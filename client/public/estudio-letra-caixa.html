<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Estúdio Letra Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --border:#dce2ec;
    --text:#151b2c; --text-dim:#5b6478; --text-faint:#8891a3;
    --accent:#1e6fd9; --accent-ink:#0d4fa8; --accent-soft:#e7f0fd;
    --accent2:#0d9488; --accent2-soft:#e3f7f4;
    --ok:#16a34a; --ok-soft:#e7f8ed;
    --warn:#d97706; --warn-soft:#fdf1de;
    --bad:#dc2626; --bad-soft:#fdeaea;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420; --surface:#161d2e; --surface-2:#1d2538; --border:#2b3450;
      --text:#e7ebf6; --text-dim:#a7b0c6; --text-faint:#7883a0;
      --accent:#5b9df0; --accent-ink:#bcdaff; --accent-soft:#1b2c4a;
      --accent2:#3fc6b8; --accent2-soft:#12312e;
      --ok:#4ade80; --ok-soft:#123420;
      --warn:#f5a524; --warn-soft:#3a2a0c;
      --bad:#f87171; --bad-soft:#3a1616;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --surface:#161d2e; --surface-2:#1d2538; --border:#2b3450;
    --text:#e7ebf6; --text-dim:#a7b0c6; --text-faint:#7883a0;
    --accent:#5b9df0; --accent-ink:#bcdaff; --accent-soft:#1b2c4a;
    --accent2:#3fc6b8; --accent2-soft:#12312e;
    --ok:#4ade80; --ok-soft:#123420;
    --warn:#f5a524; --warn-soft:#3a2a0c;
    --bad:#f87171; --bad-soft:#3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  /* Ícones inline (ICONS.*) não têm width/height — sem isso, o navegador usa o
     tamanho padrão de SVG sem viewport definido (300×150px). Qualquer SVG com
     style inline (prévias, mapas de nesting etc.) sobrescreve isso normalmente. */
  svg{width:1em; height:1em; flex:none;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; padding-inline:16px;}
  h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  #shell{max-width:1180px; margin:0 auto; padding-block:18px 48px;}

  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--bg); padding-block:10px 12px; margin-inline:-16px; padding-inline:16px; border-bottom:1px solid var(--border);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; flex:none;}
  .brand .mark svg{width:19px; height:19px;}
  .brand-name{font-family:'Sora'; font-weight:700; font-size:16px; letter-spacing:.01em;}
  .brand-sub{font-size:11px; color:var(--text-faint); margin-top:-2px;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  .segtabs{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;}
  .segtabs button{border:none; background:transparent; color:var(--text-dim); font-size:13px; font-weight:600; padding:7px 13px; border-radius:7px;}
  .segtabs button.active{background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow);}

  select, input[type=number], input[type=text]{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-dim); font-weight:600;}

  .banner{display:flex; align-items:flex-start; gap:10px; background:var(--accent-soft); border:1px solid color-mix(in oklab, var(--accent) 30%, var(--border)); border-radius:12px; padding:11px 14px; margin-block:14px; font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .banner b{color:var(--accent-ink);}
  .banner svg{flex:none; margin-top:1px; width:16px; height:16px; color:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .cardhead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .cardhead h3{font-size:15px;}
  .cardhead p{font-size:12.5px; color:var(--text-faint); margin-top:3px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:99px; text-transform:uppercase;}
  .b-ok{background:var(--ok-soft); color:var(--ok);}
  .b-warn{background:var(--warn-soft); color:var(--warn);}
  .b-bad{background:var(--bad-soft); color:var(--bad);}
  .b-neutral{background:var(--surface-2); color:var(--text-dim);}
  .b-accent{background:var(--accent-soft); color:var(--accent-ink);}

  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent; transition:filter .15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.45; cursor:not-allowed; filter:none;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}
  .btn-soft{background:var(--accent-soft); color:var(--accent-ink);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700;}
  td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right; font-family:'JetBrains Mono'; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
  .tablewrap table{border:none;}
  .price-margin-wrap table{table-layout:fixed; min-width:860px;}
  .price-margin-wrap th,.price-margin-wrap td{width:14.2857%; text-align:center; vertical-align:middle;}
  .price-margin-wrap th{white-space:nowrap;}
  .price-margin-wrap td{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  .stepper{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-block:14px;}
  .step-pill{flex:none; display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--text-faint); white-space:nowrap;}
  .step-pill .dot{width:19px; height:19px; border-radius:50%; background:var(--surface-2); color:var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex:none;}
  .step-pill.done{color:var(--text);} .step-pill.done .dot{background:var(--ok); color:#fff;}
  .step-pill.current{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}
  .step-pill.current .dot{background:var(--accent); color:#fff;}
  .step-pill.locked{opacity:.5;}
  .step-pill.clickable{cursor:pointer;}

  .projcard{border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; cursor:pointer; text-align:left; transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column;}
  .projcard:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .projcard .thumb{aspect-ratio:16/10; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .projcard .thumb svg{width:100%; height:100%; display:block;}
  .projcard .body{padding:14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .projcard h4{font-size:14px;}
  .projcard p{font-size:12px; color:var(--text-faint); line-height:1.5;}

  .kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--text-faint);}
  .kv span:last-child{font-weight:600; font-family:'JetBrains Mono';}

  .compare{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2);}
  .compare svg{display:block; width:100%; height:auto;}
  .compare .layer{position:absolute; inset:0;}

  .checklist{display:flex; flex-direction:column; gap:7px;}
  .checkrow{display:flex; align-items:center; gap:8px; font-size:13px;}
  .checkrow svg{width:15px; height:15px; color:var(--ok); flex:none;}

  input[type=range]{width:100%; accent-color:var(--accent);}
  .rangewrap{display:flex; align-items:center; gap:10px;}
  .rangewrap .val{font-family:'JetBrains Mono'; font-size:13px; font-weight:700; width:52px; text-align:right;}

  .footer-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}

  .role-note{font-size:11.5px; color:var(--text-faint); margin-top:6px; display:flex; gap:6px; align-items:flex-start;}
  .role-note svg{width:13px; height:13px; flex:none; margin-top:1px;}

  .pill-status{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;}
  .status-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px;}
  .status-flow .fseg{padding:4px 9px; border-radius:99px; background:var(--surface-2); color:var(--text-faint); font-weight:700;}
  .status-flow .fseg.active{background:var(--accent); color:#fff;}
  .status-flow .arrow{color:var(--text-faint);}

  .subtabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .subtabs button{background:transparent; border:none; padding:9px 4px; font-size:13px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent; margin-right:14px;}
  .subtabs button.active{color:var(--accent-ink); border-color:var(--accent);}

  .erpitem{display:grid; grid-template-columns:90px 1fr 90px 110px 120px 90px; gap:10px; align-items:center; padding:9px 10px; border-bottom:1px solid var(--border); font-size:12.5px;}
  .erpitem:last-child{border-bottom:none;}
  .erpitem.head{font-size:11px; text-transform:uppercase; color:var(--text-faint); font-weight:700; letter-spacing:.02em;}
  @media (max-width:820px){.erpitem{grid-template-columns:1fr; gap:3px; padding:10px;} .erpitem.head{display:none;}}

  .empty-hint{font-size:12.5px; color:var(--text-faint); padding:20px; text-align:center;}

  .source-tag{font-size:10.5px; color:var(--text-faint); display:flex; align-items:center; gap:4px; margin-top:2px;}
  .source-tag svg{width:11px;height:11px;}

  .warnbox{display:flex; gap:10px; background:var(--bad-soft); border:1px solid color-mix(in oklab, var(--bad) 35%, var(--border)); border-radius:12px; padding:13px 15px; font-size:12.5px; color:var(--text);}
  .warnbox svg{width:18px; height:18px; color:var(--bad); flex:none;}
  .warnbox b{color:var(--bad);}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}

  /* ---- Visão do cliente: cards de reação grandes e convidativos ---- */
  .cliente-hero{background:linear-gradient(160deg, var(--accent-soft), var(--surface) 65%); border:1px solid color-mix(in oklab, var(--accent) 25%, var(--border)); border-radius:18px; padding:24px; text-align:center;}
  .cliente-hero h2{font-size:20px; margin-bottom:6px;}
  .cliente-preco{font-size:32px; font-weight:800; color:var(--accent-ink); font-family:'Sora';}
  .reacoes-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px;}
  @media (max-width:640px){.reacoes-grid{grid-template-columns:1fr;}}
  .reacao-card{display:flex; align-items:center; gap:12px; text-align:left; border-radius:14px; padding:16px; border:2px solid var(--border); background:var(--surface); cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s; font-family:inherit;}
  .reacao-card:hover{transform:translateY(-2px) scale(1.01); box-shadow:var(--shadow);}
  .reacao-card .emoji{font-size:28px; flex:none; line-height:1;}
  .reacao-card .txt{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.35;}
  .reacao-card.cor-ok{border-color:color-mix(in oklab, var(--ok) 40%, var(--border));} .reacao-card.cor-ok:hover{background:var(--ok-soft);}
  .reacao-card.cor-accent{border-color:color-mix(in oklab, var(--accent) 40%, var(--border));} .reacao-card.cor-accent:hover{background:var(--accent-soft);}
  .reacao-card.cor-warn{border-color:color-mix(in oklab, var(--warn) 40%, var(--border));} .reacao-card.cor-warn:hover{background:var(--warn-soft);}
  .reacao-card.cor-neutral:hover{background:var(--surface-2);}
  .reacao-card.cor-bad{border-color:color-mix(in oklab, var(--bad) 40%, var(--border));} .reacao-card.cor-bad:hover{background:var(--bad-soft);}
</style>

<div id="shell"></div>

<script>
const ICONS = {
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v6h6"/><path d="M9 14h6M9 17h4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
};

/* ---------- DADOS DE DEMONSTRAÇÃO (fictícios, rotulados) ---------- */

function svgSign({texto, slogan, simbolo, cor, perspectiva, blur, incompleto}){
  const skew = perspectiva ? 'transform="skewY(-2.2) skewX(-4)"' : '';
  const filt = blur ? 'filter="url(#blurf)"' : '';
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="blurf"><feGaussianBlur stdDeviation="3.2"/></filter>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${blur?'#3a3f4d':'#c9cfda'}"/>
        <stop offset="1" stop-color="${blur?'#20232c':'#a8afbd'}"/>
      </linearGradient>
    </defs>
    <rect width="600" height="260" fill="url(#wall)"/>
    <g ${skew} ${filt}>
      <rect x="70" y="70" width="460" height="120" rx="8" fill="${cor.painel}" stroke="#00000022" stroke-width="2"/>
      ${simbolo}
      <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="${incompleto?'40':'38'}" fill="${cor.texto}">${texto}</text>
      ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="${cor.texto}" opacity=".85">${slogan}</text>`:''}
    </g>
    ${blur?'<rect x="120" y="60" width="360" height="150" fill="white" opacity=".14"/>':''}
    ${blur?'<rect x="300" y="60" width="80" height="150" fill="white" opacity=".1"/>':''}
  </svg>`;
}

function svgReconstruction({texto, slogan, cor, simbolo}){
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="260" fill="transparent"/>
    <g>
      <rect x="70" y="70" width="460" height="120" rx="8" fill="${cor.painel}"/>
      ${simbolo}
      <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="38" fill="${cor.texto}">${texto}</text>
      ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="${cor.texto}" opacity=".85">${slogan}</text>`:''}
    </g>
  </svg>`;
}

function svgVector({texto, slogan, simboloOutline}){
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="260" fill="transparent"/>
    <rect x="70" y="70" width="460" height="120" rx="8" fill="white" stroke="black" stroke-width="2"/>
    ${simboloOutline}
    <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="38" fill="white" stroke="black" stroke-width="1.4">${texto}</text>
    ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="white" stroke="black" stroke-width=".6">${slogan}</text>`:''}
  </svg>`;
}

const SIMBOLO_TRIGO = `<g transform="translate(300,50)"><path d="M0 20 C -10 0, -6 -22, 0 -34 C 6 -22, 10 0, 0 20 Z" fill="#f0c419"/><path d="M-14 4 C -22 -6, -20 -20, -12 -26" fill="none" stroke="#c99a12" stroke-width="3"/><path d="M14 4 C 22 -6, 20 -20, 12 -26" fill="none" stroke="#c99a12" stroke-width="3"/></g>`;
const SIMBOLO_TRIGO_OUTLINE = `<g transform="translate(300,50)"><path d="M0 20 C -10 0, -6 -22, 0 -34 C 6 -22, 10 0, 0 20 Z" fill="white" stroke="black" stroke-width="2"/></g>`;

const SIMBOLO_ENGRENAGEM = (color)=>`<g transform="translate(300,52)">
  <circle cx="0" cy="0" r="30" fill="none" stroke="${color}" stroke-width="9"/>
  ${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-5" y="-40" width="10" height="14" fill="${color}" transform="rotate(${a})"/>`).join('')}
  <circle cx="0" cy="0" r="11" fill="#f6f7fb" stroke="${color}" stroke-width="3"/>
</g>`;
const SIMBOLO_ENGRENAGEM_OUTLINE = `<g transform="translate(300,52)">

/* ---------- CÁLCULOS ---------- */
function unitToM(v,u){ return u==='mm'? v/1000 : u==='cm'? v/100 : v; }

function computeGeom(p){
  const s = state.scale[p.id];
  const e = p.escala;
  const knownM = unitToM(s.valor, s.unidade);
  const refVU = e.byHeight ? e.refHeightVU : e.refWidthVU;
  const scaleFactor = knownM / refVU; // metros por unidade-vetor
  const totalWidthM = e.totalWidthVU * scaleFactor;
  const totalHeightM = e.totalHeightVU * scaleFactor;
  const areaM2 = e.areaVU * scaleFactor * scaleFactor;
  const perimExtM = e.perimExtVU * scaleFactor;
  const perimIntM = e.perimIntVU * scaleFactor;
  return {
    scaleFactor, totalWidthM, totalHeightM, areaM2, perimExtM, perimIntM,
    corteTotalM: perimExtM + perimIntM,
  };
}

function fmt(n,d=2){ return n.toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d}); }
/** Compara ignorando acento/caixa — "acrilico" precisa achar "Acrílico" na busca. */
function normalizeSearch(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function money(n){ return 'R$ '+fmt(n,2); }

function computeOrcamento(p){
  const matTotal = p.kit.reduce((a,k)=>a+k.qtd*k.custo,0);
  const servTotal = p.servicos.reduce((a,s)=>a+s.v,0);
  const custoDireto = matTotal + servTotal;
  const descontoFrac = state.desconto/100;
  const precoBase = custoDireto/(1-state.margin);
  const precoComInstalacao = precoBase + p.instalacao;
  const precoFinal = precoComInstalacao * (1-descontoFrac);
  return {matTotal, servTotal, custoDireto, precoBase, precoComInstalacao, precoFinal};
}

/* ---------- TABELA DE PREÇOS REAL (margem por faixa de ticket) ---------- */
/** "12k" → 12000, "4.8k" → 4800 (aqui o ponto é decimal); sem "k" o ponto é
 *  separador de milhar ("8.010" → 8010, sem casas decimais na tabela real). */
function parseValorFaixa(tok){
  tok = (tok||'').trim();
  if(/k$/i.test(tok)) return parseFloat(tok.replace(/k$/i,'').replace(',','.'))*1000;
  return parseFloat(tok.replace(/\./g,'').replace(',','.'))||0;
}
function parseFaixa(label){
  const s = (label||'').replace(/R\$/g,'').trim();
  if(/^até/i.test(s)){ const m=s.match(/([\d.,]+k?)/i); return {min:0, max:m?parseValorFaixa(m[1]):Infinity}; }
  if(/\+\s*$/.test(s)){ const m=s.match(/([\d.,]+k?)\+/i); return {min:m?parseValorFaixa(m[1]):0, max:Infinity}; }
  const partes = s.split('~');
  if(partes.length===2) return {min:parseValorFaixa(partes[0]), max:parseValorFaixa(partes[1])};
  return {min:0, max:Infinity};
}
function encontrarFaixaIndex(colunas, custo){
  for(let i=0;i<colunas.length;i++){ const {min,max}=parseFaixa(colunas[i]); if(custo>=min && custo<=max) return i; }
  return Math.max(colunas.length-1,0);
}
/** Dado um vínculo {lineId} e o custo direto (ticket) do orçamento, devolve
 *  a margem real da Tabela de Preços para aquela faixa. catalog.margens é
 *  uma lista ACHATADA por linha (cada linha da Tabela de Preços real tem seu
 *  próprio ID estável, atribuído pelo servidor — ver shared/price-table.ts —
 *  nunca por seção inteira; uma "seção" como "PVC ... Clientes Brasil" tem
 *  6 linhas, cada uma com ID próprio). Migrado de vínculo por seção pra
 *  vínculo direto por linha, pedido do usuário 29-30/09/2026: a tabela física
 *  que o usuário consulta tem um ID por linha, não por seção. */
function margemDaTabela(precificacao, custoDireto){
  if(!precificacao || !precificacao.lineId) return null;
  const linha = catalog.margens.find(l=>l.lineId===precificacao.lineId);
  if(!linha) return null;
  const idx = encontrarFaixaIndex(linha.colunas, custoDireto);
  const pct = parseFloat((linha.valores[idx]||'0').replace('%','').replace(',','.'))/100;
  return { percentual:pct, faixaLabel:linha.colunas[idx], rotulo:linha.rotulo, secaoTitulo:linha.secaoTitulo };
}

/** Busca linhas da Tabela de Preços por ID (prefixo numérico) ou por texto
 *  no título da seção/rótulo da linha — pedido do usuário 30/09/2026: com
 *  105 linhas reais, rolar uma lista inteira não é viável. */
function buscarLinhasPrecificacao(query){
  const q = (query||'').trim();
  if(!q) return [];
  if(/^\d+$/.test(q)) return catalog.margens.filter(l=>String(l.lineId).startsWith(q)).slice(0,30);
  const nq = normalizeSearch(q);
  return catalog.margens.filter(l=>normalizeSearch(l.secaoTitulo+' '+l.rotulo).includes(nq)).slice(0,30);
}

/* ---------- PROPOSTA REAL: estado ---------- */
function escaparHtml(valor){
  return String(valor ?? '').replace(/[&<>"']/g, caractere=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  })[caractere]);
}

function normalizarDocumento(valor){ return String(valor||'').replace(/\D/g,''); }

function validarCnpj(cnpj){
  if(!/^\d{14}$/.test(cnpj) || /^(\d)\1{13}$/.test(cnpj)) return false;
  const calcularDigito = (base, pesos)=>{
    const soma = [...base].reduce((total, digito, indice)=>total + Number(digito)*pesos[indice], 0);
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  const base = cnpj.slice(0,12);
  const primeiro = calcularDigito(base, [5,4,3,2,9,8,7,6,5,4,3,2]);
  const segundo = calcularDigito(base+primeiro, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return cnpj === base+primeiro+segundo;
}

function validarCpf(cpf){
  if(!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;
  const calcularDigito = base=>{
    const soma = [...base].reduce((total, digito, indice)=>total + Number(digito)*(base.length+1-indice), 0);
    const resto = (soma*10)%11;
    return resto===10 ? 0 : resto;
  };
  const base = cpf.slice(0,9);
  const primeiro = calcularDigito(base);
  const segundo = calcularDigito(base+primeiro);
  return cpf===base+primeiro+segundo;
}

function rotuloDocumento(valor){ return normalizarDocumento(valor).length===11 ? 'CPF' : 'CNPJ'; }

function validarDocumento(valor){
  const documento = normalizarDocumento(valor);
  return documento.length===11 ? validarCpf(documento) : documento.length===14 ? validarCnpj(documento) : false;
}

function montarEnderecoCnpj(dados){
  const tipo = String(dados.descricao_tipo_de_logradouro||'').trim();
  const logradouro = String(dados.logradouro||'').trim();
  const rua = logradouro && tipo && !logradouro.toLocaleLowerCase('pt-BR').startsWith(tipo.toLocaleLowerCase('pt-BR'))
    ? tipo+' '+logradouro
    : (logradouro||tipo);
  const numero = String(dados.numero||'').trim();
  const numeroJaIncluido = numero && rua.toLocaleLowerCase('pt-BR').includes(numero.toLocaleLowerCase('pt-BR'));
  const linhaRua = rua && numero && !numeroJaIncluido ? rua+', '+numero : rua;
  const municipio = String(dados.municipio||'').trim();
  const uf = String(dados.uf||'').trim();
  const cep = String(dados.cep||'').replace(/\D/g,'');
  const cepFormatado = cep.length===8 ? cep.slice(0,5)+'-'+cep.slice(5) : cep;
  return [
    linhaRua,
    String(dados.complemento||'').trim(),
    String(dados.bairro||'').trim(),
    [municipio,uf].filter(Boolean).join('/'),
    cepFormatado ? 'CEP '+cepFormatado : '',
  ].filter(Boolean).join(' · ');
}

function renderAvisoConsultaCnpj(){
  const consulta = REAL.consultaCnpj;
  if(!consulta || !consulta.mensagem) return '';
  const cores = {loading:'var(--text-dim)', success:'var(--ok)', error:'var(--bad)', invalid:'var(--bad)'};
  return '<p role="status" aria-live="polite" style="font-size:11.5px; color:'+ (cores[consulta.status]||'var(--text-dim)') +'; margin:8px 0 0;">'+escaparHtml(consulta.mensagem)+'</p>';
}

let _consultaCnpjTimer = null;
let _consultaCnpjController = null;
let _consultaCnpjRequestId = 0;

async function consultarDadosCnpj(cnpj){
  const requestId = ++_consultaCnpjRequestId;
  const controller = new AbortController();
  _consultaCnpjController = controller;
  try{
    const resposta = await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj, {
      headers:{Accept:'application/json'}, signal:controller.signal,
    });
    if(requestId !== _consultaCnpjRequestId) return;
    if(resposta.status===404) throw new Error('CNPJ não encontrado na base consultada.');
    if(resposta.status===429) throw new Error('A API recebeu muitas consultas. Tente novamente em instantes.');
    if(resposta.status===403) throw new Error('A API recusou a consulta neste momento. Tente novamente mais tarde.');
    if(!resposta.ok) throw new Error('Não foi possível consultar o CNPJ agora.');
    const dados = await resposta.json();
    if(requestId !== _consultaCnpjRequestId || normalizarDocumento(REAL.cliente.cnpj)!==cnpj) return;
    if(!dados || !dados.razao_social) throw new Error('A API não retornou os dados cadastrais deste CNPJ.');
    if(dados.cnpj && normalizarDocumento(dados.cnpj)!==cnpj) throw new Error('A API retornou dados para outro CNPJ.');
    REAL.cliente.razao = String(dados.razao_social||'');
    REAL.cliente.fantasia = String(dados.nome_fantasia||'');
    REAL.cliente.endereco = montarEnderecoCnpj(dados);
    REAL.cliente.cnpjConsultado = cnpj;
    REAL.consultaCnpj = {status:'success', mensagem:'Dados encontrados. Confira as informações antes de iniciar a proposta.'};
  }catch(erro){
    if(erro.name==='AbortError' || requestId !== _consultaCnpjRequestId) return;
    REAL.consultaCnpj = {status:'error', mensagem:erro.message||'Falha na consulta. Verifique a conexão e tente novamente.'};
  }finally{
    if(requestId === _consultaCnpjRequestId){
      _consultaCnpjController = null;
      renderPreservingFocus();
    }
  }
}

    pintura: { habilitada:false, concluida:false, substrato:null, tipo:null, cores:null, temCoresAdicionais:null, coresAdicionais:null, acabamento:null, corMetal:null, itensAdicionados:[] },

let REAL = novaProposta();
let redrawRequestId = 0;
let traceRequestId = 0;

function invalidarRastreamento(){
  traceRequestId++;
  state.tracing=false;
  REAL.traceQuality=null;
}

/* ---------- GEOMETRIA REAL (integração poligonal sobre o SVG rastreado) ---------- */
function shoelaceSigned(points){
  let s=0;
  for(let i=0;i<points.length;i++){
    const a=points[i], b=points[(i+1)%points.length];
    s += a.x*b.y - b.x*a.y;
  }
  return s/2;
}

function splitSubpaths(d){
  return (d||'').trim().split(/(?=M)/).map(s=>s.trim()).filter(Boolean);
}

let _workPathEl = null;
function workPath(){
  if(_workPathEl) return _workPathEl;
  const ns='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('style','position:absolute; width:1px; height:1px; overflow:hidden; visibility:hidden; left:-9999px; top:-9999px;');
  const path = document.createElementNS(ns,'path');
  svg.appendChild(path);
  document.body.appendChild(svg);
  _workPathEl = path;
  return path;
}

function measureSubpath(dStr){
  const path = workPath();
  path.setAttribute('d', dStr);
  let len=0, bbox={x:0,y:0,width:0,height:0};
  try{ len = path.getTotalLength(); }catch(e){}
  try{ bbox = path.getBBox(); }catch(e){}
  const points=[];
  if(len>0){
    // Prompt 3 pede área vetorial, mas a API SVG do navegador só expõe o
    // comprimento da curva. Amostrar a cada ~0,5 unidade reduz o erro da
    // integração poligonal; o limite evita travar em SVGs com escala extrema.
    const samples=Math.min(10000,Math.max(32,Math.ceil(len/0.5)));
    for(let i=0;i<=samples;i++) points.push(path.getPointAtLength(len*i/samples));
  }
  const areaSigned = points.length>2 ? shoelaceSigned(points) : 0;
  return { d:dStr, len, bbox, area:Math.abs(areaSigned) };
}

function bboxContains(outer, inner){
  return inner.x >= outer.x-0.5 && inner.y >= outer.y-0.5 &&
         (inner.x+inner.width) <= (outer.x+outer.width+0.5) &&
         (inner.y+inner.height) <= (outer.y+outer.height+0.5);
}

function caixasSobrepostas(a,b){
  return a.x < b.x+b.width && a.x+a.width > b.x &&
         a.y < b.y+b.height && a.y+a.height > b.y;
}

/** Classifica contornos pelo número de outros contornos que os envolvem.
 *  Profundidade par = peça/material; ímpar = vazado (regra even-odd). */
function classifyGeometry(dString){
  const subpaths = splitSubpaths(dString).map(measureSubpath).filter(s=>s.area>3 && s.len>0);
  const external=[], internal=[];
  subpaths.forEach((s,i)=>{
    const depth=subpaths.filter((o,j)=>j!==i && o.area>s.area && bboxContains(o.bbox,s.bbox)).length;
    if(depth%2) internal.push(s); else external.push(s);
  });
  const possivelSobreposicao=external.some((a,i)=>external.slice(i+1).some(b=>caixasSobrepostas(a.bbox,b.bbox)));
  const areaPx = Math.max(external.reduce((a,s)=>a+s.area,0) - internal.reduce((a,s)=>a+s.area,0), 0);
  const perimExtPx = external.reduce((a,s)=>a+s.len,0);
  const perimIntPx = internal.reduce((a,s)=>a+s.len,0);
  let bx1=Infinity,by1=Infinity,bx2=-Infinity,by2=-Infinity;
  external.forEach(s=>{ bx1=Math.min(bx1,s.bbox.x); by1=Math.min(by1,s.bbox.y); bx2=Math.max(bx2,s.bbox.x+s.bbox.width); by2=Math.max(by2,s.bbox.y+s.bbox.height); });
  if(!isFinite(bx1)){ bx1=0; by1=0; bx2=0; by2=0; }
  return {
    areaPx, perimExtPx, perimIntPx,
    possivelSobreposicao,
    bboxPx:{x:bx1,y:by1,w:bx2-bx1,h:by2-by1},
    pieces: external.map((s,i)=>({ n:i+1, bbox:s.bbox, area:s.area })),
  };
}

/** Prompt 2: compara a silhueta binária usada no rastreamento com o SVG
 *  rasterizado na mesma escala. A meta de 95% é um indicador de triagem; a
 *  conferência visual continua necessária para textos e detalhes da marca. */
function medirSobreposicaoVetor(bin,d,w,h){
  try{
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    if(!ctx || typeof Path2D==='undefined') return null;
    ctx.fillStyle='#000'; ctx.fill(new Path2D(d),'evenodd');
    const vetor=ctx.getImageData(0,0,w,h).data;
    let intersecao=0, uniao=0;
    for(let i=0;i<bin.data.length;i+=4){
      const referencia=bin.data[i]<128;
      const forma=vetor[i+3]>127 && (0.299*vetor[i]+0.587*vetor[i+1]+0.114*vetor[i+2])<128;
      if(referencia&&forma) intersecao++;
      if(referencia||forma) uniao++;
    }
    const iouPct=uniao?intersecao/uniao*100:0;
    return {iouPct:Number(iouPct.toFixed(1)),metaPct:95,atingiuMeta:iouPct>=95};
  }catch(e){ return null; }
}

function computeGeomReal(){
  const g = REAL.geomRaw;
  if(!g || !g.bboxPx.w) return {scaleFactor:0,totalWidthM:0,totalHeightM:0,areaM2:0,areaGeralM2:0,perimExtM:0,perimIntM:0,corteTotalM:0};
  const s = REAL.scale;
  const knownM = unitToM(s.valor, s.unidade);
  const refPx = s.byHeight ? g.bboxPx.h : g.bboxPx.w;
  const scaleFactor = refPx>0 ? knownM/refPx : 0;
  const totalWidthM = g.bboxPx.w*scaleFactor;
  const totalHeightM = g.bboxPx.h*scaleFactor;
  return {
    scaleFactor,
    totalWidthM, totalHeightM,
    // Área líquida: só o conteúdo real da letra (descontados vazados) — o que
    // a integração poligonal mede. Área geral: o retângulo que contém a peça
    // inteira (largura × altura totais) — é o quanto de CHAPA o letreiro
    // consome de fato, já que a chapa é cortada de um retângulo, não recortada
    // rente à silhueta. Distinção pedida pelo usuário 28/09/2026: sem ela, uma
    // fórmula "por área" sempre subestimava o consumo real de chapa.
    areaM2: g.areaPx*scaleFactor*scaleFactor,
    areaGeralM2: totalWidthM*totalHeightM,
    perimExtM: g.perimExtPx*scaleFactor,
    perimIntM: g.perimIntPx*scaleFactor,
    corteTotalM: (g.perimExtPx+g.perimIntPx)*scaleFactor,
    possivelSobreposicao: !!g.possivelSobreposicao,
  };
}

/* ---------- VETORIZAÇÃO REAL (raster→vetor no navegador, via imagetracer.js) ---------- */
function loadImageEl(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function thresholdImageData(ctx, w, h, threshold, invert){
  const src = ctx.getImageData(0,0,w,h);
  const out = ctx.createImageData(w,h);
  for(let i=0;i<src.data.length;i+=4){
    const lum = 0.299*src.data[i] + 0.587*src.data[i+1] + 0.114*src.data[i+2];
    let isFg = lum < threshold;
    if(invert) isFg = !isFg;
    const v = isFg ? 0 : 255;
    out.data[i]=v; out.data[i+1]=v; out.data[i+2]=v; out.data[i+3]=255;
  }
  return out;
}

function traceBinary(imageData){
  return window.ImageTracer.imagedataToSVG(imageData, {
    numberofcolors:2, pathomit:6, ltres:1, qtres:1, scale:1, strokewidth:0, roundcoords:1, viewbox:true,
  });
}

function extractForegroundPath(svgStr){
  const doc = new DOMParser().parseFromString(svgStr, 'image/svg+xml');
  const svgEl = doc.querySelector('svg');
  const paths = [...doc.querySelectorAll('path')];
  let best=null, bestLum=999;
  paths.forEach(p=>{
    const fill = p.getAttribute('fill')||'';
    const m = fill.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
    const lum = m ? (0.299*+m[1]+0.587*+m[2]+0.114*+m[3]) : 128;
    if(lum<bestLum){ bestLum=lum; best=p; }
  });
  let vw=0, vh=0;
  const vb = svgEl && svgEl.getAttribute('viewBox');
  if(vb){ const parts=vb.split(/\s+/).map(Number); vw=parts[2]||0; vh=parts[3]||0; }
  if(!vw || !vh){ vw = parseFloat(svgEl && svgEl.getAttribute('width'))||vw; vh = parseFloat(svgEl && svgEl.getAttribute('height'))||vh; }
  return { d: best ? (best.getAttribute('d')||'') : '', w: vw, h: vh };
}

/* ---------- IMPORTAÇÃO DE VETOR JÁ PRONTO (SVG enviado direto, sem rastreamento) ---------- */
/** Extrai e combina os <path> de um SVG enviado pelo usuário. Formas não-path
 *  (rect/circle/etc.) são contadas mas não entram na geometria — a maioria dos
 *  vetorizadores profissionais já exporta tudo como <path>, então isso cobre o
 *  caso comum; formas nativas exigiriam conversão adicional (fora de escopo
 *  deste protótipo). */
function extractPathsFromRawSVG(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  if(doc.querySelector('parsererror')) return null;
  const svgEl = doc.querySelector('svg');
  if(!svgEl) return null;
  const paths = [...doc.querySelectorAll('path')].map(p=>p.getAttribute('d')).filter(Boolean);
  const d = paths.join(' ');
  let vw=0, vh=0;
  const vb = svgEl.getAttribute('viewBox');
  if(vb){ const parts=vb.trim().split(/[\s,]+/).map(Number); vw=parts[2]||0; vh=parts[3]||0; }
  if(!vw||!vh){ vw=parseFloat(svgEl.getAttribute('width'))||vw; vh=parseFloat(svgEl.getAttribute('height'))||vh; }
  const nonPathCount = doc.querySelectorAll('rect,circle,ellipse,polygon,polyline,line,text,image,use').length;
  const transformedCount = doc.querySelectorAll('[transform]').length;
  return { d, w:vw, h:vh, pathCount:paths.length, nonPathCount, transformedCount };
}

const RASTER_EXT = ['.png','.jpg','.jpeg'];
const UNSUPPORTED_EXT = ['.pdf','.ai','.eps','.cdr'];

/** Ponto único de entrada para os três estágios de upload do fluxo (envio
 *  inicial, troca no redesenho, envio direto de vetor na vetorização). Decide
 *  entre o caminho raster (rastreamento real via imagetracer.js) e o caminho
 *  vetor (SVG já pronto, geometria extraída direto dos caminhos reais — sem
 *  rastrear nada). AI/EPS/PDF/CDR não são processáveis no navegador nesta
 *  demonstração (exigiriam conversão no servidor, ex. Inkscape CLI — este
 *  Artifact roda 100% client-side, sem processo de servidor por trás); o
 *  usuário é avisado e orientado a exportar como SVG. Pedido do usuário
 *  29/09/2026 (CDR é o formato nativo do CorelDraw, usado por vários
 *  clientes/gráficas parceiras). */
async function handleUploadedFile(file){
  invalidarRastreamento();
  REAL.uploadError=null; REAL.uploadWarning=null;
  const name = (file.name||'').toLowerCase();
  const isSvg = name.endsWith('.svg') || file.type==='image/svg+xml';
  const isRaster = RASTER_EXT.some(ext=>name.endsWith(ext)) || /^image\/(png|jpe?g)$/.test(file.type);
  const isUnsupported = UNSUPPORTED_EXT.some(ext=>name.endsWith(ext));

  if(isUnsupported){
    const ext = name.split('.').pop().toUpperCase();
    REAL.uploadError = ext==='CDR'
      ? `Arquivo CDR (CorelDraw) não é processável no navegador nesta demonstração (exigiria conversão no servidor). No CorelDraw, use Arquivo > Exportar como > SVG e envie o SVG resultante — ou envie uma imagem JPG/PNG.`
      : `Formato ${ext} não é processável no navegador nesta demonstração (exigiria conversão no servidor). Exporte como SVG no seu software de vetorização e envie o SVG — ou envie uma imagem JPG/PNG.`;
    render();
    return;
  }
  if(isSvg){
    const text = await file.text();
    const parsed = extractPathsFromRawSVG(text);
    if(!parsed || !parsed.d){
      REAL.uploadError = 'Não consegui ler caminhos vetoriais nesse SVG (arquivo inválido ou sem elementos <path>).';
      render();
      return;
    }
    if(!Number.isFinite(parsed.w)||!Number.isFinite(parsed.h)||parsed.w<=0||parsed.h<=0){
      REAL.uploadError = 'O SVG precisa ter um viewBox ou largura e altura válidos para calcular escala e medidas.';
      render();
      return;
    }
    REAL.sourceKind='vetor';
    REAL.tracedSvg=text; REAL.fgD=parsed.d; REAL.tracedW=parsed.w; REAL.tracedH=parsed.h;
    REAL.traceQuality=null;
    REAL.geomRaw = classifyGeometry(parsed.d);
    REAL.traceError=null;
    REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
    if(parsed.nonPathCount>0){
      REAL.uploadWarning = `Detectei ${parsed.nonPathCount} elemento(s) que não são <path> (formas, texto ou imagem); foram ignorados. Converta texto e formas em caminhos no editor vetorial e remova imagens raster antes de usar este resultado.`;
    }
    if(parsed.transformedCount>0){
      REAL.uploadWarning = [REAL.uploadWarning,`Detectei ${parsed.transformedCount} elemento(s) com transformações SVG; o protótipo ainda não aplica esses transforms ao cálculo. Achate as transformações no editor antes de reenviar.`].filter(Boolean).join(' ');
    }
    render();
    return;
  }
  if(isRaster || file.type.startsWith('image/')){
    const dataUrl = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
    REAL.sourceKind='raster';
    REAL.imgReconstructed = dataUrl;
    REAL.imgPreview=null;
    REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null;
    REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
    render();
    await retrace();
    return;
  }
  REAL.uploadError = 'Tipo de arquivo não reconhecido. Envie JPG, PNG ou SVG.';
  render();
}

async function retrace(){
  const rasterSource=REAL.imgReconstructed||REAL.imgOriginal;
  if(!rasterSource) return;
  const requestId=++traceRequestId;
  REAL.traceQuality=null;
  REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
  state.tracing = true; render();
  try{
    const img = await loadImageEl(rasterSource);
    if(requestId!==traceRequestId) return;
    const maxDim = 640;
    const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
    const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx = canvas.getContext('2d');
    ctx.filter = `brightness(${REAL.ajuste.brilho}%) contrast(${REAL.ajuste.contraste}%) ${REAL.ajuste.cinza?'grayscale(100%)':''}`;
    ctx.drawImage(img,0,0,w,h);
    REAL.imgPreview = canvas.toDataURL('image/png');
    ctx.filter = 'none';
    const bin = thresholdImageData(ctx, w, h, REAL.threshold, REAL.invert);
    const svgStr = traceBinary(bin);
    const fg = extractForegroundPath(svgStr);
    REAL.tracedSvg = svgStr; REAL.fgD = fg.d;
    REAL.tracedW = fg.w; REAL.tracedH = fg.h;
    REAL.traceQuality = fg.d ? medirSobreposicaoVetor(bin,fg.d,fg.w,fg.h) : null;
    REAL.geomRaw = fg.d ? classifyGeometry(fg.d) : {areaPx:0,perimExtPx:0,perimIntPx:0,bboxPx:{x:0,y:0,w:0,h:0},pieces:[]};
    REAL.traceError = null;
  }catch(e){
    if(requestId!==traceRequestId) return;
    REAL.traceError = String(e && e.message || e);
    REAL.traceQuality = null;
  }
  if(requestId!==traceRequestId) return;
  state.tracing = false;
  render();
}

/* ---------- EDITOR VETORIAL RÁPIDO (Fabric.js) ----------
 * Mover/girar/expandir/apagar/mudar cor sobre o vetor do passo de
 * Vetorização. Vive FORA do ciclo normal de render() do app (anexado direto
 * no <body>, não dentro de #shell) de propósito: render() reconstrói TODO o
 * innerHTML de #shell a cada mudança de qualquer campo — inclusive por
 * sincronizações do banco em segundo plano, que já disparam com frequência
 * neste app. Se o <canvas> do editor estivesse dentro desse fluxo, qualquer
 * re-render alheio destruiria o elemento e o progresso de edição junto com
 * ele. Ao aplicar, rasteriza o canvas editado (com as transformações e
 * cores já aplicadas visualmente) e reaproveita o MESMO pipeline de
 * vetorização já usado pra fotos (retrace) em vez de tentar recalcular
 * manualmente rotação/escala em cima de cada curva Bézier do SVG original —
 * evitar um bug de geometria aqui importa mais que preservar curvas
 * perfeitas, já que geometria errada erra o orçamento. Pedido do usuário
 * 29/09/2026. */
let _fabricCanvas = null;

function abrirEditorVetor(){
  if(!REAL.tracedSvg && !REAL.fgD){ alert('Nada vetorizado ainda para editar.'); return; }
  if(document.getElementById('editor-vetor-overlay')) return;

  const overlay = document.createElement('div');
  overlay.id = 'editor-vetor-overlay';
  overlay.style.cssText = 'position:fixed; inset:0; z-index:1000; background:rgba(15,20,32,.72); display:flex; align-items:center; justify-content:center; padding:16px;';
  overlay.innerHTML = `
    <div style="background:var(--surface); border-radius:14px; box-shadow:var(--shadow); width:min(980px,100%); max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);">
        <div>
          <h3 style="font-size:14px; color:var(--text);">✏️ Editor rápido do vetor</h3>
          <p style="font-size:11.5px; color:var(--text-faint);">Arraste para mover · alças dos cantos para expandir · alça de cima para girar · Delete para apagar.</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-fechar">✕ Fechar sem aplicar</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:var(--surface-2);">
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);">Preenchimento <input type="color" id="editor-vetor-fill" value="#000000"></label>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);">Contorno <input type="color" id="editor-vetor-stroke" value="#000000"></label>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-desagrupar">Desagrupar (editar partes)</button>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-apagar">🗑 Apagar selecionado</button>
        <div style="flex:1;"></div>
        <button class="btn btn-primary btn-sm" id="editor-vetor-aplicar">${ICONS.check} Aplicar e recalcular</button>
      </div>
      <div style="flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg);">
        <canvas id="editor-vetor-canvas" width="820" height="560" style="border:1px solid var(--border); background:white; box-shadow:var(--shadow); max-width:100%;"></canvas>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  // backgroundColor branco OPACO é obrigatório aqui: o canvas do Fabric é
  // transparente por padrão, e thresholdImageData (reaproveitado no apply,
  // via retrace) só lê R/G/B — ignora alpha. Fundo transparente leria como
  // luminância 0 (preto) e inverteria a máscara inteira, marcando o fundo
  // vazio como "foreground".
  _fabricCanvas = new fabric.Canvas('editor-vetor-canvas', { preserveObjectStacking:true, selection:true, backgroundColor:'#ffffff' });
  const svgSource = REAL.tracedSvg || `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${REAL.tracedW||600} ${REAL.tracedH||260}"><path d="${REAL.fgD}" fill="black"/></svg>`;
  fabric.loadSVGFromString(svgSource, (objects, options)=>{
    const group = fabric.util.groupSVGElements(objects, options);
    group.set({ left:_fabricCanvas.width/2, top:_fabricCanvas.height/2, originX:'center', originY:'center' });
    if(group.width > _fabricCanvas.width*0.85 || group.height > _fabricCanvas.height*0.85){
      const escala = Math.min((_fabricCanvas.width*0.8)/group.width, (_fabricCanvas.height*0.8)/group.height);
      group.scale(escala);
    }
    _fabricCanvas.add(group);
    _fabricCanvas.setActiveObject(group);
    _fabricCanvas.renderAll();
  });

  function aplicarCor(alvo, cor, tipo){
    if(!alvo) return;
    if(alvo.type==='group' || alvo.type==='activeSelection'){ alvo.getObjects().forEach(o=>aplicarCor(o,cor,tipo)); }
    else alvo.set(tipo, cor);
  }
  function apagarSelecionados(){
    const ativos = _fabricCanvas.getActiveObjects();
    if(!ativos.length) return;
    ativos.forEach(o=>_fabricCanvas.remove(o));
    _fabricCanvas.discardActiveObject();
    _fabricCanvas.renderAll();
  }

  document.getElementById('editor-vetor-fill').addEventListener('input', e=>{ aplicarCor(_fabricCanvas.getActiveObject(), e.target.value, 'fill'); _fabricCanvas.renderAll(); });
  document.getElementById('editor-vetor-stroke').addEventListener('input', e=>{ aplicarCor(_fabricCanvas.getActiveObject(), e.target.value, 'stroke'); _fabricCanvas.renderAll(); });
  document.getElementById('editor-vetor-desagrupar').addEventListener('click', ()=>{
    const ativo = _fabricCanvas.getActiveObject();
    if(ativo && ativo.type==='group'){ ativo.toActiveSelection(); _fabricCanvas.renderAll(); }
  });
  document.getElementById('editor-vetor-apagar').addEventListener('click', apagarSelecionados);
  document.getElementById('editor-vetor-fechar').addEventListener('click', fecharEditorVetor);
  document.getElementById('editor-vetor-aplicar').addEventListener('click', aplicarEdicaoVetor);

  const teclado = (e)=>{
    if((e.key==='Delete'||e.key==='Backspace') && document.activeElement.tagName!=='INPUT'){ apagarSelecionados(); }
    if(e.key==='Escape') fecharEditorVetor();
  };
  overlay._teclado = teclado;
  window.addEventListener('keydown', teclado);
}

function fecharEditorVetor(){
  const overlay = document.getElementById('editor-vetor-overlay');
  if(overlay){
    if(overlay._teclado) window.removeEventListener('keydown', overlay._teclado);
    overlay.remove();
  }
  if(_fabricCanvas){ _fabricCanvas.dispose(); _fabricCanvas=null; }
}

/** Rasteriza o canvas editado (multiplier:2 — reduz a perda de nitidez do
 *  novo traçado) e roda pelo mesmo pipeline de retrace() já usado pra
 *  fotos: threshold, imagetracer.js, classifyGeometry. Reseta os ajustes de
 *  brilho/contraste/cinza pro padrão, pra não aplicar filtros residuais de
 *  uma edição raster anterior sobre o resultado recém montado. */
async function aplicarEdicaoVetor(){
  if(!_fabricCanvas) return;
  const dataUrl = _fabricCanvas.toDataURL({ format:'png', multiplier:2 });
  fecharEditorVetor();
  REAL.sourceKind = 'raster';
  REAL.imgOriginal = dataUrl;
  REAL.ajuste = { brilho:100, contraste:100, cinza:false };
  REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null;
  render();
  await retrace();
}

/* ---------- NESTING REAL (shelf-packing sobre as peças rastreadas) ---------- */
function packPiecesReal(sheetWmm, sheetHmm, gapMm){
  sheetWmm = sheetWmm||1220; sheetHmm = sheetHmm||2440; gapMm = gapMm||10;
  const g = REAL.geomRaw;
  const geom = computeGeomReal();
  const mmPerPx = geom.scaleFactor*1000;
  if(!g || !g.pieces.length || !mmPerPx){
    return { folhas:[], algoritmo:'shelf-packing (altura decrescente)', versao:'real v1' };
  }
  const pieces = g.pieces.map(p=>({ n:p.n, wmm:p.bbox.width*mmPerPx, hmm:p.bbox.height*mmPerPx, label:'peça '+p.n }))
    .sort((a,b)=> b.hmm-a.hmm);

  const folhas=[]; let sheet=null;
  function newSheet(){ sheet={ material:'Material do kit — chapa 1220×2440mm', pecas:[], shelves:[], usedArea:0 }; folhas.push(sheet); }
  for(const pc of pieces){
    let placed=false;
    const orientations = pc.wmm<=sheetWmm-2*gapMm && pc.hmm<=sheetHmm-2*gapMm ? [[pc.wmm,pc.hmm,0]] : [];
    if(pc.hmm<=sheetWmm-2*gapMm && pc.wmm<=sheetHmm-2*gapMm) orientations.push([pc.hmm,pc.wmm,90]);
    for(const [ow,oh,rot] of (sheet?orientations:[])){
      for(const shelf of sheet.shelves){
        if(shelf.h>=oh && (sheetWmm-shelf.usedW-gapMm)>=ow){
          sheet.pecas.push({n:pc.n, x:shelf.usedW+gapMm, y:shelf.y, w:ow, h:oh, rot, label:pc.label});
          shelf.usedW += ow+gapMm; sheet.usedArea += ow*oh; placed=true; break;
        }
      }
      if(placed) break;
      const lastShelf = sheet.shelves[sheet.shelves.length-1];
      const lastY = lastShelf ? lastShelf.y+lastShelf.h+gapMm : gapMm;
      if(lastY+oh <= sheetHmm-gapMm){
        sheet.shelves.push({y:lastY, h:oh, usedW:ow+gapMm});
        sheet.pecas.push({n:pc.n, x:gapMm, y:lastY, w:ow, h:oh, rot, label:pc.label});
        sheet.usedArea += ow*oh; placed=true; break;
      }
    }
    if(!placed){
      newSheet();
      const ow=Math.min(pc.wmm, sheetWmm-2*gapMm), oh=pc.hmm;
      sheet.shelves.push({y:gapMm, h:oh, usedW:ow+gapMm});
      sheet.pecas.push({n:pc.n, x:gapMm, y:gapMm, w:ow, h:oh, rot:0, label:pc.label});
      sheet.usedArea += ow*oh;
    }
  }
  const sheetArea = sheetWmm*sheetHmm;
  folhas.forEach(f=>{
    f.aproveitamento = Math.round(f.usedArea/sheetArea*100);
    const shelvesArea = f.shelves.reduce((a,s)=>a+s.h*sheetWmm,0);
    const sobraArea = Math.max(shelvesArea-f.usedArea,0);
    f.sobra = Math.round(sobraArea/sheetArea*100);
    f.descarte = Math.max(0, 100-f.aproveitamento-f.sobra);
  });
  return { folhas, algoritmo:'shelf-packing (altura decrescente, real)', versao:'real v1' };
}

/* ---------- COMPOSIÇÃO (KIT) REAL — matéria-prima real do MubiSys ---------- */
const FORMULA_TYPES = {
  area: {label:'Área líquida (m²) — conteúdo da letra', calc:(g,mult)=> g.areaM2*mult},
  areaGeral: {label:'Área geral (m²) — chapa consumida', calc:(g,mult)=> (g.areaGeralM2||0)*mult},
  perimExt: {label:'Perímetro externo', calc:(g,mult)=> g.perimExtM*mult},
  perimTotal: {label:'Comprimento total de corte', calc:(g,mult)=> g.corteTotalM*mult},
  fixo: {label:'Quantidade fixa', calc:(g,mult)=> mult},
};
/** Taxonomia de categoria/subcategoria/tipo do cadastro de produtos —
 *  pedido do usuário 28/09/2026. "Outros" dentro de Letreiros são materiais
 *  sem tipo (frontlight/backlight/tradicional não se aplica); Acessórios
 *  não tem terceiro nível — a subcategoria já é o item final. */
const CATEGORIAS_PRODUTO = {
  'Letreiros': {
    'Galvanizado': ['Frontlight', 'Backlight', 'Tradicional'],
    'Inox': ['Frontlight', 'Backlight', 'Tradicional'],
    'Latão': ['Frontlight', 'Backlight', 'Tradicional'],
    'Outros': ['Acrílico montado', 'Acrílico cortado', 'ACM', 'PVC Expandido'],
  },
  'Acessórios': {
    'Gabarito': [], 'LED': [], 'Fonte': [], 'Fixadores': [], 'Outros': [],
  },
  // Mesma taxonomia (substrato × tipo) já usada no wizard de pintura do
  // orçamento (resolverItensPintura) — reaproveitada aqui pra cadastro de
  // produto, decisão do usuário 29/09/2026.
  'Pintura': {
    'Galvanizado': ['Tradicional', 'Metalizada', 'Poliéster'],
    'PVC': ['Tradicional', 'Metalizada', 'Poliéster'],
  },
};

function addKitLine(materiaId){
  const m = catalog.materias.find(x=>x.id===materiaId);
  if(!m) return;
  REAL.kit.push({ matId:m.id, nome:m.nome, unidade:m.unidade, custo:m.valor, atualizado:m.atualizado, status:m.status, papel:'', formulaType:'area', mult:1.0 });
}
function removeKitLine(idx){ REAL.kit.splice(idx,1); }
function kitLineQty(line, geom){ return (FORMULA_TYPES[line.formulaType]||FORMULA_TYPES.fixo).calc(geom, line.mult); }

/* ---------- PINTURA (opcional, pré-configurada em todo orçamento) ----------
 * Wizard de múltipla escolha que resolve sozinho qual matéria-prima real usar,
 * a partir de nomes confirmados no catálogo real (28/09/2026): "Tinta PU [N
 * cores]" (tradicional), "Tinta Poliéster - dourado/prata/bronze" e "Tinta
 * Poliéster - Azul Bic" (metalizada), "Tinta Sintética Dourada Vila Rica",
 * "Verniz Fosco/Brilho 900ml", "Adicional PVC ... em Pintura". Quantidade
 * sempre por área líquida (m²) — pintura cobre a superfície da peça. */
function podeConfirmarPintura(p){
  if(!p.substrato || !p.tipo) return false;
  if(p.tipo==='tradicional'){
    if(!p.cores) return false;
    if(p.temCoresAdicionais==null) return false;
    if(p.temCoresAdicionais && !p.coresAdicionais) return false;
    if(!p.acabamento) return false;
  }
  if(p.tipo==='metalizada' && !p.corMetal) return false;
  return true;
}

/** 1 cor base + N adicionais, no teto de 4 (só existem SKUs até "4 cores"
 *  no catálogo real). */
function totalCoresPintura(p){
  return Math.min(4, Math.max(1, (p.cores||1) + (p.temCoresAdicionais ? (p.coresAdicionais||0) : 0)));
}

function resolverItensPintura(p){
  const itens = [];
  if(p.tipo==='tradicional'){
    const n = totalCoresPintura(p);
    itens.push({termo:`tinta pu [${n} cor${n>1?'es':''}]`, papel:'Pintura', formulaType:'area'});
    if(p.acabamento==='fosco') itens.push({termo:'verniz fosco', papel:'Verniz', formulaType:'area'});
    else if(p.acabamento==='brilhante') itens.push({termo:'verniz brilho', papel:'Verniz', formulaType:'area'});
  } else if(p.tipo==='metalizada'){
    if(p.corMetal==='azulbic') itens.push({termo:'azul bic', papel:'Pintura metalizada', formulaType:'area'});
    else if(p.corMetal==='douradovillarica') itens.push({termo:'vila rica', papel:'Pintura metalizada', formulaType:'area'});
    else itens.push({termo:'dourado/prata/bronze', papel:'Pintura metalizada', formulaType:'area'}); // bronze, prata, outro — mesmo item no catálogo
  } else if(p.tipo==='poliester'){
    itens.push({termo:'tinta poliester', papel:'Pintura', formulaType:'area'});
  }
  // Adicional é uma taxa de peça pequena (item de valor fixo no catálogo,
  // não por m²) — quantidade fixa, não proporcional à área.
  if(p.substrato==='pvc') itens.push({termo:'adicional pvc', papel:'Adicional PVC', formulaType:'fixo'});
  return itens;
}

/** Busca cada termo no catálogo real e adiciona ao kit (fórmula "área líquida"
 *  — decisão do usuário: pintura é por m² de superfície, não por perímetro).
 *  Marca `origemPintura` pra permitir remover tudo de uma vez depois. */
function aplicarPintura(){
  const p = REAL.pintura;
  if(!podeConfirmarPintura(p)) return;
  const specs = resolverItensPintura(p);
  const adicionados = [], naoEncontrados = [];
  specs.forEach(spec=>{
    const m = catalog.materias.find(x=>!adminState.materiasExcluidas.has(x.id) && normalizeSearch(x.nome).includes(normalizeSearch(spec.termo)));
    if(m){
      REAL.kit.push({ matId:m.id, nome:m.nome, unidade:m.unidade, custo:m.valor, atualizado:m.atualizado, status:m.status, papel:spec.papel, formulaType:spec.formulaType, mult:1.0, origemPintura:true });
      adicionados.push(m.nome);
    } else naoEncontrados.push(spec.termo);
  });
  p.habilitada = true;
  p.concluida = true;
  p.itensAdicionados = adicionados;
  if(naoEncontrados.length) alert('Não encontrei no catálogo: '+naoEncontrados.join(', ')+' — adicione manualmente na composição.');
  render();
}

/** Desabilita a pintura e remove do kit tudo que ela tinha adicionado —
 *  volta pro estado "cinza claro", não aparece mais na proposta. */
function removerPintura(){
  REAL.kit = REAL.kit.filter(k=>!k.origemPintura);
  REAL.pintura = { habilitada:false, concluida:false, substrato:null, tipo:null, cores:null, temCoresAdicionais:null, coresAdicionais:null, acabamento:null, corMetal:null, itensAdicionados:[] };
  render();
}

function computeOrcamentoReal(){
  const g = computeGeomReal();
  const matTotal = REAL.kit.reduce((a,k)=>a+kitLineQty(k,g)*k.custo,0);
  const servTotal = REAL.servicos.reduce((a,s)=>a+s.v,0);
  // % custo fixo sobre matéria-prima — GLOBAL, igual pra todo produto
  // (rateio de energia/mão-de-obra fixa), editável só em Administração >
  // Configurações. Decisão do usuário 28/09/2026: não é por produto.
  const custoFixo = matTotal * ((configGeral.custoFixoPct||0)/100);
  const custoDireto = matTotal+custoFixo+servTotal;
  const descontoFrac = REAL.desconto/100;

  // Precificação: dois modos possíveis, cadastrados em Administração por
  // produto. "fixo" = preço de venda direto, não deriva do custo (produtos
  // padronizados de ticket baixo). "margem" (padrão) = % por faixa de ticket
  // vinda da Tabela de Preços real — a margem MUDA sozinha conforme o custo
  // direto muda de faixa.
  if(REAL.precificacao && REAL.precificacao.modo==='fixo' && REAL.precificacao.precoFixo){
    const precoFinal = REAL.precificacao.precoFixo*(1-descontoFrac);
    return {matTotal, servTotal, custoFixo, custoDireto, precoBase:REAL.precificacao.precoFixo, precoComInstalacao:REAL.precificacao.precoFixo, precoFinal, margemInfo:null, margin:null, modoFixo:true};
  }

  const margemInfo = REAL.precificacao ? margemDaTabela(REAL.precificacao, custoDireto) : null;
  const margin = margemInfo ? margemInfo.percentual : REAL.margin;
  const precoBase = custoDireto/(1-margin);
  const precoComInstalacao = precoBase+REAL.instalacao;
  const precoFinal = precoComInstalacao*(1-descontoFrac);
  return {matTotal, servTotal, custoFixo, custoDireto, precoBase, precoComInstalacao, precoFinal, margemInfo, margin, modoFixo:false};
}

      <button class="btn btn-ghost" disabled title="Indisponível nesta demonstração">Solicitar nova foto</button>

}

const STEP_DEFS = [
  {k:'inventario', n:1, label:'Inventário'},
  {k:'reconstrucao', n:2, label:'Reconstrução'},
  {k:'vetorizacao', n:3, label:'Vetorização'},
  {k:'escala', n:4, label:'Escala e geometria'},
  {k:'kit', n:5, label:'Produto e kit'},
  {k:'nesting', n:6, label:'Nesting'},
  {k:'orcamento', n:7, label:'Orçamento'},
];

function renderStepper(p){
  const maxUnlocked = STEP_DEFS.findIndex(s=>!state.approvals[s.k] && s.k!=='orcamento');
  const unlockedIdx = maxUnlocked===-1 ? STEP_DEFS.length-1 : maxUnlocked;
  return `
  <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" data-act="back-picker">← Trocar de projeto</button>
    <div style="font-size:12.5px; color:var(--text-faint);">Projeto: <b style="color:var(--text);">${p.nome}</b> · ${p.produto} · ${p.escopo}</div>
  </div>
  <div class="stepper">
    ${STEP_DEFS.map((s,i)=>{
      const done = state.approvals[s.k] || (s.k==='orcamento' && state.orcamentoStatus!=='rascunho');
      const current = state.step===s.n;
      const locked = i>unlockedIdx;
      return `<div class="step-pill ${done?'done':''} ${current?'current':''} ${locked?'locked':'clickable'}" ${locked?'':`data-act="goto-step" data-val="${s.n}"`}>
        <span class="dot">${done?'✓':s.n}</span>${s.label}
      </div>`;
    }).join('')}
  </div>`;
}

function renderStepContent(p){
  switch(state.step){
    case 1: return stepInventario(p);
    case 2: return stepReconstrucao(p);
    case 3: return stepVetorizacao(p);
    case 4: return stepEscala(p);
    case 5: return stepKit(p);
    case 6: return stepNesting(p);
    case 7: return stepOrcamento(p);
    default: return '';
  }
}

function prancha(p,g){
  const w=560,h=200,pad=48;
  const artW = w-2*pad, artH= (g.totalHeightM/g.totalWidthM)*artW;
  const artY = (h-artH)/2;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; background:var(--surface); border-radius:8px;">
    <rect x="${pad}" y="${artY}" width="${artW}" height="${artH}" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity=".25"/>
    <text x="${w/2}" y="${artY+artH/2+6}" text-anchor="middle" font-family="Sora" font-weight="700" font-size="20" fill="currentColor" opacity=".55">${p.nome.split(' ')[0].toUpperCase()}</text>
    <line x1="${pad}" y1="${artY-14}" x2="${pad+artW}" y2="${artY-14}" stroke="currentColor" opacity=".5"/>
    <line x1="${pad}" y1="${artY-19}" x2="${pad}" y2="${artY-9}" stroke="currentColor" opacity=".5"/>
    <line x1="${pad+artW}" y1="${artY-19}" x2="${pad+artW}" y2="${artY-9}" stroke="currentColor" opacity=".5"/>
    <text x="${w/2}" y="${artY-20}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="currentColor" opacity=".7">${fmt(g.totalWidthM,2)} m</text>
    <line x1="${pad-14}" y1="${artY}" x2="${pad-14}" y2="${artY+artH}" stroke="currentColor" opacity=".5"/>
    <text x="${pad-20}" y="${artY+artH/2}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="currentColor" opacity=".7" transform="rotate(-90 ${pad-20} ${artY+artH/2})">${fmt(g.totalHeightM,2)} m</text>
  </svg>`;
}

function nestingSheet(f,fi){
  const W=1220,H=2440, vh = W*0.30;
  const colors=['#1e6fd9','#0d9488','#d97706','#c23b3b','#7c3aed'];
  const maxY = Math.max(...f.pecas.map(pc=>pc.y+pc.w)) + 60;
  const usableH = Math.min(vh, Math.max(maxY, W*0.16));
  return `
  <div class="card" style="background:var(--surface-2); box-shadow:none;">
    <div class="cardhead" style="margin-bottom:8px;"><div><h4 style="font-size:13px;">Chapa ${fi+1} — ${f.material}</h4></div>
      <div style="display:flex; gap:8px;">
        <span class="badge b-ok">Aproveitamento ${f.aproveitamento}%</span>
        <span class="badge b-neutral">Sobra ${f.sobra}%</span>
        <span class="badge b-bad">Descarte ${f.descarte}%</span>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${usableH}" style="width:100%; height:auto; background:var(--surface); border-radius:8px; border:1px dashed var(--border);">
      <rect x="8" y="8" width="${W-16}" height="${usableH-16}" fill="none" stroke="currentColor" stroke-dasharray="6 6" opacity=".2"/>
      ${f.pecas.map((pc,i)=>{
        const showLabel = pc.w>=100 && pc.h>=60;
        return `
        <g transform="translate(${pc.x+pc.w/2} ${pc.y+pc.h/2}) rotate(${pc.rot})">
          <rect x="${-pc.w/2}" y="${-pc.h/2}" width="${pc.w}" height="${pc.h}" rx="6" fill="${colors[i%colors.length]}22" stroke="${colors[i%colors.length]}" stroke-width="3"/>
          <circle cx="${-pc.w/2+16}" cy="${-pc.h/2+16}" r="14" fill="${colors[i%colors.length]}"/>
          <text x="${-pc.w/2+16}" y="${-pc.h/2+21}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="15" fill="white">${pc.n}</text>
          ${showLabel?`<text x="0" y="6" text-anchor="middle" font-family="Inter" font-size="14" fill="${colors[i%colors.length]}" opacity=".85">${pc.label}</text>`:''}
        </g>`;}).join('')}
      <text x="${W-16}" y="${usableH-14}" text-anchor="end" font-family="Inter" font-size="13" fill="currentColor" opacity=".4">chapa ${W}×${H}mm — restante não utilizado omitido nesta prévia</text>
    </svg>
    <div style="display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;">
      ${f.pecas.map((pc,i)=>`<div style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim);"><span style="width:9px;height:9px;border-radius:3px;background:${colors[i%colors.length]};display:inline-block;"></span>${pc.n}. ${pc.label}</div>`).join('')}
    </div>
  </div>`;
}

        </tbody>
      </table>
    </div>

    <div class="grid2" style="margin-top:14px;">

/** Um par (produtoId, modeloId) bate no filtro de categoria/subcategoria/tipo
 *  do passo 1 quando os 3 níveis escolhidos (os que estiverem preenchidos)
 *  batem com o que foi cadastrado nesse modelo em Administração. Sem
 *  categoria cadastrada no modelo, ele nunca aparece quando o filtro está
 *  ativo — decisão do usuário 28/09/2026: categoria primeiro, produto depois. */
function modeloBateFiltro(produtoId, modeloId){
  if(!REAL.filtroCategoria) return true;
  const kit = adminState.kits[kitKey(produtoId, modeloId)];
  if(!kit || kit.categoria!==REAL.filtroCategoria) return false;
  if(REAL.filtroSubcategoria && kit.subcategoria!==REAL.filtroSubcategoria) return false;
  if(REAL.filtroTipo && kit.tipoProduto!==REAL.filtroTipo) return false;
  return true;
}

async function handleReferenceUpload(file, target){
  redrawRequestId++;
  REAL.gerandoRedesenho=false;
  REAL.uploadError=null; REAL.uploadWarning=null;
  if(!file || !/^image\/(png|jpeg)$/.test(file.type)){
    REAL.uploadError='Envie uma fotografia ou print em PNG/JPG.';
    render();
    return;
  }
  invalidarRastreamento();
  const dataUrl=await new Promise((resolve,reject)=>{
    const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file);
  });
  if(target==='photo'){
    REAL.imgOriginal=dataUrl;
    REAL.imgReconstructed=null; REAL.imgPreview=null;
    REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.sourceKind=null;
    REAL.approvals.foto=false; REAL.approvals.redesenho=false; REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false;
  }else{
    REAL.imgReconstructed=dataUrl;
    REAL.imgPreview=null; REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.sourceKind='raster';
    REAL.approvals.redesenho=false; REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false;
  }
  render();
  if(target==='redraw') await retrace();
}

async function blobParaDataUrl(blob){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function comprimirReferenciaGPT(dataUrl){
  const original=await fetch(dataUrl).then(r=>r.blob());
  const bitmap=await createImageBitmap(original);
  const maxDimension=3072;
  let scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
  let width=Math.max(1,Math.round(bitmap.width*scale));
  let height=Math.max(1,Math.round(bitmap.height*scale));
  if(original.size<=3_500_000 && scale===1){ bitmap.close(); return original; }

  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  if(!ctx){ bitmap.close(); throw new Error('Nao foi possivel preparar a foto no navegador.'); }
  for(let tentativa=0;tentativa<5;tentativa++){
    canvas.width=width; canvas.height=height;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,width,height);
    ctx.drawImage(bitmap,0,0,width,height);
    const qualidade=[0.9,0.82,0.74,0.66,0.58][tentativa];
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',qualidade));
    if(!blob){ bitmap.close(); throw new Error('Nao foi possivel preparar a foto no navegador.'); }
    if(blob.size<=3_500_000){ bitmap.close(); return blob; }
    width=Math.max(1,Math.round(width*0.82));
    height=Math.max(1,Math.round(height*0.82));
  }
  bitmap.close();
  throw new Error('A foto e muito grande para enviar. Escolha uma imagem menor.');
}

async function gerarRedesenhoComGPT(){
  if(!REAL.imgOriginal || REAL.gerandoRedesenho) return;
  if(REAL.escopoRedesenho==='elementos_selecionados' && !REAL.elementosSelecionados.trim()){
    REAL.uploadError='Descreva os elementos que o GPT deve reconstruir.';
    render();
    return;
  }

  const requestId=++redrawRequestId;
  invalidarRastreamento();
  REAL.gerandoRedesenho=true;
  REAL.uploadError=null;
  render();
  try{
    const imagem=await comprimirReferenciaGPT(REAL.imgOriginal);
    const query=new URLSearchParams({escopo:REAL.escopoRedesenho});
    if(REAL.escopoRedesenho==='elementos_selecionados') query.set('elementosSelecionados',REAL.elementosSelecionados.trim());
    const response=await fetch('/api/letra-caixa/redesenho?'+query.toString(),{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':imagem.type||'image/jpeg'},
      body:imagem
    });
    if(!response.ok){
      const body=await response.json().catch(()=>({}));
      throw new Error(body.error||'O GPT nao conseguiu gerar a reconstrução.');
    }
    const resultado=await response.blob();
    if(requestId!==redrawRequestId) return;
    REAL.imgReconstructed=await blobParaDataUrl(resultado);
    REAL.imgPreview=null;
    REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.sourceKind='raster';
    REAL.approvals.redesenho=false; REAL.approvals.vetorizacao=false; REAL.approvals.escala=false;
    REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
    // Antecipar o traçado enquanto o operador confere o redesenho reduz a
    // espera depois da aprovação sem fazer uma segunda chamada ao GPT.
    void retrace();
  }catch(error){
    if(requestId===redrawRequestId){
      REAL.uploadError=error instanceof Error?error.message:'Falha ao gerar a reconstrução.';
    }
  }finally{
    if(requestId===redrawRequestId){ REAL.gerandoRedesenho=false; render(); }
  }
}

  const hasReference=!!REAL.imgOriginal;
  const hasReconstruction=!!REAL.imgReconstructed;
  const canApprove=hasReconstruction && (REAL.escopoRedesenho!=='elementos_selecionados'||REAL.elementosSelecionados.trim());
  return `
  <div class="card">
    <div class="cardhead"><div><h3>3 · Etapa 2 — reconstrução visual fiel (Prompt 1)</h3><p>Corrige perspectiva e remove ambiente/efeitos físicos sem modernizar, inventar conteúdo ou trocar a tipografia. O resultado precisa continuar parecendo a mesma identidade.</p></div></div>
    ${hasReference?`
      <div class="grid2">
        <div><p style="font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;">Foto original</p><div class="compare"><img src="${REAL.imgOriginal}" alt="Referência original" style="display:block;width:100%;height:auto;"></div></div>
        <div><p style="font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;">Redesenho aprovado</p><div class="compare">${hasReconstruction?`<img src="${REAL.imgReconstructed}" alt="Reconstrução enviada" style="display:block;width:100%;height:auto;">`:`<div class="empty-hint">Envie a imagem redesenhada para comparar e seguir para a vetorização.</div>`}</div></div>
      </div>
      ${hasReconstruction?uploadBox('Trocar a imagem reconstruída','Envie a versão final aprovada em PNG/JPG','real-redraw-upload','image/png,image/jpeg,.jpg,.jpeg,.png'):uploadBox('Enviar imagem reconstruída','PNG/JPG frontal, limpa e fiel à referência','real-redraw-upload','image/png,image/jpeg,.jpg,.jpeg,.png')}
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap;">
        <button class="btn btn-primary" data-act="real-redraw-generate" ${REAL.gerandoRedesenho?'disabled':''}>${REAL.gerandoRedesenho?'GPT redesenhando...':hasReconstruction?'Gerar nova vers\u00e3o com GPT':'Gerar reconstru\u00e7\u00e3o com GPT'}</button>
        ${REAL.gerandoRedesenho?'<span class="role-note">O GPT est\u00e1 reconstruindo a imagem. Isso pode levar alguns instantes...</span>':'<span class="role-note">Voc\u00ea poder\u00e1 comparar a sa\u00edda com a foto e aprovar antes de vetorizar.</span>'}
      </div>
      <div class="checklist" style="margin-top:12px;">
        <div class="checkrow">${ICONS.check}Preservar letras, acentos, símbolos, proporções e detalhes pequenos</div>
        <div class="checkrow">${ICONS.check}Nivelar perspectiva sem apagar inclinações que façam parte da identidade</div>
        <div class="checkrow">${ICONS.check}Reconstruir só a face gráfica; retirar parede, ferragens, laterais, reflexos e halos</div>
        <div class="checkrow">${ICONS.check}Usar cores chapadas; registrar como incerto o que a foto não confirma</div>
      </div>
      <div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" data-act="copy-redraw-prompt">Copiar instrução do Prompt 1</button></div>
      <div class="role-note" style="margin-top:10px;">${ICONS.info} A reconstru\u00e7\u00e3o \u00e9 gerada pelo GPT Image no servidor usando o Prompt 1. Revise o resultado antes de aprovar; cada gera\u00e7\u00e3o usa cr\u00e9ditos da API OpenAI.</div>
      ${uploadMessages()}
      <div class="footer-nav">
        <button class="btn btn-ghost btn-sm" data-act="real-remove-image">Trocar a foto original</button>
        <button class="btn btn-primary" data-act="real-approve" data-val="redesenho" ${canApprove?'':'disabled'}>${ICONS.check} Aprovar reconstrução e avançar</button>
      </div>
    `:`<div class="warnbox" style="margin-top:12px;"><span>${ICONS.alert}</span><div>Envie primeiro a foto original e aprove o escopo no passo anterior.</div></div>`}
  </div>`;
}

    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"><button class="btn btn-soft btn-sm" data-act="editor-vetor-abrir">✏️ Editor rápido (mover, girar, expandir, apagar, cor)</button><button class="btn btn-ghost btn-sm" data-act="download-vector-svg">Baixar SVG vetorial</button></div>` : ''}
    <details style="margin-top:14px;">
