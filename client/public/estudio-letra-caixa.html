      <div style="margin-top:10px;">${uploadBox('Enviar SVG já vetorizado', 'substitui o rastreamento acima por um arquivo pronto','real-upload','image/svg+xml,.svg')}</div>
    </details>
    ${uploadMessages()}
    <div class="footer-nav">
      <div class="role-note">${ICONS.info} Silhueta ruidosa? Ajuste o limiar, ou volte e mude brilho/contraste.</div>
      <button class="btn btn-primary" data-act="real-approve" data-val="vetorizacao" ${hasTrace?'':'disabled'}>${ICONS.check} Aprovar vetorização e avançar</button>
    </div>
  </div>`;
}

function realStepEscala(){
  const g = computeGeomReal();
  const proporcao = REAL.geomRaw && REAL.geomRaw.bboxPx.h ? REAL.geomRaw.bboxPx.w/REAL.geomRaw.bboxPx.h : 0;
  const medidaDeRaster = REAL.sourceKind==='raster';
  return `
  <div class="card">
    <div class="cardhead"><div><h3>5 · Escala, área e perímetros (Prompt 3)</h3><p>Informe uma dimensão física conhecida. A escala é uniforme e ignora margens vazias do SVG; área líquida desconta os vazados e o corte soma contornos externos e internos.</p></div></div>
    <div class="grid2">
      <div>
        <label class="field">A medida corresponde a
          <select data-act="real-scale-reference">
            <option value="arte_completa" ${REAL.scale.reference==='arte_completa'?'selected':''}>Arte completa deste arquivo</option>
            <option value="nome_principal" ${REAL.scale.reference==='nome_principal'?'selected':''}>Nome/palavra principal isolado</option>
            <option value="simbolo" ${REAL.scale.reference==='simbolo'?'selected':''}>Símbolo isolado</option>
            <option value="painel" ${REAL.scale.reference==='painel'?'selected':''}>Painel/placa de fundo</option>
            <option value="outro" ${REAL.scale.reference==='outro'?'selected':''}>Outro elemento isolado</option>
          </select>
        </label>
        ${REAL.scale.reference==='outro'?`<label class="field" style="margin-top:10px;">Descreva os pontos medidos<input type="text" value="${escaparHtml(REAL.scale.referenceDesc)}" data-act="real-scale-reference-desc" placeholder="Ex.: extremos do símbolo, sem o texto"></label>`:''}
        <div style="display:flex; gap:10px;">
          <label class="field" style="flex:1;">
            <span>${REAL.scale.byHeight?'Altura real conhecida':'Largura real conhecida'}</span>
            <input type="text" inputmode="decimal" value="${REAL.scale.valor}" data-act="real-scale-value">
          </label>
          <label class="field" style="width:100px;">Unidade
            <select data-act="real-scale-unit">${['mm','cm','m'].map(u=>`<option value="${u}" ${REAL.scale.unidade===u?'selected':''}>${u}</option>`).join('')}</select>
          </label>
        </div>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; margin-top:10px;">
          <input type="checkbox" data-act="real-scale-byheight" ${REAL.scale.byHeight?'checked':''}> Medida é a altura (em vez da largura)
        </label>
        <p style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">A dimensão oposta é calculada proporcionalmente. Se a medida for só de um símbolo ou palavra, envie na etapa de reconstrução uma arte isolada desse elemento; a geometria é calculada sobre tudo o que estiver neste arquivo.</p>
        <p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">Contorno preto de visualização: ignorado. O cálculo considera os caminhos preenchidos do SVG.</p>
      </div>
      <div class="tablewrap">
        <table><tbody>
          <tr><td>Largura total</td><td class="num">${fmt(g.totalWidthM,3)} m</td></tr>
          <tr><td>Altura total (proporcional)</td><td class="num">${fmt(g.totalHeightM,3)} m</td></tr>
          <tr><td>Proporção (largura/altura)</td><td class="num">${fmt(proporcao,3)}</td></tr>
          <tr><td>Fator de escala</td><td class="num">${g.scaleFactor.toExponential(3)}</td></tr>
          <tr><td>Área líquida (amostragem, descontados vazados)</td><td class="num">${fmt(g.areaM2,3)} m²</td></tr>
          <tr><td>Área geral (retângulo envolvente)</td><td class="num">${fmt(g.areaGeralM2,3)} m²</td></tr>
          <tr><td>Perímetro externo</td><td class="num">${fmt(g.perimExtM,2)} m</td></tr>
          <tr><td>Perímetro interno / vazados</td><td class="num">${fmt(g.perimIntM,2)} m</td></tr>
          <tr><td><b>Comprimento total de corte</b></td><td class="num"><b>${fmt(g.corteTotalM,2)} m</b></td></tr>
        </tbody></table>
      </div>
    </div>
    <div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:14px;">
      <p style="font-size:12.5px;font-weight:700;margin-bottom:8px;">Prancha técnica</p>
      ${pranchaTecnicaSvg(g)}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-soft btn-sm" data-act="download-tech-sheet">Baixar prancha técnica PNG (2400 px)</button>
        <button class="btn btn-ghost btn-sm" data-act="download-vector-svg">Baixar SVG vetorial</button>
      </div>

    <div class="warnbox" style="margin-top:12px;background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 35%,var(--border));">
      <span style="color:var(--warn);">${ICONS.info}</span><div><b>Resultado geométrico aproximado por amostragem.</b> ${medidaDeRaster?'A medida parte do traçado automático; ruído, perspectiva e qualidade do redesenho podem alterar os contornos.':'A medida parte dos caminhos vetoriais lidos no SVG.'} ${g.possivelSobreposicao?'As caixas envolventes de peças se cruzam; confira sobreposições, pois áreas coincidentes podem ser contadas mais de uma vez.':''} Kerf, diâmetro da ferramenta, offsets e desperdício não estão incluídos.</div>
    </div>
    <div class="footer-nav">
      <div class="role-note">${ICONS.info} ${REAL.geomRaw?REAL.geomRaw.pieces.length:0} contorno(s) externo(s); revise vazados e sobreposições antes de usar para fabricação.</div>
      <button class="btn btn-primary" data-act="real-approve" data-val="escala">${ICONS.check} Confirmar medidas e avançar</button>
    </div>
  </div>`;
}

function pranchaTecnicaSvg(g=computeGeomReal()){
  const width=1800, height=1120;
  const box=REAL.geomRaw && REAL.geomRaw.bboxPx || {x:0,y:0,w:REAL.tracedW||1,h:REAL.tracedH||1};
  const drawX=130, drawY=160, drawW=1050, drawH=690;
  const scale=Math.min(drawW/Math.max(box.w,1),drawH/Math.max(box.h,1));
  const artW=box.w*scale, artH=box.h*scale, artX=drawX+(drawW-artW)/2, artY=drawY+(drawH-artH)/2;
  const x2=artX+artW, y2=artY+artH;
  const title=escaparHtml(REAL.modeloNome||'Arte vetorizada');
  const refLabels={arte_completa:'arte completa',nome_principal:'nome/palavra principal isolado',simbolo:'símbolo isolado',painel:'painel/placa',outro:REAL.scale.referenceDesc||'outro elemento'};
  const refText=escaparHtml(refLabels[REAL.scale.reference]||'arte completa');
  const totalCut=fmt(g.corteTotalM,2), area=fmt(g.areaM2,3);
  const widthLabel=`${fmt(g.totalWidthM,3)} m`, heightLabel=`${fmt(g.totalHeightM,3)} m`;
  const ticks=Array.from({length:11},(_,i)=>{
    const x=artX+artW*i/10, y=artY+artH*i/10;
    const tickM=g.totalWidthM*i/10;
    return `<line x1="${x}" y1="${y2+32}" x2="${x}" y2="${y2+42}" stroke="#64748b"/><text x="${x}" y="${y2+62}" text-anchor="middle" font-size="12" fill="#475569">${fmt(tickM,2)}</text><line x1="${artX-34}" y1="${y}" x2="${artX-24}" y2="${y}" stroke="#64748b"/><text x="${artX-45}" y="${y+4}" text-anchor="end" font-size="12" fill="#475569">${fmt(g.totalHeightM*i/10,2)}</text>`;
  }).join('');
  return `<svg id="prancha-tecnica-svg" xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;background:#fff;border:1px solid var(--border);border-radius:8px;">
    <rect width="${width}" height="${height}" fill="#fff"/>
    <text x="${drawX}" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">PRANCHA TÉCNICA — ${title}</text>
    <text x="${drawX}" y="105" font-family="Arial,sans-serif" font-size="15" fill="#475569">Escala aplicada uniformemente · ${REAL.scale.byHeight?'altura':'largura'} conhecida: ${escaparHtml(REAL.scale.valor)} ${REAL.scale.unidade} · contorno visual ignorado</text>
    <defs><marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
    <svg x="${artX}" y="${artY}" width="${artW}" height="${artH}" viewBox="${box.x} ${box.y} ${box.w} ${box.h}" preserveAspectRatio="xMidYMid meet"><path d="${escaparHtml(REAL.fgD||'')}" fill="#111827" fill-rule="evenodd"/></svg>
    <line x1="${artX}" y1="${y2+16}" x2="${x2}" y2="${y2+16}" stroke="#334155" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <text x="${artX+artW/2}" y="${y2+7}" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Largura ${widthLabel}</text>
    <line x1="${artX-16}" y1="${artY}" x2="${artX-16}" y2="${y2}" stroke="#334155" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
    <text x="${artX-26}" y="${artY+artH/2}" text-anchor="middle" transform="rotate(-90 ${artX-26} ${artY+artH/2})" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">Altura ${heightLabel}</text>
    ${ticks}
    <text x="${artX+artW/2}" y="${y2+84}" text-anchor="middle" font-size="12" fill="#475569">Régua horizontal (m)</text>
    <text x="1290" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">RESULTADOS</text>
    <text x="1290" y="235" font-size="15" fill="#334155">Largura: ${widthLabel}</text>
    <text x="1290" y="270" font-size="15" fill="#334155">Altura: ${heightLabel}</text>
    <text x="1290" y="305" font-size="15" fill="#334155">Área líquida (aprox.): ${area} m²</text>
    <text x="1290" y="340" font-size="15" fill="#334155">Perímetro externo: ${fmt(g.perimExtM,2)} m</text>
    <text x="1290" y="375" font-size="15" fill="#334155">Vazados: ${fmt(g.perimIntM,2)} m</text>
    <text x="1290" y="410" font-size="15" font-weight="700" fill="#0f172a">Corte total: ${totalCut} m</text>
    <text x="1290" y="460" font-size="13" fill="#475569">Fator de escala: ${g.scaleFactor.toExponential(3)}</text>
    <text x="1290" y="495" font-size="13" fill="#475569">Referência medida: ${refText}</text>
    <text x="1290" y="530" font-size="13" fill="#475569">Arquivo de origem: ${REAL.sourceKind==='raster'?'raster rastreado (aproximado)':'SVG vetorial'}</text>
    <line x1="1290" y1="565" x2="1700" y2="565" stroke="#cbd5e1"/>
    <text x="1290" y="600" font-size="12" fill="#64748b">Cálculo por amostragem; não inclui kerf, ferramenta, offset ou desperdício.</text>
    <text x="1290" y="625" font-size="12" fill="#64748b">${g.possivelSobreposicao?'Confira peças sobrepostas: a área pode ser somada duas vezes.':'Confira contornos e vazados antes de fabricar.'}</text>
    <text x="${drawX}" y="${height-35}" font-size="12" fill="#64748b">${title} · prancha gerada pelo protótipo Estúdio Letra Caixa</text>
  </svg>`;
}

async function downloadTechnicalSheetPNG(){
  const svg=document.getElementById('prancha-tecnica-svg');
  if(!svg){ alert('Confirme as medidas para gerar a prancha.'); return; }
  const source=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob);
  try{
    const image=await loadImageEl(url), canvas=document.createElement('canvas');
    canvas.width=2400; canvas.height=Math.round(2400*1120/1800);
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height);
    const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!png) throw new Error('Não consegui renderizar o PNG.');
    const pngUrl=URL.createObjectURL(png), link=document.createElement('a'); link.href=pngUrl; link.download='prancha-tecnica.png'; link.click(); setTimeout(()=>URL.revokeObjectURL(pngUrl),1000);
  }catch(e){ alert(e.message||'Falha ao exportar a prancha PNG.'); }
  finally{ URL.revokeObjectURL(url); }
}

function downloadVectorSvg(){
  if(!REAL.fgD){ alert('Ainda não há geometria vetorial para exportar.'); return; }
  const b=REAL.geomRaw && REAL.geomRaw.bboxPx || {x:0,y:0,w:REAL.tracedW||1,h:REAL.tracedH||1};
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${b.w}" height="${b.h}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}"><path d="${escaparHtml(REAL.fgD)}" fill="#fff" stroke="#000" stroke-width="1" fill-rule="evenodd"/></svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'})), link=document.createElement('a'); link.href=url; link.download='arte-vetorizada.svg'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function montarInstrucaoRedesenho(){
  const escopo=REAL.escopoRedesenho==='somente_logo'?'somente a logo, sem dados externos à marca':REAL.escopoRedesenho==='letreiro_completo'?'todo o painel gráfico, incluindo textos e elementos que pertençam ao letreiro':`somente estes elementos: ${REAL.elementosSelecionados.trim()}`;
  return `Reconstrua fielmente a arte existente na imagem anexada. Escopo: ${escopo}. Faça um inventário completo dos elementos e use a foto como referência principal. Preserve conteúdo, tipografia, símbolos, proporções, composição, detalhes pequenos e cores aproximadas. Corrija a perspectiva e nivele os eixos quando a inclinação não fizer parte da identidade; preserve curvas, diagonais e assimetrias originais. Reconstrua só a face gráfica: remova ambiente, suportes, laterais físicas, aros, reflexos, sombras e halos. Use cores chapadas, sem gradientes, textura ou volume. Não modernize, embeleze, simetrize, invente letras ou complete partes ilegíveis; marque como incerto o que não puder confirmar. Não pesquise outra versão da marca. Compare referência e reconstrução lado a lado e corrija diferenças. Entregue a arte frontal limpa, com fundo transparente para logo isolada quando possível. Não gere SVG nem prepare corte nesta etapa.`;
}

async function copiarInstrucaoRedesenho(){
  const prompt=montarInstrucaoRedesenho();
  try{
    await navigator.clipboard.writeText(prompt);
    alert('Instrução copiada. Cole-a no chat de IA junto com a foto original.');
  }catch(e){
    const area=document.createElement('textarea'); area.value=prompt; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
    const ok=document.execCommand('copy'); area.remove();
    alert(ok?'Instrução copiada. Cole-a no chat de IA junto com a foto original.':'Não consegui copiar automaticamente. Selecione e copie o texto do Prompt 1 no código do protótipo.');
  }
}

        <div class="kv" style="border-top:1px solid var(--border); margin-top:6px; padding-top:8px;"><span style="font-weight:700; color:var(--text);">Preço final</span><span style="font-size:16px; color:var(--accent-ink);">${money(o.precoFinal)}</span></div>
      </div>
    </div>

      </div>
      ${curIdx<statuses.length-1? `<button class="btn btn-primary" data-act="real-advance-status">${ICONS.check} Avançar para "${statuses[curIdx+1]}"</button>` : (REAL.cotacaoLink ? `<a class="btn btn-primary" href="${escaparHtml(REAL.cotacaoLink)}" target="_blank" rel="noopener">${ICONS.check} Abrir ${escaparHtml(REAL.cotacaoNumero||'cotação interativa')}</a>` : `<button class="btn btn-primary" data-act="real-concluir-cotacao">${ICONS.check} Concluir orçamento e gerar link</button>`)}

}

/* ---------- ADMIN: catálogo real (produtos/modelos + matérias-primas do MubiSys) ---------- */
const adminState = {
  produtoQuery:'', materiaQuery:'', adminMatQuery:'', kitProdutoQuery:'', precoLinhaQuery:'', filtroVendedorPropostas:'',
  filtroDataInicioPropostas:'', filtroDataFimPropostas:'', filtroNumeroPropostas:'',
  cotacoesServidor:[], cotacoesCarregando:false, cotacoesErro:'',
  expandedProdutoId:null, editingKey:null,
  // { 'produtoId_modeloId': { linhas:[{matId,nome,unidade,custo,atualizado,status,papel,formulaType,mult}], precificacao:{lineId}|{modo:'fixo',precoFixo}|null, nomeCompleto, prazoDiasUteis, kitProdutos, fotoUrl, fotoAssetId } }
  kits:{},
  produtosExcluidos:new Set(), materiasExcluidas:new Set(),
};
function kitKey(produtoId, modeloId){ return produtoId+'_'+modeloId; }

/* ---------- PERSISTÊNCIA REAL (banco do artifact) ----------
 * Sem isso, adminState.kits/exclusões viviam só em memória JS: qualquer
 * reload (ou outro vendedor abrindo o mesmo link) via o cadastro do
 * administrador sumir, mesmo já tendo sido preenchido antes — a composição
 * de matéria-prima "desaparecia" e sem ela não há orçamento. Agora o
 * cadastro do admin é gravado no banco do artifact e recarregado/sincronizado
 * ao vivo entre todas as abas que tiverem esta página aberta. */
let dbApi = null;
let assetsApi = null;
let cotacaoEmCriacao = false;
const _kitSaveTimers = {};
let _exclSaveTimer = null;
let _configSaveTimer = null;

/** Config GLOBAL (não por produto): % custo fixo é sempre o mesmo pra todo
 *  mundo (decisão do usuário 28/09/2026 — corrige a v.anterior deste
 *  protótipo, que tinha custo fixo por produto); vendedores e papéis de peça
 *  são listas geridas em Administração > Configurações. */
const configGeral = {
  custoFixoPct: 40,
  vendedores: [],
  whatsappVendedores: {},
  formasPagamento: { cartao:true, boleto:true, ted:true },
  jurosCartaoPct: [0,0,0,0,0,0],
  papeisPeca: ['Face','Fundo','Lateral','Pintura','Iluminação','Fixação','Insumo fabricação','Produtividade'],
};

/** Propostas confirmadas pelo vendedor no fluxo real — carregadas do banco
 *  pra alimentar a aba "Propostas realizadas" em Administração. */
const propostasReais = {};

function linkCotacaoPublica(token){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('cotacao', token);
  return url.toString();
}

function normalizarTelefoneWhatsApp(valor){
  const digitos=String(valor||'').replace(/\D/g,'');
  if(digitos.length===10 || digitos.length===11) return '55'+digitos;
  if((digitos.length===12 || digitos.length===13) && digitos.startsWith('55')) return digitos;
  return '';
}

async function carregarCotacoesServidor(){
  adminState.cotacoesCarregando = true;
  adminState.cotacoesErro = '';
  try{
    const response = await fetch('/api/letra-caixa/cotacoes', {credentials:'same-origin'});
    const body = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error || 'Não foi possível carregar as cotações.');
    adminState.cotacoesServidor = body.cotacoes || [];
  }catch(error){
    adminState.cotacoesErro = error.message || 'Não foi possível carregar as cotações.';
  }finally{
    adminState.cotacoesCarregando = false;
    if(state.tab==='admin' && state.adminTab==='propostas') render();
  }
}

function snapshotCotacaoReal(){
  const g = computeGeomReal();
  const o = computeOrcamentoReal();
  const kitPronto = REAL.produtoId && REAL.modeloId ? adminState.kits[kitKey(REAL.produtoId, REAL.modeloId)] : null;
  return {
    dataEmissao: REAL.dataEmissao,
    validadeDias: REAL.validadeDias || 20,
    modalidadeFrete: REAL.modalidadeFrete || null,
    metodoPagamento: 'pix',
    formasPagamentoPermitidas: ['pix', ...Object.entries(configGeral.formasPagamento).filter(([,habilitada])=>habilitada).map(([forma])=>forma)],
    jurosCartaoPct: configGeral.jurosCartaoPct.slice(0,6),
    cliente:{
      cnpj:REAL.cliente.cnpj || null,
      razao:REAL.cliente.razao || null,
      fantasia:REAL.cliente.fantasia || null,
      endereco:REAL.cliente.endereco || null,
    },
    vendedor:REAL.vendedor || '',
    whatsappVendedor:normalizarTelefoneWhatsApp(configGeral.whatsappVendedores[REAL.vendedor]) || null,
    modeloNome:REAL.modeloNome || '',
    descricaoProduto:REAL.descricaoProduto || '',
    areaM2:Number.isFinite(g.areaM2) ? g.areaM2 : null,
    areaGeralM2:Number.isFinite(g.areaGeralM2) ? g.areaGeralM2 : null,
    precoFinal:o.precoFinal,
    prazoDiasUteis:kitPronto?.prazoDiasUteis ?? null,
    status:'enviado',
  };
}

async function criarCotacaoPublica(){
  const response = await fetch('/api/letra-caixa/cotacoes', {
    method:'POST',
    credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sourceId:REAL.id, snapshot:snapshotCotacaoReal()}),
  });
  const body = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(body.error || 'Não foi possível gerar o link da cotação.');
  REAL.cotacaoId = body.id;
  REAL.cotacaoNumero = body.numero;
  REAL.cotacaoToken = body.token;
  REAL.cotacaoLink = linkCotacaoPublica(body.token);
  await carregarCotacoesServidor();
  return REAL.cotacaoLink;
}

async function concluirOrcamentoEabrirCotacao(){
  if(cotacaoEmCriacao) return;
  cotacaoEmCriacao=true;
  const janela = window.open('about:blank','_blank');
  if(janela) janela.opener = null;
  try{
    REAL.orcamentoStatus='enviado';
    const link = await criarCotacaoPublica();
    if(janela) janela.location.href=link;
    state.tab='admin';
    state.adminTab='propostas';
    render();
  }catch(error){
    if(janela) janela.close();
    alert(error.message || 'Não foi possível concluir o orçamento.');
    render();
  }finally{
    cotacaoEmCriacao=false;
  }
}

async function initDb(){
  try{ dbApi = await claude.use('db'); }catch(e){ dbApi = null; }
  try{ assetsApi = await claude.use('assets'); }catch(e){ assetsApi = null; }
  if(!dbApi) return; // visão sem banco (link público, viewer sem grant etc.) — segue só em memória
  try{
    const snap = await dbApi.collection('kits').get();
    snap.docs.forEach(d=>{
      const data = d.data();
      if(data) adminState.kits[d.id] = {
        linhas: data.linhas||[], precificacao: data.precificacao||null,
        nomeCompleto: data.nomeCompleto||null,
        prazoDiasUteis: data.prazoDiasUteis??null, kitProdutos: data.kitProdutos||[],
        fotoUrl: data.fotoUrl||null, fotoAssetId: data.fotoAssetId||null,
        categoria: data.categoria||null, subcategoria: data.subcategoria||null, tipoProduto: data.tipoProduto||null,
      };
    });
  }catch(e){ /* leitura falhou: segue com o que já está em memória */ }
  try{
    const cfg = await dbApi.doc('config/exclusoes').get();
    if(cfg.exists){
      const data = cfg.data()||{};
      adminState.produtosExcluidos = new Set(data.produtos||[]);
      adminState.materiasExcluidas = new Set(data.materias||[]);
    }
  }catch(e){}
  try{
    const cfg = await dbApi.doc('config/geral').get();
    if(cfg.exists){
      const data = cfg.data()||{};
      if(typeof data.custoFixoPct==='number') configGeral.custoFixoPct = data.custoFixoPct;
      if(Array.isArray(data.vendedores)) configGeral.vendedores = data.vendedores;
      if(data.whatsappVendedores && typeof data.whatsappVendedores==='object' && !Array.isArray(data.whatsappVendedores)) configGeral.whatsappVendedores = data.whatsappVendedores;
      if(data.formasPagamento && typeof data.formasPagamento==='object' && !Array.isArray(data.formasPagamento)){
        for(const forma of ['cartao','boleto','ted']) if(typeof data.formasPagamento[forma]==='boolean') configGeral.formasPagamento[forma]=data.formasPagamento[forma];
      }
      if(Array.isArray(data.jurosCartaoPct)) configGeral.jurosCartaoPct=Array.from({length:6},(_,i)=>{
        const valor=Number(data.jurosCartaoPct[i]);
        return Number.isFinite(valor)?Math.min(100,Math.max(0,valor)):0;
      });
      if(Array.isArray(data.papeisPeca) && data.papeisPeca.length) configGeral.papeisPeca = data.papeisPeca;
    }
  }catch(e){}
  dbApi.collection('kits').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed') delete adminState.kits[ch.doc.id];
      else{
        const data = ch.doc.data();
        if(data) adminState.kits[ch.doc.id] = {
          linhas: data.linhas||[], precificacao: data.precificacao||null,
          nomeCompleto: data.nomeCompleto||null,
          prazoDiasUteis: data.prazoDiasUteis??null, kitProdutos: data.kitProdutos||[],
          fotoUrl: data.fotoUrl||null, fotoAssetId: data.fotoAssetId||null,
          categoria: data.categoria||null, subcategoria: data.subcategoria||null, tipoProduto: data.tipoProduto||null,
        };
      }
    });
    render();
  }, ()=>{ /* stream caiu: o que já foi carregado permanece visível */ });
  dbApi.collection('propostasReais').onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed') delete propostasReais[ch.doc.id];
      else propostasReais[ch.doc.id] = ch.doc.data();
    });
    render();
  }, ()=>{});
  render();
}

/** Grava (debounced) a composição de um modelo no banco compartilhado. */
function salvarKit(key){
  if(!dbApi || !key) return;
  const kit = adminState.kits[key];
  if(!kit) return;
  clearTimeout(_kitSaveTimers[key]);
  _kitSaveTimers[key] = setTimeout(()=>{
    const [produtoId, modeloId] = key.split('_').map(Number);
    dbApi.doc('kits/'+key).set({
      produtoId, modeloId, linhas:kit.linhas, precificacao:kit.precificacao||null,
      nomeCompleto:kit.nomeCompleto||null,
      prazoDiasUteis:kit.prazoDiasUteis??null, kitProdutos:kit.kitProdutos||[],
      fotoUrl:kit.fotoUrl||null, fotoAssetId:kit.fotoAssetId||null,
      categoria:kit.categoria||null, subcategoria:kit.subcategoria||null, tipoProduto:kit.tipoProduto||null,
    }).catch(()=>{});
  }, 500);
}

/** Grava (debounced) quais produtos/matérias o admin marcou como excluídos. */
function salvarExclusoes(){
  if(!dbApi) return;
  clearTimeout(_exclSaveTimer);
  _exclSaveTimer = setTimeout(()=>{
    dbApi.doc('config/exclusoes').set({
      produtos:[...adminState.produtosExcluidos],
      materias:[...adminState.materiasExcluidas],
    }).catch(()=>{});
  }, 400);
}

/** Grava (debounced) a configuração geral (custo fixo global, vendedores, papéis de peça). */
function salvarConfigGeral(){
  if(!dbApi) return;
  clearTimeout(_configSaveTimer);
  _configSaveTimer = setTimeout(()=>{
    dbApi.doc('config/geral').set({ ...configGeral }).catch(()=>{});
  }, 400);
}

/** Faz upload da foto do produto (capability `assets`) e salva a URL no kit —
 *  aparece depois na proposta comercial (vendedor e link público). */
async function uploadFotoProduto(key, file){
  if(!assetsApi){ alert('Upload de imagem indisponível nesta visão (sem grant de assets).'); return; }
  try{
    const res = await assetsApi.upload(file);
    const kit = adminState.kits[key];
    if(kit){ kit.fotoUrl = res.url; kit.fotoAssetId = res.id; salvarKit(key); render(); }
  }catch(e){
    alert('Erro ao enviar foto: '+(e && e.message || e));
  }
}

/** ID único por proposta real — gerado ao iniciar (novaProposta), usado como
 *  doc id em `propostasReais` pra permitir salvar/atualizar sem duplicar. */
function gerarIdProposta(){
  return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

/** Grava a proposta confirmada pelo vendedor na aba "Propostas realizadas" —
 *  chamado ao salvar/avançar status no passo 7 (Orçamento). Guarda um
 *  snapshot dos dados que importam pra gestão (não precisa reabrir o fluxo
 *  inteiro pra saber cliente/vendedor/valor/status). */
function salvarPropostaReal(){
  if(!dbApi || !REAL.id) return;
  const g = computeGeomReal();
  const o = computeOrcamentoReal();
  const kitPronto = REAL.produtoId && REAL.modeloId ? adminState.kits[kitKey(REAL.produtoId, REAL.modeloId)] : null;
  const doc = {
    grupoId: REAL.grupoId || REAL.id, versao: REAL.versao||1,
    dataEmissao: REAL.dataEmissao, validadeDias: REAL.validadeDias,
    modalidadeFrete: REAL.modalidadeFrete, metodoPagamento: REAL.metodoPagamento,
    clienteCnpj: REAL.cliente.cnpj, clienteRazao: REAL.cliente.razao,
    clienteFantasia: REAL.cliente.fantasia, clienteEndereco: REAL.cliente.endereco,
    vendedor: REAL.vendedor||'', modeloNome: REAL.modeloNome||'',
    prazoDiasUteis: kitPronto ? kitPronto.prazoDiasUteis??null : null,
    custoDireto: o.custoDireto, precoFinal: o.precoFinal, margin: o.margin,
    status: REAL.orcamentoStatus,
    reacaoCliente: REAL.reacaoCliente || null,
    areaM2: g.areaM2, areaGeralM2: g.areaGeralM2,
    criadoEm: propostasReais[REAL.id]?.criadoEm || new Date().toISOString(),
    atualizadoEm: new Date().toISOString(),
  };
  propostasReais[REAL.id] = doc;
  dbApi.doc('propostasReais/'+REAL.id).set(doc).catch(()=>{});
}

/** Cria uma nova versão da mesma proposta (mesmo cliente/vendedor/grupo),
 *  pra apresentar ao cliente uma composição/produto diferente sem perder a
 *  versão anterior — pedido do usuário 28/09/2026. Salva a versão atual
 *  antes de trocar, senão ela fica só em memória e some do admin. */
function criarNovaVersao(){
  salvarPropostaReal();
  const grupoId = REAL.grupoId || REAL.id;
  const proximaVersao = (REAL.versao||1) + 1;
  const cliente = { ...REAL.cliente };
  const vendedor = REAL.vendedor;
  const modalidadeFrete = REAL.modalidadeFrete;
  const metodoPagamento = REAL.metodoPagamento;
  const validadeDias = REAL.validadeDias;
  REAL = novaProposta();
  REAL.grupoId = grupoId;
  REAL.versao = proximaVersao;
  REAL.cliente = cliente;
  REAL.vendedor = vendedor;
  REAL.modalidadeFrete = modalidadeFrete;
  REAL.metodoPagamento = metodoPagamento;
  REAL.validadeDias = validadeDias;
  state.step = 1;
  render();
}

const FRETE_LABEL = {FOB:'FOB', CIF:'CIF', retira:'Cliente retira', entrega:'Entrega'};
const PAGAMENTO_LABEL = {boleto:'Boleto', cartao:'Cartão de crédito', pix:'PIX', ted:'TED/DOC'};

function adminPropostasReais(){
  const lista = Object.entries(propostasReais).map(([id,d])=>({id, ...d}));
  const filtroVendedor = adminState.filtroVendedorPropostas||'';
  const filtradas = lista.filter(p=> !filtroVendedor || p.vendedor===filtroVendedor);
  // Agrupadas por grupoId (versões da mesma proposta), grupos ordenados pela
  // versão mais recente; dentro do grupo, v1, v2, v3... em ordem.
  const gruposCount = {};
  filtradas.forEach(p=>{ const g=p.grupoId||p.id; gruposCount[g]=(gruposCount[g]||0)+1; });
  const ordenadas = [...filtradas].sort((a,b)=>{
    const ga=a.grupoId||a.id, gb=b.grupoId||b.id;
    if(ga!==gb) return new Date(b.criadoEm||0) - new Date(a.criadoEm||0);
    return (a.versao||1) - (b.versao||1);
  });
  const vendedoresComProposta = [...new Set(lista.map(p=>p.vendedor).filter(Boolean))];
  const STATUS_LABEL = {rascunho:'Rascunho', pendente:'Pendente', aprovado:'Aprovado', enviado:'Enviado'};
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Propostas realizadas</h3><p>Propostas salvas pelo vendedor no fluxo real (passo 7 · Orçamento) — separadas por data e vendedor. Uma proposta pode ter várias versões (mesmo cliente, produtos diferentes) via "Criar nova versão".</p></div>
      <span class="badge b-accent">${lista.length} proposta(s)</span>
    </div>
    <label class="field" style="max-width:260px; margin-bottom:12px;">Filtrar por vendedor
      <select data-act="admin-propostas-filtro-vendedor">
        <option value="">Todos</option>
        ${vendedoresComProposta.map(v=>`<option value="${v}" ${filtroVendedor===v?'selected':''}>${v}</option>`).join('')}
      </select>
    </label>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Data emissão</th><th>Versão</th><th>Vendedor</th><th>Cliente</th><th>Produto</th><th>Frete</th><th>Pagamento</th><th>Valor</th><th>Status</th><th>Reação do cliente</th></tr></thead>
        <tbody>
        ${ordenadas.length? ordenadas.map(p=>{
          const grupo = p.grupoId||p.id;
          const reacao = p.reacaoCliente && p.reacaoCliente.tipo ? REACOES_CLIENTE.find(x=>x.key===p.reacaoCliente.tipo) : null;
          return `<tr>
          <td>${p.dataEmissao? new Date(p.dataEmissao).toLocaleDateString('pt-BR') : (p.criadoEm? new Date(p.criadoEm).toLocaleDateString('pt-BR') : '—')}</td>
          <td>v${p.versao||1}${gruposCount[grupo]>1?` <span class="badge b-accent" style="font-size:9px;">${gruposCount[grupo]} versões</span>`:''}</td>
          <td>${p.vendedor||'—'}</td>
          <td title="${escaparHtml([p.clienteCnpj && rotuloDocumento(p.clienteCnpj)+' '+p.clienteCnpj, p.clienteEndereco].filter(Boolean).join(' · '))}">${escaparHtml(p.clienteRazao||p.clienteCnpj||'—')}${p.clienteFantasia ? '<div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">'+escaparHtml(p.clienteFantasia)+'</div>' : ''}</td>
          <td>${p.modeloNome||'—'}</td>
          <td>${FRETE_LABEL[p.modalidadeFrete]||'—'}</td>
          <td>${PAGAMENTO_LABEL[p.metodoPagamento]||'—'}</td>
          <td class="num">${money(p.precoFinal||0)}</td>
          <td><span class="badge b-neutral">${STATUS_LABEL[p.status]||p.status}</span></td>
          <td>${reacao? `<span title="${reacao.label}${p.reacaoCliente.comentario?' — \"'+p.reacaoCliente.comentario+'\"':''}">${reacao.emoji} ${reacao.label}</span>` : '<span style="color:var(--text-faint);">— sem resposta —</span>'}</td>
        </tr>`;}).join('') : `<tr><td colspan="10" class="empty-hint">Nenhuma proposta salva ainda — no Fluxo do vendedor, passo 7, clique em "Salvar proposta".</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function adminCotacoesHistorico(){
  const servidor = adminState.cotacoesServidor.map(p=>({
    ...p, id:'servidor-'+p.id, numeroCotacao:p.numero, vendedor:p.vendedor,
    modeloNome:p.modeloNome, clienteRazao:p.clienteNome, precoFinal:p.precoFinal,
    clienteFantasia:p.clienteFantasia, clienteEndereco:p.clienteEndereco,
    clienteCnpj:p.clienteCnpj, status:p.status, criadoEm:p.criadaEm, reacaoCliente:p.reacaoCliente,
  }));
  const lista = servidor;
  const numero = (adminState.filtroNumeroPropostas||'').trim().toLowerCase();
  const inicio = adminState.filtroDataInicioPropostas||'';
  const fim = adminState.filtroDataFimPropostas||'';
  const vendedor = adminState.filtroVendedorPropostas||'';
  const filtradas = lista.filter(p=>{
    const dataObj = new Date(p.dataEmissao||p.criadoEm||0);
    const data = Number.isNaN(dataObj.getTime())?'':[dataObj.getFullYear(),String(dataObj.getMonth()+1).padStart(2,'0'),String(dataObj.getDate()).padStart(2,'0')].join('-');
    return (!numero || String(p.numeroCotacao||'').toLowerCase().includes(numero))
      && (!inicio || data>=inicio) && (!fim || data<=fim)
      && (!vendedor || p.vendedor===vendedor);
  }).sort((a,b)=>new Date(b.criadoEm||b.dataEmissao||0)-new Date(a.criadoEm||a.dataEmissao||0));
  const vendedores = [...new Set(lista.map(p=>p.vendedor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const STATUS_LABEL = {aberta:'Enviada', aceita:'Aceita', recusada:'Recusada', expirada:'Expirada', enviado:'Enviada'};
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Cotações concluídas</h3><p>Orçamentos concluídos no Estúdio, com número e link interativo para o cliente responder.</p></div>
      <span class="badge b-accent">${adminState.cotacoesCarregando?'Atualizando…':filtradas.length+' cotação(ões)'}</span>

    ${adminState.cotacoesErro?`<div class="warnbox" style="margin-bottom:12px;">${escaparHtml(adminState.cotacoesErro)}</div>`:''}
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;">
      <label class="field">Data inicial<input type="date" value="${escaparHtml(inicio)}" data-act="admin-propostas-data-inicio"></label>
      <label class="field">Data final<input type="date" value="${escaparHtml(fim)}" data-act="admin-propostas-data-fim"></label>
      <label class="field">Número da cotação<input type="text" placeholder="Ex.: COT-000123" value="${escaparHtml(adminState.filtroNumeroPropostas||'')}" data-act="admin-propostas-filtro-numero"></label>
      <label class="field">Vendedor<select data-act="admin-propostas-filtro-vendedor"><option value="">Todos</option>${vendedores.map(v=>`<option value="${escaparHtml(v)}" ${vendedor===v?'selected':''}>${escaparHtml(v)}</option>`).join('')}</select></label>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Data</th><th>Número</th><th>Vendedor</th><th>Cliente</th><th>Produto</th><th>Frete</th><th>Pagamento</th><th>Valor</th><th>Status / resposta</th><th>Link</th></tr></thead>
      <tbody>${filtradas.length?filtradas.map(p=>{
        const reacao = p.reacaoCliente?.tipo ? REACOES_CLIENTE.find(x=>x.key===p.reacaoCliente.tipo) : null;
        const pagamentoResposta=p.reacaoCliente?.formaPagamento?`${PAGAMENTO_LABEL[p.reacaoCliente.formaPagamento]||p.reacaoCliente.formaPagamento}${p.reacaoCliente.formaPagamento==='cartao'?` ${p.reacaoCliente.parcelasCartao||1}x · ${money(p.reacaoCliente.valorPagamento||p.precoFinal||0)}`:''}`:'';
        const link = p.token ? linkCotacaoPublica(p.token) : '';
        const data = p.dataEmissao||p.criadoEm;
        const cliente = p.clienteNome||p.clienteRazao||p.clienteCnpj||'—';
        return `<tr>
          <td>${data?new Date(data).toLocaleDateString('pt-BR'):'—'}</td>
          <td class="mono">${escaparHtml(p.numeroCotacao||'—')}</td>
          <td>${escaparHtml(p.vendedor||'—')}</td>
          <td title="${escaparHtml([p.clienteCnpj,p.clienteEndereco].filter(Boolean).join(' · '))}">${escaparHtml(cliente)}${p.clienteFantasia?`<div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">${escaparHtml(p.clienteFantasia)}</div>`:''}</td>
          <td>${escaparHtml(p.modeloNome||'—')}</td>
          <td>${FRETE_LABEL[p.modalidadeFrete]||'—'}</td>
          <td>${PAGAMENTO_LABEL[p.metodoPagamento]||'—'}</td>
          <td class="num">${money(p.precoFinal||0)}</td>
          <td><span class="badge b-neutral">${STATUS_LABEL[p.status]||p.status||'Enviada'}</span>${reacao?`<div style="font-size:11px;margin-top:4px;" title="${escaparHtml(reacao.label+(p.reacaoCliente.comentario?' — '+p.reacaoCliente.comentario:''))}">${reacao.emoji} ${escaparHtml(reacao.label)}</div>`:''}${pagamentoResposta?`<div style="font-size:10.5px;color:var(--text-dim);margin-top:3px;">Pagamento: ${escaparHtml(pagamentoResposta)}</div>`:''}</td>
          <td>${link?`<div style="display:flex;gap:6px;flex-wrap:wrap;"><a class="btn btn-ghost btn-sm" href="${escaparHtml(link)}" target="_blank" rel="noopener">Abrir</a><button class="btn btn-ghost btn-sm" data-act="admin-cotacao-copiar" data-url="${escaparHtml(link)}">Copiar link</button></div>`:'<span style="color:var(--text-faint);">Link não disponível</span>'}</td>
        </tr>`;
      }).join(''):`<tr><td colspan="10" class="empty-hint">Nenhuma cotação encontrada para estes filtros.</td></tr>`}</tbody>
    </table></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn btn-ghost btn-sm" data-act="admin-propostas-atualizar">Atualizar histórico</button></div>
  </div>`;
}

function adminProdutos(){
  if(!catalog.ready) return `<div class="card"><div class="empty-hint">Carregando catálogo real do MubiSys…</div></div>`;
  const q = normalizeSearch(adminState.produtoQuery);
  // Excluído sempre vai para o fim da lista — ordenação estável, então a
  // ordem original do catálogo é preservada dentro de cada grupo (ativos
  // primeiro, excluídos depois). A posição é derivada de produtosExcluidos,
  // que já é persistido (salvarExclusoes) — não precisa de campo de ordem
  // separado: excluir/reativar já reordena e já fica salvo. Pedido do
  // usuário 29/09/2026.
  const visiveis = catalog.produtos
    .filter(p=> !q || normalizeSearch(p.nome).includes(q))
    .slice()
    .sort((a,b)=> (adminState.produtosExcluidos.has(a.id)?1:0) - (adminState.produtosExcluidos.has(b.id)?1:0));
  const cadastrados = Object.keys(adminState.kits).length;
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Produtos (catálogo real do MubiSys)</h3><p>${catalog.produtos.length} produtos espelhados via API GET /produto. A composição não vem da API — ela não expõe isso (verificado: só há endpoint de catálogo e de matéria-prima, não de ficha técnica) — monte uma vez por modelo abaixo e fica salva para o vendedor reaproveitar.</p></div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
        <span class="badge b-accent">${cadastrados} modelo(s) cadastrado(s)</span>
        <span class="badge ${dbApi?'b-ok':'b-warn'}">${dbApi?'✓ salvo no banco':'⚠ sem banco — só nesta sessão'}</span>
      </div>
    </div>
    <input type="text" placeholder="Buscar produto…" value="${adminState.produtoQuery}" data-act="admin-produto-query" style="width:100%; margin-bottom:12px;">
    <div class="tablewrap">
      ${visiveis.length? visiveis.map(p=>adminProdutoRow(p)).join('') : `<div class="empty-hint">Nenhum produto encontrado para "${adminState.produtoQuery}".</div>`}
    </div>
  </div>`;
}

function adminProdutoRow(p){
  const expanded = adminState.expandedProdutoId===p.id;
  const excluido = adminState.produtosExcluidos.has(p.id);
  const cadastradosCount = p.modelos.filter(m=>adminState.kits[kitKey(p.id,m.id)]).length;
  return `
  <div style="border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer; ${excluido?'opacity:.45;':''}" data-act="admin-toggle-produto" data-val="${p.id}">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="color:var(--text-faint); font-size:12px;">${expanded?'▾':'▸'}</span>
        <div>
          <div style="font-weight:600; font-size:13.5px;">${p.nome}${excluido?' <span class="badge b-bad" style="margin-left:6px;">excluído</span>':''}</div>
          <div style="font-size:11.5px; color:var(--text-faint);">${p.modelos.length} modelo(s) · ${cadastradosCount} cadastrado(s) no Radrasys</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" data-act="admin-excluir-produto" data-val="${p.id}">${excluido?'Reativar':'Excluir'}</button>
    </div>
    ${expanded? `<div style="padding:0 12px 10px 32px;">${p.modelos.map(m=>adminModeloRow(p,m)).join('')}</div>` : ''}
  </div>`;
}

function adminModeloRow(p, m){
  const key = kitKey(p.id, m.id);
  const kit = adminState.kits[key];
  const editing = adminState.editingKey===key;
  return `
  <div style="border-top:1px solid var(--border); padding:10px 0;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
      <div>
        <div style="font-size:13px; font-weight:600;">${m.nome}</div>
        <div style="font-size:11.5px; color:var(--text-faint);">${m.unidade||'—'}${kit && kit.categoria? ` · ${kit.categoria} ▸ ${kit.subcategoria||'—'}${kit.tipoProduto?' ▸ '+kit.tipoProduto:''}` : ''}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        ${kit? `<span class="badge b-ok">${ICONS.check} Cadastrado (${kit.linhas.length} item${kit.linhas.length===1?'':'s'}${kit.precificacao?(kit.precificacao.modo==='fixo'?' · preço fixo':' · margem vinculada'):''})</span>` : `<span class="badge b-neutral">Não cadastrado</span>`}
        <button class="btn btn-soft btn-sm" data-act="admin-edit-kit" data-val="${key}" data-nome="${p.nome} — ${m.nome}">${editing?'Fechar':'✏️ '+(kit?'Editar produto':'Cadastrar produto')}</button>
      </div>
    </div>
    ${editing? adminKitEditor(p, m, key) : ''}
  </div>`;
}

function adminKitEditor(p, m, key){
  const kitState = adminState.kits[key] || {linhas:[], precificacao:null};
  const kit = kitState.linhas;
  const q = adminState.adminMatQuery||'';
  const matches = q.length>=2 ? catalog.materias.filter(x=>!adminState.materiasExcluidas.has(x.id) && normalizeSearch(x.nome).includes(normalizeSearch(q))).slice(0,40) : [];

  const modoPreco = kitState.precificacao && kitState.precificacao.modo==='fixo' ? 'fixo' : 'margem';
  // Linha da Tabela de Preços já vinculada (se houver) — resolvida direto
  // pelo ID de linha, não mais por seção. Pedido do usuário 29-30/09/2026.
  const linhaVinculada = kitState.precificacao && kitState.precificacao.lineId!=null
    ? catalog.margens.find(l=>l.lineId===kitState.precificacao.lineId) : null;
  const precoLinhaQuery = adminState.precoLinhaQuery||'';
  const precoLinhaMatches = buscarLinhasPrecificacao(precoLinhaQuery);

  // Todo produto/modelo já cadastrado no catálogo real pode ser vinculado
  // como "produto do kit" — antes só entravam aqui os que já tinham UM kit
  // salvo nesta sessão, o que escondia produtos reais ainda não abertos no
  // editor. Ampliado pra cobrir o catálogo inteiro, pedido do usuário
  // 29/09/2026; o nome usado é o já cadastrado (nomeCompleto) quando existe,
  // senão "Produto — Modelo" direto do catálogo.
  const outrosModelos = [];
  catalog.produtos.forEach(prod=>{
    prod.modelos.forEach(mod=>{
      const k = kitKey(prod.id, mod.id);
      if(k===key) return;
      const existente = adminState.kits[k];
      outrosModelos.push({ key:k, nome: (existente && existente.nomeCompleto) || `${prod.nome} — ${mod.nome}` });
    });
  });
  const kitProdutos = Array.isArray(kitState.kitProdutos) ? kitState.kitProdutos : [];
  const kpq = adminState.kitProdutoQuery||'';
  const kitProdutoMatches = kpq.length>=1
    ? outrosModelos.filter(o=>!kitProdutos.some(kp=>kp.key===o.key) && normalizeSearch(o.nome).includes(normalizeSearch(kpq))).slice(0,40)
    : [];

  const catAtual = kitState.categoria && CATEGORIAS_PRODUTO[kitState.categoria] ? kitState.categoria : '';
  const subcatsDaCat = catAtual ? Object.keys(CATEGORIAS_PRODUTO[catAtual]) : [];
  const subcatAtual = kitState.subcategoria && subcatsDaCat.includes(kitState.subcategoria) ? kitState.subcategoria : '';
  const tiposDaSubcat = (catAtual && subcatAtual) ? CATEGORIAS_PRODUTO[catAtual][subcatAtual] : [];

  return `
  <div class="card" style="background:var(--surface-2); box-shadow:none; margin-top:10px;">
    <p style="font-size:12px; font-weight:700; margin-bottom:8px;">✏️ Editando — ${p.nome} · ${m.nome}</p>

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin-bottom:6px;">Categoria</p>
    <div class="grid3">
      <label class="field">Categoria
        <select data-act="admin-categoria" data-key="${key}">
          <option value="">Selecione…</option>
          ${Object.keys(CATEGORIAS_PRODUTO).map(c=>`<option value="${c}" ${catAtual===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </label>
      <label class="field">Material / subcategoria
        <select data-act="admin-subcategoria" data-key="${key}" ${!catAtual?'disabled':''}>
          <option value="">${catAtual?'Selecione…':'Escolha a categoria primeiro'}</option>
          ${subcatsDaCat.map(sc=>`<option value="${sc}" ${subcatAtual===sc?'selected':''}>${sc}</option>`).join('')}
        </select>
      </label>
      <label class="field">Tipo
        <select data-act="admin-tipo-produto" data-key="${key}" ${!tiposDaSubcat.length?'disabled':''}>
          <option value="">${tiposDaSubcat.length?'Selecione…':'—'}</option>
          ${tiposDaSubcat.map(t=>`<option value="${t}" ${kitState.tipoProduto===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </label>
    </div>

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Foto do produto <span style="font-weight:400; text-transform:none;">— aparece na proposta comercial</span></p>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      ${kitState.fotoUrl? `<img src="${kitState.fotoUrl}" style="width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--border);">` : `<div style="width:90px; height:90px; border-radius:8px; border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-faint); text-align:center;">sem foto</div>`}
      <input type="file" accept="image/*" data-act="admin-foto-produto" data-key="${key}" ${assetsApi?'':'disabled'}>
    </div>
    ${!assetsApi? `<p style="font-size:11px; color:var(--text-faint); margin-top:4px;">Upload de imagem indisponível nesta visão (sem grant de assets).</p>` : ''}

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Prazo de produção</p>
    <label class="field" style="max-width:220px;">Dias úteis
      <input type="text" inputmode="numeric" value="${kitState.prazoDiasUteis??''}" data-act="admin-prazo-dias" data-key="${key}" placeholder="ex: 5">
    </label>
    <p style="font-size:11px; color:var(--text-faint); margin-top:4px;">Aparece pro vendedor e pro cliente na proposta. O % de custo fixo sobre matéria-prima agora é global — edite em Administração &gt; Configurações.</p>

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Produtos do kit <span style="font-weight:400; text-transform:none;">— vincule vários itens: pesquise e clique em cada produto; os selecionados ficam abaixo</span></p>
    <div style="position:relative;">
      <input type="text" placeholder="Buscar produto pelo nome…" value="${kpq}" data-act="admin-kitproduto-query" style="width:100%;">
      ${kitProdutoMatches.length? `<div class="card" style="position:absolute; z-index:20; width:100%; margin-top:4px; padding:6px; max-height:260px; overflow:auto;">
        ${kitProdutoMatches.map(o=>`<button type="button" data-act="admin-kitproduto-add" data-val="${o.key}" data-key="${key}" style="display:block; width:100%; padding:8px 9px; border:0; border-radius:8px; background:transparent; color:var(--text); text-align:left; cursor:pointer; font-size:12.5px;"><span style="color:var(--accent); font-weight:700; margin-right:6px;">+</span>${o.nome}</button>`).join('')}
      </div>` : (kpq.length ? '<p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">Nenhum outro produto encontrado para esta busca.</p>' : '')}
    </div>

function adminMateriasAdmin(){

  const q = normalizeSearch(adminState.materiaQuery);
  // Mesma regra de Produtos: excluída sempre no fim, ordenação estável (ativas
  // mantêm a ordem original do catálogo entre si) — posição derivada de
  // materiasExcluidas, que já é persistido (salvarExclusoes). Pedido do
  // usuário 29/09/2026.
  const visiveis = catalog.materias
    .filter(m=> !q || normalizeSearch(m.nome).includes(q))
    .slice()
    .sort((a,b)=> (adminState.materiasExcluidas.has(a.id)?1:0) - (adminState.materiasExcluidas.has(b.id)?1:0));

      <span class="badge ${excluidas?'b-warn':'b-neutral'}">${excluidas} excluída(s)</span>
    </div>
    <input type="text" placeholder="Buscar matéria-prima…" value="${adminState.materiaQuery}" data-act="admin-materia-query" style="width:100%; margin-bottom:12px;">
    <div class="tablewrap">
      <div class="erpitem head"><span>ID</span><span>Nome</span><span>Unidade</span><span>Custo</span><span>Atualizado</span><span>Ação</span></div>
      ${visiveis.slice(0,150).map(m=>{
        const excl = adminState.materiasExcluidas.has(m.id);
        return `<div class="erpitem" style="${excl?'opacity:.45;':''}">
          <span class="mono">${m.id}</span>
          <span>${m.nome}${m.status!=='Ativo'?` <span class="badge b-bad" style="margin-left:4px;">${m.status}</span>`:''}</span>
          <span>${m.unidade}</span>
          <span class="mono">${money(m.valor)}</span>
          <span>${m.atualizado||'—'}</span>
          <span><button class="btn btn-ghost btn-sm" data-act="admin-excluir-materia" data-val="${m.id}">${excl?'Reativar':'Excluir'}</button></span>

    ${visiveis.length>150? `<p style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">Mostrando 150 de ${visiveis.length} resultados — refine a busca.</p>`:''}
  </div>`;
}

/* ---------- EVENTOS ---------- */
// Únicas data-act tratadas pelo handler de clique GENÉRICO abaixo — tudo que
// não está nesta lista tem handler próprio e dedicado em bindAdminEvents/
// bindRealEvents/bindClienteEvents (ou nos blocos logo após este bind).
// Sem essa lista, o loop genérico anexava TAMBÉM um listener a esses outros
// elementos (ex: `admin-mat-add`, `admin-kit-papel`) — como o genérico roda
// PRIMEIRO (registrado antes dos handlers específicos) e termina com
// render(), ele reconstruía a tela com o estado AINDA não atualizado (o
// handler real só roda depois, no segundo listener do mesmo elemento) —
// isso apagava visualmente a seleção de <select> como "Papel na peça" e
// atrapalhava cliques em sequência (ex: adicionar mais de uma matéria-prima),
// porque o DOM já tinha sido reconstruído prematuramente por baixo do clique
// em andamento. Achado e corrigido 29/09/2026.
const GENERIC_CLICK_ACTS = new Set(['tab','admin-tab','pick-project','back-picker','goto-step','approve','advance-status','erp-search']);
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.dataset.act;
    const handler = (ev)=>{
      const val = el.dataset.val;
      switch(act){
        case 'tab': state.tab=val; break;
        case 'role': state.role=val; break;
        case 'admin-tab': state.adminTab=val; if(val==='propostas') carregarCotacoesServidor(); break;
        case 'pick-project': resetProjectState(val); break;
        case 'back-picker': state.projectId=null; break;
        case 'goto-step': state.step=parseInt(val); break;
        case 'approve': {
          state.approvals[val]=true;
          const idx = STEP_DEFS.findIndex(s=>s.k===val);
          if(idx>-1 && idx<STEP_DEFS.length-1) state.step = STEP_DEFS[idx+1].n;
          break;
        }
        case 'advance-status': {
          const order=['rascunho','pendente','aprovado','enviado'];
          const i = order.indexOf(state.orcamentoStatus);
          if(i<order.length-1) state.orcamentoStatus=order[i+1];
          break;
        }
        case 'erp-search': return;
      }
      render();
    };
    // Único <select> com ação puramente genérica (sem handler próprio) é o
    // de perfil (role) no topbar — todos os outros selects com data-act
    // (papel na peça, fórmula, categoria, vendedor, produto/modelo etc.) têm
    // handler dedicado registrado em outro lugar; deixá-los cair aqui também
    // causava o double-handling descrito acima.
    if(el.tagName==='SELECT'){
      if(act==='role') el.addEventListener('change', (e)=>{ state.role=e.target.value; render(); });
      return;
    }
    // Campos de texto/número/checkbox têm handlers próprios (input/change) ligados
    // mais abaixo. Anexar também este clique genérico destruiria o campo (via
    // render()) assim que o usuário clicasse nele para focar, antes mesmo da
    // primeira tecla — foi o que quebrou a digitação do CNPJ.
    if(el.tagName==='INPUT' || el.tagName==='TEXTAREA'){ return; }
    if(!GENERIC_CLICK_ACTS.has(act)) return;
    el.addEventListener('click', handler);
  });

  bindRangeLive('[data-act="overlay-opacity"]', v=>{ state.overlayOpacity=parseInt(v); return state.overlayOpacity; }, v=>v+'%');
  bindRangeLive('[data-act="margin"]', v=>{ state.margin=parseFloat(v); return state.margin; }, v=>Math.round(v*100)+'%');
  bindRangeLive('[data-act="desconto"]', v=>{ state.desconto=parseFloat(v); return state.desconto; }, v=>v+'%');

  bindNumberLive('[data-act="scale-value"]', v=>{ state.scale[state.projectId].valor = parseFloat(v)||0; });

  const su = document.querySelector('[data-act="scale-unit"]');
  if(su) su.addEventListener('change', e=>{ state.scale[state.projectId].unidade = e.target.value; render(); });

  bindAdminEvents();
  bindRealEvents();
  bindClienteEvents();
}

/** Handlers da Visão do cliente — separados de bindRealEvents porque essa
 *  aba é acessada por state.tab, independente de state.mode. */
function bindClienteEvents(){
  if(state.tab!=='cliente') return;
  document.querySelectorAll('[data-act="cliente-reacao"]').forEach(el=>{
    el.addEventListener('click', ()=>{ REAL.reacaoCliente.tipo = el.dataset.val; render(); });
  });
  const comentEl = document.querySelector('[data-act="cliente-comentario"]');
  if(comentEl) comentEl.addEventListener('input', e=>{ REAL.reacaoCliente.comentario = e.target.value; });
  const enviarBtn = document.querySelector('[data-act="cliente-enviar-reacao"]');
  if(enviarBtn) enviarBtn.addEventListener('click', ()=>{
    if(!REAL.reacaoCliente.tipo) return;
    REAL.reacaoCliente.respondidoEm = new Date().toISOString();
    salvarPropostaReal();
    render();
  });
  const alterarBtn = document.querySelector('[data-act="cliente-alterar-reacao"]');
  if(alterarBtn) alterarBtn.addEventListener('click', ()=>{
    REAL.reacaoCliente = { tipo:null, comentario:REAL.reacaoCliente.comentario, respondidoEm:null };
    render();
  });
}

function bindAdminEvents(){
  if(state.tab!=='admin') return;

  const filtroVend = document.querySelector('[data-act="admin-propostas-filtro-vendedor"]');
  if(filtroVend) filtroVend.addEventListener('change', e=>{ adminState.filtroVendedorPropostas=e.target.value; render(); });
  const filtroInicio = document.querySelector('[data-act="admin-propostas-data-inicio"]');
  if(filtroInicio) filtroInicio.addEventListener('change', e=>{ adminState.filtroDataInicioPropostas=e.target.value; render(); });
  const filtroFim = document.querySelector('[data-act="admin-propostas-data-fim"]');
  if(filtroFim) filtroFim.addEventListener('change', e=>{ adminState.filtroDataFimPropostas=e.target.value; render(); });
  const filtroNumero = document.querySelector('[data-act="admin-propostas-filtro-numero"]');
  if(filtroNumero) filtroNumero.addEventListener('input', e=>{
    adminState.filtroNumeroPropostas=e.target.value;
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer=setTimeout(renderPreservingFocus,250);
  });
  const atualizarCotacoes = document.querySelector('[data-act="admin-propostas-atualizar"]');
  if(atualizarCotacoes) atualizarCotacoes.addEventListener('click', ()=>carregarCotacoesServidor());
  document.querySelectorAll('[data-act="admin-cotacao-copiar"]').forEach(botao=>botao.addEventListener('click',async()=>{
    const link=botao.dataset.url||'';
    try{
      if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(link);
      else window.prompt('Copie o link da cotação:',link);
      const label=botao.textContent;
      botao.textContent='Copiado';
      setTimeout(()=>{if(botao.isConnected) botao.textContent=label;},1400);
    }catch{window.prompt('Copie o link da cotação:',link);}
  }));

  const custoFixoEl = document.querySelector('[data-act="config-custo-fixo"]');
  if(custoFixoEl) custoFixoEl.addEventListener('input', e=>{
    configGeral.custoFixoPct = parseFloat(e.target.value.replace(',','.'))||0;
    salvarConfigGeral();
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(renderPreservingFocus, 400);
  });

  document.querySelectorAll('[data-act="config-pagamento-forma"]').forEach(el=>el.addEventListener('change',()=>{
    const forma=el.dataset.forma;
    if(!Object.prototype.hasOwnProperty.call(configGeral.formasPagamento,forma)) return;
    configGeral.formasPagamento[forma]=el.checked;
    salvarConfigGeral();
    render();
  }));
  document.querySelectorAll('[data-act="config-pagamento-juros"]').forEach(el=>el.addEventListener('input',e=>{
    const indice=Number(el.dataset.idx);
    if(!Number.isInteger(indice)||indice<0||indice>5) return;
    const valor=parseFloat(String(e.target.value).replace(',','.'));
    configGeral.jurosCartaoPct[indice]=Number.isFinite(valor)?Math.min(100,Math.max(0,valor)):0;
    salvarConfigGeral();
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer=setTimeout(renderPreservingFocus,400);
  }));

  const vendedorNovoEl = document.querySelector('[data-act="config-vendedor-novo"]');
  const addVendedor = ()=>{
    if(!vendedorNovoEl) return;
    const nome = vendedorNovoEl.value.trim();
    if(!nome || configGeral.vendedores.includes(nome)) return;
    configGeral.vendedores.push(nome);
    salvarConfigGeral();
    render();
  };
  const vendedorAddBtn = document.querySelector('[data-act="config-vendedor-add"]');
  if(vendedorAddBtn) vendedorAddBtn.addEventListener('click', addVendedor);
  if(vendedorNovoEl) vendedorNovoEl.addEventListener('keydown', e=>{ if(e.key==='Enter') addVendedor(); });
  document.querySelectorAll('[data-act="config-vendedor-whatsapp"]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const nome=configGeral.vendedores[+el.dataset.idx];
      if(!nome) return;
      const numero=String(el.value||'').replace(/\D/g,'');
      if(numero) configGeral.whatsappVendedores[nome]=numero;
      else delete configGeral.whatsappVendedores[nome];
      salvarConfigGeral();
    });
  });
  document.querySelectorAll('[data-act="config-vendedor-remove"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nome=configGeral.vendedores[+el.dataset.idx];
      configGeral.vendedores.splice(+el.dataset.idx,1);
      if(nome) delete configGeral.whatsappVendedores[nome];
      salvarConfigGeral();
      render();
    });
  });

  const papelNovoEl = document.querySelector('[data-act="config-papel-novo"]');
  const addPapel = ()=>{
    if(!papelNovoEl) return;
    const nome = papelNovoEl.value.trim();
    if(!nome || configGeral.papeisPeca.includes(nome)) return;
    configGeral.papeisPeca.push(nome);
    salvarConfigGeral();
    render();
  };
  const papelAddBtn = document.querySelector('[data-act="config-papel-add"]');
  if(papelAddBtn) papelAddBtn.addEventListener('click', addPapel);
  if(papelNovoEl) papelNovoEl.addEventListener('keydown', e=>{ if(e.key==='Enter') addPapel(); });
  document.querySelectorAll('[data-act="config-papel-remove"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      configGeral.papeisPeca.splice(+el.dataset.idx,1);
      salvarConfigGeral();
      render();
    });
  });

  const pq = document.querySelector('[data-act="admin-produto-query"]');
  if(pq) pq.addEventListener('input', e=>{ adminState.produtoQuery=e.target.value; renderPreservingFocus(); });

  const mq2 = document.querySelector('[data-act="admin-materia-query"]');
  if(mq2) mq2.addEventListener('input', e=>{ adminState.materiaQuery=e.target.value; renderPreservingFocus(); });

  document.querySelectorAll('[data-act="admin-toggle-produto"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = parseInt(el.dataset.val);
      adminState.expandedProdutoId = adminState.expandedProdutoId===id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-act="admin-excluir-produto"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = parseInt(el.dataset.val);
      if(adminState.produtosExcluidos.has(id)) adminState.produtosExcluidos.delete(id); else adminState.produtosExcluidos.add(id);
      salvarExclusoes();
      render();
    });
  });
  document.querySelectorAll('[data-act="admin-excluir-materia"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = parseInt(el.dataset.val);
      if(adminState.materiasExcluidas.has(id)) adminState.materiasExcluidas.delete(id); else adminState.materiasExcluidas.add(id);
      salvarExclusoes();
      render();
    });
  });
  document.querySelectorAll('[data-act="admin-edit-kit"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.val;
      if(adminState.editingKey===key){ adminState.editingKey=null; }
      else{
        adminState.editingKey=key;
        if(!adminState.kits[key]) adminState.kits[key]={linhas:[], precificacao:null, prazoDiasUteis:null, kitProdutos:[], fotoUrl:null, fotoAssetId:null, categoria:null, subcategoria:null, tipoProduto:null};
        adminState.kits[key].nomeCompleto = el.dataset.nome;
        adminState.adminMatQuery='';
      }
      render();
    });
  });
  document.querySelectorAll('[data-act="admin-kit-done"]').forEach(el=>{
    el.addEventListener('click', ()=>{ adminState.editingKey=null; render(); });
  });
  const amq = document.querySelector('[data-act="admin-mat-query"]');
  if(amq) amq.addEventListener('input', e=>{ adminState.adminMatQuery=e.target.value; renderPreservingFocus(); });
  document.querySelectorAll('[data-act="admin-mat-add"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.key;
      const m = catalog.materias.find(x=>x.id===parseInt(el.dataset.val));
      if(m && adminState.kits[key]){
        adminState.kits[key].linhas.push({ matId:m.id, nome:m.nome, unidade:m.unidade, custo:m.valor, atualizado:m.atualizado, status:m.status, papel:'', formulaType:'area', mult:1.0 });
        salvarKit(key);
      }
      adminState.adminMatQuery='';
      render();

/** Re-renderiza preservando foco e posição do cursor no campo de texto ativo
 *  (render() reconstrói o innerHTML inteiro, o que por padrão perde o foco a
 *  cada tecla digitada). */
function renderPreservingFocus(){
  const active = document.activeElement;
  let restore=null;
  if(active && active.dataset && active.dataset.act && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    restore = { act:active.dataset.act, idx:active.dataset.idx, selStart:active.selectionStart, selEnd:active.selectionEnd };
  }
  render();
  if(restore){
    const sel = restore.idx!=null ? `[data-act="${restore.act}"][data-idx="${restore.idx}"]` : `[data-act="${restore.act}"]`;
    const el = document.querySelector(sel);
    if(el){
      el.focus();
      if(typeof restore.selStart==='number' && el.setSelectionRange){
        try{ el.setSelectionRange(restore.selStart, restore.selEnd); }catch(e){}
      }
    }
  }
}

let _renderDebounceTimer=null;
/** Liga um <input type=range>: dá feedback numérico imediato sem reconstruir a
 *  página a cada pixel arrastado (o que interromperia o próprio arraste), e só
 *  confirma o re-render completo (ou uma função de commit, ex. retrace) depois
 *  de uma pausa curta ou ao soltar (change). */
function bindRangeLive(selector, setValue, formatFn, commitFn){
  commitFn = commitFn || render;
  const el = document.querySelector(selector);
  if(!el) return;
  const valEl = el.parentElement.querySelector('.val');
  el.addEventListener('input', e=>{
    const v = setValue(e.target.value);
    if(valEl) valEl.textContent = formatFn(v);
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(commitFn, 250);
  });
  el.addEventListener('change', ()=>{ clearTimeout(_renderDebounceTimer); commitFn(); });
}

/** Liga um <input type=number|text> que compõe um valor de vários caracteres
 *  (ex.: "0.4", "1.25"). Atualiza o estado a cada tecla mas NÃO reconstrói o
 *  DOM a cada uma — se render() rodasse a cada tecla, o campo seria
 *  redesenhado com o valor já convertido (ex. "0." vira "0"), apagando o
 *  ponto decimal que o usuário acabou de digitar antes de terminar o número.
 *  Só confirma o re-render completo numa pausa curta ou ao sair do campo. */
function bindNumberLive(selector, setValue, commitFn){
  commitFn = commitFn || renderPreservingFocus;
  const el = document.querySelector(selector);
  if(!el) return;
  el.addEventListener('input', e=>{
    setValue(e.target.value);
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(commitFn, 400);
  });
  el.addEventListener('change', ()=>{ clearTimeout(_renderDebounceTimer); commitFn(); });
}
