  document.querySelectorAll('[data-act="real-kit-papel"]').forEach(el=> el.addEventListener('change', e=>{ REAL.kit[+el.dataset.idx].papel=e.target.value; render(); }));
  document.querySelectorAll('[data-act="real-kit-formula"]').forEach(el=> el.addEventListener('change', e=>{ REAL.kit[+el.dataset.idx].formulaType=e.target.value; render(); }));
  document.querySelectorAll('[data-act="real-kit-mult"]').forEach(el=>{
    el.addEventListener('input', e=>{
      REAL.kit[+el.dataset.idx].mult = parseFloat(e.target.value)||0;
      clearTimeout(_renderDebounceTimer);
      _renderDebounceTimer = setTimeout(renderPreservingFocus, 400);
    });
    el.addEventListener('change', ()=>{ clearTimeout(_renderDebounceTimer); renderPreservingFocus(); });
  });
  document.querySelectorAll('[data-act="real-kit-remove"]').forEach(el=> el.addEventListener('click', ()=>{ removeKitLine(+el.dataset.idx); render(); }));

  bindRangeLive('[data-act="real-margin"]', v=>{ REAL.margin=parseFloat(v); return REAL.margin; }, v=>Math.round(v*100)+'%');
  bindRangeLive('[data-act="real-desconto"]', v=>{ REAL.desconto=parseFloat(v); return REAL.desconto; }, v=>v+'%');
  const realAdvanceBtn = document.querySelector('[data-act="real-advance-status"]');
  if(realAdvanceBtn) realAdvanceBtn.addEventListener('click', ()=>{
    const order=['rascunho','pendente','aprovado','enviado'];
    const i=order.indexOf(REAL.orcamentoStatus);
    if(i===order.length-2){ concluirOrcamentoEabrirCotacao(); return; }
    if(i<order.length-1) REAL.orcamentoStatus=order[i+1];
    salvarPropostaReal();
    render();
  });
  const concluirCotacao = document.querySelector('[data-act="real-concluir-cotacao"]');
  if(concluirCotacao) concluirCotacao.addEventListener('click', ()=>concluirOrcamentoEabrirCotacao());
  const realSalvarBtn = document.querySelector('[data-act="real-salvar-proposta"]');
  if(realSalvarBtn) realSalvarBtn.addEventListener('click', ()=>{
    if(REAL.orcamentoStatus==='enviado'){
      if(REAL.cotacaoLink){ window.open(REAL.cotacaoLink,'_blank','noopener'); return; }
      concluirOrcamentoEabrirCotacao();
      return;
    }
    if(!dbApi){ alert('Sem banco disponível nesta visão — a proposta não pode ser salva na aba de Administração.'); return; }
    salvarPropostaReal();
    alert('Proposta salva — aparece em Administração > Propostas realizadas.');
  });
  const realNovaVersaoBtn = document.querySelector('[data-act="real-nova-versao"]');
  if(realNovaVersaoBtn) realNovaVersaoBtn.addEventListener('click', ()=>{ criarNovaVersao(); });
  const freteEl = document.querySelector('[data-act="real-frete"]');
  if(freteEl) freteEl.addEventListener('change', e=>{ REAL.modalidadeFrete=e.target.value||null; render(); });
  const descricaoProdutoEl = document.querySelector('[data-act="real-descricao-produto"]');
  if(descricaoProdutoEl) descricaoProdutoEl.addEventListener('input', e=>{ REAL.descricaoProduto=e.target.value; });
  bindNumberLive('[data-act="real-validade-dias"]', v=>{ REAL.validadeDias=parseInt(v)||20; });
}

let cotacaoPublicaAtual = null;
let respostaPublicaSelecionada = null;
let comentarioRespostaPublica = '';
let formaPagamentoPublica = 'pix';
let parcelasCartaoPublica = 1;

function calcularPagamentoPublico(p){
  const formasValidas=['pix','cartao','boleto','ted'];
  const configuradas=Array.isArray(p?.formasPagamentoPermitidas)?p.formasPagamentoPermitidas.filter(f=>formasValidas.includes(f)):formasValidas;
  const permitidas=[...new Set(['pix',...configuradas])];
  const forma=permitidas.includes(formaPagamentoPublica)?formaPagamentoPublica:'pix';
  const parcelas=forma==='cartao'?Math.max(1,Math.min(6,Number(parcelasCartaoPublica)||1)):1;
  const taxas=Array.isArray(p?.jurosCartaoPct)?p.jurosCartaoPct:[];
  const taxa=forma==='cartao'?Math.max(0,Math.min(100,Number(taxas[parcelas-1])||0)):0;
  const base=Number(p?.precoFinal)||0;
  const total=base*(1+taxa/100);
  return {permitidas,forma,parcelas,taxa,base,total,valorParcela:total/parcelas};
}

function abrirWhatsAppRespostaPublica(tipo, comentario){
  const p=cotacaoPublicaAtual;
  const reacao=REACOES_CLIENTE.find(x=>x.key===tipo);
  if(!p || !reacao) return;
  const cliente=p.cliente?.razao || p.cliente?.fantasia || 'cliente';
  const pagamento=calcularPagamentoPublico(p);
  const linhas=[
    `Olá, ${p.vendedor}! Sou ${cliente} e estou retornando sobre a cotação ${p.numero} (${p.modeloNome}).`,
    `Minha resposta: ${reacao.label}`,
    `Forma de pagamento simulada: ${PAGAMENTO_LABEL[pagamento.forma]}${pagamento.forma==='cartao'?` em ${pagamento.parcelas}x de ${money(pagamento.valorParcela)} (total ${money(pagamento.total)}, taxa ${fmt(pagamento.taxa,2)}%)`:''}.`,
    `Cotação: ${window.location.href}`,
  ];
  if(comentario?.trim()) linhas.push(`Complemento: ${comentario.trim()}`);
  const telefone=normalizarTelefoneWhatsApp(p.whatsappVendedor);
  const url=`https://wa.me/${telefone}?text=${encodeURIComponent(linhas.join(String.fromCharCode(10)))}`;
  const janela=window.open(url,'_blank');
  if(janela) janela.opener=null;
  else window.location.href=url;
}

function renderCotacaoPublica(mensagemErro=''){
  const root=document.getElementById('shell');
  if(mensagemErro){
    root.innerHTML=`<div class="card" style="max-width:760px;margin:48px auto;"><h2>Não foi possível abrir a cotação</h2><p style="margin-top:8px;color:var(--text-dim);">${escaparHtml(mensagemErro)}</p></div>`;
    return;
  }
  const p=cotacaoPublicaAtual;
  if(!p){
    root.innerHTML='<div class="card" style="max-width:760px;margin:48px auto;">Carregando cotação…</div>';
    return;
  }
  const emissao=new Date(p.dataEmissao);
  const validade=new Date(emissao.getTime()+(p.validadeDias||20)*86400000);
  const reacao=p.reacaoCliente?.tipo?REACOES_CLIENTE.find(x=>x.key===p.reacaoCliente.tipo):null;
  const pagamento=calcularPagamentoPublico(p);
  root.innerHTML=`
    <div style="max-width:900px;margin:22px auto 48px;">
      <div class="brand" style="margin:8px 0 18px;"><div class="mark" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;">R</div><div><div class="brand-name">Radrasys · Cotação</div><div class="brand-sub">Link interativo para o cliente</div></div></div>
      <div class="cliente-hero">
        <div class="badge b-accent" style="margin-bottom:10px;">${escaparHtml(p.numero)}</div>
        <h1 style="font-size:24px;">${escaparHtml(p.modeloNome)}</h1>
        ${p.descricaoProduto?`<div style="max-width:680px;margin:12px auto 0;text-align:left;"><p style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;">Descrição do produto</p><p style="font-size:13px;white-space:pre-wrap;line-height:1.55;">${escaparHtml(p.descricaoProduto)}</p></div>`:''}
        <p style="font-size:13px;color:var(--text-dim);margin:8px 0;">Cotação para ${escaparHtml(p.cliente.razao||p.cliente.fantasia||'você')} · emitida em ${emissao.toLocaleDateString('pt-BR')} · válida até ${validade.toLocaleDateString('pt-BR')}</p>
        ${p.cliente.cnpj?`<p style="font-size:12px;color:var(--text-dim);margin:4px 0;"><b>${rotuloDocumento(p.cliente.cnpj)}:</b> ${escaparHtml(p.cliente.cnpj)}</p>`:''}
        ${p.cliente.fantasia?`<p style="font-size:12px;color:var(--text-dim);margin:4px 0;"><b>Nome fantasia:</b> ${escaparHtml(p.cliente.fantasia)}</p>`:''}
        ${p.cliente.endereco?`<p style="font-size:12px;color:var(--text-dim);margin:4px 0;"><b>Endereço:</b> ${escaparHtml(p.cliente.endereco)}</p>`:''}
        <div class="cliente-preco" style="margin-top:14px;">${money(pagamento.total)}</div>
        <div style="font-size:12px;color:var(--text-dim);">${pagamento.forma==='cartao'?`${pagamento.parcelas}x de ${money(pagamento.valorParcela)} no cartão · taxa de ${fmt(pagamento.taxa,2)}%`: `Valor em ${PAGAMENTO_LABEL[pagamento.forma]}`}</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
          ${p.modalidadeFrete?`<span class="badge b-accent">${FRETE_LABEL[p.modalidadeFrete]||p.modalidadeFrete}</span>`:''}
          ${p.prazoDiasUteis!=null?`<span class="badge b-neutral">${p.prazoDiasUteis} dias úteis</span>`:''}
          ${p.areaM2!=null?`<span class="badge b-neutral">${p.areaM2.toLocaleString('pt-BR',{maximumFractionDigits:2})} m²</span>`:''}
        </div>
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="cardhead"><div><h3>Forma de pagamento</h3><p>Valor base da cotação no PIX: <b>${money(pagamento.base)}</b>. Selecione outra forma para simular.</p></div></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${pagamento.permitidas.map(forma=>`<button type="button" class="btn ${pagamento.forma===forma?'btn-primary':'btn-ghost'}" data-act="publica-forma-pagamento" data-val="${forma}" aria-pressed="${pagamento.forma===forma}">${PAGAMENTO_LABEL[forma]}</button>`).join('')}
        </div>
        ${pagamento.forma==='cartao'?`
          <div style="margin-top:16px;">
            <p style="font-size:12px;font-weight:700;margin-bottom:8px;">Simulador do cartão (até 6x)</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;">
              ${Array.from({length:6},(_,i)=>{
                const taxa=Number(p.jurosCartaoPct?.[i])||0;
                const total=pagamento.base*(1+taxa/100);
                const parcela=total/(i+1);
                const selecionada=pagamento.parcelas===i+1;
                return `<button type="button" data-act="publica-parcelas-cartao" data-val="${i+1}" aria-pressed="${selecionada}" style="text-align:left;padding:10px;border-radius:9px;border:1px solid ${selecionada?'var(--accent)':'var(--border)'};background:${selecionada?'var(--accent-soft)':'var(--surface-2)'};color:var(--text);cursor:pointer;"><b>${i+1}x de ${money(parcela)}</b><div style="font-size:11px;color:var(--text-dim);margin-top:4px;">Total ${money(total)} · juros ${fmt(taxa,2)}%</div></button>`;
              }).join('')}
            </div>
          </div>
        `:''}
      </div>
      <div class="card" style="margin-top:14px;">
        <div class="cardhead"><div><h3>${reacao?'Sua resposta':'O que você achou da cotação?'}</h3><p>${reacao?escaparHtml(reacao.label):'Toque numa opção para abrir o WhatsApp com uma mensagem pronta. Revise e envie por lá.'}</p></div></div>
        ${!reacao && !p.whatsappVendedor?'<p class="role-note">O WhatsApp do vendedor ainda não foi cadastrado. Depois de abrir, escolha o contato do vendedor.</p>':''}
        ${reacao?`
          ${p.reacaoCliente.comentario?`<p style="font-style:italic;color:var(--text-dim);">“${escaparHtml(p.reacaoCliente.comentario)}”</p>`:''}
          ${p.reacaoCliente.formaPagamento?`<p class="role-note">Forma simulada: ${PAGAMENTO_LABEL[p.reacaoCliente.formaPagamento]||p.reacaoCliente.formaPagamento}${p.reacaoCliente.formaPagamento==='cartao'?` em ${p.reacaoCliente.parcelasCartao||1}x · total ${money(p.reacaoCliente.valorPagamento??p.precoFinal)}`:''}</p>`:''}
          <div class="role-note">Respondido em ${new Date(p.reacaoCliente.respondidoEm).toLocaleString('pt-BR')}</div>
          <button class="btn btn-ghost btn-sm" data-act="publica-alterar-resposta">Alterar resposta</button>
        `:`
          <div class="reacoes-grid">${REACOES_CLIENTE.map(rc=>`<button type="button" class="reacao-card cor-${rc.cor}" data-act="publica-escolher-resposta" data-val="${rc.key}" aria-pressed="false"><span class="emoji">${rc.emoji}</span><span class="txt">${escaparHtml(rc.label)}</span></button>`).join('')}</div>
          <label class="field" style="margin-top:16px;">Comentário (opcional)
            <textarea data-act="publica-comentario" rows="3" style="width:100%;resize:vertical;font-family:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);" placeholder="Escreva aqui para complementar sua resposta">${escaparHtml(comentarioRespostaPublica)}</textarea>
          </label>
          <p style="font-size:11px;color:var(--text-faint);margin-top:6px;">Para incluir o complemento na mensagem, escreva e toque novamente na opção escolhida.</p>
          <div class="footer-nav"><span></span><button class="btn btn-primary" data-act="publica-enviar-resposta" ${respostaPublicaSelecionada?'':'disabled'}>${ICONS.check} Registrar resposta também na cotação</button></div>
        `}
      </div>
      <p style="text-align:center;color:var(--text-faint);font-size:11px;margin-top:14px;">Vendedor responsável: ${escaparHtml(p.vendedor)}</p>
    </div>`;
  root.querySelectorAll('[data-act="publica-forma-pagamento"]').forEach(botao=>botao.addEventListener('click',()=>{
    formaPagamentoPublica=botao.dataset.val||'pix';
    if(formaPagamentoPublica==='cartao') parcelasCartaoPublica=1;
    renderCotacaoPublica();
  }));
  root.querySelectorAll('[data-act="publica-parcelas-cartao"]').forEach(botao=>botao.addEventListener('click',()=>{
    parcelasCartaoPublica=Number(botao.dataset.val)||1;
    renderCotacaoPublica();
  }));
  root.querySelectorAll('[data-act="publica-escolher-resposta"]').forEach(botao=>botao.addEventListener('click',()=>{
    respostaPublicaSelecionada=botao.dataset.val;
    abrirWhatsAppRespostaPublica(respostaPublicaSelecionada,comentarioRespostaPublica);
    root.querySelectorAll('[data-act="publica-escolher-resposta"]').forEach(outro=>{
      const selecionado=outro===botao;
      outro.setAttribute('aria-pressed',String(selecionado));
      outro.style.borderColor=selecionado?'var(--accent)':'';
      outro.style.background=selecionado?'var(--accent-soft)':'';
    });
    const enviar=root.querySelector('[data-act="publica-enviar-resposta"]');
    if(enviar) enviar.disabled=false;
  }));
  const comentario=root.querySelector('[data-act="publica-comentario"]');
  if(comentario) comentario.addEventListener('input',e=>{comentarioRespostaPublica=e.target.value;});
  const enviar=root.querySelector('[data-act="publica-enviar-resposta"]');
  if(enviar) enviar.addEventListener('click',async()=>{
    if(!respostaPublicaSelecionada) return;
    enviar.disabled=true;
    try{
      const response=await fetch('/api/letra-caixa/cotacoes/'+encodeURIComponent(new URLSearchParams(location.search).get('cotacao'))+'/resposta',{
        method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({tipo:respostaPublicaSelecionada,comentario:comentarioRespostaPublica,formaPagamento:pagamento.forma,parcelasCartao:pagamento.forma==='cartao'?pagamento.parcelas:null}),
      });
      const body=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(body.error||'Não foi possível enviar a resposta.');
      cotacaoPublicaAtual.reacaoCliente=body.reacaoCliente;
      renderCotacaoPublica();
    }catch(error){alert(error.message||'Não foi possível enviar a resposta.');enviar.disabled=false;}
  });
  const alterar=root.querySelector('[data-act="publica-alterar-resposta"]');
  if(alterar) alterar.addEventListener('click',()=>{
    comentarioRespostaPublica=p.reacaoCliente?.comentario||'';
    respostaPublicaSelecionada=null;
    cotacaoPublicaAtual.reacaoCliente=null;
    renderCotacaoPublica();
  });
}

async function iniciarCotacaoPublica(token){
  renderCotacaoPublica();
  try{
    const response=await fetch('/api/letra-caixa/cotacoes/'+encodeURIComponent(token),{credentials:'same-origin',cache:'no-store'});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Link inválido ou cotação não encontrada.');
    cotacaoPublicaAtual=body;
    formaPagamentoPublica='pix';
    parcelasCartaoPublica=1;
    renderCotacaoPublica();
  }catch(error){renderCotacaoPublica(error.message||'Não foi possível abrir a cotação.');}
}
