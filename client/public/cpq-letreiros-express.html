async function analisarCorrespondenciaCoresReal(){
  const color=REAL.colorAnalysis;
  if(color.loading)return;
  if(!color.iluminacao){color.error='O projeto não informa se terá iluminação. Responda a pergunta para continuar a composição.';render();return;}
  if(color.iluminacao!=='sem_iluminacao'&&String(color.transmissaoMinimaPct??'').trim()===''){color.error='Informe o mínimo de transmissão da face iluminada definido pela engenharia.';render();return;}
  if(!REAL.tracedSvgOriginal){color.error='A arte vetorial original com cores não está disponível. Reenvie o SVG ou gere uma nova vetorização.';render();return;}
  const geom=computeGeomReal();
  if(!geom.scaleFactor){color.error='Confirme uma escala física válida antes de calcular as áreas por cor.';render();return;}
  // Trocas de material de outra arte não valem para esta.
  const assinaturaArte=assinaturaSvgArte();
  if(color.escolhasAssinatura!==assinaturaArte){color.escolhas={};color.escolhasAssinatura=assinaturaArte;}
  color.loading=true;color.error=null;color.resultados=null;color.aprovado=false;REAL.factibilidade=null;REAL.nesting=null;REAL.nestingMateriaPrimaIds=[];REAL.approvals.nesting=false;REAL.approvals.kit=false;render();
  try{
    const minimum=String(color.transmissaoMinimaPct??'').trim()===''?null:Number(color.transmissaoMinimaPct);
    const response=await fetch('/api/letra-caixa/cores/analisar-svg',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      sourceId:REAL.id,svgArte:REAL.tracedSvgOriginal,svgGeometria:REAL.tracedSvg,
      larguraSvgMm:REAL.tracedW*geom.scaleFactor*1000,alturaSvgMm:REAL.tracedH*geom.scaleFactor*1000,
      iluminacao:color.iluminacao,transmissaoMinimaPct:minimum,baseImpressao:color.baseImpressao,construcaoFace:construcaoFaceEfetiva(color),laminar:color.laminar,semAdesivo:!!color.semAdesivo,
      escolhas:Object.entries(color.escolhas||{}).map(([regionKey,escolha])=>({regionKey,corHex:escolha.corHex||null,tipo:escolha.tipo,...(escolha.id?{id:escolha.id}:{})})),
      coresManuais:coresManuaisParaServidor(),
    })});
    const body=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(body.error||'Não foi possível comparar as cores da arte com os materiais.');
    color.resultados=body.resultados||[];color.aprovado=false;color.opcoes=body.opcoes||{};
    await anexarReferenciasPantone(color);
  }catch(error){color.error=error.message||'Falha na análise cromática.';}
  finally{color.loading=false;render();}
}

function aplicarComposicaoSugeridaCoresReal(){
  const resultados=REAL.colorAnalysis.resultados||[];
  if(!resultados.length)return;
  if(resultados.some(item=>item.requerConfirmacaoConstrucao||item.requerChapaBase&&!item.chapaBaseMateriaPrimaId))
    throw new Error('Responda às perguntas de composição da face antes de seguir.');
  const materialIds=[...new Set(resultados.flatMap(item=>{
    if(item.tipoSugestao==='chapa') return item.chapaMateriaPrimaId?[Number(item.chapaMateriaPrimaId)]:[];
    if(item.requerChapaBase) return item.chapaBaseMateriaPrimaId?[Number(item.chapaBaseMateriaPrimaId)]:[];
    return [];
  }))];
  if(!materialIds.length)return;
  const materiais=materialIds.map(materialId=>{
    const material=catalog.materias.find(item=>Number(item.id)===materialId);
    if(!material)throw new Error(`Atualize o catálogo MubiSys para incluir a matéria-prima ${materialId} sugerida para a face.`);
    return material;
  });
  // As opções de variação da linha Face não impedem a troca: a cor da arte decide a chapa. A composição original
  // (com a variação escolhida) fica guardada e aparece no aviso "Face do kit: antes → depois".
  if(REAL.colorAnalysis.composicaoKitOriginal==null)REAL.colorAnalysis.composicaoKitOriginal=REAL.kit.map(line=>({...line}));
  REAL.kit=REAL.kit.filter(line=>camadaFisicaKit(line)!=='face'&&!line.origemComposicaoCor);
  for(const material of materiais) REAL.kit.push({matId:material.id,nome:material.nome,unidade:material.unidade,custo:material.valor,atualizado:material.atualizado,status:material.status,papel:'Face',formulaType:'areaTotal',mult:1,variantes:[],variacaoSelecionadaMatId:null,origemComposicaoCor:true});
}

async function aprovarCoresESeguirReal(){
  const color=REAL.colorAnalysis;
  if(!color.resultados?.length)return;
  color.pendenciaAprovacao=null;
  try{
    aplicarComposicaoSugeridaCoresReal();
  }catch(error){
    // Não deu para aplicar a composição por cor: volta ao kit original; iniciarNestingAutomatico roda o nesting de reserva.
    restaurarComposicaoCoresReal(); color.error=error.message||'Falha ao aplicar as sugestões de materiais.'; render(); return;
  }
  try{
    const response=await fetch('/api/letra-caixa/cores/aprovar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceId:REAL.id,autorizaAdesivoSobreAcrilico:!!color.autorizaAdesivo})});
    const body=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(body.error||'Não foi possível registrar a aprovação do mapeamento de cores.');
    color.aprovado=true;color.aprovadoPor=body.aprovadoPor||'usuário atual';
  }catch(error){
    // A sugestão (face trocada, adesivo) continua na composição; a pendência fica em destaque e o nesting segue.
    color.pendenciaAprovacao=error.message||'Falha ao aprovar as sugestões de materiais.';
  }
  render();
  await analisarFactibilidadeReal();
}

/** Resumo, para o vendedor, do que o sistema decidiu a partir das cores da logo: chapa de acrílico mais parecida (ΔE00 ≤ 2) ou, sem
 *  equivalente, acrílico transparente + adesivo Imprimax. Com `editavel` (passo do Nesting) cada cor tem um menu para trocar o material
 *  sugerido, porque a sugestão pode errar; a cor em si se corrige no desenho da Ficha técnica. */
function htmlAvisoCoresAutomaticas(editavel=false){
  const color=REAL.colorAnalysis;
  if(!color?.resultados?.length||!(color.aprovado||color.pendenciaAprovacao)) return '';
  const nomesFace=lines=>[...new Set(lines.map(line=>materialKitAtivo(line).nome||line.nome).filter(Boolean))].join(' + ');
  const antes=nomesFace((color.composicaoKitOriginal||[]).filter(line=>camadaFisicaKit(line)==='face'));
  const depois=nomesFace((REAL.kit||[]).filter(line=>line.origemComposicaoCor));
  const amostra=hex=>`<span style="display:inline-block;width:12px;height:12px;border:1px solid var(--border);border-radius:3px;vertical-align:middle;background:${escaparHtml(hex||'#e2e8f0')};"></span>`;
  const itens=color.resultados.map(result=>{
    const opcoes=(color.opcoes&&color.opcoes[result.regionKey])||[];
    const alternativas=result.alternativas||[];
    const chapa=result.tipoSugestao==='chapa'?alternativas.find(item=>Number(item.id)===Number(result.chapaId)):null;
    const adesivo=result.tipoSugestao==='imprimax'?alternativas.find(item=>Number(item.id)===Number(result.imprimaxAdesivoId)):null;
    const opcaoAtual=opcoes.find(o=>(result.tipoSugestao==='chapa'&&o.tipo==='chapa'&&Number(o.id)===Number(result.chapaId))||(result.tipoSugestao==='imprimax'&&o.tipo==='imprimax'&&Number(o.id)===Number(result.imprimaxAdesivoId)));
    const de=result.deltaE00!=null?` (ΔE00 ${fmt(result.deltaE00,1)})`:'';
    const nomeAdesivo=[adesivo?.linha,adesivo?.codigo||adesivo?.nome].filter(Boolean).join(' ').replace(/^imprimax\s+/i,'');
    const nomeChapa=nomeMateriaCatalogo(result.chapaMateriaPrimaId)||chapa?.nome||'chapa cadastrada';
    const texto=result.tipoSugestao==='chapa'
      ?`acrílico/chapa ${result.escolhaManual?'escolhido':'mais parecido'}: <b>${escaparHtml(nomeChapa)}</b>${de}`
      :result.tipoSugestao==='imprimax'
        ?`${result.escolhaManual?'adesivo escolhido':'sem chapa nesta cor →'} ${result.requerChapaBase?'<b>acrílico transparente + adesivo Imprimax</b>':'<b>adesivo Imprimax</b>'} ${escaparHtml(nomeAdesivo)}${de}`
        :result.tipoSugestao==='impresso'
          ?(result.tipoCor==='solida'?'<b>adesivo impresso</b> (não há chapa nem adesivo Imprimax compatível com esta cor)':'<b>adesivo impresso</b> (degradê ou arte complexa)')
          :color.semAdesivo?'adesivo desconsiderado — a face segue a composição do kit':'revisão manual necessária';
    const corIndicada=(result.avisos||[]).some(aviso=>/^Cor indicada pelo vendedor/.test(aviso));
    const marcas=(corIndicada?' <span class="badge b-accent" title="Você indicou esta cor no desenho da Ficha técnica">cor indicada por você</span>':'')+(result.escolhaManual?' <span class="badge b-accent" title="Você trocou o material sugerido">material escolhido por você</span>':'');
    const alertas=(result.avisos||[]).filter(texto=>/Atenção|pendente|não cadastrado|Carregue|Transmissão de luz não cadastrada/i.test(texto)).map(texto=>`<div class="role-note">${escaparHtml(texto)}</div>`).join('');
    const menu=editavel&&result.tipoCor==='solida'&&opcoes.length>1?htmlMenuMaterialDaCor(result,opcoes):'';
    return `<li style="margin-bottom:6px;">${amostra(result.corHex)} ${escaparHtml(result.corHex||result.pantoneCode||result.tipoCor||'cor')} → ${opcaoAtual&&opcaoAtual.corHex?amostra(opcaoAtual.corHex)+' ':''}${texto}${marcas}${menu}${alertas}</li>`;
  }).join('');
  return `<div class="banner" style="margin:10px 0;">${ICONS.info}<div><b>Cores da logo identificadas; materiais da face ajustados automaticamente${color.aprovado?'':' (cores ainda não aprovadas)'}.</b>
    ${antes||depois?`<div style="margin-top:4px;">Face do kit: ${escaparHtml(antes||'—')} → <b>${escaparHtml(depois||'sem chapa colorida (adesivo sobre a base)')}</b></div>`:''}
    <ul style="margin:6px 0 0 18px;">${itens}</ul>
    ${editavel?'<div class="role-note" style="margin-top:8px;">A cor errada? Corrija no desenho da <b>Ficha técnica (passo 5)</b>: clique nas peças e indique a cor. Aqui você só troca o material sugerido para a cor.</div>':''}</div></div>`;
}

/** Menu das opções de material para uma cor (chapas por matéria-prima, adesivos Imprimax e adesivo impresso). */
function htmlMenuMaterialDaCor(result,opcoes){
  const color=REAL.colorAnalysis, atual=color.escolhas&&color.escolhas[result.regionKey];
  const valorAtual=atual?(atual.tipo==='impresso'?'impresso':atual.tipo+':'+atual.id):'auto';
  const rotulo=o=>{
    const nome=o.tipo==='chapa'?(nomeMateriaCatalogo(o.mubisysMateriaPrimaId)||o.nome):[o.linha,o.codigo||o.nome].filter(Boolean).join(' ').replace(/^imprimax\s+/i,'');
    return nome+(o.deltaE00!=null?` — ΔE00 ${fmt(o.deltaE00,1)}`:' — sem cor cadastrada')+(o.bloqueada?' (incompatível com a iluminação)':'');
  };
  const grupo=(titulo,tipo)=>{
    const lista=opcoes.filter(o=>o.tipo===tipo);
    return lista.length?`<optgroup label="${titulo}">${lista.map(o=>`<option value="${tipo}:${o.id}" ${valorAtual===tipo+':'+o.id?'selected':''} ${o.bloqueada?'disabled':''} title="${escaparHtml(o.motivo||'')}">${escaparHtml(rotulo(o))}</option>`).join('')}</optgroup>`:'';
  };
  return `<div style="margin-top:4px;"><label class="field" style="margin:0;">Trocar o material desta cor
    <select data-act="cor-escolher" data-region="${escaparHtml(result.regionKey)}" style="max-width:480px;">
      <option value="auto" ${valorAtual==='auto'?'selected':''}>Sugestão automática</option>
      ${grupo('Chapas de acrílico (por matéria-prima)','chapa')}${grupo('Adesivo Imprimax sobre acrílico transparente','imprimax')}
      <option value="impresso" ${valorAtual==='impresso'?'selected':''}>Adesivo impresso</option>
    </select></label></div>`;
}

/** O vendedor trocou o material sugerido para uma cor: o servidor valida a escolha, regrava o mapeamento e o nesting é refeito. */
async function escolherMaterialCor(regionKey,valor){
  if(state.tracing||REAL.factibilidadeCarregando||REAL.nestingCarregando||(REAL.colorAnalysis&&REAL.colorAnalysis.loading)) return;
  const color=REAL.colorAnalysis, result=(color.resultados||[]).find(r=>r.regionKey===regionKey);
  if(!result) return;
  color.escolhas=color.escolhas||{};
  if(valor==='auto') delete color.escolhas[regionKey];
  else{
    const [tipo,id]=valor.split(':');
    color.escolhas[regionKey]={tipo,id:id?Number(id):null,corHex:result.corHex||null};
    if(tipo!=='chapa') color.semAdesivo=false; // pediu adesivo de propósito: a decisão anterior de dispensá-lo não vale mais
  }
  await refazerCoresENesting();
}

/** Linhas de adesivo (Imprimax/impresso) que a análise de cores concluiu serem necessárias, exibidas na tabela da
 *  composição. O custo já entra no orçamento por `custoMateriaisCorTotal`; por isso não vão para REAL.kit (evita contar duas vezes). */
function htmlLinhasAdesivoComposicao(){
  const color=REAL.colorAnalysis;
  if(!color?.resultados?.length||!(color.aprovado||color.pendenciaAprovacao)) return '';
  return color.resultados.filter(result=>result.tipoSugestao==='imprimax'||result.tipoSugestao==='impresso').map(result=>{
    const adesivo=result.tipoSugestao==='imprimax'?(result.alternativas||[]).find(item=>Number(item.id)===Number(result.imprimaxAdesivoId)):null;
    const nome=result.tipoSugestao==='impresso'?'Adesivo impresso':'Adesivo Imprimax '+[adesivo?.linha,adesivo?.codigo||adesivo?.nome].filter(Boolean).join(' ').replace(/^imprimax\s+/i,'');
    const consumo=result.areaConsumoM2;
    const custo=result.custoEstimado;
    const unit=consumo>0&&custo!=null?custo/consumo:null;
    const pendente=custo==null||!(consumo>0);
    return `<tr style="background:${pendente?'rgba(245,158,11,.18)':'var(--surface-2)'};">
      <td><span style="display:inline-block;width:12px;height:12px;border:1px solid var(--border);border-radius:3px;vertical-align:middle;background:${escaparHtml(result.corHex||'#e2e8f0')};"></span> ${escaparHtml(nome)}<div class="source-tag">${ICONS.db} Adicionado pela análise de cores · ${escaparHtml(result.corHex||result.tipoCor||'')}${result.requerChapaBase?' · sobre acrílico transparente':''}</div></td>
      <td>Face (adesivo)</td><td>Área de consumo da bobina</td><td class="num">—</td>
      <td class="num">${consumo==null?'Pendente':fmt(consumo,4)+' m²'}</td>
      <td class="num">${unit==null?'Pendente':money(unit)}</td>
      <td class="num">${custo==null?'Pendente':money(custo)}</td>
      <td></td></tr>`;
  }).join('');
}

/** Adesivos que a análise de cores pediu e que ainda não têm custo/consumo fechado (cadastro da bobina, preço do vinil...). */
function adesivosSemCustoCores(){
  const resultados = (REAL.colorAnalysis && REAL.colorAnalysis.resultados) || [];
  return resultados.filter(r => (r.tipoSugestao === 'imprimax' || r.tipoSugestao === 'impresso')
    && (r.custoEstimado == null || !(Number(r.areaTotalM2) > 0) || !(Number(r.areaConsumoM2) > 0)));
}

/** Problema destacado (passos Nesting, Composição e Orçamento) quando as cores sugerem adesivo e algo impede fechar o custo
 *  ou aprovar o mapeamento. Nunca bloqueia o nesting: a decisão — cadastrar, trocar ou remover — é do vendedor. */
function htmlPendenciasCores(){
  const color = REAL.colorAnalysis;
  if(!color || !(color.resultados || []).length) return '';
  const semCusto = adesivosSemCustoCores();
  if(!color.pendenciaAprovacao && !semCusto.length) return '';
  const adesivos = color.resultados.filter(r => r.tipoSugestao === 'imprimax' || r.tipoSugestao === 'impresso');
  const nomeAdesivo = r => {
    const alt = r.tipoSugestao === 'imprimax' ? (r.alternativas || []).find(item => Number(item.id) === Number(r.imprimaxAdesivoId)) : null;
    return r.tipoSugestao === 'impresso' ? 'adesivo impresso' : 'adesivo Imprimax ' + [alt && alt.linha, alt && (alt.codigo || alt.nome)].filter(Boolean).join(' ').replace(/^imprimax\s+/i,'');
  };
  const sugeridos = adesivos.map(r => `<li>${escaparHtml(nomeAdesivo(r))} para ${escaparHtml(r.corHex || r.tipoCor || 'cor da arte')}${r.areaTotalM2 != null ? ` · ${fmt(r.areaTotalM2, 3)} m²` : ''}</li>`).join('');
  const avisos = [...new Set(color.resultados.flatMap(r => r.avisos || []).filter(t => /bobina|cadastr|pendente|largura|pre[çc]o/i.test(t)))].slice(0, 4);
  return `<div class="warnbox" role="alert" style="margin:10px 0;border-width:2px;">
    <span>${ICONS.alert}</span>
    <div>
      <b style="font-size:14px;">Atenção — decisão necessária: ${adesivos.length ? 'o sistema sugeriu adesivo e o custo não fecha' : 'as cores não puderam ser aprovadas'}.</b>
      ${sugeridos ? `<div style="margin-top:6px;">Adesivo sugerido (já está na Composição, com custo pendente):</div><ul style="margin:4px 0 0 18px;">${sugeridos}</ul>` : ''}
      ${color.pendenciaAprovacao ? `<div style="margin-top:8px;"><b>O que impede:</b> ${escaparHtml(color.pendenciaAprovacao)}</div>` : ''}
      ${avisos.length ? `<ul style="margin:6px 0 0 18px;">${avisos.map(t => `<li>${escaparHtml(t)}</li>`).join('')}</ul>` : ''}
      <div style="margin-top:8px;">O nesting foi feito normalmente. Enquanto isso não for resolvido, o <b>preço não pode ser aprovado nem a proposta emitida</b>. Você pode:</div>
      <ol style="margin:4px 0 0 18px;">
        <li>cadastrar na Administração do CPQ a largura total e útil da bobina, a sangria e o preço do vinil e clicar em <b>Refazer análise de cores e nesting</b>;</li>
        <li>ou, se o sistema leu a arte errado e o projeto não precisa de adesivo, <b>desconsiderar o adesivo</b>: a face volta à composição do kit e nenhum custo de vinil ou impressão entra no orçamento.</li>
      </ol>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        <button class="btn btn-soft btn-sm" data-act="cor-refazer" title="Refaz a leitura das cores e o nesting; volta a composição do kit ao original antes de aplicar as sugestões">Refazer análise de cores e nesting</button>
        ${htmlControleSemAdesivo()}
      </div>
    </div>
  </div>`;
}

/** Botão para o vendedor descartar a leitura de adesivo (a arte pode ter sido lida errado) e, depois, voltar atrás. A decisão
 *  vai ao servidor (`semAdesivo`), que regrava o mapeamento de cores sem região de adesivo; o nesting roda de novo. */
function htmlControleSemAdesivo(){
  const color=REAL.colorAnalysis;
  if(!color||!(color.resultados||[]).length) return '';
  if(color.semAdesivo) return `<button class="btn btn-ghost btn-sm" data-act="cor-sem-adesivo" data-val="0" title="Volta a usar a leitura de adesivo feita pelo sistema">Voltar a considerar o adesivo</button>`;
  if(!color.resultados.some(r=>r.tipoSugestao==='imprimax'||r.tipoSugestao==='impresso')) return '';
  return `<button class="btn btn-ghost btn-sm" data-act="cor-sem-adesivo" data-val="1" title="O sistema pode ter lido a arte errado: a face volta à composição do kit e nenhum custo de adesivo entra no orçamento">O projeto não precisa de adesivo (desconsiderar)</button>`;
}

async function alternarSemAdesivo(desconsiderar){
  if(state.tracing || REAL.factibilidadeCarregando || REAL.nestingCarregando || (REAL.colorAnalysis && REAL.colorAnalysis.loading)) return;
  REAL.colorAnalysis.semAdesivo = !!desconsiderar;
  await refazerCoresENesting();
}

/** Refaz a análise de cores e o nesting (depois de cadastrar a bobina/preços). Volta ao passo do nesting. */
async function refazerCoresENesting(){
  if(state.tracing || REAL.factibilidadeCarregando || REAL.nestingCarregando || (REAL.colorAnalysis && REAL.colorAnalysis.loading)) return;
  invalidarAnaliseCoresReal();
  REAL.colorAnalysis.error = null; REAL.colorAnalysis.pendenciaAprovacao = null;
  REAL.nestingAutoChave = null;
  REAL.step = 6; render();
  await iniciarNestingAutomatico();
}

function renderAnaliseCoresReal(){
  const color=REAL.colorAnalysis;
  const pendencias=htmlPendenciasCores();
  return `<div style="margin:10px 0;">
    ${color.error?`<div class="warnbox" role="alert">${escaparHtml(color.error)}</div>`:''}
    ${pendencias}
    ${pendencias?'':htmlControleSemAdesivo()}
    ${color.loading?'<div class="empty-hint">Rastreando as cores da logo e escolhendo os materiais da face…</div>':''}
    ${htmlAvisoCoresAutomaticas(true)}
    ${color.error&&!color.loading?'<button class="btn btn-ghost btn-sm" style="margin-top:10px;" data-act="cor-analisar">Tentar novamente</button>':''}
  </div>`;
}

/** Dispara sozinho (uma vez por composição/arte) a análise de cores e o nesting das chapas da composição. */
function agendarNestingAutomatico(){
  const color=REAL.colorAnalysis;
  if(REAL.factibilidadeCarregando||REAL.nestingCarregando||color.loading||REAL.factibilidade||REAL.nesting||REAL.factibilidadeErro||color.error||REAL.nestingFormatosPendentes?.length) return;
  const chave=JSON.stringify([(REAL.kit||[]).map(l=>[materialKitAtivo(l).matId,l.papel||'',l.origemPintura?1:0]),REAL.tracedSvg?.length||0,REAL.tracedW,REAL.tracedH]);
  if(REAL.nestingAutoChave===chave) return;
  REAL.nestingAutoChave=chave;
  setTimeout(iniciarNestingAutomatico,0);
}
async function iniciarNestingAutomatico(){
  const color=REAL.colorAnalysis;
  if(REAL.step!==6||REAL.factibilidadeCarregando||REAL.nestingCarregando||color.loading) return;
  if(!color.resultados?.length) await analisarCorrespondenciaCoresReal();
  if(!color.resultados?.length){
    // Sem a leitura das cores o nesting ainda roda com a composição do kit; as cores precisam ser resolvidas antes de emitir.
    if(color.error&&!REAL.factibilidade&&!REAL.nesting) await analisarFactibilidadeReal();
    return;
  }
  if(color.aprovado){ await analisarFactibilidadeReal(); return; }
  // Sem chapa equivalente, acrílico transparente + adesivo Imprimax entra sozinho; o vendedor é informado no aviso da tela.
  color.autorizaAdesivo=true;
  await aprovarCoresESeguirReal();
  // Se as cores não foram aprovadas (ex.: falta cadastrar a bobina do adesivo), o nesting ainda roda com a composição do kit.
  if(!color.aprovado&&!REAL.factibilidade&&!REAL.nesting&&!REAL.factibilidadeCarregando) await analisarFactibilidadeReal();
}

async function executarNestingFactibilidadeReal(formatosTemporarios=REAL.nestingFormatosUsados||[]){
  const fact=REAL.factibilidade;
  if(!fact) throw new Error('Analise a factibilidade antes do nesting.');
  if(fact.status_factibilidade==='REQUER_APROVACAO_EMENDA'&&!fact.reciboDecisao) return;
  REAL.nestingCarregando=true; REAL.nesting=null; REAL.factibilidadeErro=null; render();
  try{
    const lotesPorMaterial=fact.materiais.map(material=>{
      const pecas=fact.acao==='REDIMENSIONAR_PARA_CABER'?material.pecas_redimensionadas_opcao:material.pecas_para_nesting;
      if(!Array.isArray(pecas)||!pecas.length) throw new Error('Nao ha pecas de corte para '+material.materia_prima+'.');
      return {materiaPrimaId:material.id_materia_prima,pecas};
    });
    const response=await fetch('/api/letra-caixa/nesting',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sourceId:REAL.id,resultadoHash:fact.resultadoHash,ticketAnalise:fact.ticketAnalise,
        acaoFactibilidade:fact.acao||null,reciboDecisaoFactibilidade:fact.reciboDecisao||null,
        lotesPorMaterial,materiaPrimaIds:lotesPorMaterial.map(lote=>lote.materiaPrimaId),
        formatosTemporarios,
        espacamentoMm:Number(REAL.nestingConfiguracao.espacamentoMm)||0,
        margemBordaMm:Number(REAL.nestingConfiguracao.margemBordaMm)||0,
      }),
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Falha no Deepnest para os materiais selecionados.');
    const resultados=body.materiais||[];
    const falhasNesting=Array.isArray(body.falhas)?body.falhas:[];
    if(resultados.length+falhasNesting.length!==lotesPorMaterial.length) throw new Error('O nesting nao retornou todos os materiais.');
    // Um material que não coube não derruba os outros: os que deram certo aparecem (e podem ser baixados) e a falha fica explicada.
    REAL.nesting={materiais:resultados,falhas:falhasNesting,algoritmo:body.motor||'Deepnest'};
  }finally{ REAL.nestingCarregando=false; }
}

/* Política de corte por matéria-prima (cadastro em Administração > Produtos > Matérias-primas). Mesma precedência de
 * shared/politica-corte.ts: valor próprio > padrão do processo > padrão do orçamento. Só o material ESCOVADO restringe a rotação
 * (0° e 180°); os demais giram livremente. Os valores definitivos são resolvidos no servidor; aqui é só para mostrar ao vendedor. */
const PROCESSOS_CORTE_CPQ = {laser:{rotulo:'Laser', espacamento:3, margem:8}, router:{rotulo:'Router CNC', espacamento:8, margem:12}, plasma:{rotulo:'Plasma', espacamento:10, margem:20}, faca:{rotulo:'Faca / lâmina', espacamento:3, margem:5}};
function politicaCorteResolvida(pol, config){
  const processo = pol && PROCESSOS_CORTE_CPQ[pol.processoCorte] ? PROCESSOS_CORTE_CPQ[pol.processoCorte] : null;
  const proprio = valor => valor != null && Number.isFinite(Number(valor)) ? Number(valor) : null;
  const espacamento = proprio(pol && pol.espacamentoMm) ?? (processo ? processo.espacamento : Number(config.espacamentoMm) || 0);
  const margem = proprio(pol && pol.margemBordaMm) ?? (processo ? processo.margem : Number(config.margemBordaMm) || 0);
  const veio = !!pol && pol.rotacaoPermitida === 'veio';
  return {processo, espacamento, margem, veio, temPolitica: !!(processo || veio || proprio(pol && pol.espacamentoMm) != null || proprio(pol && pol.margemBordaMm) != null)};
}
/** ' · processo Laser · escovado: só 0° e 180°' (ou vazio) a partir do resultado do servidor. */
function textoProcessoRotacaoNesting(material){
  const processo = PROCESSOS_CORTE_CPQ[material.processo_corte];
  return (processo ? ' · processo ' + processo.rotulo : '') + (material.rotacao_permitida === 'veio' ? ' · escovado: só 0° e 180°' : '');
}

function renderConfiguracaoNestingReal(){
  const config=REAL.nestingConfiguracao||{espacamentoMm:3,margemBordaMm:5};
  const idsBrutos=REAL.nestingMateriaPrimaIds?.length
    ? REAL.nestingMateriaPrimaIds
    : [...new Set((REAL.kit||[]).filter(line=>!line.origemPintura&&!linhaEhPerfil(line)&&camadaFisicaKit(line)).map(line=>Number(materialKitAtivo(line).matId)).filter(id=>Number.isInteger(id)&&id>0))];
  const chapas=REAL.nestingFormatosCadastrados||[];
  // Só chapa/bobina com formato cadastrado entra no nesting; perfil e demais itens não pedem dimensões.
  const idsChapa=new Set(chapas.filter(chapa=>chapa.ativo!==false).map(chapa=>Number(chapa.mubisysMateriaPrimaId)));
  const ids=idsChapa.size?idsBrutos.filter(id=>idsChapa.has(Number(id))):idsBrutos;
  const semFormato=[];
  const nomes=new Map((catalog.materias||[]).map(material=>[Number(material.id),material.nome]));
  const linhas=[];
  linhas.push('<div class="card" style="background:var(--surface-2);box-shadow:none;margin:10px 0;">');
  linhas.push('<div class="cardhead"><div><h4>Chapas da composição</h4><p>O nesting roda sozinho para cada chapa vinculada à Face, Aro ou Fundo do kit e calcula a área de consumo usada no preço. O espaço e a margem abaixo são o padrão do orçamento: a matéria-prima com processo de corte cadastrado usa os valores dela (mostrados em azul na lista).</p></div></div>');
  linhas.push('<div class="grid2" style="margin-top:10px;">');
  linhas.push('<label class="field">Distanciamento entre peças (mm)<input type="number" min="0" max="50" step="0.5" value="'+escaparHtml(config.espacamentoMm)+'" data-act="nesting-espacamento"></label>');
  linhas.push('<label class="field">Distanciamento da borda (mm)<input type="number" min="0" max="50" step="0.5" value="'+escaparHtml(config.margemBordaMm)+'" data-act="nesting-margem-borda"></label>');
  linhas.push('</div>');
  const chapasAtivasIds=new Set(chapas.filter(chapa=>chapa.ativo!==false).map(chapa=>Number(chapa.mubisysMateriaPrimaId)));
  const papeisPendentes=(REAL.kit||[]).map((linha,idx)=>({linha,idx,material:materialKitAtivo(linha)})).filter(item=>!item.linha.origemPintura&&!linhaEhPerfil(item.linha)&&chapasAtivasIds.has(Number(item.material.matId))&&!camadaFisicaKit(item.linha));
  if(papeisPendentes.length){
    linhas.push('<div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:10px;"><b>Vincule as chapas às camadas do desenho</b><p class="role-note">Este vínculo mínimo permite separar Face, Aro e Fundo para o nesting. As fórmulas e multiplicadores ficam para a próxima etapa.</p>');
    for(const item of papeisPendentes){
      const papeis=papeisDePeca();
      const opcoes='<option value="">Selecione a camada</option>'+papeis.map(papel=>'<option value="'+escaparHtml(papel)+'">'+escaparHtml(papel)+'</option>').join('');
      linhas.push('<label class="field" style="margin-top:8px;">'+escaparHtml(item.material.nome)+'<select data-act="nesting-kit-papel" data-idx="'+item.idx+'">'+opcoes+'</select></label>');
    }
    linhas.push('</div>');
  }
  for(const id of ids){
    const opcoes=chapas.filter(chapa=>chapa.ativo!==false&&Number(chapa.mubisysMateriaPrimaId)===id);
    if(opcoes.length){
      const resumo=opcoes.map(chapa=>escaparHtml(chapa.nome||'Formato cadastrado')+' · '+chapa.larguraMm+' × '+chapa.alturaMm+' mm').join(' / ');
      const politica = politicaCorteResolvida(opcoes[0].politica, config);
      const textoPolitica = politica.temPolitica ? '<div style="margin-top:2px;color:var(--accent-ink);">'+(politica.processo?'Processo de corte: <b>'+politica.processo.rotulo+'</b> · ':'')+'espaço entre peças <b>'+politica.espacamento+' mm</b> · margem de borda <b>'+politica.margem+' mm</b>'+(politica.veio?' · <b>escovado: só gira 0° e 180°</b>':'')+'</div>' : '';
      linhas.push('<div class="role-note"><b>'+escaparHtml(nomes.get(id)||('Matéria-prima '+id))+':</b> '+resumo+textoPolitica+'</div>');
    }
  }
  for(const id of semFormato){
    const manual=REAL.nestingFormatosTemporarios[id]||{larguraMm:'',alturaMm:'',bobina:false};
    const bobina=!!manual.bobina;
    linhas.push('<div class="card" style="background:var(--surface);box-shadow:none;margin-top:8px;"><b>'+escaparHtml(nomes.get(id)||('Matéria-prima '+id))+'</b>');
    linhas.push('<div class="grid2" style="margin-top:8px;">');
    linhas.push('<label class="field">'+(bobina?'Comprimento máximo':'Largura')+' (mm)<input type="number" min="10" max="50000" step="1" value="'+escaparHtml(manual.larguraMm)+'" data-act="nesting-formato-largura" data-material-id="'+id+'" placeholder="Ex.: 2000"></label>');
    linhas.push('<label class="field">'+(bobina?'Largura do rolo':'Altura')+' (mm)<input type="number" min="10" max="50000" step="1" value="'+escaparHtml(manual.alturaMm)+'" data-act="nesting-formato-altura" data-material-id="'+id+'" placeholder="Ex.: 1000"></label>');
    linhas.push('<label class="checkrow" style="grid-column:1/-1;"><input type="checkbox" data-act="nesting-formato-bobina" data-material-id="'+id+'" '+(bobina?'checked':'')+'> Matéria-prima em bobina (sem rotação)</label>');
    linhas.push('</div></div>');
  }
  if(semFormato.length) linhas.push('<div class="role-note" style="margin-top:8px;">Essas dimensões serão usadas somente nesta cotação e não alteram o cadastro de matérias-primas.</div>');
  if(!ids.length){
    linhas.push('<div class="role-note" style="margin-top:8px;">Ainda não há matéria-prima de chapa vinculada a Face, Aro ou Fundo.</div>');
    linhas.push('<button class="btn btn-ghost btn-sm" style="margin-top:8px;" data-act="real-nesting-go-composition">Abrir composição para escolher materiais</button>');
  }
  linhas.push('<button class="btn btn-primary" style="margin-top:10px;" data-act="real-nesting-iniciar" '+(REAL.factibilidadeCarregando||REAL.nestingCarregando?'disabled':'')+'>'+(REAL.factibilidadeCarregando||REAL.nestingCarregando?'Calculando…':'Calcular nesting')+'</button><div class="role-note" data-nesting-config-status style="display:none;"></div></div>');
  return linhas.join('');
}

/* ---------- Prancha, visualização e download do nesting ----------
 * Cada chapa tem uma prancha no estilo da prancha técnica (título, desenho com cotas e painel RESULTADOS) com o material, a
 * % da chapa utilizada, a área líquida das peças e o perímetro de corte; o resumo por material vem numa tabela. As peças vêm
 * da factibilidade (SVG em mm, origem no canto da caixa da peça); a rotação é em torno dessa origem e (x, y) é o canto da
 * caixa já girada, como no motor. Quando o desenho não cabe numa chapa, o material usa várias (quantidade_chapas) e cada
 * posicionamento traz chapaIndice. */
function pecasDoMaterialNesting(idMateria){
  const fact = REAL.factibilidade;
  const m = fact && (fact.materiais || []).find(item => Number(item.id_materia_prima) === Number(idMateria));
  if(!m) return [];
  return (fact.acao === 'REDIMENSIONAR_PARA_CABER' ? m.pecas_redimensionadas_opcao : m.pecas_para_nesting) || [];
}

function caminhoDaPecaNesting(svgTexto){
  try{
    const doc = new DOMParser().parseFromString(svgTexto, 'image/svg+xml');
    return [...doc.querySelectorAll('path')].map(p => p.getAttribute('d') || '').filter(Boolean).join(' ');
  }catch(erro){ return ''; }
}

function pontosDoCaminhoNesting(d){
  const n = (String(d).match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
  const pontos = [];
  for(let i = 0; i + 1 < n.length; i += 2) pontos.push([n[i], n[i + 1]]);
  return pontos;
}

/** Área líquida (mm², descontados os vazados) e perímetro de corte (mm) de um caminho em mm. */
function medidasDoCaminhoNesting(d){
  const aneis = String(d).split(/(?=[Mm])/).map(parte => pontosDoCaminhoNesting(parte)).filter(anel => anel.length >= 3);
  const area = anel => Math.abs(anel.reduce((s, [x1, y1], i) => { const [x2, y2] = anel[(i + 1) % anel.length]; return s + x1 * y2 - x2 * y1; }, 0)) / 2;
  const perimetro = anel => anel.reduce((s, [x1, y1], i) => { const [x2, y2] = anel[(i + 1) % anel.length]; return s + Math.hypot(x2 - x1, y2 - y1); }, 0);
  const dentro = (pt, anel) => {
    let c = false;
    for(let i = 0, j = anel.length - 1; i < anel.length; j = i++){
      const [xi, yi] = anel[i], [xj, yj] = anel[j];
      if((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  let areaTotal = 0, per = 0;
  aneis.forEach((anel, i) => {
    const profundidade = aneis.reduce((n, outro, k) => (k !== i && dentro(anel[0], outro) ? n + 1 : n), 0);
    areaTotal += (profundidade % 2 === 0 ? 1 : -1) * area(anel);
    per += perimetro(anel);
  });
  return {area:Math.max(0, areaTotal), perimetro:per};
}

function transformacaoDaPecaNesting(d, pos){
  const graus = Number(pos.rotacaoGraus) || 0, rad = graus * Math.PI / 180, c = Math.cos(rad), s = Math.sin(rad);
  let minX = Infinity, minY = Infinity;
  for(const [x, y] of pontosDoCaminhoNesting(d)){
    const rx = x * c - y * s, ry = x * s + y * c;
    if(rx < minX) minX = rx;
    if(ry < minY) minY = ry;
  }
  if(!Number.isFinite(minX)) return null;
  const r = valor => Math.round(valor * 1000) / 1000;
  return {graus:r(graus), tx:r((Number(pos.xMm) || 0) - minX), ty:r((Number(pos.yMm) || 0) - minY)};
}

function quantidadeChapasNesting(material){ return Math.max(1, Number(material.quantidade_chapas) || 1); }
function posicoesDaChapaNesting(material, indice){ return (material.posicionamentos || []).filter(pos => (Number(pos.chapaIndice) || 0) === indice); }

/** Números de uma chapa: peças, área líquida, perímetro de corte, bloco ocupado (consumo) e as % da chapa. */
function metricasChapaNesting(material, indice){
  const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm), margem = Number(material.margem_borda_mm) || 0;
  const pecas = new Map(pecasDoMaterialNesting(material.id_materia_prima).map(p => [p.id, p]));
  const posicoes = posicoesDaChapaNesting(material, indice);
  let areaMm2 = 0, perimetroMm = 0;
  for(const pos of posicoes){
    const peca = pecas.get(pos.origemId), d = peca ? caminhoDaPecaNesting(peca.svg) : '';
    const m = d ? medidasDoCaminhoNesting(d) : null;
    if(m){ areaMm2 += m.area; perimetroMm += m.perimetro; }
  }
  // O layout começa na margem de borda: o bloco ocupado (consumo) vai da origem da chapa até a última peça + margem.
  const blocoW = posicoes.length ? Math.min(W, Math.max(...posicoes.map(p => (Number(p.xMm) || 0) + (Number(p.larguraMm) || 0))) + margem) : 0;
  const blocoH = posicoes.length ? Math.min(H, Math.max(...posicoes.map(p => (Number(p.yMm) || 0) + (Number(p.alturaMm) || 0))) + margem) : 0;
  const areaChapaM2 = (W * H) / 1_000_000, blocoM2 = (blocoW * blocoH) / 1_000_000, areaM2 = areaMm2 / 1_000_000;
  return {pecas:posicoes.length, areaM2, perimetroM:perimetroMm / 1000, blocoW, blocoH, blocoM2, areaChapaM2,
    pctChapa:areaChapaM2 > 0 ? 100 * blocoM2 / areaChapaM2 : 0, pctPecas:areaChapaM2 > 0 ? 100 * areaM2 / areaChapaM2 : 0};
}

/** Conteúdo SVG (em mm) de UMA chapa: contorno da chapa, margem de borda e peças. `modo`: 'prancha' (escuro, como a prancha técnica) ou 'corte' (só contornos). */
function conteudoSvgNesting(material, modo, indice){
  indice = indice || 0;
  const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm), margem = Number(material.margem_borda_mm) || 0;
  const pecas = new Map(pecasDoMaterialNesting(material.id_materia_prima).map(p => [p.id, p]));
  const espessura = modo === 'corte' ? 0.6 : Math.max(W, H) / 1500;
  const estilo = modo === 'corte' ? 'fill="none" stroke="#000000"' : 'fill="#1f2937" fill-opacity="0.92" stroke="#0f172a"';
  const posicoes = posicoesDaChapaNesting(material, indice).map((pos, i) => {
    const peca = pecas.get(pos.origemId), d = peca ? caminhoDaPecaNesting(peca.svg) : '';
    const t = d ? transformacaoDaPecaNesting(d, pos) : null;
    if(!t) return `<rect x="${Number(pos.xMm) || 0}" y="${Number(pos.yMm) || 0}" width="${Number(pos.larguraMm) || 0}" height="${Number(pos.alturaMm) || 0}" ${estilo} stroke-width="${espessura}"><title>Peça ${i + 1} (caixa)</title></rect>`;
    return `<path d="${d}" transform="translate(${t.tx} ${t.ty}) rotate(${t.graus})" fill-rule="evenodd" ${estilo} stroke-width="${espessura}"><title>Peça ${i + 1} · ${t.graus}°</title></path>`;
  }).join('');
  const bordas = `<rect id="Chapa" x="0" y="0" width="${W}" height="${H}" fill="${modo === 'corte' ? 'none' : '#f8fafc'}" stroke="#2563eb" stroke-width="${Math.max(espessura, 0.8)}"/>`
    + (margem > 0 && W > 2 * margem && H > 2 * margem ? `<rect id="Margem" x="${margem}" y="${margem}" width="${W - 2 * margem}" height="${H - 2 * margem}" fill="none" stroke="#94a3b8" stroke-width="${Math.max(espessura / 2, 0.4)}" stroke-dasharray="${margem * 2} ${margem}"/>` : '');
  return bordas + `<g id="Pecas">${posicoes}</g>`;
}

/** Prancha de nesting de UMA chapa, no estilo da prancha técnica: desenho com cotas à esquerda e RESULTADOS à direita. */
function pranchaNestingSvg(material, indice){
  const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm), n = quantidadeChapasNesting(material);
  const m = metricasChapaNesting(material, indice);
  const width = 1800, height = 1120, drawX = 130, drawY = 170, drawW = 1050, drawH = 690;
  const escala = Math.min(drawW / W, drawH / H), sw = W * escala, sh = H * escala, sx = drawX + (drawW - sw) / 2, sy = drawY + (drawH - sh) / 2, x2 = sx + sw, y2 = sy + sh;
  const titulo = escaparHtml(REAL.modeloNome || 'Projeto'), nomeMat = escaparHtml(material.materia_prima);
  const rotuloChapa = material.formato === 'bobina' ? 'Bobina' : 'Chapa';
  const L = (y, texto, extra) => `<text x="1290" y="${y}" font-family="Arial,sans-serif" font-size="${(extra && extra.t) || 15}" ${extra && extra.b ? 'font-weight="700" ' : ''}fill="${(extra && extra.c) || '#334155'}">${texto}</text>`;
  const tamanhoBloco = `${fmt(m.blocoW, 0)} × ${fmt(m.blocoH, 0)} mm`;
  const custo = material.custo_material_estimado != null && Number.isFinite(Number(material.custo_material_estimado)) ? money(material.custo_material_estimado) : 'pendente';
  const bloco = m.blocoW > 0 ? `<rect x="0" y="0" width="${m.blocoW}" height="${m.blocoH}" fill="none" stroke="#ea580c" stroke-width="${Math.max(W, H) / 900}" stroke-dasharray="${Math.max(W, H) / 120} ${Math.max(W, H) / 200}"/>` : '';
  return `<svg id="prancha-nesting-${material.id_materia_prima}-${indice}" xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;background:#fff;border:1px solid var(--border);border-radius:8px;">
    <rect width="${width}" height="${height}" fill="#fff"/>
    <text x="${drawX}" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">PRANCHA DE NESTING — ${titulo}</text>
    <text x="${drawX}" y="105" font-family="Arial,sans-serif" font-size="15" fill="#475569">${nomeMat} · ${rotuloChapa} ${escaparHtml(material.nome_chapa_utilizada)}${n > 1 ? ` · chapa ${indice + 1} de ${n}` : ''} · espaçamento ${fmt(material.espacamento_pecas_mm, 1)} mm · borda ${fmt(material.margem_borda_mm, 1)} mm${escaparHtml(textoProcessoRotacaoNesting(material))}</text>
    <defs><marker id="dim-arrow-n" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
    <svg x="${sx}" y="${sy}" width="${sw}" height="${sh}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${conteudoSvgNesting(material, 'prancha', indice)}${bloco}</svg>
    <line x1="${sx}" y1="${y2 + 22}" x2="${x2}" y2="${y2 + 22}" stroke="#334155" marker-start="url(#dim-arrow-n)" marker-end="url(#dim-arrow-n)"/>
    <text x="${sx + sw / 2}" y="${y2 + 44}" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">${rotuloChapa} ${fmt(W, 0)} mm</text>
    <line x1="${sx - 22}" y1="${sy}" x2="${sx - 22}" y2="${y2}" stroke="#334155" marker-start="url(#dim-arrow-n)" marker-end="url(#dim-arrow-n)"/>
    <text x="${sx - 34}" y="${sy + sh / 2}" text-anchor="middle" transform="rotate(-90 ${sx - 34} ${sy + sh / 2})" font-family="Arial,sans-serif" font-size="16" fill="#0f172a">${fmt(H, 0)} mm</text>
    <text x="${sx + sw / 2}" y="${y2 + 72}" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ea580c">Tracejado laranja: bloco ocupado (consumo) ${tamanhoBloco}</text>
    <text x="1290" y="190" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">RESULTADOS</text>
    ${L(235, `Material: ${nomeMat}`, {t:14})}
    ${L(270, `${rotuloChapa}: ${escaparHtml(material.nome_chapa_utilizada)}${n > 1 ? ` (${indice + 1} de ${n})` : ''}`)}
    ${L(310, `% da ${rotuloChapa.toLowerCase()} utilizada: ${fmt(m.pctChapa, 1)}%`, {t:17, b:true, c:'#0f172a'})}
    ${L(345, `% da ${rotuloChapa.toLowerCase()} com peças (área real): ${fmt(m.pctPecas, 1)}%`)}
    ${L(380, `Área da ${rotuloChapa.toLowerCase()}: ${fmt(m.areaChapaM2, 3)} m²`)}
    ${L(415, `Bloco ocupado (consumo): ${fmt(m.blocoM2, 3)} m²`)}
    ${L(450, `Área líquida das peças: ${fmt(m.areaM2, 3)} m²`, {b:true, c:'#0f172a'})}
    ${L(485, `Perímetro de corte: ${fmt(m.perimetroM, 2)} m`, {b:true, c:'#0f172a'})}
    ${L(520, `Peças posicionadas: ${m.pecas}`)}
    ${n > 1 ? L(570, `Total do material: ${n} chapas · consumo ${fmt(material.area_chapa_utilizada_m2, 3)} m²`, {t:13, c:'#475569'}) : ''}
    ${L(n > 1 ? 600 : 570, `Custo estimado do material${n > 1 ? ' (todas as chapas)' : ''}: ${escaparHtml(custo)}`, {t:13, c:'#475569'})}
    <line x1="1290" y1="640" x2="1700" y2="640" stroke="#cbd5e1"/>
    <text x="1290" y="675" font-family="Arial,sans-serif" font-size="12" fill="#64748b">${material.motor === 'interno' ? 'Estimativa do motor interno: consumo conservador (igual ou maior que o real).' : 'Nesting calculado pelo Deepnest.'}</text>
    <text x="1290" y="700" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Área e perímetro calculados sobre o contorno das peças posicionadas.</text>
    <text x="1290" y="725" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Não inclui kerf, ferramenta nem offset de corte.</text>
    <text x="${drawX}" y="${height - 35}" font-family="Arial,sans-serif" font-size="12" fill="#64748b">${titulo} · prancha de nesting gerada pelo CPQ Letreiros Express</text>
  </svg>`;
}

function rotuloMaterialNesting(material){
  const chapa = material.formato === 'bobina' ? 'bobina' : 'chapa';
  const n = quantidadeChapasNesting(material);
  return `${material.materia_prima} · ${n > 1 ? n + ' chapas' : chapa} ${material.nome_chapa_utilizada} (${material.chapa.largura_mm} × ${material.chapa.altura_mm} mm) · ${(material.posicionamentos || []).length} peça(s)`;
}

/** Todas as chapas dos materiais num só SVG (em mm), uma embaixo da outra, com o nome de cada uma. */
function svgDownloadNestingCompleto(materiais){
  const folga = 120, altTexto = 60;
  let y = 0, larguraMax = 0;
  const blocos = [];
  materiais.forEach(material => {
    const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm), n = quantidadeChapasNesting(material);
    for(let i = 0; i < n; i++){
      const titulo = rotuloMaterialNesting(material) + (n > 1 ? ` · chapa ${i + 1} de ${n}` : '');
      blocos.push(`<g transform="translate(0 ${y})"><text x="0" y="${altTexto - 15}" font-size="36" font-family="Arial" fill="#111827">${escaparHtml(titulo)}</text><g transform="translate(0 ${altTexto})">${conteudoSvgNesting(material, 'corte', i)}</g></g>`);
      y += altTexto + H + folga; larguraMax = Math.max(larguraMax, W);
    }
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${larguraMax}mm" height="${y}mm" viewBox="0 0 ${larguraMax} ${y}">${blocos.join('')}</svg>`;
}

function svgDownloadNesting(material){
  if(quantidadeChapasNesting(material) > 1) return svgDownloadNestingCompleto([material]);
  const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}"><title>${escaparHtml(rotuloMaterialNesting(material))}</title>${conteudoSvgNesting(material, 'corte', 0)}</svg>`;
}

function baixarTextoNesting(nome, conteudo){
  const url = URL.createObjectURL(new Blob([conteudo], {type:'image/svg+xml'}));
  const link = document.createElement('a'); link.href = url; link.download = nome; link.click(); URL.revokeObjectURL(url);
}

function nomeArquivoNesting(texto){
  return String(texto || 'material').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).toLowerCase() || 'material';
}

/** Baixa a prancha de cada chapa do material em PNG (2400 px), como a prancha técnica. */
async function baixarPranchasNestingPNG(material){
  const n = quantidadeChapasNesting(material);
  for(let i = 0; i < n; i++){
    const svg = document.getElementById('prancha-nesting-' + material.id_materia_prima + '-' + i);
    if(!svg) continue;
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], {type:'image/svg+xml;charset=utf-8'}));
    try{
      const imagem = await loadImageEl(url), canvas = document.createElement('canvas');
      canvas.width = 2400; canvas.height = Math.round(2400 * 1120 / 1800);
      const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(imagem, 0, 0, canvas.width, canvas.height);
      const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if(!png) throw new Error('Não consegui renderizar o PNG.');
      const pngUrl = URL.createObjectURL(png), link = document.createElement('a');
      link.href = pngUrl; link.download = 'prancha-nesting-' + nomeArquivoNesting(material.materia_prima) + (n > 1 ? '-chapa-' + (i + 1) : '') + '.png'; link.click();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
    }catch(erro){ alert(erro.message || 'Falha ao exportar a prancha PNG.'); }
    finally{ URL.revokeObjectURL(url); }
    await new Promise(resolve => setTimeout(resolve, 300));
  }
}

/** Instrução quando o desenho precisou de várias chapas (o que fazer para caber em uma só ou seguir assim). */
function htmlInstrucaoVariasChapas(material){
  const n = quantidadeChapasNesting(material);
  if(n < 2) return '';
  return `<div class="warnbox" role="alert" style="margin-top:10px;"><span>${ICONS.alert}</span><div>
    <b>Este desenho não cabe em uma chapa: o sistema usou ${n} chapas de ${escaparHtml(material.nome_chapa_utilizada)} (${material.chapa.largura_mm} × ${material.chapa.altura_mm} mm).</b>
    <div style="margin-top:4px;">${escaparHtml(material.instrucao_nao_coube || '')}</div>
    <div class="role-note" style="margin-top:4px;">O consumo e o custo do material já somam as ${n} chapas.</div>
  </div></div>`;
}

/** Pranchas de um material (uma por chapa) e os botões de download. */
function painelVisualNesting(material){
  const W = Number(material.chapa.largura_mm), H = Number(material.chapa.altura_mm);
  if(!(W > 0) || !(H > 0) || !(material.posicionamentos || []).length) return '';
  const n = quantidadeChapasNesting(material);
  const pranchas = Array.from({length:n}, (_, indice) => posicoesDaChapaNesting(material, indice).length
    ? `<div style="margin-top:${indice ? 10 : 0}px;">${pranchaNestingSvg(material, indice)}</div>` : '').join('');
  return `<div style="margin-top:10px;">
    ${pranchas}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;">
      <button class="btn btn-soft btn-sm" data-act="nesting-baixar-png" data-material-id="${material.id_materia_prima}">Baixar prancha${n > 1 ? 's' : ''} de nesting (PNG)</button>
      <button class="btn btn-ghost btn-sm" data-act="nesting-baixar-svg" data-material-id="${material.id_materia_prima}">Baixar nesting${n > 1 ? ' das ' + n + ' chapas' : ''} (SVG em mm)</button>

}

/** Resumo por material (tabela): chapa, quantidade, % da chapa utilizada, área líquida, perímetro, consumo e custo. */
function resumoNesting(){
  const fact = REAL.factibilidade, nesting = REAL.nesting;
  if(!fact || !(fact.materiais || []).length) return '';
  const resultados = (nesting && nesting.materiais) || [];
  const linhas = fact.materiais.map(m => {
    const r = resultados.find(item => Number(item.id_materia_prima) === Number(m.id_materia_prima));
    const total = pecasDoMaterialNesting(m.id_materia_prima).length;
    if(r){
      const n = quantidadeChapasNesting(r), custo = r.custo_material_estimado != null && Number.isFinite(Number(r.custo_material_estimado)) ? money(r.custo_material_estimado) : 'pendente';
      return `<tr><td>${n > 1 ? ICONS.alert : ICONS.check} <b>${escaparHtml(r.materia_prima)}</b><div class="source-tag">${(r.posicionamentos || []).length} de ${total} peça(s)${r.motor === 'interno' ? ' · estimativa do motor interno' : ''}</div></td>
        <td>${escaparHtml(r.nome_chapa_utilizada)}<div class="source-tag">${r.chapa.largura_mm} × ${r.chapa.altura_mm} mm</div></td>
        <td class="num">${n > 1 ? '<b>' + n + '</b>' : n}</td>
        <td class="num"><b>${fmt(r.porcentagem_aproveitamento, 1)}%</b>${n > 1 ? '<div class="source-tag">média das ' + n + ' chapas</div>' : ''}</td>
        <td class="num">${fmt(r.area_liquida_m2, 3)} m²</td>
        <td class="num">${fmt(r.perimetro_total_m, 2)} m</td>
        <td class="num">${fmt(r.area_chapa_utilizada_m2, 3)} m²</td>
        <td class="num">${escaparHtml(custo)}</td></tr>`;
    }
    const falha = ((nesting && nesting.falhas) || []).find(f => Number(f.id_materia_prima) === Number(m.id_materia_prima));
    return `<tr><td>${ICONS.alert} <b>${escaparHtml(m.materia_prima)}</b><div class="source-tag">${total} peça(s)</div></td>
      <td colspan="7">${falha ? '<b>Nesting não feito:</b> ' + escaparHtml(falha.mensagem) : (REAL.nestingCarregando ? 'Nesting em andamento…' : 'Nesting ainda não calculado')}</td></tr>`;

      ${prontos.length > 1 || prontos.some(r => quantidadeChapasNesting(r) > 1) ? '<button class="btn btn-soft btn-sm" data-act="nesting-baixar-todos">Baixar todos (SVG único)</button>' : ''}</div>
    ${((nesting && nesting.falhas) || []).length ? `<div class="warnbox" role="alert" style="margin-top:8px;"><span>${ICONS.alert}</span><div>O nesting de ${((nesting && nesting.falhas) || []).map(f => escaparHtml(f.materia_prima)).join(' e ')} <b>não foi feito</b>; ${prontos.length ? 'o de ' + prontos.map(r => escaparHtml(r.materia_prima)).join(' e ') + ' foi feito e pode ser baixado abaixo' : 'nenhum outro material ficou pronto'}. Veja o motivo e o que fazer na tabela.</div></div>` : ''}

/** Linhas de emenda sugeridas, com a posição e quanto material cada uma atravessa (quanto menor, melhor o ponto do corte). */
function htmlLinhasDeEmenda(fact){
  const linhas = (fact && fact.detalhes_corte && fact.detalhes_corte.coordenadas_linha_corte) || [];
  if(!linhas.length) return '';
  const itens = linhas.slice(0, 12).map((l, i) => {
    const vertical = Math.abs(Number(l.x1) - Number(l.x2)) < 1e-6;
    const posicao = vertical ? 'vertical em x = ' + fmt(l.x1, 0) + ' mm' : 'horizontal em y = ' + fmt(l.y1, 0) + ' mm';
    const material = l.materialCortadoMm != null ? ' · atravessa <b>' + fmt(l.materialCortadoMm, 0) + ' mm</b> de material' + (Number(l.materialCortadoMm) < 1 ? ' (passa num vão)' : '') : '';
    return '<li>Emenda ' + (i + 1) + ' (' + escaparHtml(l.materiaPrima || '') + '): ' + posicao + material + '</li>';
  }).join('');
  return '<div style="margin-top:8px;"><b>Linhas de emenda sugeridas</b> (a prévia abaixo mostra onde cada uma corta; o corte só é feito depois da aprovação):<ul style="margin:4px 0 0 18px;">' + itens + (linhas.length > 12 ? '<li>… e mais ' + (linhas.length - 12) + ' linha(s)</li>' : '') + '</ul></div>';
}

/* ---- Peso estimado do letreiro (só para o vendedor; nunca vai ao link do cliente) ----
   O cálculo é feito no servidor (POST /api/letra-caixa/peso); aqui só se montam as
   quantidades das linhas e se exibe o resultado. */
let pesoServidor = {chave:'', estado:'vazio', itens:[], erro:''};
function linhasParaPeso(){
  const g=computeGeomReal();
  const resultados=REAL.nestingMateriais?.length?REAL.nestingMateriais:(REAL.nesting?.materiais||[]);
  // Mão de obra de solda não tem peso: fica fora da lista (e do aviso de "item sem peso").
  return REAL.kit.filter(linha=>!linha.origemSoldaAuto).map(linha=>{
    const material=materialKitAtivo(linha);
    const nesting=resultados.find(item=>Number(item.id_materia_prima)===Number(material.matId));
    const areaLiquida=nesting&&Number.isFinite(Number(nesting.area_liquida_m2))?Number(nesting.area_liquida_m2)*(Number(linha.mult)||0):null;
    return {matId:Number(material.matId),nome:String(material.nome||'').slice(0,256),quantidade:Math.max(0,kitLineQty(linha,g)),unidade:String(material.unidade||''),formulaType:String(linha.formulaType||'fixo'),areaLiquidaM2:areaLiquida};
  }).filter(linha=>Number.isInteger(linha.matId)&&linha.matId>0&&Number.isFinite(linha.quantidade));
}
async function carregarPesoServidor(chave, linhas){
  pesoServidor={chave,estado:'carregando',itens:[],erro:''};
  try{
    const response=await fetch('/api/letra-caixa/peso',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({linhas})});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível calcular o peso.');
    if(pesoServidor.chave!==chave) return; // chegou resposta velha
    pesoServidor={chave,estado:'pronto',itens:Array.isArray(body.itens)?body.itens:[],erro:''};
  }catch(error){
    if(pesoServidor.chave!==chave) return;
    pesoServidor={chave,estado:'erro',itens:[],erro:error.message||'Falha ao calcular o peso.'};
  }
  render();
}
function blocoPesoReal(){
  const caixa=conteudo=>'<div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:14px;">'+conteudo+'</div>';
  const linhas=linhasParaPeso();
  const chave=JSON.stringify(linhas);
  if(pesoServidor.chave!==chave){carregarPesoServidor(chave,linhas);return caixa('<div class="empty-hint">Calculando o peso…</div>');}
  if(pesoServidor.estado==='carregando') return caixa('<div class="empty-hint">Calculando o peso…</div>');
  if(pesoServidor.estado==='erro') return caixa('<div class="warnbox" role="alert">'+ICONS.alert+' '+escaparHtml(pesoServidor.erro)+' O peso não foi calculado.</div>');
  const itens=linhas.map((linha,i)=>({nome:linha.nome,...(pesoServidor.itens[i]||{kg:null,como:'',motivo:'Sem resposta do servidor.'})}));
  (REAL.colorAnalysis?.resultados||[]).filter(item=>item.tipoSugestao==='imprimax'||item.tipoSugestao==='impresso')
    .forEach(item=>itens.push({nome:item.tipoSugestao==='impresso'?'Adesivo impresso':'Adesivo Imprimax',kg:null,como:'',motivo:'Adesivos ainda não têm peso cadastrado.'}));
  const pendentes=itens.filter(item=>item.kg==null).length;
  const totalKg=itens.reduce((soma,item)=>soma+(item.kg||0),0);
  const linhasHtml=itens.map(l=>l.kg!=null
    ?'<tr><td>'+escaparHtml(l.nome)+'</td><td style="font-size:12px;color:var(--text-dim);">'+escaparHtml(l.como)+'</td><td class="num">'+fmt(l.kg,3)+' kg</td></tr>'
    :'<tr style="background:rgba(245,158,11,.14);"><td><b>'+escaparHtml(l.nome)+'</b>'+(l.produto?' <span class="badge b-neutral">produto</span>':'')+'</td><td style="font-size:12px;">'+ICONS.alert+' '+escaparHtml(l.motivo)+'</td><td class="num"><span class="badge b-warn">sem peso</span></td></tr>').join('');
  return caixa('<div class="cardhead"><div><h3>Peso estimado do letreiro</h3><p>Uso interno do vendedor: não aparece no link do cliente. Calculado no servidor com a densidade das chapas e perfis e o peso específico das demais matérias-primas.</p></div>'
    +'<span class="badge '+(pendentes?'b-warn':'b-ok')+'">'+(pendentes?pendentes+' item(ns) sem peso':'Todos com peso calculado')+'</span></div>'
    +'<div class="tablewrap"><table><thead><tr><th>Item</th><th>Cálculo</th><th>Peso</th></tr></thead><tbody>'+linhasHtml
    +'<tr><td colspan="2"><b>Peso total estimado do letreiro</b>'+(pendentes?'<div class="role-note">Soma apenas os itens com peso calculado; os destacados em amarelo ficaram de fora.</div>':'')+'</td><td class="num"><b>'+fmt(totalKg,3)+' kg</b></td></tr>'
    +'</tbody></table></div>');
}

function kitKey(produtoId, modeloId){ return produtoId+'_'+modeloId; }
function skuProduto(produtoId){ return 'SKU-'+String(produtoId??'').trim().padStart(6,'0'); }
function skuModelo(produtoId, modeloId){ return `${skuProduto(produtoId)}-M${String(modeloId??'').trim().padStart(3,'0')}`; }
function skuModeloPorKey(key){ const [produtoId,modeloId]=String(key||'').split('_'); return skuModelo(produtoId,modeloId); }
function nomeModeloPorKey(key){
  const kit=adminState.kits[key];
  if(kit && kit.nomeCompleto) return kit.nomeCompleto;
  const [produtoId,modeloId]=String(key||'').split('_').map(Number);
  const produto=catalog.produtos.find(item=>item.id===produtoId);
  const modelo=produto && produto.modelos.find(item=>item.id===modeloId);
  return produto && modelo ? `${produto.nome} — ${modelo.nome}` : String(key||'Modelo sem nome');
}

/** Lista de Pantones de referência (guia fornecido pela Radra), carregada uma vez do servidor. */
function carregarPantoneReferencia(){
  if(pantoneReferencia) return Promise.resolve(pantoneReferencia);
  if(!pantoneReferenciaPromise){
    pantoneReferenciaPromise=fetch('/api/letra-caixa/cores/pantone',{credentials:'same-origin'})
      .then(response=>response.ok?response.json():Promise.reject(new Error('Não foi possível carregar a tabela Pantone.')))
      .then(body=>{pantoneReferencia=Array.isArray(body.pantone)?body.pantone:[];if(state.tab==='admin'&&state.adminTab==='chapas')render();return pantoneReferencia;})
      .catch(error=>{pantoneReferenciaPromise=null;chapaPantoneErro=error.message||'Tabela Pantone indisponível.';return [];});
  }
  return pantoneReferenciaPromise;
}
function chavePantoneCliente(codigo){
  return String(codigo||'').toUpperCase().replace(/\s+/g,'');
}
function pantoneHexDe(codigo){
  const chave=chavePantoneCliente(codigo);
  if(!chave||!pantoneReferencia) return null;
  const achado=pantoneReferencia.find(item=>chavePantoneCliente(item.codigo)===chave)||pantoneReferencia.find(item=>chavePantoneCliente(item.codigo)==='PMS'+chave);
  return achado?achado.hex:null;
}
async function consultarReferenciasCor(hexes){
  const response=await fetch('/api/letra-caixa/cores/pantone/referencias',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({cores:hexes})});
  const body=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(body.error||'Não foi possível consultar o Pantone mais próximo.');
  return body.referencias||[];
}
function cmykParaHexCliente(c,m,y,k){
  const canal=(valor,preto)=>Math.round(255*(1-valor/100)*(1-preto/100)).toString(16).padStart(2,'0');
  return '#'+canal(c,k)+canal(m,k)+canal(y,k);
}
/** Anexa o Pantone de referência mais próximo e um CMYK aproximado a cada cor da análise (sem alterar o cálculo). */
async function anexarReferenciasPantone(color){
  const hexes=[...new Set((color.resultados||[]).map(item=>item.corHex).filter(Boolean))].slice(0,60);
  if(!hexes.length){color.referencias={};return;}
  try{
    const lista=await consultarReferenciasCor(hexes);
    color.referencias={};
    lista.forEach(item=>{if(item.valida) color.referencias[item.hex]=item;});
  }catch(error){color.referencias={};}
}

/** Papéis do campo "Papel na peça": a lista de Administração > Configurações, sempre com "Aro" (chapa metálica com o miolo cortado, que
 *  sustenta a face de acrílico nos letreiros frontlight). Se a lista salva ainda não tiver o Aro, ele entra logo depois de "Face". */
function papeisDePeca(){
  const lista=[...new Set(configGeral.papeisPeca)];
  if(!lista.includes('Aro')){ const i=lista.indexOf('Face'); lista.splice(i>=0?i+1:lista.length,0,'Aro'); }
  return lista;
}
/** Largura (mm) da faixa do Aro: o aro é a chapa metálica com o miolo cortado (só as bordas) que sustenta a face de acrílico. Quando o desenho
 *  não traz uma camada "Aro" própria, o servidor gera a faixa dessa largura a partir da face. Regras repetidas de shared/faixa-aro.ts. */
const LARGURA_FAIXA_ARO_PADRAO_MM=6, LARGURA_FAIXA_ARO_MIN_MM=1, LARGURA_FAIXA_ARO_MAX_MM=50;
/** A configurada em Administração > Configurações, ou 6 mm (padrão). */
function larguraFaixaAro(){
  const v=Number(configGeral.larguraFaixaAroMm);
  return Number.isFinite(v)&&v>=LARGURA_FAIXA_ARO_MIN_MM&&v<=LARGURA_FAIXA_ARO_MAX_MM?v:LARGURA_FAIXA_ARO_PADRAO_MM;
}
/** Só o papel "Aro" ganha a faixa automática: "Lateral", "Perfil" e "Contorno" também caem na camada física aro, mas não. */
function papelEhAro(papel){ return normalizeSearch(String(papel||'')).split(/[^a-z0-9]+/).filter(Boolean).includes('aro'); }

function normalizarTelefoneWhatsApp(valor){
  const digitos=String(valor||'').replace(/\D/g,'');
  if(digitos.length===10 || digitos.length===11) return '55'+digitos;
  if((digitos.length===12 || digitos.length===13) && digitos.startsWith('55')) return digitos;
  return '';
}

async function solicitarSugestaoPrecoReal(){
  if(REAL.precoIACarregando||REAL.precoAprovacaoCarregando) return;
  REAL.precoSugestao=null;
  REAL.precoAprovacao=null;
  REAL.precoAprovadoFinal=null;
  REAL.precoIAErro='';
  REAL.precoIACarregando=true;
  render();
  try{
    const response=await fetch('/api/letra-caixa/precos/sugerir',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sourceId:REAL.id,snapshot:snapshotCotacaoReal()}),
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível analisar o preço.');

  }
}

async function aprovarPrecoReal(origem){
  if(REAL.precoIACarregando||REAL.precoAprovacaoCarregando) return;
  const pendenciasCores=resumoCustoCoresReal().pendencias;
  if(pendenciasCores.length){REAL.precoIAErro='Atualize os custos de vinil, impressão e laminação pendentes antes de aprovar o preço.';render();return;}
  const precoAprovado=origem==='gpt'?Number(REAL.precoSugestao?.precoSugerido):Number(computeOrcamentoReal().precoCalculado);
  if(!Number.isFinite(precoAprovado)||precoAprovado<0){REAL.precoIAErro='O preço não é válido para aprovação.';render();return;}
  REAL.precoIAErro='';
  REAL.precoAprovacaoCarregando=true;
  render();
  try{
    const response=await fetch('/api/letra-caixa/precos/aprovar',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sourceId:REAL.id,
        snapshot:snapshotCotacaoReal(),
        origem,
        precoAprovado,
        ticket:origem==='gpt'?REAL.precoSugestao?.ticket??null:null,
      }),
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível aprovar o preço.');
    REAL.precoAprovacao=body;
    REAL.precoAprovadoFinal=body.precoAprovado;
    REAL.precoAprovacao.localBaseKey=chaveBasePrecoReal();
  }catch(error){
    REAL.precoIAErro=error.message||'Não foi possível aprovar o preço.';
  }finally{
    REAL.precoAprovacaoCarregando=false;
    render();
  }
}

async function concluirOrcamentoEabrirCotacao(){
  if(resumoCustoCoresReal().pendencias.length){alert('Há custos de vinil/ impressão/ laminação pendentes. Atualize o cadastro por m² e refaça a análise de cores antes de emitir.');return;}
  if(cotacaoEmCriacao) return;
  cotacaoEmCriacao=true;
  const janela = window.open('about:blank','_blank');
  if(janela) janela.opener = null;
  try{
    REAL.orcamentoStatus='enviado';
    const link = await criarCotacaoPublica();
    if(janela) janela.location.href=linkParaCliente()||link;
    state.tab='admin';
    state.adminTab='propostas';
    render();
  }catch(error){
    if(janela) janela.close();
    alert(error.message || 'Não foi possível concluir o orçamento.');
    render();
  }finally{
    cotacaoEmCriacao=false;
  }
}

function textoEstadoSalvamentoKit(key){
  const estado=kitSaveState[key];
  if(estado?.status==='pendente') return 'Alteração pendente de salvamento…';
  if(estado?.status==='salvando') return 'Salvando no banco compartilhado…';
  if(estado?.status==='salvo') return 'Alterações salvas no banco compartilhado.';
  if(estado?.status==='erro') return `Falha ao salvar: ${estado.erro}`;
  if(kitsCarregando) return 'Carregando os cadastros salvos…';
  if(kitsApiDisponivel) return 'As alterações são salvas no banco compartilhado.';
  return kitsApiErro ? `Banco indisponível: ${kitsApiErro}` : 'Banco compartilhado indisponível.';
}

async function carregarKitsServidor(){
  kitsCarregando=true;
  kitsApiErro='';
  try{
    const response=await fetch('/api/letra-caixa/kits',{credentials:'same-origin',cache:'no-store'});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível carregar os cadastros de produtos.');
    const kits={};
    (Array.isArray(body.kits)?body.kits:[]).forEach(item=>{
      const chave=String(item?.chave||'');
      if(/^\d+_\d+$/.test(chave)&&item.kit&&typeof item.kit==='object'&&!Array.isArray(item.kit)) kits[chave]=item.kit;
    });
    adminState.kits=kits;
    kitsApiDisponivel=true;
  }catch(error){
    kitsApiDisponivel=false;
    kitsApiErro=String(error&&error.message||'Não foi possível acessar o banco compartilhado.');
  }finally{
    kitsCarregando=false;
    render();
  }
}

/** Traz do MubiSys a composição comum do modelo + a de cada variação ativa para o kit do Radrasys.
 *  Linhas manuais (sem origemMubiSys) só são mantidas com substituir=false; kits com linhas manuais
 *  são pulados na importação em massa para não duplicar custo. */
function importarComposicaoMubiSysNoKit(produto, modelo, {substituir=false}={}){
  const key=kitKey(produto.id,modelo.id);
  const importada=composicaoMubiSysDoModelo(modelo,variacoesAtivasDoModelo(modelo).map(v=>v.id));
  if(!importada) return {status:'sem-composicao'};
  if(importada.erro) return {status:'erro',erro:importada.erro};
  const existente=adminState.kits[key];
  const manuais=(existente?.linhas||[]).filter(l=>!l.origemMubiSys);
  if(manuais.length&&!substituir) return {status:'pulado'};
  const kit=existente||(adminState.kits[key]={linhas:[],precificacao:null,descricaoProduto:'',prazoDiasUteis:null,kitProdutos:[],fotoUrl:null,fotoAssetId:null,categoria:null,subcategoria:null,tipoProduto:null,nomeCompleto:`${produto.nome} — ${modelo.nome}`});
  kit.linhas=importada.linhas.map(l=>({...l,variantes:[]}));
  return {status:'importado',key,linhas:kit.linhas.length};
}

async function importarComposicoesMubiSysEmMassa(){
  if(catalog.importando||!catalog.mubisysWebConectado) return;
  catalog.importando=true;catalog.importMsg='Importando…';render();
  const total={importado:0,pulado:0,'sem-composicao':0,erro:0,falhaSalvar:0};
  for(const produto of catalog.produtos){
    if(adminState.produtosExcluidos.has(produto.id)) continue;
    for(const modelo of produto.modelos){
      const r=importarComposicaoMubiSysNoKit(produto,modelo);
      total[r.status]++;
      if(r.status==='importado'&&!(await salvarKitImediato(r.key))) total.falhaSalvar++;
    }
  }
  catalog.importando=false;
  catalog.importMsg=`${total.importado} modelo(s) importado(s); ${total.pulado} pulado(s) por já terem composição manual; ${total['sem-composicao']} sem composição no MubiSys${total.erro?`; ${total.erro} com matéria-prima fora do catálogo`:''}${total.falhaSalvar?`; ${total.falhaSalvar} não salvaram`:''}.`;
  render();
}

async function salvarKitImediato(key){
  clearTimeout(_kitSaveTimers[key]);
  delete _kitSaveTimers[key];
  const kit=adminState.kits[key];
  if(!kit||!/^\d+_\d+$/.test(key)) return false;
  const payload=JSON.stringify({kit});
  const gravacao=(_kitSaveChains[key]||Promise.resolve()).catch(()=>{}).then(async()=>{
    atualizarEstadoSalvamentoKit(key,'salvando');
    const response=await fetch(`/api/letra-caixa/kits/${encodeURIComponent(key)}`,{
      method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:payload,
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível salvar o cadastro do produto.');
    kitsApiDisponivel=true;
    kitsApiErro='';
    atualizarEstadoSalvamentoKit(key,'salvo');
    return true;
  }).catch(error=>{
    const mensagem=String(error&&error.message||'Não foi possível salvar o cadastro do produto.');
    kitsApiErro=mensagem;
    atualizarEstadoSalvamentoKit(key,'erro',mensagem);
    return false;
  });
  _kitSaveChains[key]=gravacao;
  return gravacao;
}

/** Salva alterações rapidamente após o vendedor parar de editar um campo. */
function salvarKit(key){
  if(!key||!adminState.kits[key]) return Promise.resolve(false);
  clearTimeout(_kitSaveTimers[key]);
  atualizarEstadoSalvamentoKit(key,'pendente');
  return new Promise(resolve=>{
    _kitSaveTimers[key]=setTimeout(()=>{
      delete _kitSaveTimers[key];
      salvarKitImediato(key).then(resolve);
    },500);
  });
}

/** Carrega a configuração global do endpoint do Radrasys. */
async function carregarConfigGeralServidor(){
  configGeralEstado='carregando';
  configGeralErro='';
  try{
    const response=await fetch('/api/letra-caixa/configuracoes',{credentials:'same-origin',cache:'no-store'});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível carregar as configurações compartilhadas.');
    const data=body.config||{};
    if(typeof data.custoFixoPct==='number') configGeral.custoFixoPct=data.custoFixoPct;
    if(Array.isArray(data.vendedores)) configGeral.vendedores=data.vendedores;
    if(data.whatsappVendedores && typeof data.whatsappVendedores==='object' && !Array.isArray(data.whatsappVendedores)) configGeral.whatsappVendedores=data.whatsappVendedores;
    if(data.formasPagamento && typeof data.formasPagamento==='object'){
      for(const forma of ['cartao','boleto','ted']) if(typeof data.formasPagamento[forma]==='boolean') configGeral.formasPagamento[forma]=data.formasPagamento[forma];
    }
    if(Array.isArray(data.jurosCartaoPct)) configGeral.jurosCartaoPct=Array.from({length:6},(_,i)=>{
      const valor=Number(data.jurosCartaoPct[i]);
      return Number.isFinite(valor)?Math.min(100,Math.max(0,valor)):0;
    });
    if(Array.isArray(data.papeisPeca)) configGeral.papeisPeca=data.papeisPeca;
    if(typeof data.regrasLeituraArte==='string') configGeral.regrasLeituraArte=data.regrasLeituraArte;
    if(typeof data.larguraFaixaAroMm==='number' && data.larguraFaixaAroMm>=LARGURA_FAIXA_ARO_MIN_MM && data.larguraFaixaAroMm<=LARGURA_FAIXA_ARO_MAX_MM) configGeral.larguraFaixaAroMm=data.larguraFaixaAroMm;
    configGeral.papeisPeca=papeisDePeca();
    configGeralCarregada=true;
    configGeralEstado='pronto';
  }catch(error){
    configGeralCarregada=false;
    configGeralEstado='erro';
    configGeralErro=String(error && error.message || 'Não foi possível carregar as configurações compartilhadas.');
  }finally{
    render();
  }
}

/** Grava (debounced) a configuração geral no banco Postgres do Radrasys. */
function salvarConfigGeral(){
  if(!configGeralCarregada) return;
  clearTimeout(_configSaveTimer);
  const revisao=++_configSaveRevision;
  configGeralEstado='salvando';
  configGeralErro='';
  _configSaveTimer = setTimeout(()=>{
    const config=JSON.parse(JSON.stringify(configGeral));
    _configSaveChain=_configSaveChain.catch(()=>{}).then(async()=>{
      const response=await fetch('/api/letra-caixa/configuracoes',{
        method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({config}),
      });
      const body=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(body.error||'Não foi possível salvar as configurações.');
    });
    _configSaveChain.then(()=>{
      if(revisao!==_configSaveRevision) return;
      configGeralEstado='salvo';
      configGeralErro='';
      renderPreservingFocus();
    }).catch(error=>{
      if(revisao!==_configSaveRevision) return;
      configGeralEstado='erro';
      configGeralErro=String(error && error.message || 'Não foi possível salvar as configurações.');
      renderPreservingFocus();
    });
  }, 400);
}

/** Grava a proposta confirmada pelo vendedor na aba "Propostas realizadas" —
 *  chamado ao salvar/avançar status no passo 7 (Orçamento). Guarda um
 *  snapshot dos dados que importam pra gestão (não precisa reabrir o fluxo
 *  inteiro pra saber cliente/vendedor/valor/status). */
function salvarPropostaReal(){
  if(!dbApi || !REAL.id) return;
  const g = computeGeomReal();
  const o = computeOrcamentoReal();
  const kitPronto = REAL.produtoId && REAL.modeloId ? adminState.kits[kitKey(REAL.produtoId, REAL.modeloId)] : null;
  const doc = {
    grupoId: REAL.grupoId || REAL.id, versao: REAL.versao||1,
    dataEmissao: REAL.dataEmissao, validadeDias: REAL.validadeDias,
    modalidadeFrete: REAL.modalidadeFrete, metodoPagamento: REAL.metodoPagamento,
    clienteCnpj: REAL.cliente.cnpj, clienteRazao: REAL.cliente.razao,
    clienteFantasia: REAL.cliente.fantasia, clienteEndereco: REAL.cliente.endereco,
    clienteEmail: REAL.cliente.email, clienteWhatsapp: REAL.cliente.whatsapp,
    vendedor: REAL.vendedor||'', modeloNome: REAL.modeloNome||'',
    prazoDiasUteis: kitPronto ? kitPronto.prazoDiasUteis??null : null,
    custoDireto: o.custoDireto, precoFinal: o.precoFinal, margin: o.margin,
    status: REAL.orcamentoStatus,
    reacaoCliente: REAL.reacaoCliente || null,
    areaM2: g.areaM2, areaGeralM2: g.areaGeralM2,
    criadoEm: propostasReais[REAL.id]?.criadoEm || new Date().toISOString(),
    atualizadoEm: new Date().toISOString(),
  };
  propostasReais[REAL.id] = doc;
  dbApi.doc('propostasReais/'+REAL.id).set(doc).catch(()=>{});
}

/** Cria uma nova versão da mesma proposta (mesmo cliente/vendedor/grupo),
 *  pra apresentar ao cliente uma composição/produto diferente sem perder a
 *  versão anterior — pedido do usuário 28/09/2026. Salva a versão atual
 *  antes de trocar, senão ela fica só em memória e some do admin. */
function criarNovaVersao(){
  salvarPropostaReal();
  const grupoId = REAL.grupoId || REAL.id;
  const proximaVersao = (REAL.versao||1) + 1;
  const cliente = { ...REAL.cliente };
  const vendedor = REAL.vendedor;
  const modalidadeFrete = REAL.modalidadeFrete;
  const metodoPagamento = REAL.metodoPagamento;
  const validadeDias = REAL.validadeDias;
  REAL = novaProposta();
  REAL.grupoId = grupoId;
  REAL.versao = proximaVersao;
  REAL.cliente = cliente;
  REAL.vendedor = vendedor;
  REAL.modalidadeFrete = modalidadeFrete;
  REAL.metodoPagamento = metodoPagamento;
  REAL.validadeDias = validadeDias;
  state.step = 1;
  render();
}
