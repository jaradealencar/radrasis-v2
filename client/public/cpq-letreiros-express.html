async function gerarRedesenhoComGPT(){
  if(!REAL.imgOriginal || REAL.gerandoRedesenho) return;
  if(REAL.escopoRedesenho==='elementos_selecionados' && !REAL.elementosSelecionados.trim()){
    REAL.uploadError='Descreva os elementos que o GPT deve reconstruir.';
    render();
    return;
  }

  const requestId=++redrawRequestId;
  invalidarRastreamento();
  REAL.redesenhoToken=null;
  REAL.gerandoRedesenho=true;
  REAL.uploadError=null;
  render();
  try{
    const extras=Array.isArray(REAL.imgsReferencia)?REAL.imgsReferencia:[];
    let response;
    if(extras.length){
      // Foto principal + referências adicionais da mesma logo, em JSON (cada imagem reduzida para o corpo caber nos 4,5 MB da Vercel).
      const principal=await comprimirImagemAte(REAL.imgOriginal,1_300_000,1600);
      const referencias=[];
      for(const ref of extras) referencias.push({...await comprimirImagemAte(ref.dataUrl,800_000,1400),tipo:ref.tipo});
      response=await fetch('/api/letra-caixa/redesenho-referencias',{
        method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({escopo:REAL.escopoRedesenho,...(REAL.escopoRedesenho==='elementos_selecionados'?{elementosSelecionados:REAL.elementosSelecionados.trim()}:{}),principal,referencias}),
      });
    }else{
      const imagem=await comprimirReferenciaGPT(REAL.imgOriginal);
      const query=new URLSearchParams({escopo:REAL.escopoRedesenho});
      if(REAL.escopoRedesenho==='elementos_selecionados') query.set('elementosSelecionados',REAL.elementosSelecionados.trim());
      response=await fetch('/api/letra-caixa/redesenho?'+query.toString(),{
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':imagem.type||'image/jpeg'},
        body:imagem
      });
    }
    if(!response.ok){
      const body=await response.json().catch(()=>({}));
      throw new Error(body.error||'O GPT nao conseguiu gerar a reconstrução.');
    }
    const redesenhoToken=response.headers.get('X-Redesenho-Token');
    if(!redesenhoToken) throw new Error('O servidor não confirmou o pré-processamento por IA. Gere a reconstrução novamente.');
    const resultado=await response.blob();
    if(requestId!==redrawRequestId) return;
    REAL.imgReconstructed=await blobParaDataUrl(resultado);
    REAL.imagemRedesenhadaUrl=null;
    REAL.redesenhoToken=redesenhoToken;
    REAL.imgPreview=null;
    REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.sourceKind='raster';
    REAL.approvals.redesenho=false; REAL.approvals.vetorizacao=false; REAL.approvals.escala=false;
    REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
  }catch(error){
    if(requestId===redrawRequestId){
      REAL.uploadError=error instanceof Error?error.message:'Falha ao gerar a reconstrução.';
    }
  }finally{
    if(requestId===redrawRequestId){ REAL.gerandoRedesenho=false; render(); }
  }
}

/* ---------- PRODUTIVIDADE DE SOLDA AUTOMÁTICA (pedido de 06/10/2026) ----------
 * O vendedor escolhe só o tipo de fixação (etapa 1). Na Ficha técnica o servidor (POST /api/letra-caixa/solda/sugerir) escolhe as
 * "Produtividade Solda …" de cada faixa de altura e elas entram na composição como linhas automáticas, quantificadas pelo perímetro
 * total (externo + vazados) dos elementos da faixa. Cada troca do vendedor vira uma correção, que o gestor transforma em regra
 * (Administração > Produtividades de solda). Os tipos e o limite repetem shared/produtividade-solda.ts (o HTML não importa
 * módulos); o servidor valida de novo. */
const SOLDA_CATEGORIA='Letreiros';
const SOLDA_MAX_FIXACOES=3;
const SOLDA_TIPOS_FIXACAO=[['barra_roscada','Barra roscada'],['patinha_led','Patinha para LED'],['chapinha_dupla_face','Chapinha dupla-face'],['orelhinha','Orelhinha'],['sem_fixacao','Sem fixação']];
const SOLDA_MATERIAIS=[['galvanizado','Galvanizado'],['inox','Inox'],['latao','Latão'],['aluminio','Alumínio'],['acrilico','Acrílico']];
const SOLDA_FAIXAS={ate_11cm:{rotulo:'≤ 11 cm',formula:'soldaPerimAte11'},acima_11cm:{rotulo:'> 11 cm',formula:'soldaPerimAcima11'}};
const SOLDA_CONFIANCA={alta:['Confiança alta','b-ok'],media:['Confiança média','b-accent'],baixa:['Confiança baixa — confira','b-warn'],nenhuma:['Sem produtividade','b-bad']};
const SOLDA_ORIGEM_TEXTO={regra:'regra treinada',heuristica:'pontuação automática',manual:'escolha do vendedor'};

function novoEstadoSolda(){
  return {chave:'', estado:'vazio', erro:'', resposta:null, opcoes:{}, escolhas:{}, dispensadas:{}, notas:{}, enviadas:new Set(), materialManual:null};
}
function soldaKitAtual(){ return REAL.produtoId&&REAL.modeloId ? (adminState.kits[kitKey(REAL.produtoId,REAL.modeloId)]||null) : null; }
function soldaFixacaoObrigatoria(){ const kit=soldaKitAtual(); return !!kit&&kit.categoria===SOLDA_CATEGORIA; }
/** A produtividade automática só entra em jogo para Letreiros ou quando o vendedor escolheu alguma fixação. */
function soldaAtiva(){ return (REAL.tiposFixacao||[]).length>0 || soldaFixacaoObrigatoria(); }
function soldaEhProdutividadeNome(nome){ const n=normalizeSearch(String(nome||'')).trim(); return n.includes('produtividade')&&!n.startsWith('produtividade geral'); }
/** Mesmas regras de shared/produtividade-solda.ts: até 3 tipos e "sem fixação" não combina com os outros. */
function alternarFixacaoSolda(selecionados, tipo){
  if(selecionados.includes(tipo)) return selecionados.filter(t=>t!==tipo);
  if(tipo==='sem_fixacao') return ['sem_fixacao'];
  const outros=selecionados.filter(t=>t!=='sem_fixacao');
  if(outros.length>=SOLDA_MAX_FIXACOES) return [...selecionados];
  return SOLDA_TIPOS_FIXACAO.map(([k])=>k).filter(k=>k===tipo||outros.includes(k));
}
function rotuloFixacaoSolda(tipos){ return (tipos||[]).map(t=>(SOLDA_TIPOS_FIXACAO.find(([k])=>k===t)||[t,t])[1]).join(' + '); }

/** Seletor do tipo de fixação (etapa 1). Obrigatório só em produtos da categoria Letreiros. */
function htmlFixacaoSolda(){
  const sel=REAL.tiposFixacao||[];
  const obrigatoria=soldaFixacaoObrigatoria();
  const cheio=!sel.includes('sem_fixacao')&&sel.length>=SOLDA_MAX_FIXACOES;
  return `<div style="max-width:680px;margin-top:12px;" data-teste="fixacao-solda"><div class="field">Tipo de fixação${obrigatoria?' (obrigatório)':''} — escolha até ${SOLDA_MAX_FIXACOES}
    <div style="display:grid;gap:6px;margin-top:7px;">
      ${SOLDA_TIPOS_FIXACAO.map(([k,rotulo])=>{
        const marcado=sel.includes(k);
        const bloqueado=!marcado&&k!=='sem_fixacao'&&cheio;
        return `<label style="display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;${bloqueado?'opacity:.5;':''}"><input type="checkbox" data-act="real-fixacao-solda" data-val="${k}" ${marcado?'checked':''} ${bloqueado?'disabled':''}><span>${rotulo}</span></label>`;
      }).join('')}
    </div>
  </div><div style="font-size:11px;color:${obrigatoria&&!sel.length?'var(--warn)':'var(--text-faint)'};margin-top:4px;">${obrigatoria&&!sel.length?'Escolha a fixação para avançar. ':''}Com o material do produto e as medidas da Ficha técnica, o sistema escolhe a produtividade de solda e a inclui no orçamento. "Sem fixação" não combina com os outros tipos.</div></div>`;
}

function soldaTituloProduto(){
  const kit=soldaKitAtual();
  return [(kit&&kit.nomeCompleto)||REAL.modeloNome||'', ...(REAL.variacaoModeloNomes||[])].filter(Boolean).join(' ').slice(0,500);
}
/** Dados enviados ao servidor; `null` enquanto não há geometria com escala. A chave da sugestão é o próprio pedido. */
function soldaPedido(){
  if(!soldaAtiva()||!REAL.geomRaw) return null;
  const g=computeGeomReal();
  if(!(g.scaleFactor>0)) return null;
  const p=perimetrosPorAltura(g), arred=n=>Math.round(n*10000)/10000;
  return {
    chaveKit:REAL.produtoId&&REAL.modeloId?kitKey(REAL.produtoId,REAL.modeloId):null,
    titulo:soldaTituloProduto(),
    nomesComposicao:(REAL.kit||[]).filter(l=>!l.origemSoldaAuto).map(l=>String(materialKitAtivo(l).nome||'').slice(0,256)).slice(0,300),
    tiposFixacao:[...(REAL.tiposFixacao||[])],
    ...(REAL.solda.materialManual?{materialManual:REAL.solda.materialManual}:{}),
    faixas:[{faixa:'ate_11cm',perimetroM:arred(p.ateM),elementos:p.ateElementos},{faixa:'acima_11cm',perimetroM:arred(p.acimaM),elementos:p.acimaElementos}],
  };
}

/** Pede a sugestão quando o pedido mudou (mesmo padrão do peso: chamada dentro do render, sem repetir a mesma chave). */
async function garantirSugestaoSolda(forcar=false){
  const pedido=soldaPedido(), solda=REAL.solda;
  if(!pedido){ if(solda.chave){ solda.chave=''; solda.estado='vazio'; solda.resposta=null; } return; }
  const chave=JSON.stringify(pedido);
  if(!forcar&&solda.chave===chave) return;
  solda.chave=chave; solda.estado='carregando'; solda.erro='';
  try{
    const response=await fetch('/api/letra-caixa/solda/sugerir',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(pedido)});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível escolher as produtividades de solda.');
    if(solda!==REAL.solda||solda.chave!==chave) return; // outra proposta ou pedido mais novo
    solda.resposta=body; solda.estado='pronto';
    (body.faixas||[]).forEach(f=>[f.escolhida,...(f.alternativas||[])].filter(Boolean).forEach(o=>{ solda.opcoes[o.id]=o; }));
  }catch(error){
    if(solda!==REAL.solda||solda.chave!==chave) return;
    solda.estado='erro'; solda.erro=error.message||'Falha ao consultar as produtividades de solda.'; solda.resposta=null;
  }
  if(REAL.approvals.escala) sincronizarSoldaNoKit();
  render();
}
function soldaReiniciar(){
  REAL.solda={...novoEstadoSolda(), materialManual:REAL.solda.materialManual};
  REAL.kit=(REAL.kit||[]).filter(l=>!l.origemSoldaAuto);
  REAL.approvals.kit=false;
}
function soldaFaixaResposta(faixa){ return ((REAL.solda.resposta||{}).faixas||[]).find(f=>f.faixa===faixa)||null; }
/** Produtividade valendo para a faixa: a que o vendedor trocou ou, sem troca, a sugerida. */
function soldaOpcaoEscolhida(f){
  const id=REAL.solda.escolhas[f.faixa];
  return (id!=null&&REAL.solda.opcoes[id])||f.escolhida||null;
}
/** Recria as linhas automáticas da composição a partir da sugestão e das trocas do vendedor (não mexe no nesting). */
function sincronizarSoldaNoKit(){
  REAL.kit=(REAL.kit||[]).filter(l=>!l.origemSoldaAuto);
  const solda=REAL.solda;
  if(!soldaAtiva()||solda.estado!=='pronto'||!solda.resposta||solda.chave!==JSON.stringify(soldaPedido())) return;
  for(const f of solda.resposta.faixas||[]){
    if(!f.necessaria||solda.dispensadas[f.faixa]) continue;
    const o=soldaOpcaoEscolhida(f);
    if(!o) continue;
    REAL.kit.push({matId:o.id,nome:o.nome,unidade:o.unidade,custo:o.valor,atualizado:o.atualizado,status:o.status,papel:`Mão de obra · solda ${SOLDA_FAIXAS[f.faixa].rotulo}`,formulaType:SOLDA_FAIXAS[f.faixa].formula,mult:1,variantes:[],origemSoldaAuto:true,soldaFaixa:f.faixa,soldaConfianca:f.confianca,soldaOrigem:f.origem});
  }
}
/** As duas fórmulas de solda viram "fixo" no snapshot, com a quantidade (perímetro) já calculada: o servidor e a importação em
 *  Propostas continuam validando `quantidade = multiplicador` sem conhecer a fórmula nova. */
function formulaParaServidor(linha, quantidade){
  if(linha.formulaType==='soldaPerimAte11'||linha.formulaType==='soldaPerimAcima11') return {formulaType:'fixo',multiplicador:Math.max(0,Number.isFinite(quantidade)?quantidade:0)};
  return {formulaType:String(linha.formulaType||'fixo'),multiplicador:Math.max(0,Number(linha.mult)||0)};
}
/** Resumo da escolha para o snapshot da cotação (rastreabilidade: o que foi sugerido, por quem e com qual confiança). */
function soldaSnapshot(){
  const r=REAL.solda.resposta;
  if(!soldaAtiva()||!r) return undefined;
  return {
    material:r.material&&r.material.usado?{usado:r.material.usado,origem:r.material.manual?'manual':(r.material.origem||null)}:null,
    faixas:(r.faixas||[]).filter(f=>f.necessaria).map(f=>{
      const o=REAL.solda.dispensadas[f.faixa]?null:soldaOpcaoEscolhida(f);
      const manual=!!o&&!!f.escolhida&&o.id!==f.escolhida.id;
      return {faixa:f.faixa,elementos:f.elementos,perimetroM:f.perimetroM,produtividadeId:o?o.id:null,produtividadeNome:o?String(o.nome).slice(0,256):null,origem:o?(manual?'manual':f.origem):'nenhuma',confianca:f.confianca,regraId:manual?null:(f.regraId||null)};
    }),
  };
}
/** Troca do vendedor ≠ sugestão do sistema: envia ao servidor como correção (uma vez por combinação) para o gestor treinar as regras. */
async function registrarCorrecoesSolda(){
  const solda=REAL.solda, r=solda.resposta;
  if(!soldaAtiva()||!r) return;
  for(const f of r.faixas||[]){
    if(!f.necessaria||solda.dispensadas[f.faixa]||!f.escolhida) continue;
    const o=soldaOpcaoEscolhida(f);
    if(!o||o.id===f.escolhida.id) continue;
    const marca=[f.faixa,f.escolhida.id,o.id,(REAL.tiposFixacao||[]).join(',')].join('|');
    if(solda.enviadas.has(marca)) continue;
    solda.enviadas.add(marca);
    try{
      const response=await fetch('/api/letra-caixa/solda/correcoes',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        cotacaoRef:REAL.id?String(REAL.id).slice(0,80):null, faixa:f.faixa,
        contexto:{chaveKit:REAL.produtoId&&REAL.modeloId?kitKey(REAL.produtoId,REAL.modeloId):null,titulo:soldaTituloProduto(),subcategoria:r.subcategoria||null,tipoProduto:r.tipoProduto||null,material:(r.material&&r.material.usado)||null,tiposFixacao:[...(REAL.tiposFixacao||[])],perimetroM:f.perimetroM,elementos:f.elementos},
        sugeridaId:f.escolhida.id, escolhidaId:o.id, nota:(solda.notas[f.faixa]||'').trim().slice(0,500)||null,
      })});
      if(!response.ok) solda.enviadas.delete(marca);
    }catch(e){ solda.enviadas.delete(marca); }
  }
}

function soldaAvisos(){
  if(!soldaAtiva()) return [];
  const avisos=[], s=REAL.solda, r=s.resposta;
  if(!(REAL.tiposFixacao||[]).length) avisos.push('Nenhum tipo de fixação foi escolhido na etapa 1: a produtividade de solda não foi incluída no orçamento.');
  if(s.estado==='erro') avisos.push(`${s.erro} A produtividade de solda não foi incluída.`);
  if(r){
    if(!(r.material&&r.material.usado)) avisos.push('Não consegui identificar o material do letreiro (subcategoria, título e composição não o indicam): escolha-o na Ficha técnica para a escolha considerar o material.');
    (r.faixas||[]).filter(f=>f.necessaria).forEach(f=>{
      const rotulo=SOLDA_FAIXAS[f.faixa].rotulo, o=soldaOpcaoEscolhida(f);
      if(s.dispensadas[f.faixa]) avisos.push(`A produtividade dos elementos ${rotulo} foi removida da composição: ${fmt(f.perimetroM,2)} m de solda ficam sem custo.`);
      else if(!o) avisos.push(`Sem produtividade de solda para os elementos ${rotulo} (${fmt(f.perimetroM,2)} m de perímetro): esse trabalho está sem custo no orçamento. ${(f.avisos||[]).find(a=>a.startsWith('Nenhuma'))||'Classifique as produtividades em Produtos > Matérias-primas ou escolha uma na lista.'}`);
      else if(f.confianca==='baixa'&&s.escolhas[f.faixa]==null) avisos.push(`Confira a produtividade dos elementos ${rotulo}: há mais de uma igualmente provável.`);
      if(o&&/hora|quadrad|m²/i.test(String(o.unidade||''))) avisos.push(`A unidade de "${o.nome}" é ${o.unidade}, mas a quantidade é o perímetro em metros: confira o cadastro no MubiSys.`);
    });
  }
  const duplicadas=(REAL.kit||[]).filter(l=>!l.origemSoldaAuto&&soldaEhProdutividadeNome(materialKitAtivo(l).nome));
  if(duplicadas.length) avisos.push(`A composição do produto já traz produtividade de solda (${duplicadas.map(l=>materialKitAtivo(l).nome).join('; ')}): confira para não cobrar duas vezes.`);
  return avisos;
}
function htmlAvisosSolda(){
  if(!soldaAtiva()) return '';
  garantirSugestaoSolda();
  const avisos=soldaAvisos();
  if(!avisos.length) return '';
  return `<div class="warnbox" role="alert" style="margin:12px 0;" data-teste="avisos-solda"><span>${ICONS.alert}</span><div><b>Produtividade de solda</b><ul style="margin:6px 0 0 16px;">${avisos.map(a=>`<li>${escaparHtml(a)}</li>`).join('')}</ul></div></div>`;
}

/** Quadro da produtividade de solda: material, fixação e, por faixa de altura, a produtividade escolhida (com troca) e o custo. */
function painelSoldaProdutividade(){
  if(!soldaAtiva()) return '';
  garantirSugestaoSolda();
  const s=REAL.solda, r=s.resposta, tipos=REAL.tiposFixacao||[];
  const linhaFixacao=`<div class="kv"><span>Tipo de fixação</span><span>${tipos.length?escaparHtml(rotuloFixacaoSolda(tipos)):'<span class="badge b-warn">não escolhido</span>'} <button class="btn btn-ghost btn-sm" data-act="real-goto-step" data-val="1">Alterar na etapa 1</button></span></div>`;
  let corpo='';
  if(s.estado==='carregando'||(s.estado==='vazio'&&tipos.length)) corpo='<div class="empty-hint">Escolhendo as produtividades de solda…</div>';
  else if(s.estado==='erro') corpo=`<div class="warnbox" role="alert"><span>${ICONS.alert}</span><div>${escaparHtml(s.erro)} <button class="btn btn-soft btn-sm" data-act="real-solda-refazer">Tentar de novo</button></div></div>`;
  else if(r){
    const usado=r.material&&r.material.usado, origemMaterial=r.material&&r.material.manual?'escolhido por você':({subcategoria:'subcategoria do produto',tipo:'tipo do produto',titulo:'título do produto',composicao:'composição'}[r.material&&r.material.origem]||'');
    const linhaMaterial=`<div class="kv"><span>Material do letreiro</span><span>${usado?`${escaparHtml((SOLDA_MATERIAIS.find(([k])=>k===usado)||[usado,usado])[1])}${origemMaterial?` <span class="source-tag" style="display:inline;">(${origemMaterial})</span>`:''}`:'<span class="badge b-warn">não identificado</span>'}
      <select data-act="real-solda-material" style="font-size:11.5px;margin-left:6px;"><option value="">Detectar sozinho</option>${SOLDA_MATERIAIS.map(([k,rot])=>`<option value="${k}" ${s.materialManual===k?'selected':''}>${rot}</option>`).join('')}</select></span></div>`;
    const divergencias=((r.material&&r.material.divergencias)||[]).map(d=>`<div class="role-note">${ICONS.info} ${escaparHtml(d)}</div>`).join('');
    const necessarias=(r.faixas||[]).filter(f=>f.necessaria);
    const linhas=necessarias.map(f=>{
      const o=soldaOpcaoEscolhida(f), faixa=SOLDA_FAIXAS[f.faixa], dispensada=!!s.dispensadas[f.faixa];
      const opcoes=[f.escolhida,...(f.alternativas||[])].filter(Boolean);
      if(o&&!opcoes.some(x=>x.id===o.id)) opcoes.push(o);
      const trocou=!!o&&!!f.escolhida&&o.id!==f.escolhida.id;
      const [textoConfianca,classeConfianca]=SOLDA_CONFIANCA[trocou?'media':f.confianca]||SOLDA_CONFIANCA.nenhuma;
      const origem=trocou?'manual':f.origem;
      const motivos=o&&Array.isArray(o.motivos)&&o.motivos.length?`<details style="margin-top:4px;"><summary style="cursor:pointer;font-size:11px;color:var(--accent-ink);">Por que esta produtividade</summary><ul style="margin:4px 0 0 16px;font-size:11px;color:var(--text-dim);">${o.motivos.map(m=>`<li>${escaparHtml(m.texto)}${m.pontos?` <span class="mono">(${m.pontos>0?'+':''}${m.pontos})</span>`:''}</li>`).join('')}</ul></details>`:'';
      const select=opcoes.length?`<select data-act="real-solda-escolha" data-faixa="${f.faixa}" style="width:100%;max-width:420px;font-size:11.5px;">${opcoes.map(x=>`<option value="${x.id}" ${o&&x.id===o.id?'selected':''}>${f.escolhida&&x.id===f.escolhida.id?'★ ':''}${escaparHtml(x.nome)} · ${money(x.valor)}</option>`).join('')}</select>`:'<span class="badge b-bad">nenhuma produtividade serve</span>';
      const nota=trocou?`<input type="text" maxlength="500" placeholder="Por que trocou? (ajuda a treinar o sistema)" value="${escaparHtml(s.notas[f.faixa]||'')}" data-act="real-solda-nota" data-faixa="${f.faixa}" style="display:block;width:100%;max-width:420px;margin-top:6px;font-size:11.5px;">`:'';
      return `<tr>
        <td><span class="badge ${f.faixa==='ate_11cm'?'b-accent':'b-warn'}">${faixa.rotulo}</span></td>
        <td class="num">${f.elementos}</td>
        <td class="num">${fmt(f.perimetroM,2)} m</td>
        <td>${select}${nota}<div style="margin-top:5px;"><span class="badge ${classeConfianca}">${textoConfianca}</span> <span style="font-size:11px;color:var(--text-faint);">${o?escaparHtml(SOLDA_ORIGEM_TEXTO[origem]||''):''}</span></div>${motivos}${(f.avisos||[]).filter(a=>!a.startsWith('Nenhuma')).map(a=>`<div class="role-note">${ICONS.info} ${escaparHtml(a)}</div>`).join('')}</td>
        <td class="num">${o&&!dispensada?money(f.perimetroM*(Number(o.valor)||0)):'—'}${dispensada?`<div><button class="btn btn-ghost btn-sm" data-act="real-solda-incluir" data-faixa="${f.faixa}">Incluir de novo</button></div>`:''}</td>
      </tr>`;
    }).join('');
    corpo=`${linhaMaterial}${divergencias}
      ${necessarias.length?`<div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th>Faixa</th><th>Elementos</th><th>Perímetro</th><th>Produtividade</th><th>Custo</th></tr></thead><tbody>${linhas}</tbody></table></div>`:'<div class="empty-hint" style="margin-top:10px;">Nenhum elemento medido ainda: confirme a escala acima.</div>'}
      <div style="font-size:11px;color:var(--text-faint);margin-top:8px;">${r.lista==='relacionadas'?'Escolha entre as produtividades ligadas a este produto.':'Este produto não tem produtividades relacionadas: a escolha usa todo o cadastro.'} A quantidade é o perímetro total (contorno externo + vazados) dos elementos da faixa, em metros. Cada troca sua é registrada para o gestor treinar as regras.</div>`;
  }
  const avisos=soldaAvisos();
  return `<div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:14px;" data-teste="painel-solda">
    <div class="cardhead" style="margin-bottom:8px;"><div><h4 style="font-size:13px;">Produtividade de solda (automática)</h4></div>${s.estado==='pronto'?'<button class="btn btn-ghost btn-sm" data-act="real-solda-refazer">Refazer sugestão</button>':''}</div>
    ${linhaFixacao}${corpo}
    ${avisos.length?`<div class="warnbox" role="alert" style="margin-top:10px;"><span>${ICONS.alert}</span><div><ul style="margin:0 0 0 16px;">${avisos.map(a=>`<li>${escaparHtml(a)}</li>`).join('')}</ul></div></div>`:''}
  </div>`;
}

/** Contagem por faixa de altura, na escala atual da ficha técnica: `{ate, acima}` ou `null` sem geometria/escala. */
function contagemElementosPorAltura(g=computeGeomReal()){
  const c=classificarAlturasElementos(REAL.geomRaw, g.scaleFactor);
  return c ? {ate:c.ate.length, acima:c.acima.length} : null;
}

/** Quadro "Altura dos elementos": contadores ≤ 11 cm / > 11 cm, desenho numerado e tabela por elemento. */
function painelAlturaElementos(g){
  const c=classificarAlturasElementos(REAL.geomRaw, g.scaleFactor);
  if(!c) return '';
  const box=REAL.geomRaw.bboxPx, unidade=Math.max(box.w,box.h,1), pad=unidade*0.03;
  const cor=i=>i.grupo==='ate'?'var(--accent)':'var(--warn)';
  const desenho=c.itens.map(i=>`<path d="${escaparHtml([i.d,...i.vazados].join(' '))}" fill-rule="evenodd" style="fill:${cor(i)};opacity:.85"/>`).join('');
  const rotulos=c.itens.map(i=>{
    const r=Math.min(Math.max(Math.min(i.bbox.width,i.bbox.height)*0.3,unidade*0.012),unidade*0.03);
    const cx=i.bbox.x+i.bbox.width/2, cy=i.bbox.y+i.bbox.height/2;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#0f172a" stroke-width="${r*0.12}"/><text x="${cx}" y="${cy+r*0.4}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="${r*1.15}" fill="#0f172a">${i.n}</text>`;
  }).join('');
  const ordenados=[...c.ate,...c.acima];
  const linhas=ordenados.map(i=>`<tr>
    <td class="num">${i.n}</td>
    <td class="num">${fmt(i.alturaMm/10,1)} cm</td>
    <td class="num">${fmt(i.larguraMm/10,1)} cm</td>
    <td class="num">${fmt(i.perimetroM,2)} m</td>
    <td><span class="badge ${i.grupo==='ate'?'b-accent':'b-warn'}">${i.grupo==='ate'?'≤ 11 cm':'> 11 cm'}</span>${i.proximoDoLimite?' <span class="badge b-neutral" title="A escala tem tolerância de cerca de ±1%: confira esta peça.">perto do limite</span>':''}</td>
  </tr>`).join('');
  const limiteCm=ALTURA_ELEMENTO_LIMITE_MM/10;
  return `
    <div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:14px;">
      <p style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Altura dos elementos (corte em ${limiteCm} cm)</p>
      <p style="font-size:11.5px;color:var(--text-faint);margin-bottom:10px;">Cada contorno externo é um elemento (letra, símbolo ou pedaço solto, como o ponto do “i”). A altura é a da caixa vertical da peça, na escala informada acima; letras coladas pelo vetorizador contam como um só elemento.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <div style="flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;"><span class="badge b-accent">≤ ${limiteCm} cm</span><div style="font-size:26px;font-weight:700;margin-top:6px;" data-teste="elementos-ate">${c.ate.length}</div><div style="font-size:11.5px;color:var(--text-faint);">elemento(s) com ${limiteCm} cm ou menos · perímetro ${fmt(c.perimetroAteM,2)} m</div></div>
        <div style="flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;"><span class="badge b-warn">&gt; ${limiteCm} cm</span><div style="font-size:26px;font-weight:700;margin-top:6px;" data-teste="elementos-acima">${c.acima.length}</div><div style="font-size:11.5px;color:var(--text-faint);">elemento(s) com mais de ${limiteCm} cm · perímetro ${fmt(c.perimetroAcimaM,2)} m</div></div>
      </div>
      ${c.proximos.length?`<div class="role-note" style="margin-bottom:10px;">${ICONS.info} ${c.proximos.length} elemento(s) a até ${ALTURA_ELEMENTO_FAIXA_PROXIMA_MM} mm do limite (${c.proximos.map(i=>i.n).join(', ')}): a escala tem tolerância de cerca de ±1%, então confira a medida de cada um.</div>`:''}
      <div class="grid2">
        <div class="compare" style="background:#fff;"><svg viewBox="${box.x-pad} ${box.y-pad} ${box.w+2*pad} ${box.h+2*pad}" style="display:block;width:100%;height:auto;" role="img" aria-label="Elementos numerados, coloridos por faixa de altura">${desenho}${rotulos}</svg></div>
        <div class="tablewrap" style="max-height:340px;overflow-y:auto;">
          <table>
            <thead><tr><th>Nº</th><th>Altura</th><th>Largura</th><th>Perímetro</th><th>Faixa</th></tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ---------- CORES DA FACE NO DESENHO (pedido de 06/10/2026) ----------
 * A leitura automática das cores pode errar (ex.: letras brancas redesenhadas em preto). Na Ficha técnica o vendedor clica nas peças do
 * desenho e indica a cor delas; o servidor usa essas cores no lugar da leitura (`coresManuais` em /cores/analisar-svg) e escolhe o
 * acrílico de cada cor. Cada cor de acrílico tem o seu nesting e o fundo (PVC) cobre o letreiro inteiro. A cor é por caminho do SVG
 * (o Vectorizer.AI gera um caminho por forma; o traçador local junta as formas da mesma cor num caminho só). A numeração dos caminhos é a
 * mesma do servidor (`extrairRegioesCorSvg`): todo <path> fora de <defs>, na ordem do documento, de 0 em diante. */
let _assinaturaSvgCache={svg:null,valor:''};
/** Identifica a arte vetorial atual: indicações de cor de uma arte anterior não valem para a nova. */
function assinaturaSvgArte(){
  const s=REAL.tracedSvgOriginal||'';
  if(_assinaturaSvgCache.svg===s) return _assinaturaSvgCache.valor;
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0;
  _assinaturaSvgCache={svg:s,valor:s.length+':'+h};
  return _assinaturaSvgCache.valor;
}

let _corCtx=null;
/** Qualquer cor CSS opaca (#rgb, rgb(), nome) → "#rrggbb"; degradê, "none" ou cor com transparência → null. */
function corParaHex(valor){
  const v=String(valor==null?'':valor).trim();
  if(!v||/^none$/i.test(v)||/^url\(/i.test(v)) return null;
  if(!_corCtx) _corCtx=document.createElement('canvas').getContext('2d');
  _corCtx.fillStyle='#010203';
  _corCtx.fillStyle=v;
  const lido=String(_corCtx.fillStyle);
  if(lido==='#010203'&&v.toLowerCase()!=='#010203') return null;
  return /^#[0-9a-f]{6}$/i.test(lido)?lido.toLowerCase():null;
}

let _caminhosColoridosCache={svg:null,valor:null};
/** Caminhos da arte vetorial original com a cor lida de cada um: `{view, caminhos:[{index,d,hex,gradiente,semPreenchimento,fillRule}]}`. */
function lerCaminhosColoridos(){
  const svg=REAL.tracedSvgOriginal;
  if(!svg) return null;
  if(_caminhosColoridosCache.svg===svg) return _caminhosColoridosCache.valor;
  let valor=null;
  try{
    const doc=new DOMParser().parseFromString(svg.replace(/<!doctype[^>[]*>/gi,''),'image/svg+xml');
    const raiz=doc.querySelector('svg');
    if(!raiz||doc.querySelector('parsererror')) throw new Error('SVG ilegível');
    const vb=(raiz.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
    const view=vb.length===4&&vb.every(Number.isFinite)&&vb[2]>0&&vb[3]>0
      ? {x:vb[0],y:vb[1],w:vb[2],h:vb[3]}
      : {x:0,y:0,w:parseFloat(raiz.getAttribute('width'))||REAL.tracedW||1000,h:parseFloat(raiz.getAttribute('height'))||REAL.tracedH||500};
    const estiloDe=(no,prop)=>{
      const decl=(no.getAttribute('style')||'').split(';').map(s=>s.trim()).find(s=>s.toLowerCase().startsWith(prop+':'));
      return decl?decl.slice(prop.length+1).trim():no.getAttribute(prop);
    };
    const caminhos=[...doc.querySelectorAll('path')].filter(p=>!p.closest('defs')).map((p,index)=>{
      let fill=null;
      for(let no=p;no&&no.nodeType===1&&fill==null;no=no.parentNode) fill=estiloDe(no,'fill');
      if(fill==null) fill='#000000';
      return {
        index,d:p.getAttribute('d')||'',hex:corParaHex(fill),gradiente:/^url\(/i.test(fill),
        semPreenchimento:/^none$/i.test(String(fill).trim()),fillRule:estiloDe(p,'fill-rule')==='evenodd'?'evenodd':'nonzero',
      };
    });
    valor={view,caminhos};
  }catch(erro){ valor=null; }
  _caminhosColoridosCache={svg,valor};
  return valor;
}

function coresFaceEstado(){
  if(!REAL.coresFace) REAL.coresFace={assinatura:'',mapa:{},selecao:[],paleta:null,paletaCarregando:false,paletaErro:null,personalizada:'#ff7f00'};
  const st=REAL.coresFace, assinatura=assinaturaSvgArte();
  if(st.assinatura!==assinatura){ st.assinatura=assinatura; st.mapa={}; st.selecao=[]; }
  return st;
}
function nomeMateriaCatalogo(id){
  const material=(catalog.materias||[]).find(item=>Number(item.id)===Number(id));
  return material?material.nome:'';
}
/** Cores indicadas pelo vendedor, agrupadas por cor, no formato que o servidor espera. */
function coresManuaisParaServidor(){
  const st=coresFaceEstado(), porCor=new Map();
  Object.entries(st.mapa).forEach(([indice,hex])=>{ porCor.set(hex,[...(porCor.get(hex)||[]),Number(indice)]); });
  return [...porCor.entries()].map(([corHex,pathIndexes])=>({corHex,pathIndexes:pathIndexes.sort((a,b)=>a-b)}));
}

/** Corpo do cartão "Cores da face": desenho clicável, cores atuais, seleção e paleta. */
function htmlCoresFaceInterior(){
  const lido=lerCaminhosColoridos();
  if(!lido) return '<div class="empty-hint">Não foi possível ler as cores do desenho vetorial. Use "Refazer análise de cores" no passo do nesting.</div>';
  const st=coresFaceEstado();
  if(!st.paleta&&!st.paletaCarregando&&!st.paletaErro) setTimeout(carregarPaletaCoresFace,0);
  const {view}=lido, pad=Math.max(view.w,view.h)*0.02;
  const corDe=c=>st.mapa[c.index]||c.hex||(c.gradiente?'#94a3b8':'#000000');
  const selecionadas=new Set(st.selecao);
  const desenhaveis=lido.caminhos.filter(c=>!c.semPreenchimento&&c.d);
  const caminhos=desenhaveis.map(c=>{
    const selecionada=selecionadas.has(c.index), cor=corDe(c);
    return `<path data-act="cor-peca" data-idx="${c.index}" d="${escaparHtml(c.d)}" fill="${cor}" fill-rule="${c.fillRule}" stroke="${selecionada?'#2563eb':'#0f172a'}" stroke-width="${selecionada?3.5:1}" vector-effect="non-scaling-stroke" style="cursor:pointer;outline:none;" tabindex="0" role="button" aria-pressed="${selecionada}" aria-label="Peça ${c.index+1}, cor ${cor}${st.mapa[c.index]?', indicada por você':''}"><title>Peça ${c.index+1} · ${cor}${st.mapa[c.index]?' (indicada por você)':''}${c.gradiente&&!st.mapa[c.index]?' · degradê na arte':''}</title></path>`;
  }).join('');
  const grupos=new Map();
  desenhaveis.forEach(c=>{
    const hex=corDe(c), grupo=grupos.get(hex)||{hex,indices:[],manuais:0};
    grupo.indices.push(c.index); if(st.mapa[c.index]) grupo.manuais+=1;
    grupos.set(hex,grupo);
  });
  const chip='display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 4px;background:var(--surface);font-size:12px;';
  const amostra=(hex,tam=18)=>`<span style="display:inline-block;width:${tam}px;height:${tam}px;border:1px solid var(--border);border-radius:50%;background:${hex};flex:none;"></span>`;
  const legenda=[...grupos.values()].map(g=>`<span style="${chip}">${amostra(g.hex)}<b>${g.hex}</b> · ${g.indices.length} peça(s)${g.manuais?` <span class="badge b-accent">indicada por você</span>`:''}<button class="btn btn-ghost btn-sm" style="padding:1px 8px;" data-act="cor-selecionar-cor" data-hex="${g.hex}">Selecionar</button></span>`).join('');
  const nSel=st.selecao.length, nManuais=Object.keys(st.mapa).length;
  const desabilitado=nSel?'':'disabled';
  const paleta=(st.paleta||[]).map(item=>{
    const nome=nomeMateriaCatalogo(item.mubisysMateriaPrimaId)||item.nome||'chapa';
    return `<button type="button" class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:6px;" data-act="cor-aplicar" data-hex="${item.corHex}" title="${escaparHtml(nome)} · ${item.corHex}" ${desabilitado}>${amostra(item.corHex,16)}${escaparHtml(nome)}</button>`;
  }).join('');
  const coresDaArte=[...grupos.values()].map(g=>`<button type="button" class="btn btn-ghost btn-sm" style="display:inline-flex;align-items:center;gap:6px;" data-act="cor-aplicar" data-hex="${g.hex}" title="Usar a cor ${g.hex}" ${desabilitado}>${amostra(g.hex,16)}${g.hex}</button>`).join('');
  return `
    <p style="font-size:12.5px;font-weight:700;margin-bottom:4px;">Cores da face — confira e corrija a leitura</p>
    <p style="font-size:11.5px;color:var(--text-faint);margin-bottom:10px;">O desenho é a face do letreiro. O sistema leu as cores abaixo a partir da arte, mas pode errar (por exemplo, letras brancas redesenhadas em preto). <b>Clique nas peças</b> para selecioná-las e indique a cor delas: com a cor certa o sistema procura o acrílico mais parecido. Cada cor de acrílico terá o seu próprio nesting, e o fundo (PVC) sempre cobre o letreiro inteiro, qualquer que seja a cor da frente.</p>
    <div class="grid2" style="align-items:start;">
      <div style="background:repeating-conic-gradient(#e2e8f0 0% 25%,#f8fafc 0% 50%) 0 0/16px 16px;border:1px solid var(--border);border-radius:12px;padding:6px;">
        <svg viewBox="${view.x-pad} ${view.y-pad} ${view.w+2*pad} ${view.h+2*pad}" style="display:block;width:100%;height:auto;max-height:420px;" role="group" aria-label="Peças da face; clique para selecionar e indicar a cor">${caminhos}</svg>
      </div>
      <div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${legenda}</div>
        <div class="role-note" style="margin-bottom:8px;">${ICONS.info} ${nSel?`<b>${nSel}</b> peça(s) selecionada(s).`:'Nenhuma peça selecionada.'} <button class="btn btn-ghost btn-sm" data-act="cor-selecionar-tudo">Selecionar todas</button> <button class="btn btn-ghost btn-sm" data-act="cor-limpar-selecao" ${desabilitado}>Limpar seleção</button></div>
        <p style="font-size:12px;font-weight:700;margin:8px 0 4px;">Indicar a cor das peças selecionadas</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;">
          ${paleta||(st.paletaCarregando?'<span class="role-note" style="margin:0;">Carregando as cores de acrílico cadastradas…</span>':st.paletaErro?`<span class="role-note" style="margin:0;">${escaparHtml(st.paletaErro)}</span>`:'<span class="role-note" style="margin:0;">Nenhuma chapa com cor de referência cadastrada.</span>')}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;"><span class="role-note" style="margin:0;">Cores do desenho:</span>${coresDaArte}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <label class="field" style="flex-direction:row;align-items:center;gap:6px;margin:0;"><span style="font-size:12px;">Outra cor</span><input type="color" data-act="cor-personalizada" value="${escaparHtml(st.personalizada||'#ff7f00')}" style="width:42px;height:28px;padding:0;"></label>
          <button class="btn btn-soft btn-sm" data-act="cor-aplicar-personalizada" ${desabilitado}>Aplicar esta cor</button>
          <button class="btn btn-ghost btn-sm" data-act="cor-restaurar" ${desabilitado} title="Volta as peças selecionadas à cor que o sistema leu na arte">Voltar à leitura automática</button>
        </div>
        ${nManuais?`<div class="role-note" style="margin-top:10px;">${ICONS.check} Você indicou a cor de <b>${nManuais}</b> peça(s). <button class="btn btn-ghost btn-sm" data-act="cor-restaurar-todas">Desfazer todas</button></div>`:''}
      </div>
    </div>`;
}

function htmlCartaoCoresFace(){
  const lido=lerCaminhosColoridos();
  if(!lido||!lido.caminhos.length) return '';
  return `<div id="cores-face-card" class="card" style="background:var(--surface-2);box-shadow:none;margin-top:14px;">${htmlCoresFaceInterior()}</div>`;
}

/** Redesenha só o cartão (sem recarregar a página inteira a cada clique) e religa os eventos dele. */
function atualizarCartaoCoresFace(){
  const no=document.getElementById('cores-face-card');
  if(!no) return;
  no.innerHTML=htmlCoresFaceInterior();
  bindCoresFaceEventos();
}

async function carregarPaletaCoresFace(){
  const st=coresFaceEstado();
  if(st.paletaCarregando||st.paleta) return;
  st.paletaCarregando=true; st.paletaErro=null;
  try{
    const resposta=await fetch('/api/letra-caixa/cores/paleta',{credentials:'same-origin'});
    const corpo=await resposta.json().catch(()=>({}));
    if(!resposta.ok) throw new Error(corpo.error||'Não foi possível carregar as cores de acrílico cadastradas.');
    st.paleta=Array.isArray(corpo.chapas)?corpo.chapas:[];
  }catch(erro){ st.paletaErro=erro.message||'Não foi possível carregar as cores de acrílico cadastradas.'; }
  finally{ st.paletaCarregando=false; atualizarCartaoCoresFace(); }
}

/** A cor das peças mudou: a leitura de cores, o nesting e as aprovações que dependiam dela deixam de valer. */
function aoMudarCoresFace(){
  invalidarAnaliseCoresReal();
  REAL.colorAnalysis.escolhas={}; REAL.colorAnalysis.opcoes={}; REAL.colorAnalysis.error=null; REAL.nestingAutoChave=null;
  atualizarCartaoCoresFace();
}

function aplicarCorNasPecas(hex){
  const st=coresFaceEstado(), lido=lerCaminhosColoridos();
  if(!st.selecao.length||!lido||!/^#[0-9a-f]{6}$/i.test(hex)) return;
  const cor=hex.toLowerCase(), porIndice=new Map(lido.caminhos.map(c=>[c.index,c]));
  st.selecao.forEach(indice=>{
    const original=porIndice.get(indice);
    if(original&&original.hex===cor&&!original.gradiente) delete st.mapa[indice]; // a mesma cor que a arte já tem: não é uma correção
    else st.mapa[indice]=cor;
  });
  aoMudarCoresFace();
}

function bindCoresFaceEventos(){
  const alternar=indice=>{
    const st=coresFaceEstado(), i=Number(indice);
    st.selecao=st.selecao.includes(i)?st.selecao.filter(x=>x!==i):[...st.selecao,i];
    atualizarCartaoCoresFace();
  };
  document.querySelectorAll('[data-act="cor-peca"]').forEach(no=>{
    no.addEventListener('click',()=>alternar(no.dataset.idx));
    no.addEventListener('keydown',evento=>{ if(evento.key==='Enter'||evento.key===' '){ evento.preventDefault(); alternar(no.dataset.idx); } });
  });
  document.querySelectorAll('[data-act="cor-selecionar-cor"]').forEach(botao=>botao.addEventListener('click',()=>{
    const st=coresFaceEstado(), lido=lerCaminhosColoridos();
    if(!lido) return;
    const novos=lido.caminhos.filter(c=>!c.semPreenchimento&&c.d&&(st.mapa[c.index]||c.hex||(c.gradiente?'#94a3b8':'#000000'))===botao.dataset.hex).map(c=>c.index);
    st.selecao=[...new Set([...st.selecao,...novos])];
    atualizarCartaoCoresFace();
  }));
  document.querySelectorAll('[data-act="cor-selecionar-tudo"]').forEach(botao=>botao.addEventListener('click',()=>{
    const lido=lerCaminhosColoridos();
    if(!lido) return;
    coresFaceEstado().selecao=lido.caminhos.filter(c=>!c.semPreenchimento&&c.d).map(c=>c.index);
    atualizarCartaoCoresFace();
  }));
  document.querySelectorAll('[data-act="cor-limpar-selecao"]').forEach(botao=>botao.addEventListener('click',()=>{ coresFaceEstado().selecao=[]; atualizarCartaoCoresFace(); }));
  document.querySelectorAll('[data-act="cor-aplicar"]').forEach(botao=>botao.addEventListener('click',()=>aplicarCorNasPecas(botao.dataset.hex)));
  document.querySelectorAll('[data-act="cor-personalizada"]').forEach(campo=>campo.addEventListener('input',()=>{ coresFaceEstado().personalizada=campo.value; }));
  document.querySelectorAll('[data-act="cor-aplicar-personalizada"]').forEach(botao=>botao.addEventListener('click',()=>aplicarCorNasPecas(coresFaceEstado().personalizada||'#ff7f00')));
  document.querySelectorAll('[data-act="cor-restaurar"]').forEach(botao=>botao.addEventListener('click',()=>{
    const st=coresFaceEstado();
    st.selecao.forEach(indice=>{ delete st.mapa[indice]; });
    aoMudarCoresFace();
  }));
  document.querySelectorAll('[data-act="cor-restaurar-todas"]').forEach(botao=>botao.addEventListener('click',()=>{ coresFaceEstado().mapa={}; aoMudarCoresFace(); }));
}

async function downloadTechnicalSheetPNG(){
  const svg=document.getElementById('prancha-tecnica-svg');
  if(!svg){ alert('Confirme as medidas para gerar a prancha.'); return; }
  const source=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'}), url=URL.createObjectURL(blob);
  try{
    const image=await loadImageEl(url), canvas=document.createElement('canvas');
    canvas.width=2400; canvas.height=Math.round(2400*1120/1800);
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height);
    const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!png) throw new Error('Não consegui renderizar o PNG.');
    const pngUrl=URL.createObjectURL(png), link=document.createElement('a'); link.href=pngUrl; link.download='prancha-tecnica.png'; link.click(); setTimeout(()=>URL.revokeObjectURL(pngUrl),1000);
  }catch(e){ alert(e.message||'Falha ao exportar a prancha PNG.'); }
  finally{ URL.revokeObjectURL(url); }
}

function montarInstrucaoRedesenho(){
  const escopo=REAL.escopoRedesenho==='somente_logo'?'somente a logo, sem dados externos à marca':REAL.escopoRedesenho==='letreiro_completo'?'todo o painel gráfico, incluindo textos e elementos que pertençam ao letreiro':`somente estes elementos: ${REAL.elementosSelecionados.trim()}`;
  return `Reconstrua fielmente a arte existente na imagem anexada. Escopo: ${escopo}. Faça um inventário completo dos elementos e use a foto como referência principal. Preserve conteúdo, tipografia, símbolos, proporções, composição, detalhes pequenos e cores aproximadas. Corrija a perspectiva e nivele os eixos quando a inclinação não fizer parte da identidade; preserve curvas, diagonais e assimetrias originais. Reconstrua só a face gráfica: remova ambiente, suportes, laterais físicas, aros, reflexos, sombras e halos. Use cores chapadas, sem gradientes, textura ou volume. Não modernize, embeleze, simetrize, invente letras ou complete partes ilegíveis; marque como incerto o que não puder confirmar. Não pesquise outra versão da marca. Compare referência e reconstrução lado a lado e corrija diferenças. Entregue a arte frontal limpa, com fundo transparente para logo isolada quando possível. Não gere SVG nem prepare corte nesta etapa.`;
}

async function copiarInstrucaoRedesenho(){
  const prompt=montarInstrucaoRedesenho();
  try{
    await navigator.clipboard.writeText(prompt);
    alert('Instrução copiada. Cole-a no chat de IA junto com a foto original.');
  }catch(e){
    const area=document.createElement('textarea'); area.value=prompt; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
    const ok=document.execCommand('copy'); area.remove();
    alert(ok?'Instrução copiada. Cole-a no chat de IA junto com a foto original.':'Não consegui copiar automaticamente. Selecione e copie o texto do Prompt 1 no código do protótipo.');
  }
}

function camadaFisicaKit(line){
  const tokens=new Set(normalizeSearch(String(line?.papel||'')).split(/[^a-z0-9]+/).filter(Boolean));
  const face=['face','frente','visual','translucida'].some(token=>tokens.has(token));
  const aro=['aro','lateral','laterais','contorno','perfil'].some(token=>tokens.has(token));
  const fundo=['fundo','base','costas','verso','back'].some(token=>tokens.has(token));
  const matches=[face?'face':null,aro?'aro':null,fundo?'fundo':null].filter(Boolean);
  return matches.length===1?matches[0]:null;
}

/** Perfil nunca entra no nesting (regra do usuário, 05/10/2026): o consumo dele vem do perímetro da prancha técnica.
 *  Vale pelo papel da linha ou pelo nome da matéria-prima, porque o cadastro pode não estar classificado como perfil. */
function linhaEhPerfil(line){
  const tokens=texto=>normalizeSearch(String(texto||'')).split(/[^a-z0-9]+/).filter(Boolean);
  return tokens(line?.papel).includes('perfil')||tokens(materialKitAtivo(line)?.nome||line?.nome).includes('perfil');
}

async function analisarFactibilidadeReal(){
  if(REAL.factibilidadeCarregando||REAL.nestingCarregando) return;
  REAL.factibilidadeCarregando=true; REAL.factibilidadeErro=null; REAL.factibilidade=null; REAL.nesting=null;
  render();
  try{
    const boardResponse=await fetch('/api/letra-caixa/chapas',{credentials:'same-origin'});
    const boardBody=await boardResponse.json().catch(()=>({}));
    if(!boardResponse.ok) throw new Error(boardBody.error||'Nao foi possivel carregar as chapas cadastradas.');
    const chapas=Array.isArray(boardBody.chapas)?boardBody.chapas:[];
    REAL.nestingFormatosCadastrados=chapas;
    const configured=new Set(chapas.filter(board=>board.ativo!==false).map(board=>Number(board.mubisysMateriaPrimaId)));
    // Só entra no nesting matéria-prima classificada como chapa/bobina (com formato cadastrado); perfil, LED etc. ficam de fora.
    const physicalLines=(REAL.kit||[]).filter(line=>!line.origemPintura&&!linhaEhPerfil(line)&&camadaFisicaKit(line)&&configured.has(Number(materialKitAtivo(line).matId)));
    const mappedLineIds=new Set(physicalLines.map(line=>Number(materialKitAtivo(line).matId)).filter(id=>Number.isInteger(id)&&id>0));
    const linhasChapaSemCamada=(REAL.kit||[]).filter(line=>!line.origemPintura&&!linhaEhPerfil(line)&&configured.has(Number(materialKitAtivo(line).matId))&&!camadaFisicaKit(line));
    if(linhasChapaSemCamada.length){
      REAL.nestingMateriaPrimaIds=[...new Set([...mappedLineIds,...linhasChapaSemCamada.map(line=>Number(materialKitAtivo(line).matId)).filter(id=>Number.isInteger(id)&&id>0)])];
      throw new Error('Vincule cada matéria-prima de chapa à Face, ao Aro ou ao Fundo no bloco desta etapa.');
    }
    const materiaPrimaIds=[...mappedLineIds];
    REAL.nestingMateriaPrimaIds=materiaPrimaIds;
    if(!materiaPrimaIds.length) throw new Error('Nenhuma matéria-prima de chapa ou bobina com formato cadastrado está ligada à Face, ao Aro ou ao Fundo do kit. Classifique a matéria-prima como chapa em Administração > Produtos > Matérias-primas ou ajuste o papel dela na composição.');
    if(materiaPrimaIds.length>10) throw new Error('A factibilidade aceita ate 10 materiais de chapa por projeto.');
    const missingFormats=materiaPrimaIds.filter(id=>!configured.has(id));
    const formatosTemporarios=[];
    for(const id of missingFormats){
      const manual=REAL.nestingFormatosTemporarios[id]||{};
      const larguraMm=Number(manual.larguraMm), alturaMm=Number(manual.alturaMm);
      if(!Number.isInteger(larguraMm)||larguraMm<10||larguraMm>50000||!Number.isInteger(alturaMm)||alturaMm<10||alturaMm>50000){
        REAL.nestingFormatosPendentes=missingFormats;
        REAL.factibilidadeErro=null;
        return;
      }
      formatosTemporarios.push({materiaPrimaId:id,larguraMm,alturaMm,bobina:!!manual.bobina});
    }
    REAL.nestingFormatosPendentes=[];
    REAL.nestingFormatosUsados=formatosTemporarios;
    const camadaKeys=new Set();
    const camadasMateriais=physicalLines.flatMap(line=>{
      const materiaPrimaId=Number(materialKitAtivo(line).matId), camada=camadaFisicaKit(line);
      const key=`${materiaPrimaId}:${camada}`;
      if(!Number.isInteger(materiaPrimaId)||materiaPrimaId<=0||!camada||camadaKeys.has(key))return [];
      camadaKeys.add(key);return [{materiaPrimaId,camada,...(camada==='aro'&&papelEhAro(line.papel)?{faixaMm:larguraFaixaAro()}:{})}];
    });
    const g=computeGeomReal();
    const usarContornoCorte=REAL.colorAnalysis.aprovado&&contornoCorteAplicavel();
    REAL.svgNesting=svgComCamadaFace(usarContornoCorte?REAL.tracedSvgCorte:REAL.tracedSvg);
    const response=await fetch('/api/letra-caixa/factibilidade',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sourceId:REAL.id,svg:REAL.svgNesting,contornoCorte:usarContornoCorte,
        larguraSvgMm:REAL.tracedW*g.scaleFactor*1000,alturaSvgMm:REAL.tracedH*g.scaleFactor*1000,
        materiaPrimaIds,camadasMateriais,
        formatosTemporarios,
        margemBordaMm:Number(REAL.nestingConfiguracao.margemBordaMm)||0,
      }),
    });
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Nao foi possivel analisar a factibilidade de fabricacao.');
    REAL.factibilidade={...body,acao:null,reciboDecisao:null,resultadoDecisao:null};
    if(body.status_factibilidade==='APTO_NESTING') await executarNestingFactibilidadeReal(formatosTemporarios);
  }catch(error){ REAL.factibilidadeErro=error.message||'Falha ao analisar a factibilidade.'; }
  finally{ REAL.factibilidadeCarregando=false; render(); }
}

/** O produto tem face em acrílico? Vale quando a linha Face do kit é uma matéria-prima de acrílico. */
function faceDoProdutoEhAcrilico(){
  return (REAL.kit||[]).some(line=>camadaFisicaKit(line)==='face'&&/acril/.test(normalizeSearch(materialKitAtivo(line).nome||'')));
}
function construcaoFaceEfetiva(color){
  if(color.construcaoFace==='nao_informada') return faceDoProdutoEhAcrilico()?'acrilico_total':'outra';
  return color.construcaoFace;
}
