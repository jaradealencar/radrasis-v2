/** Segunda chamada (+1 crédito): só a silhueta que a CNC corta. Falhar aqui nunca invalida a vetorização completa. */
async function gerarContornoCorte(imagem, requestId, motor){
  limparContornoCorte();
  if(!REAL.gerarContornoCnc) return;
  try{
    let svgCorte, creditos = null;
    if(motor === 'gpt') return; // sem contorno de corte separado: o nesting usa o vetor completo
    if(motor === 'local'){
      if(!window.CpqVetorizadorLocal) throw new Error('o traçador local não carregou; recarregue a página (Ctrl+F5).');
      svgCorte = (await window.CpqVetorizadorLocal.vetorizarImagem(imagem, {modo:'corte'})).svg;
    }else{
      const response = await fetch('/api/letra-caixa/vetorizacao?modo=corte', {
        method:'POST', credentials:'same-origin', headers:{'Content-Type':imagem.type, 'X-Redesenho-Token':REAL.redesenhoToken}, body:imagem,
      });
      if(!response.ok){
        const body = await response.json().catch(() => ({}));
        throw new Error(body.error || 'O Vectorizer.AI não gerou o contorno de corte.');
      }
      const ticket = response.headers.get('X-Redesenho-Token');
      if(ticket) REAL.redesenhoToken = ticket;
      creditos = response.headers.get('X-Vectorizer-Credits-Charged');
      svgCorte = await response.text();
    }
    if(requestId !== traceRequestId) return;
    REAL.corteCreditos = creditos;
    const resultado = await validarContornoCorte(svgCorte);
    if(requestId !== traceRequestId) return;
    if(!resultado.ok){ REAL.corteErro = resultado.erro; return; }
    REAL.tracedSvgCorte = resultado.svg; REAL.tracedSvgCorteOriginal = resultado.svgOriginal; REAL.tracedSvgCorteDe = REAL.tracedSvg; REAL.corteInfo = resultado.info;
  }catch(erro){
    if(requestId !== traceRequestId) return;
    REAL.corteErro = String(erro && erro.message || erro);
  }
}

/* ---------- PLANO B DA VETORIZAÇÃO ----------
 * Vectorizer.AI (principal) → traçador local (grátis, no navegador) → GPT (SVG aproximado). No modo automático o
 * sistema desce a lista quando um motor falha (sem crédito, erro, SVG inválido) ou a silhueta não bate com a arte
 * aprovada. O vendedor também pode escolher o motor ou limpar o fundo da arte com o GPT antes de vetorizar. */
const MOTOR_ROTULO = {vectorizer:'Vectorizer.AI', local:'traçador local', gpt:'GPT (SVG)'};

async function svgPorMotor(motor, imagem, ajustes){
  if(motor === 'local'){
    if(!window.CpqVetorizadorLocal) throw new Error('o traçador local não carregou; recarregue a página (Ctrl+F5).');
    const r = await window.CpqVetorizadorLocal.vetorizarImagem(imagem, {maxCores:ajustes.maxCores, minAreaPx:ajustes.minAreaPx});
    return {svg:r.svg, creditos:null, ticket:null};
  }
  const consulta = new URLSearchParams();
  if(ajustes.maxCores != null) consulta.set('maxCores', String(ajustes.maxCores));
  if(motor === 'vectorizer'){
    if(ajustes.minAreaPx != null) consulta.set('minArea', String(ajustes.minAreaPx));
    if(ajustes.tolerancia != null) consulta.set('tolerancia', String(ajustes.tolerancia));
  }
  const rota = motor === 'gpt' ? '/api/letra-caixa/vetorizacao-gpt' : '/api/letra-caixa/vetorizacao';
  const response = await fetch(rota + (consulta.toString() ? '?' + consulta : ''), {
    method:'POST', credentials:'same-origin', headers:{'Content-Type':imagem.type, 'X-Redesenho-Token':REAL.redesenhoToken}, body:imagem,
  });
  if(!response.ok){
    const body = await response.json().catch(() => ({}));
    throw new Error(body.error || (MOTOR_ROTULO[motor] + ' não conseguiu vetorizar a imagem.'));
  }
  return {svg:await response.text(), creditos:response.headers.get('X-Vectorizer-Credits-Charged'), ticket:response.headers.get('X-Redesenho-Token')};
}

/** Vetoriza com um motor e já confere o resultado (caminhos legíveis + silhueta contra a arte aprovada). */
async function candidatoDoMotor(motor, imagem, ajustes, rasterSource, rigoroso){
  const r = await svgPorMotor(motor, imagem, ajustes);
  if(r.ticket) REAL.redesenhoToken = r.ticket;
  const styled = applyPrompt2VectorStyle(r.svg);
  if(rigoroso && styled.audit && !styled.audit.ok) throw new Error(styled.audit.fatal.join(' '));
  const parsed = extractPathsFromRawSVG(styled.svgText);
  if(!parsed || !parsed.d) throw new Error('não retornou caminhos vetoriais utilizáveis.');
  if(!Number.isFinite(parsed.w)||!Number.isFinite(parsed.h)||parsed.w<=0||parsed.h<=0) throw new Error('o SVG não contém dimensões válidas para calcular a escala.');
  if(parsed.transformedCount > 0) throw new Error('o SVG contém transformações que o cálculo ainda não interpreta.');
  const quality = await validatePrompt2Trace(rasterSource, styled.svgText);
  return {motor, r, svgStr:styled.svgText, parsed, quality};
}

/** O GPT Image remove fundo/ruído da arte aprovada (sobre branco liso) e a vetorização roda de novo. */
async function limparFundoEVetorizar(){
  if(state.tracing || !REAL.imgReconstructed || !REAL.redesenhoToken) return;
  state.tracing = true; REAL.traceError = null; render();
  try{
    const imagem = await fetch(REAL.imgReconstructed).then(response => response.blob());
    const response = await fetch('/api/letra-caixa/limpar-fundo', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':imagem.type, 'X-Redesenho-Token':REAL.redesenhoToken}, body:imagem,
    });
    if(!response.ok){
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || 'O GPT não conseguiu limpar o fundo da arte.');
    }
    const ticket = response.headers.get('X-Redesenho-Token');
    if(!ticket) throw new Error('O servidor não confirmou a arte limpa. Tente novamente.');
    REAL.imgReconstructed = await blobParaDataUrl(await response.blob());
    REAL.redesenhoToken = ticket;
    REAL.fundoLimpoGpt = true;
  }catch(erro){
    REAL.traceError = String(erro && erro.message || erro);
    state.tracing = false; render();
    return;
  }
  state.tracing = false;
  await retrace(REAL.motorVetorizacao === 'gpt' ? {motor:'auto'} : undefined);
}

    : REAL.motorUsado === 'local'
      ? '<div class="role-note" style="margin-top:8px;">Vetorizado pelo traçador local (sem créditos). Confira curvas finas e vazados na sobreposição.</div>' : '';
  return `<div class="card" style="background:var(--surface-2);box-shadow:none;margin-top:12px;">
    <p style="font-size:12.5px;font-weight:700;margin-bottom:6px;">Plano B da vetorização</p>
    <label class="field" style="display:block;font-size:12px;">Motor
      <select data-act="real-motor-vetorizacao" ${state.tracing ? 'disabled' : ''} style="display:block;margin-top:4px;width:min(100%,420px);">
        ${opcao('auto', 'Automático: Vectorizer.AI → traçador local → GPT')}
        ${opcao('vectorizer', 'Só Vectorizer.AI')}
        ${opcao('local', 'Só traçador local (grátis, no navegador)')}
        ${opcao('gpt', 'Só GPT (SVG aproximado)')}
      </select>
    </label>
    <div class="role-note" style="margin-top:6px;">No automático, se o Vectorizer.AI falhar, estiver sem crédito ou a silhueta não bater com a arte, o sistema tenta o traçador local e, por último, o GPT. O resultado sempre passa pela mesma validação de silhueta e pela sua conferência.</div>
    ${REAL.motorUsado ? `<div class="role-note" style="margin-top:6px;">Última vetorização: <b>${MOTOR_ROTULO[REAL.motorUsado]}</b>${REAL.fundoLimpoGpt ? ' · fundo da arte limpo pelo GPT' : ''}.</div>` : ''}
    ${falhas}${aviso}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <button class="btn btn-ghost btn-sm" data-act="real-vetorizar-local" ${ocupado ? 'disabled' : ''}>Refazer com o traçador local</button>
      <button class="btn btn-ghost btn-sm" data-act="real-vetorizar-gpt" ${ocupado ? 'disabled' : ''}>Refazer com GPT</button>
      <button class="btn btn-ghost btn-sm" data-act="real-limpar-fundo-gpt" ${ocupado ? 'disabled' : ''} title="O GPT Image tira fundo, sombras e ruído da arte e a vetorização roda de novo (consome crédito da OpenAI)">Limpar fundo com GPT e vetorizar</button>
    </div>
  </div>`;
}

async function retrace(opcoes){
  const rasterSource=REAL.imgReconstructed;
  if(!rasterSource || !REAL.redesenhoToken) return;
  REAL.vetorAnterior=capturarVetorAtual()||REAL.vetorAnterior;
  (REAL.chatVetor||[]).forEach(m=>{ if(m.estado==='pendente') m.estado='obsoleto'; });
  const requestId=++traceRequestId;
  REAL.traceQuality=null;
  REAL.traceReview={...TRACE_REVIEW_DEFAULTS};
  REAL.traceError=null;
  REAL.vectorizerCredits=null;
  REAL.uploadError=null; REAL.uploadWarning=null;
  REAL.imgPreview=null; REAL.tracedSvg=null; REAL.tracedSvgOriginal=null; REAL.fgD=''; REAL.tracedW=0; REAL.tracedH=0; REAL.geomRaw=null; limparContornoCorte(); REAL.analiseArte=null; REAL.analiseErro=null;
  REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
  state.tracing = true; render();
  try{
    const imagem=await fetch(rasterSource).then(response=>response.blob());
    if(requestId!==traceRequestId) return;
    if(!['image/png','image/jpeg'].includes(imagem.type)) throw new Error('Envie uma imagem PNG ou JPG para vetorizar.');
    if(imagem.size>12*1024*1024) throw new Error('A imagem preparada excede 12 MB. Gere novamente uma versao menor.');
    const manuais=opcoes&&opcoes.ajustes?opcoes.ajustes:null;
    const leitura=manuais?null:await lerArteAprovada(imagem,requestId);
    if(requestId!==traceRequestId) return;
    const ajustes=manuais||(leitura&&leitura.ajustes)||{};
    REAL.ajustesVetorizacao=ajustes;
    const motorPedido=(opcoes&&opcoes.motor)||REAL.motorVetorizacao||'auto';
    const ordem=motorPedido==='auto'?['vectorizer','local','gpt']:[motorPedido];
    const falhas=[];
    let melhor=null;
    const nota=candidato=>(candidato.quality.status==='fail'?0:1000)+(candidato.quality.metrics?Number(candidato.quality.metrics.iou)||0:0);
    for(const motor of ordem){
      try{
        // No automático, SVG fora do padrão também conta como falha e passa ao próximo motor.
        const candidato=await candidatoDoMotor(motor,imagem,ajustes,rasterSource,motorPedido==='auto');
        if(requestId!==traceRequestId) return;
        if(!melhor||nota(candidato)>nota(melhor)) melhor=candidato;
        if(candidato.quality.status!=='fail') break;
        falhas.push(MOTOR_ROTULO[motor]+': a silhueta não bateu com a arte aprovada.');
      }catch(erro){
        if(requestId!==traceRequestId) return;
        falhas.push(MOTOR_ROTULO[motor]+': '+String(erro&&erro.message||erro));
      }
    }
    if(!melhor) throw new Error(falhas.join(' · ')||'Nenhum motor conseguiu vetorizar a imagem.');
    const svgResponse=melhor.r.svg, svgStr=melhor.svgStr, parsed=melhor.parsed;
    REAL.motorUsado=melhor.motor;
    // Só vale como "plano B acionado" quando outro motor assumiu o lugar do primeiro da lista.
    REAL.motoresFalhas=melhor.motor===ordem[0]?[]:falhas;
    REAL.imgPreview=rasterSource;
    REAL.vectorizerCredits=melhor.motor==='vectorizer'?melhor.r.creditos:null;
    REAL.tracedSvg=svgStr; REAL.tracedSvgOriginal=svgResponse; REAL.fgD=parsed.d; invalidarFactibilidadeReal();
    REAL.tracedW=parsed.w; REAL.tracedH=parsed.h;
    REAL.geomRaw=classifyGeometry(parsed.d);
    REAL.traceReview={...TRACE_REVIEW_DEFAULTS};
    REAL.traceQuality=melhor.quality;
    if(requestId!==traceRequestId) return;
    await gerarContornoCorte(imagem,requestId,melhor.motor);
    if(requestId!==traceRequestId) return;
    if(parsed.nonPathCount>0){
      REAL.uploadWarning=`O SVG contém ${parsed.nonPathCount} elemento(s) que não são caminhos e não entram no cálculo geométrico. Confira o resultado no preview antes de aprovar.`;
    }
    REAL.traceError = null;
  }catch(e){
    if(requestId!==traceRequestId) return;
    REAL.traceError = String(e && e.message || e);
    REAL.traceQuality = null;
  }
  if(requestId!==traceRequestId) return;
  state.tracing = false;
  render();
}

/* ---------- EDITOR VETORIAL DIRETO (sem rasterizar, sem crédito) ----------
 * Edita os próprios caminhos do SVG: selecionar, apagar, mover, esticar/ampliar
 * (proporcional ou livre), girar e espelhar. Cada transformação é aplicada
 * matematicamente aos comandos do caminho (M, L, H, V, C, S, Q, T, Z), então as
 * curvas continuam exatas e nada é revetorizado nem cobrado. Vive FORA do #shell
 * (anexado ao <body>) porque render() reconstrói o #shell inteiro e destruiria a
 * edição em andamento. Ao aplicar, o desenho é recortado rente à arte e volta pelo
 * mesmo caminho de um SVG enviado: o tamanho real do letreiro precisa ser
 * informado de novo na etapa seguinte (escala) antes do nesting. */
const VT_NS = 'http://www.w3.org/2000/svg';
let _vt = null;

function vtLerCaminho(d){
  const tokens = String(d || '').match(/[MmLlHhVvCcSsQqTtAaZz]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g) || [];
  const argumentos = {M:2, L:2, H:1, V:1, C:6, S:4, Q:4, T:2, A:7, Z:0};
  const saida = [];
  let i = 0;
  while(i < tokens.length){
    const comando = tokens[i++];
    if(!/[A-Za-z]/.test(comando)) throw new Error('Caminho inválido.');
    const n = argumentos[comando.toUpperCase()];
    if(n === 0){ saida.push({c:comando, a:[]}); continue; }
    let primeiro = true;
    while(i < tokens.length && !/[A-Za-z]/.test(tokens[i])){
      if(i + n > tokens.length) throw new Error('Caminho incompleto.');
      const a = tokens.slice(i, i + n).map(Number);
      i += n;
      let c = comando;
      if(!primeiro && comando === 'M') c = 'L';
      if(!primeiro && comando === 'm') c = 'l';
      saida.push({c, a});
      primeiro = false;
    }
  }
  return saida;
}

/** Aplica uma matriz [a,b,c,d,e,f] a um caminho SVG e devolve o novo "d" (sempre em coordenadas absolutas). */
function vtTransformarCaminho(d, m){
  const comandos = vtLerCaminho(d);
  const P = (x, y) => [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];
  const f = n => String(Math.round(n * 1000) / 1000);
  const par = (x, y) => { const [px, py] = P(x, y); return f(px) + ' ' + f(py); };
  const saida = [];
  let cx = 0, cy = 0, sx = 0, sy = 0, ultimo = '', lcx = 0, lcy = 0;
  for(const {c, a} of comandos){
    const rel = c === c.toLowerCase();
    const C = c.toUpperCase();
    const ox = rel ? cx : 0, oy = rel ? cy : 0;
    if(C === 'A') throw new Error('Este desenho tem arcos (A), que o editor ainda não transforma.');
    if(C === 'M'){
      cx = a[0] + ox; cy = a[1] + oy; sx = cx; sy = cy;
      saida.push('M' + par(cx, cy));
    }else if(C === 'L'){
      cx = a[0] + ox; cy = a[1] + oy;
      saida.push('L' + par(cx, cy));
    }else if(C === 'H'){
      cx = a[0] + ox;
      saida.push('L' + par(cx, cy));
    }else if(C === 'V'){
      cy = a[0] + oy;
      saida.push('L' + par(cx, cy));
    }else if(C === 'C'){
      const x1 = a[0] + ox, y1 = a[1] + oy, x2 = a[2] + ox, y2 = a[3] + oy, x = a[4] + ox, y = a[5] + oy;
      saida.push('C' + par(x1, y1) + ' ' + par(x2, y2) + ' ' + par(x, y));
      lcx = x2; lcy = y2; cx = x; cy = y;
    }else if(C === 'S'){
      const x1 = (ultimo === 'C' || ultimo === 'S') ? 2*cx - lcx : cx;
      const y1 = (ultimo === 'C' || ultimo === 'S') ? 2*cy - lcy : cy;
      const x2 = a[0] + ox, y2 = a[1] + oy, x = a[2] + ox, y = a[3] + oy;
      saida.push('C' + par(x1, y1) + ' ' + par(x2, y2) + ' ' + par(x, y));
      lcx = x2; lcy = y2; cx = x; cy = y;
    }else if(C === 'Q'){
      const x1 = a[0] + ox, y1 = a[1] + oy, x = a[2] + ox, y = a[3] + oy;
      saida.push('Q' + par(x1, y1) + ' ' + par(x, y));
      lcx = x1; lcy = y1; cx = x; cy = y;
    }else if(C === 'T'){
      const x1 = (ultimo === 'Q' || ultimo === 'T') ? 2*cx - lcx : cx;
      const y1 = (ultimo === 'Q' || ultimo === 'T') ? 2*cy - lcy : cy;
      const x = a[0] + ox, y = a[1] + oy;
      saida.push('Q' + par(x1, y1) + ' ' + par(x, y));
      lcx = x1; lcy = y1; cx = x; cy = y;
    }else if(C === 'Z'){
      saida.push('Z');
      cx = sx; cy = sy;
    }
    ultimo = C;
  }
  return saida.join('');
}

const VT_ATRIBUTOS = ['fill','fill-opacity','opacity','stroke','stroke-width','stroke-opacity','data-pantone','data-pantone-code','data-cmyk','id'];
function vtAtributos(attrs){
  return Object.keys(attrs || {}).filter(nome => VT_ATRIBUTOS.includes(nome))
    .map(nome => ` ${nome}="${escaparHtml(String(attrs[nome]))}"`).join('');
}

function vtCaixaSelecao(){
  if(!_vt || !_vt.sel.size) return null;
  const caixas = [..._vt.sel].map(i => document.querySelector(`#vt-svg [data-i="${i}"]`)).filter(Boolean).map(el => el.getBBox());
  if(!caixas.length) return null;
  const x0 = Math.min(...caixas.map(b => b.x)), y0 = Math.min(...caixas.map(b => b.y));
  const x1 = Math.max(...caixas.map(b => b.x + b.width)), y1 = Math.max(...caixas.map(b => b.y + b.height));
  return {x:x0, y:y0, w:x1 - x0, h:y1 - y0};
}

function vtPonto(ev){
  const svg = document.getElementById('vt-svg');
  const ponto = svg.createSVGPoint();
  ponto.x = ev.clientX; ponto.y = ev.clientY;
  const p = ponto.matrixTransform(svg.getScreenCTM().inverse());
  return {x:p.x, y:p.y};
}

function vtSnapshot(){ return JSON.stringify(_vt.els.map(e => ({d:e.d, deleted:e.deleted}))); }
function vtGuardarDesfazer(){
  _vt.desfazer.push(vtSnapshot());
  if(_vt.desfazer.length > 60) _vt.desfazer.shift();
}
function vtDesfazer(){
  const anterior = _vt.desfazer.pop();
  if(!anterior) return;
  JSON.parse(anterior).forEach((item, i) => { _vt.els[i].d = item.d; _vt.els[i].deleted = item.deleted; });
  _vt.sel = new Set();
  vtDesenhar();
}

function vtAjustarVista(){
  const arte = document.getElementById('vt-art');
  if(!arte || !arte.childNodes.length) return;
  const b = arte.getBBox();
  const margem = Math.max(b.width, b.height) * 0.08 || 1;
  _vt.view = {x:b.x - margem, y:b.y - margem, w:b.width + 2*margem, h:b.height + 2*margem};
}

function vtDesenhar(){
  const host = document.getElementById('vt-canvas');
  if(!host) return;
  const v = _vt.view;
  const ativos = _vt.els.map((e, i) => ({e, i})).filter(x => !x.e.deleted);
  host.innerHTML = `<svg id="vt-svg" xmlns="${VT_NS}" viewBox="${v.x} ${v.y} ${v.w} ${v.h}" style="width:100%;height:100%;touch-action:none;display:block;background:${_vt.escuro ? '#1e293b' : '#ffffff'};">`
    + `<g id="vt-art">${ativos.map(({e, i}) => `<path data-i="${i}" d="${e.d}"${e.attrs.fill ? '' : ' fill="#000000"'}${vtAtributos(e.attrs)} style="cursor:move;"/>`).join('')}</g>`
    + `<g id="vt-sel"></g><rect id="vt-caixa" x="0" y="0" width="0" height="0" fill="rgba(37,99,235,.12)" stroke="#2563eb" stroke-dasharray="4 3" stroke-width="${v.w / 700}" style="display:none;pointer-events:none;"/></svg>`;
  vtDesenharSelecao();
}

function vtDesenharSelecao(caixaPrevia){
  const alvo = document.getElementById('vt-sel');
  const info = document.getElementById('vt-info');
  const ativos = _vt.els.filter(e => !e.deleted).length;
  if(info) info.textContent = `${ativos} elemento(s) no desenho · ${_vt.sel.size} selecionado(s)`;
  if(!alvo) return;
  const b = caixaPrevia || vtCaixaSelecao();
  const campoL = document.getElementById('vt-largura'), campoA = document.getElementById('vt-altura');
  if(!b){
    alvo.innerHTML = '';
    if(campoL){ campoL.value = ''; campoA.value = ''; }
    return;
  }
  const v = _vt.view, t = v.w / 90, linha = v.w / 600;
  const pontos = {nw:[b.x, b.y], n:[b.x + b.w/2, b.y], ne:[b.x + b.w, b.y], e:[b.x + b.w, b.y + b.h/2], se:[b.x + b.w, b.y + b.h], s:[b.x + b.w/2, b.y + b.h], sw:[b.x, b.y + b.h], w:[b.x, b.y + b.h/2]};
  const cursores = {nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize', n:'ns-resize', s:'ns-resize', e:'ew-resize', w:'ew-resize'};
  alvo.innerHTML = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="#2563eb" stroke-width="${linha}" stroke-dasharray="${linha * 4} ${linha * 3}" style="pointer-events:none;"/>`
    + Object.keys(pontos).map(h => `<rect data-h="${h}" x="${pontos[h][0] - t/2}" y="${pontos[h][1] - t/2}" width="${t}" height="${t}" fill="#ffffff" stroke="#2563eb" stroke-width="${linha}" style="cursor:${cursores[h]};"/>`).join('');
  if(campoL && document.activeElement !== campoL && document.activeElement !== campoA){
    campoL.value = b.w.toFixed(1);
    campoA.value = b.h.toFixed(1);
  }
}

function vtConfirmar(m){
  if(!_vt.sel.size) return;
  vtGuardarDesfazer();
  try{
    _vt.sel.forEach(i => { _vt.els[i].d = vtTransformarCaminho(_vt.els[i].d, m); });
  }catch(erro){ _vt.desfazer.pop(); alert(erro.message); }
  vtDesenhar();
}

function vtApagar(){
  if(!_vt.sel.size) return;
  vtGuardarDesfazer();
  _vt.sel.forEach(i => { _vt.els[i].deleted = true; });
  _vt.sel = new Set();
  vtDesenhar();
}

function vtPrevia(m){
  [..._vt.sel].forEach(i => {
    const el = document.querySelector(`#vt-svg [data-i="${i}"]`);
    if(el) el.setAttribute('transform', `matrix(${m.join(' ')})`);
  });
}

function vtMatrizEscala(b, sx, sy, ax, ay){ return [sx, 0, 0, sy, ax * (1 - sx), ay * (1 - sy)]; }

function vtLigarEventos(overlay){
  const host = document.getElementById('vt-canvas');
  let arrasto = null;

  host.addEventListener('contextmenu', ev => ev.preventDefault());
  host.addEventListener('wheel', ev => {
    ev.preventDefault();
    const p = vtPonto(ev), fator = ev.deltaY < 0 ? 0.85 : 1 / 0.85, v = _vt.view;
    v.x = p.x - (p.x - v.x) * fator; v.y = p.y - (p.y - v.y) * fator; v.w *= fator; v.h *= fator;
    vtDesenhar();
  }, {passive:false});

  host.addEventListener('pointerdown', ev => {
    const svg = document.getElementById('vt-svg');
    if(!svg) return;
    if(ev.button === 2 || ev.button === 1){
      arrasto = {tipo:'pan', ini:{x:ev.clientX, y:ev.clientY}, vista:{..._vt.view}, escala:svg.getScreenCTM().a};
      host.setPointerCapture(ev.pointerId);
      return;
    }
    if(ev.button !== 0) return;
    const p = vtPonto(ev), alvo = ev.target;
    const alca = alvo.getAttribute && alvo.getAttribute('data-h');
    if(alca){
      arrasto = {tipo:'escala', alca, caixa:vtCaixaSelecao(), ini:p, m:null};
      host.setPointerCapture(ev.pointerId);
      return;
    }
    const indice = alvo.getAttribute && alvo.getAttribute('data-i');
    if(indice != null){
      const i = Number(indice);
      if(ev.shiftKey){ if(_vt.sel.has(i)) _vt.sel.delete(i); else _vt.sel.add(i); }
      else if(!_vt.sel.has(i)) _vt.sel = new Set([i]);
      vtDesenharSelecao();
      arrasto = {tipo:'mover', ini:p, caixa:vtCaixaSelecao(), m:null};
      host.setPointerCapture(ev.pointerId);
      return;
    }
    if(!ev.shiftKey) _vt.sel = new Set();
    vtDesenharSelecao();
    arrasto = {tipo:'caixa', ini:p, atual:p};
    host.setPointerCapture(ev.pointerId);
  });

  host.addEventListener('pointermove', ev => {
    if(!arrasto) return;
    if(arrasto.tipo === 'pan'){
      const dx = (ev.clientX - arrasto.ini.x) / arrasto.escala, dy = (ev.clientY - arrasto.ini.y) / arrasto.escala;
      _vt.view = {..._vt.view, x:arrasto.vista.x - dx, y:arrasto.vista.y - dy};
      document.getElementById('vt-svg').setAttribute('viewBox', `${_vt.view.x} ${_vt.view.y} ${_vt.view.w} ${_vt.view.h}`);
      return;
    }
    const p = vtPonto(ev);
    if(arrasto.tipo === 'mover'){
      arrasto.m = [1, 0, 0, 1, p.x - arrasto.ini.x, p.y - arrasto.ini.y];
      vtPrevia(arrasto.m);
      const b = arrasto.caixa;
      vtDesenharSelecao({x:b.x + arrasto.m[4], y:b.y + arrasto.m[5], w:b.w, h:b.h});
    }else if(arrasto.tipo === 'escala'){
      const b = arrasto.caixa, h = arrasto.alca;
      let sx = 1, sy = 1, ax = b.x, ay = b.y;
      if(h.includes('e')){ sx = (p.x - b.x) / b.w; ax = b.x; }
      else if(h.includes('w')){ sx = (b.x + b.w - p.x) / b.w; ax = b.x + b.w; }
      if(h.includes('s')){ sy = (p.y - b.y) / b.h; ay = b.y; }
      else if(h.includes('n')){ sy = (b.y + b.h - p.y) / b.h; ay = b.y + b.h; }
      if(h.length === 2 && !ev.altKey){
        const s = Math.abs(sx - 1) >= Math.abs(sy - 1) ? sx : sy;
        sx = s; sy = s;
      }
      sx = Math.max(0.02, sx); sy = Math.max(0.02, sy);
      arrasto.m = vtMatrizEscala(b, sx, sy, ax, ay);
      vtPrevia(arrasto.m);
      vtDesenharSelecao({x:arrasto.m[0] * b.x + arrasto.m[4], y:arrasto.m[3] * b.y + arrasto.m[5], w:b.w * sx, h:b.h * sy});
    }else if(arrasto.tipo === 'caixa'){
      arrasto.atual = p;
      const r = document.getElementById('vt-caixa');
      r.style.display = '';
      r.setAttribute('x', Math.min(arrasto.ini.x, p.x)); r.setAttribute('y', Math.min(arrasto.ini.y, p.y));
      r.setAttribute('width', Math.abs(p.x - arrasto.ini.x)); r.setAttribute('height', Math.abs(p.y - arrasto.ini.y));
    }
  });

  const terminar = ev => {
    if(!arrasto) return;
    const a = arrasto; arrasto = null;
    try{ host.releasePointerCapture(ev.pointerId); }catch(e){}
    if(a.tipo === 'pan') return;
    if((a.tipo === 'mover' || a.tipo === 'escala') && a.m){
      const mudou = a.m.some((valor, k) => Math.abs(valor - [1, 0, 0, 1, 0, 0][k]) > 1e-9);
      if(mudou) vtConfirmar(a.m); else vtDesenhar();
    }else if(a.tipo === 'caixa'){
      const x0 = Math.min(a.ini.x, a.atual.x), x1 = Math.max(a.ini.x, a.atual.x), y0 = Math.min(a.ini.y, a.atual.y), y1 = Math.max(a.ini.y, a.atual.y);
      if(x1 - x0 > _vt.view.w / 400 || y1 - y0 > _vt.view.w / 400){
        document.querySelectorAll('#vt-svg [data-i]').forEach(el => {
          const b = el.getBBox();
          if(b.x < x1 && b.x + b.width > x0 && b.y < y1 && b.y + b.height > y0) _vt.sel.add(Number(el.getAttribute('data-i')));
        });
      }
      vtDesenhar();
    }
  };
  host.addEventListener('pointerup', terminar);
  host.addEventListener('pointercancel', terminar);

  const teclado = ev => {
    const emCampo = document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
    if((ev.key === 'Delete' || ev.key === 'Backspace') && !emCampo){ ev.preventDefault(); vtApagar(); }
    else if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !emCampo){ ev.preventDefault(); vtDesfazer(); }
    else if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a' && !emCampo){
      ev.preventDefault();
      _vt.sel = new Set(_vt.els.map((e, i) => e.deleted ? null : i).filter(i => i != null));
      vtDesenharSelecao();
    }else if(ev.key === 'Escape' && !emCampo) fecharEditorVetorial();
  };
  overlay._teclado = teclado;
  window.addEventListener('keydown', teclado);
}

/** Lê os caminhos do vetor atual como elementos editáveis (usado pelo editor e pelo chat de ajustes). */
function lerElementosEditaveis(fonte){
  if(!fonte) throw new Error('Nada vetorizado ainda para editar.');
  const doc = new DOMParser().parseFromString(fonte, 'image/svg+xml');
  if(doc.querySelector('parsererror') || !doc.querySelector('svg')) throw new Error('Não foi possível ler o desenho vetorial.');
  if(doc.querySelector('[transform]')) throw new Error('Este SVG tem transformações internas. Achate-as em um editor vetorial antes de editar.');
  const caminhos = [...doc.querySelectorAll('path')].filter(p => p.getAttribute('d'));
  if(!caminhos.length) throw new Error('O desenho não tem caminhos para editar.');
  const els = caminhos.map(p => {
    const attrs = {};
    for(const nome of VT_ATRIBUTOS){ const valor = p.getAttribute(nome); if(valor != null) attrs[nome] = valor; }
    if(attrs.fill == null){ const pai = p.closest('[fill]'); if(pai) attrs.fill = pai.getAttribute('fill'); }
    return {attrs, d:p.getAttribute('d'), deleted:false};
  });
  els.forEach(e => vtTransformarCaminho(e.d, [1, 0, 0, 1, 0, 0]));
  const raiz = doc.querySelector('svg');
  const vb = (raiz.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  const view = vb.length === 4 && vb.every(Number.isFinite) && vb[2] > 0 && vb[3] > 0
    ? {x:vb[0], y:vb[1], w:vb[2], h:vb[3]}
    : {x:0, y:0, w:parseFloat(raiz.getAttribute('width')) || 1000, h:parseFloat(raiz.getAttribute('height')) || 500};
  return {els, view};
}

/** Caixa de cada caminho (e da união) medida num SVG invisível, sem depender do editor aberto. */
function caixasDosCaminhos(ds){
  const svg = document.createElementNS(VT_NS, 'svg');
  svg.setAttribute('width', '10'); svg.setAttribute('height', '10');
  svg.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;';
  const grupo = document.createElementNS(VT_NS, 'g');
  svg.appendChild(grupo);
  const nos = ds.map(d => { const no = document.createElementNS(VT_NS, 'path'); no.setAttribute('d', d); grupo.appendChild(no); return no; });
  document.body.appendChild(svg);
  try{ return {uniao:grupo.getBBox(), caixas:nos.map(no => no.getBBox())}; }
  finally{ svg.remove(); }
}
function caixaDeCaminhos(ds){ return caixasDosCaminhos(ds).uniao; }

/** Recorta o desenho editado rente à arte, valida e devolve ao fluxo como vetor (sem Vectorizer.AI). */
async function aplicarEdicaoVetorial(){
  if(!_vt) return;
  const ativos = _vt.els.filter(e => !e.deleted).map(e => ({attrs:e.attrs, d:e.d}));
  const resultado = await finalizarEdicaoVetor(ativos, 'Desenho editado no editor vetorial. Confira o resultado e informe de novo o tamanho real do letreiro na etapa de escala antes do nesting.');
  if(!resultado.ok){ alert(resultado.erro); return; }
  fecharEditorVetorial();
}

/** Recorta o desenho rente à arte, valida e devolve ao fluxo como vetor (sem Vectorizer.AI). Serve ao editor e ao chat. */
async function finalizarEdicaoVetor(ativos, aviso){
  if(!ativos.length) return {ok:false, erro:'Não sobrou nenhum elemento no desenho.'};
  const caixa = caixaDeCaminhos(ativos.map(e => e.d));
  if(!(caixa.width > 0) || !(caixa.height > 0)) return {ok:false, erro:'O desenho editado ficou sem largura ou altura.'};
  const folga = Math.max(caixa.width, caixa.height) * 0.02;
  const m = [1, 0, 0, 1, -caixa.x + folga, -caixa.y + folga];
  const largura = Math.round((caixa.width + 2 * folga) * 1000) / 1000, altura = Math.round((caixa.height + 2 * folga) * 1000) / 1000;
  let caminhos;
  try{ caminhos = ativos.map(e => ({attrs:e.attrs, d:vtTransformarCaminho(e.d, m)})); }
  catch(erro){ return {ok:false, erro:erro.message}; }
  const svg = `<svg xmlns="${VT_NS}" viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}">`
    + caminhos.map(c => `<path d="${c.d}"${c.attrs.fill ? '' : ' fill="#000000"'}${vtAtributos(c.attrs)}/>`).join('') + '</svg>';
  const estilizado = applyPrompt2VectorStyle(svg);
  if(!estilizado.audit.ok) return {ok:false, erro:'O desenho editado não passou na validação: ' + estilizado.audit.fatal.join(' ')};
  const lido = extractPathsFromRawSVG(estilizado.svgText);
  if(!lido || !lido.d || !(lido.w > 0) || !(lido.h > 0)) return {ok:false, erro:'Não foi possível ler as medidas do desenho editado.'};
  REAL.vetorAnterior = capturarVetorAtual();
  if(!REAL.vetorBaseSvg) REAL.vetorBaseSvg = REAL.tracedSvgOriginal;
  limparContornoCorte();
  invalidarFactibilidadeReal();
  REAL.tracedSvg = estilizado.svgText; REAL.tracedSvgOriginal = svg; REAL.fgD = lido.d; REAL.tracedW = lido.w; REAL.tracedH = lido.h;
  REAL.geomRaw = classifyGeometry(lido.d);
  REAL.traceReview = {...TRACE_REVIEW_DEFAULTS};
  REAL.traceQuality = await validatePrompt2Trace(null, estilizado.svgText);
  REAL.traceError = null;
  REAL.uploadError = null;
  REAL.uploadWarning = aviso;
  REAL.approvals.vetorizacao = false; REAL.approvals.escala = false; REAL.approvals.kit = false; REAL.approvals.nesting = false; REAL.nesting = null;
  render();
  return {ok:true};
}

/* ---------- EDITOR VETORIAL RÁPIDO (Fabric.js) ----------
 * Mover/girar/expandir/apagar/mudar cor sobre o vetor do passo de
 * Vetorização. Vive FORA do ciclo normal de render() do app (anexado direto
 * no <body>, não dentro de #shell) de propósito: render() reconstrói TODO o
 * innerHTML de #shell a cada mudança de qualquer campo — inclusive por
 * sincronizações do banco em segundo plano, que já disparam com frequência
 * neste app. Se o <canvas> do editor estivesse dentro desse fluxo, qualquer
 * re-render alheio destruiria o elemento e o progresso de edição junto com
 * ele. Ao aplicar, rasteriza o canvas editado (com as transformações e
 * cores já aplicadas visualmente) e reaproveita o MESMO pipeline de
 * vetorização já usado pra fotos (retrace) em vez de tentar recalcular
 * manualmente rotação/escala em cima de cada curva Bézier do SVG original —
 * evitar um bug de geometria aqui importa mais que preservar curvas
 * perfeitas, já que geometria errada erra o orçamento. Pedido do usuário
 * 29/09/2026. */
let _fabricCanvas = null;

function abrirEditorVetor(){
  if(!REAL.tracedSvg && !REAL.fgD){ alert('Nada vetorizado ainda para editar.'); return; }
  if(document.getElementById('editor-vetor-overlay')) return;

  const overlay = document.createElement('div');
  overlay.id = 'editor-vetor-overlay';
  overlay.style.cssText = 'position:fixed; inset:0; z-index:1000; background:rgba(15,20,32,.72); display:flex; align-items:center; justify-content:center; padding:16px;';
  overlay.innerHTML = `
    <div style="background:var(--surface); border-radius:14px; box-shadow:var(--shadow); width:min(980px,100%); max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);">
        <div>
          <h3 style="font-size:14px; color:var(--text);">✏️ Editor rápido do vetor</h3>
          <p style="font-size:11.5px; color:var(--text-faint);">Arraste para mover · alças dos cantos para expandir · alça de cima para girar · Delete para apagar.</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-fechar">✕ Fechar sem aplicar</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:var(--surface-2);">
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);">Preenchimento <input type="color" id="editor-vetor-fill" value="#000000"></label>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);">Contorno <input type="color" id="editor-vetor-stroke" value="#000000"></label>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-desagrupar">Desagrupar (editar partes)</button>
        <button class="btn btn-ghost btn-sm" id="editor-vetor-apagar">🗑 Apagar selecionado</button>
        <div style="flex:1;"></div>
        <button class="btn btn-primary btn-sm" id="editor-vetor-aplicar">${ICONS.check} Aplicar edição · 1 crédito para vetorizar</button>
      </div>
      <div style="flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg);">
        <canvas id="editor-vetor-canvas" width="820" height="560" style="border:1px solid var(--border); background:white; box-shadow:var(--shadow); max-width:100%;"></canvas>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  // Fundo branco opaco facilita a inspeção do SVG no editor e mantém a
  // referência visual consistente ao aplicar as alterações.
  _fabricCanvas = new fabric.Canvas('editor-vetor-canvas', { preserveObjectStacking:true, selection:true, backgroundColor:'#ffffff' });
  const svgSource = REAL.tracedSvg || `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${REAL.tracedW||600} ${REAL.tracedH||260}"><path d="${REAL.fgD}" fill="black"/></svg>`;
  fabric.loadSVGFromString(svgSource, (objects, options)=>{
    const group = fabric.util.groupSVGElements(objects, options);
    group.set({ left:_fabricCanvas.width/2, top:_fabricCanvas.height/2, originX:'center', originY:'center' });
    if(group.width > _fabricCanvas.width*0.85 || group.height > _fabricCanvas.height*0.85){
      const escala = Math.min((_fabricCanvas.width*0.8)/group.width, (_fabricCanvas.height*0.8)/group.height);
      group.scale(escala);
    }
    _fabricCanvas.add(group);
    _fabricCanvas.setActiveObject(group);
    _fabricCanvas.renderAll();
  });

  function aplicarCor(alvo, cor, tipo){
    if(!alvo) return;
    if(alvo.type==='group' || alvo.type==='activeSelection'){ alvo.getObjects().forEach(o=>aplicarCor(o,cor,tipo)); }
    else alvo.set(tipo, cor);
  }
  function apagarSelecionados(){
    const ativos = _fabricCanvas.getActiveObjects();
    if(!ativos.length) return;
    ativos.forEach(o=>_fabricCanvas.remove(o));
    _fabricCanvas.discardActiveObject();
    _fabricCanvas.renderAll();
  }

  document.getElementById('editor-vetor-fill').addEventListener('input', e=>{ aplicarCor(_fabricCanvas.getActiveObject(), e.target.value, 'fill'); _fabricCanvas.renderAll(); });
  document.getElementById('editor-vetor-stroke').addEventListener('input', e=>{ aplicarCor(_fabricCanvas.getActiveObject(), e.target.value, 'stroke'); _fabricCanvas.renderAll(); });
  document.getElementById('editor-vetor-desagrupar').addEventListener('click', ()=>{
    const ativo = _fabricCanvas.getActiveObject();
    if(ativo && ativo.type==='group'){ ativo.toActiveSelection(); _fabricCanvas.renderAll(); }
  });
  document.getElementById('editor-vetor-apagar').addEventListener('click', apagarSelecionados);
  document.getElementById('editor-vetor-fechar').addEventListener('click', fecharEditorVetor);
  document.getElementById('editor-vetor-aplicar').addEventListener('click', aplicarEdicaoVetor);

  const teclado = (e)=>{
    if((e.key==='Delete'||e.key==='Backspace') && document.activeElement.tagName!=='INPUT'){ apagarSelecionados(); }
    if(e.key==='Escape') fecharEditorVetor();
  };
  overlay._teclado = teclado;
  window.addEventListener('keydown', teclado);
}

function fecharEditorVetor(){
  const overlay = document.getElementById('editor-vetor-overlay');
  if(overlay){
    if(overlay._teclado) window.removeEventListener('keydown', overlay._teclado);
    overlay.remove();
  }
  if(_fabricCanvas){ _fabricCanvas.dispose(); _fabricCanvas=null; }
}

/** Rasteriza a edição do canvas e a define como nova entrada. A chamada paga
 *  ao Vectorizer.AI fica explícita no botão da etapa de vetorização. */
function aplicarEdicaoVetor(){
  if(!_fabricCanvas) return;
  const dataUrl = _fabricCanvas.toDataURL({ format:'png', multiplier:2 });

  REAL.imgReconstructed = dataUrl;
  REAL.imgPreview=null; REAL.tracedSvg=null; REAL.tracedSvgOriginal=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.vectorizerCredits=null;
  REAL.uploadError=null; REAL.uploadWarning=null;
  REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;

}

/* ---------- NESTING REAL (shelf-packing sobre as peças rastreadas) ---------- */
/* ---------- COMPOSIÇÃO (KIT) REAL — matéria-prima real do MubiSys ---------- */
const FORMULA_TYPES = {
  areaTotal: {label:'Área de consumo calculada pelo nesting (m²)', calc:(g,mult)=> (g.areaTotalNestingM2||g.areaGeralM2||0)*mult},
  area: {label:'Área líquida das peças (m²) — conteúdo da letra', calc:(g,mult)=> g.areaM2*mult},
  areaGeral: {label:'Área geral (m²) — chapa consumida', calc:(g,mult)=> (g.areaGeralM2||0)*mult},
  perimExt: {label:'Perímetro externo', calc:(g,mult)=> g.perimExtM*mult},
  perimTotal: {label:'Perímetro total de corte (m)', calc:(g,mult)=> g.corteTotalM*mult},
  fixo: {label:'Unidade (quantidade por letreiro, ex.: brinde)', calc:(g,mult)=> mult},
  // Produtividade de solda (linhas automáticas da Ficha técnica): perímetro total dos elementos de cada faixa de altura, em metros.
  // No snapshot da cotação viram "fixo" com a quantidade já calculada (ver formulaParaServidor).
  soldaPerimAte11: {label:'Solda: perímetro dos elementos de até 11 cm (m)', calc:(g,mult)=> perimetrosPorAltura(g).ateM*mult},
  soldaPerimAcima11: {label:'Solda: perímetro dos elementos acima de 11 cm (m)', calc:(g,mult)=> perimetrosPorAltura(g).acimaM*mult},
  // Gabarito de kraft (shared/gabarito.ts): comprimento = largura do letreiro aberto; a altura atravessa a
  // bobina de 1,2 m e, passando dela, o papel repete em faixas. Resultado em m² de papel cobrado.
  gabaritoKraft: {label:'Gabarito kraft: faixas da bobina × largura do letreiro (m²)', calc:(g,mult)=>{
    const faixas=Math.max(1,Math.ceil(Math.round((g.totalHeightM||0)*1000)/(KRAFT_LARGURA_BOBINA_M*1000)));

  }},
};
/** Base de cobrança do produto (pedido de 06/10/2026; shared/base-cobranca-produto.ts, validada no servidor): como o consumo da
 *  composição escala com o letreiro quando o produto entra no kit de outro. Reusa as fórmulas das matérias-primas; com a base

function baseCobrancaValida(valor){ return BASES_COBRANCA_PRODUTO.includes(valor)?valor:null; }
/** Fórmula das linhas novas de um produto: a base dele; sem base, área líquida (padrão antigo do cadastro). */

function addKitLine(materiaId){
  const m = catalog.materias.find(x=>x.id===materiaId);
  if(!m) return;
  invalidarFactibilidadeReal();
  REAL.kit.push({ matId:m.id, nome:m.nome, unidade:m.unidade, custo:m.valor, atualizado:m.atualizado, status:m.status, papel:'', formulaType:'area', mult:1.0 });
}
function removeKitLine(idx){ invalidarFactibilidadeReal(); REAL.kit.splice(idx,1); }
function kitLineQty(line, geom){
  const material=materialKitAtivo(line);
  const resultados=REAL.nestingMateriais?.length?REAL.nestingMateriais:(REAL.nesting?.materiais||[]);
  const nesting=resultados.find(item=>Number(item.id_materia_prima)===Number(material.matId));
  if(nesting&&line.formulaType==='areaTotal') return Math.max(0,Number(nesting.area_chapa_utilizada_m2)||0)*(Number(line.mult)||0);
  if(nesting&&line.formulaType==='area') return Math.max(0,Number(nesting.area_liquida_m2)||0)*(Number(line.mult)||0);
  if(nesting&&line.formulaType==='perimTotal') return Math.max(0,Number(nesting.perimetro_total_m)||0)*(Number(line.mult)||0);
  return (FORMULA_TYPES[line.formulaType]||FORMULA_TYPES.fixo).calc(geom, line.mult);
}
function materialKitAtivo(line){
  const variacao=(Array.isArray(line.variantes)?line.variantes:[]).find(item=>String(item.matId)===String(line.variacaoSelecionadaMatId));
  return variacao?{...line,...variacao}:line;
}
function variacoesSelecionadasCotacao(){
  const variacoesModelo = (REAL.variacaoModeloNomes||[]).map(nome=>({nome:'Variação do modelo',valor:String(nome).slice(0,120)}));
  return [...variacoesModelo,...REAL.kit.flatMap(line=>{
    const variacao=(Array.isArray(line.variantes)?line.variantes:[]).find(item=>String(item.matId)===String(line.variacaoSelecionadaMatId));
    return variacao?[{nome:String(line.variacaoNome||'Variação').slice(0,80),valor:String(variacao.valor||variacao.nome||'').slice(0,120)}]:[];
  })].slice(0,100);
}

function variacoesAtivasDoModelo(modelo){
  return (Array.isArray(modelo?.variacoes)?modelo.variacoes:[]).filter(v=>!['inativo','inativa','nao','não','0'].includes(normalizeSearch(String(v.status||''))));
}
function formulaPorUnidadeModelo(unidade){
  const u=normalizeSearch(String(unidade||'')).replace(/²/g,'2');
  if(u.includes('area')||u.includes('quadrad')||u.includes('m2')||u.includes('metro quadrado')) return 'areaTotal';
  if(u.includes('perimetro')||u.includes('linear')||u.includes('comprimento')||u==='m'||u.includes('metro linear')) return 'perimExt';
  return 'fixo';
}
function composicaoMubiSysDoModelo(modelo, variacaoIds){
  const todas=Array.isArray(catalog.composicoesMubiSys)?catalog.composicoesMubiSys:[];
  const ids=new Set((Array.isArray(variacaoIds)?variacaoIds:variacaoIds?[variacaoIds]:[]).map(Number));
  const variacoes=todas.filter(item=>item.variacaoId!=null&&ids.has(Number(item.variacaoId)));
  const compartilhadas=todas.filter(item=>!item.variacaoId&&Number(item.modeloId)===Number(modelo.id));
  const registros=[...compartilhadas,...variacoes];
  if(!registros.length) return null;
  const linhas=[];
  for(const item of registros){
    const m=catalog.materias.find(x=>Number(x.id)===Number(item.materiaPrimaId));
    if(!m) return {erro:`A matéria-prima ${item.materiaPrimaId} desta composição não está no catálogo atual do MubiSys.`};
    const variacao=item.variacaoId==null?null:variacoesAtivasDoModelo(modelo).find(v=>Number(v.id)===Number(item.variacaoId));
    const unidadeConsumo=item.unidade||m.unidade||modelo.unidade||'unidade';
    linhas.push({matId:m.id,nome:m.nome,unidade:m.unidade,custo:m.valor,atualizado:m.atualizado,status:m.status,papel:'',formulaType:formulaPorUnidadeModelo(unidadeConsumo),mult:Number(item.quantidade)||0,variantes:[],origemMubiSys:true,consumoBaseUnidade:variacao?.nome||modelo.unidade||'unidade',unidadeConsumo,variacaoModeloId:item.variacaoId??null,variacaoModeloNome:variacao?.nome||null});
  }
  return {linhas};
}
function carregarComposicaoModeloReal(produto, modelo, variacaoIds){
  const kitPronto=produto&&modelo?adminState.kits[kitKey(produto.id,modelo.id)]:null;
  const ids=(Array.isArray(variacaoIds)?variacaoIds:variacaoIds?[variacaoIds]:[]).map(Number).filter(Number.isFinite);
  const variacoes=variacoesAtivasDoModelo(modelo).filter(item=>ids.includes(Number(item.id)));
  REAL.variacaoModeloIds=variacoes.map(item=>Number(item.id));
  REAL.variacaoModeloNomes=variacoes.map(item=>item.nome);
  REAL.variacaoModeloId=REAL.variacaoModeloIds[0]??null;
  REAL.variacaoModeloNome=REAL.variacaoModeloNomes.join(', ')||null;
  REAL.modeloNome=modelo?`${produto.nome} — ${modelo.nome}`:null;
  REAL.descricaoProduto=kitPronto?.descricaoProduto||'';
  REAL.precificacao=kitPronto?.precificacao?{...kitPronto.precificacao}:null;
  const base=modelo?linhasDoModelo(produto,modelo,ids):{linhas:[],fonte:'nenhuma',erro:null};
  REAL.kit=base.linhas;
  REAL.kitSource=base.fonte;
  REAL.kitWarning=base.fonte==='mubisys'?null:(base.erro||((catalog.mubisysWebConectado&&catalog.composicoesMubiSys.length)?'Não encontrei consumo do MubiSys para esta variação; usando a composição cadastrada no Radrasys.':null));
  // Troca de variação do produto principal preserva as escolhas já feitas nos produtos do kit.
  const chaveKit=modelo?kitKey(produto.id,modelo.id):null;
  if(!Array.isArray(REAL.kitProdutosSel)||REAL.kitProdutosSelDe!==chaveKit){
    REAL.kitProdutosSel=kitProdutosPadrao(kitPronto);
    REAL.kitProdutosSelDe=chaveKit;
  }
  aplicarKitProdutosNoKit();
}

/** Linhas de composição de um modelo para as variações dadas: ficha do MubiSys quando houver,
 *  senão a composição cadastrada no Radrasys. Linha sem variacaoModeloId vale para todas as variações. */
function linhasDoModelo(produto, modelo, ids){
  const kitPronto=adminState.kits[kitKey(produto.id,modelo.id)];
  const importada=composicaoMubiSysDoModelo(modelo,ids);
  if(importada?.linhas) return {linhas:importada.linhas,fonte:'mubisys',erro:null};
  const linhas=kitPronto?kitPronto.linhas.filter(k=>k.variacaoModeloId==null||ids.includes(Number(k.variacaoModeloId))).map(k=>({...k,variantes:Array.isArray(k.variantes)?k.variantes.map(v=>({...v})):[],variacaoSelecionadaMatId:k.variacaoPadraoMatId??null})):[];
  return {linhas,fonte:kitPronto?'radrasys':'nenhuma',erro:importada?.erro||null};
}

/** Gabarito kraft (produto 127 / modelo 570): o papel #1098 usa a regra de faixas da bobina em vez
 *  da fórmula comum. Sem composição cadastrada, o gabarito ainda assim leva o papel kraft. */
function ajustarGabaritoKraft(linhas){
  const ajustadas=linhas.map(l=>Number(l.matId)===KRAFT_MATERIA_PRIMA_ID?{...l,formulaType:'gabaritoKraft',mult:1,unidadeConsumo:'m²'}:l);
  if(ajustadas.some(l=>l.formulaType==='gabaritoKraft')) return ajustadas;
  const kraft=catalog.materias.find(m=>Number(m.id)===KRAFT_MATERIA_PRIMA_ID);
  if(!kraft) return ajustadas;
  return [...ajustadas,{matId:kraft.id,nome:kraft.nome,unidade:kraft.unidade,custo:kraft.valor,atualizado:kraft.atualizado,status:kraft.status,papel:'Gabarito',formulaType:'gabaritoKraft',mult:1,variantes:[]}];
}

/** Seleção inicial dos produtos do kit: o modelo vinculado e a variação padrão cadastrada
 *  (senão a padrão do MubiSys, senão a única existente). O vendedor pode trocar na cotação. */
function kitProdutosPadrao(kitPronto){
  const vinculados=Array.isArray(kitPronto?.kitProdutos)?kitPronto.kitProdutos:[];
  const sel=vinculados.map(kp=>{
    const [produtoId,modeloId]=kp.key.split('_').map(Number);
    const modelo=catalog.produtos.find(p=>p.id===produtoId)?.modelos.find(m=>m.id===modeloId);
    return {slot:kp.key,key:kp.key,nome:kp.nome,variacaoIds:variacoesPadraoDoKitProduto(kp,modelo)};
  });
  // Gabarito de fixação entra em todo kit (modelo kraft por padrão), salvo se o kit já vincula um gabarito.
  if(!sel.some(s=>s.key.startsWith(`${GABARITO_PRODUTO_ID}_`))
    && catalog.produtos.some(p=>p.id===GABARITO_PRODUTO_ID&&p.modelos.some(m=>m.id===GABARITO_MODELO_KRAFT_ID))){
    sel.push({slot:GABARITO_SLOT,key:GABARITO_SLOT,nome:'Gabarito de Fixação',variacaoIds:[],implicito:true});
  }
  return sel;
}
function variacoesPadraoDoKitProduto(kp, modelo){
  const ativas=variacoesAtivasDoModelo(modelo);
  const cadastrada=ativas.find(v=>String(v.id)===String(kp?.variacaoPadraoId));
  const padrao=cadastrada||ativas.find(v=>v.padrao)||(ativas.length===1?ativas[0]:null);
  return padrao?[Number(padrao.id)]:[];
}

/** Recompõe, em REAL.kit, as matérias-primas dos produtos que formam o kit conforme a seleção atual. */
function aplicarKitProdutosNoKit(){
  REAL.kit=(REAL.kit||[]).filter(l=>!l.origemKitProduto);
  for(const sel of (REAL.kitProdutosSel||[])){
    if(sel.implicito&&REAL.gabaritoAtivo===false) continue;
    const [produtoId,modeloId]=sel.key.split('_').map(Number);
    const produto=catalog.produtos.find(p=>p.id===produtoId);
    const modelo=produto?.modelos.find(m=>m.id===modeloId);
    if(!modelo) continue;
    const nome=adminState.kits[sel.key]?.nomeCompleto||`${produto.nome} — ${modelo.nome}`;
    let linhasModelo=linhasDoModelo(produto,modelo,sel.variacaoIds.map(Number)).linhas;
    if(produtoId===GABARITO_PRODUTO_ID&&modeloId===GABARITO_MODELO_KRAFT_ID) linhasModelo=ajustarGabaritoKraft(linhasModelo);
    REAL.kit.push(...linhasModelo.map(l=>({...l,origemKitProduto:sel.slot,kitProdutoNome:nome})));
  }
}

/* ---------- PINTURA (opcional, pré-configurada em todo orçamento) ----------
 * Wizard de múltipla escolha que resolve sozinho qual matéria-prima real usar,
 * a partir de nomes confirmados no catálogo real (28/09/2026): "Tinta PU [N
 * cores]" (tradicional), "Tinta Poliéster - dourado/prata/bronze" e "Tinta
 * Poliéster - Azul Bic" (metalizada), "Tinta Sintética Dourada Vila Rica",
 * "Verniz Fosco/Brilho 900ml", "Adicional PVC ... em Pintura". Quantidade
 * sempre por área líquida (m²) — pintura cobre a superfície da peça. */
function podeConfirmarPintura(p){
  if(!p.substrato || !p.tipo) return false;
  if(p.tipo==='tradicional'){
    if(!p.cores) return false;
    if(p.temCoresAdicionais==null) return false;
    if(p.temCoresAdicionais && !p.coresAdicionais) return false;
    if(!p.acabamento) return false;
  }
  if(p.tipo==='metalizada' && !p.corMetal) return false;
  return true;
}

/** 1 cor base + N adicionais, no teto de 4 (só existem SKUs até "4 cores"
 *  no catálogo real). */
function totalCoresPintura(p){
  return Math.min(4, Math.max(1, (p.cores||1) + (p.temCoresAdicionais ? (p.coresAdicionais||0) : 0)));
}

function resolverItensPintura(p){
  const itens = [];
  if(p.tipo==='tradicional'){
    const n = totalCoresPintura(p);
    itens.push({termo:`tinta pu [${n} cor${n>1?'es':''}]`, papel:'Pintura', formulaType:'area'});
    if(p.acabamento==='fosco') itens.push({termo:'verniz fosco', papel:'Verniz', formulaType:'area'});
    else if(p.acabamento==='brilhante') itens.push({termo:'verniz brilho', papel:'Verniz', formulaType:'area'});
  } else if(p.tipo==='metalizada'){
    if(p.corMetal==='azulbic') itens.push({termo:'azul bic', papel:'Pintura metalizada', formulaType:'area'});
    else if(p.corMetal==='douradovillarica') itens.push({termo:'vila rica', papel:'Pintura metalizada', formulaType:'area'});
    else itens.push({termo:'dourado/prata/bronze', papel:'Pintura metalizada', formulaType:'area'}); // bronze, prata, outro — mesmo item no catálogo
  } else if(p.tipo==='poliester'){
    itens.push({termo:'tinta poliester', papel:'Pintura', formulaType:'area'});
  }
  // Adicional é uma taxa de peça pequena (item de valor fixo no catálogo,
  // não por m²) — quantidade fixa, não proporcional à área.
  if(p.substrato==='pvc') itens.push({termo:'adicional pvc', papel:'Adicional PVC', formulaType:'fixo'});
  return itens;
}

/** Busca cada termo no catálogo real e adiciona ao kit (fórmula "área líquida"
 *  — decisão do usuário: pintura é por m² de superfície, não por perímetro).
 *  Marca `origemPintura` pra permitir remover tudo de uma vez depois. */
function aplicarPintura(){
  const p = REAL.pintura;
  if(!podeConfirmarPintura(p)) return;
  const specs = resolverItensPintura(p);
  const adicionados = [], naoEncontrados = [];
  specs.forEach(spec=>{
    const m = catalog.materias.find(x=>!adminState.materiasExcluidas.has(x.id) && normalizeSearch(x.nome).includes(normalizeSearch(spec.termo)));
    if(m){
      REAL.kit.push({ matId:m.id, nome:m.nome, unidade:m.unidade, custo:m.valor, atualizado:m.atualizado, status:m.status, papel:spec.papel, formulaType:spec.formulaType, mult:1.0, origemPintura:true });
      adicionados.push(m.nome);
    } else naoEncontrados.push(spec.termo);
  });
  REAL.approvals.kit=false;
  p.habilitada = true;
  p.concluida = true;
  p.itensAdicionados = adicionados;
  if(naoEncontrados.length) alert('Não encontrei no catálogo: '+naoEncontrados.join(', ')+' — adicione manualmente na composição.');
  render();
}

/** Desabilita a pintura e remove do kit tudo que ela tinha adicionado —
 *  volta pro estado "cinza claro", não aparece mais na proposta. */
function removerPintura(){
  REAL.kit = REAL.kit.filter(k=>!k.origemPintura);
  REAL.approvals.kit=false;
  REAL.pintura = { habilitada:false, concluida:false, substrato:null, tipo:null, cores:null, temCoresAdicionais:null, coresAdicionais:null, acabamento:null, corMetal:null, itensAdicionados:[] };
  render();
}

function linhaComCustoNesting(linha, geom=computeGeomReal()){
  const material=materialKitAtivo(linha);
  const resultadosNesting=REAL.nestingMateriais?.length?REAL.nestingMateriais:(REAL.nesting?.materiais||[]);
  const nesting=resultadosNesting.find(item=>Number(item.id_materia_prima)===Number(material.matId));
  const quantidade=Math.max(0,kitLineQty(linha,geom));
  const custoBase=quantidade*(Number(material.custo)||0);
  if(!nesting) return {quantidade,custoTotal:custoBase,custoUnitario:Number(material.custo)||0,nesting:null};
  const metadados={idChapa:nesting.id_chapa_utilizada,nomeChapa:nesting.nome_chapa_utilizada,larguraMm:nesting.chapa.largura_mm,alturaMm:nesting.chapa.altura_mm,areaChapaM2:nesting.chapa.largura_mm*nesting.chapa.altura_mm/1e6,areaUtilizadaM2:nesting.area_chapa_utilizada_m2,areaLiquidaM2:nesting.area_liquida_m2,areaSobraM2:nesting.area_sobra_m2,perimetroTotalM:nesting.perimetro_total_m,aproveitamentoPct:nesting.porcentagem_aproveitamento,criterio:nesting.criterio_escolha,custoUnitarioCatalogo:Number(nesting.custo_unitario)||0,unidadeCusto:nesting.unidade_custo,custoMaterialEstimado:nesting.custo_material_estimado,custoSobraEstimado:nesting.custo_sobra_estimado,alertaCusto:nesting.alerta_custo,chapaPrincipal:nesting.chapa_principal,espacamentoPecasMm:nesting.espacamento_pecas_mm,margemBordaMm:nesting.margem_borda_mm,reciboIntegridade:nesting.reciboIntegridade};
  if(nesting.custo_material_estimado==null||!Number.isFinite(Number(nesting.custo_material_estimado))) return {quantidade,custoTotal:custoBase,custoUnitario:Number(material.custo)||0,nesting:metadados};
  const linhasMesmoMaterial=(REAL.kit||[]).filter(item=>Number(materialKitAtivo(item).matId)===Number(material.matId));
  const custoBaseTotal=linhasMesmoMaterial.reduce((total,item)=>{const atual=materialKitAtivo(item);return total+Math.max(0,kitLineQty(item,geom))*(Number(atual.custo)||0);},0);
  const parcela=custoBaseTotal>0?custoBase/ custoBaseTotal:1/Math.max(1,linhasMesmoMaterial.length);
  const custoTotal=Math.max(0,Number(nesting.custo_material_estimado)*parcela);
  return {quantidade,custoTotal,custoUnitario:quantidade>0?custoTotal/quantidade:0,nesting:metadados};
}

function resumoCustoCoresReal(){
  const results=REAL.colorAnalysis?.resultados||[];
  const additional=results.filter(item=>item.tipoSugestao==='imprimax'||item.tipoSugestao==='impresso');
  return {
    // Vale com ou sem aprovação do mapeamento: adesivo sugerido sem custo fechado é pendência (bloqueia o preço), nunca custo zero.
    total:additional.reduce((sum,item)=>sum+(item.custoEstimado!=null&&Number.isFinite(Number(item.custoEstimado))?Number(item.custoEstimado):0),0),
    pendencias:additional.filter(item=>item.custoEstimado==null||!(Number(item.areaTotalM2)>0)||!(Number(item.areaConsumoM2)>0)),
  };
}

/* Embalagem Acabamento (MubiSys #4258): item especial, entra em toda proposta e o
 * vendedor pode excluir. Não é matéria-prima com consumo: cobra 3,5% sobre o preço
 * de todos os outros itens (pedido do usuário 05/10/2026). */
const EMBALAGEM_PCT = 3.5;
function aplicarEmbalagem(precoSemEmbalagem){
  const pct = REAL.embalagemAtiva===false ? 0 : EMBALAGEM_PCT;
  const valor = precoSemEmbalagem*pct/100;
  return {embalagemPct:pct, embalagemValor:valor, precoCalculado:precoSemEmbalagem+valor};
}

function computeOrcamentoReal(){
  const g = computeGeomReal();
  const matKitTotal = REAL.kit.reduce((a,k)=>a+linhaComCustoNesting(k,g).custoTotal,0);
  const corCusto=resumoCustoCoresReal();
  const matTotal = matKitTotal+corCusto.total;
  const servTotal = REAL.servicos.reduce((a,s)=>a+s.v,0);
  // % custo fixo sobre matéria-prima — GLOBAL, igual pra todo produto
  // (rateio de energia/mão-de-obra fixa), editável só em Administração >
  // Configurações. Decisão do usuário 28/09/2026: não é por produto.
  const custoFixo = matTotal * ((configGeral.custoFixoPct||0)/100);
  const custoDireto = matTotal+custoFixo+servTotal;
  const descontoFrac = REAL.desconto/100;

  // Precificação: dois modos possíveis, cadastrados em Administração por
  // produto. "fixo" = preço de venda direto, não deriva do custo (produtos
  // padronizados de ticket baixo). "margem" (padrão) = % por faixa de ticket
  // vinda da Tabela de Preços real — a margem MUDA sozinha conforme o custo
  // direto muda de faixa.
  if(REAL.precificacao && REAL.precificacao.modo==='fixo' && REAL.precificacao.precoFixo){
    const emb = aplicarEmbalagem(REAL.precificacao.precoFixo*(1-descontoFrac));
    const precoCalculado = emb.precoCalculado;
    const precoFinal = Number.isFinite(REAL.precoAprovadoFinal)?REAL.precoAprovadoFinal:precoCalculado;
    return {matTotal, matKitTotal, custoMateriaisCorTotal:corCusto.total, pendenciasCustoCores:corCusto.pendencias, servTotal, custoFixo, custoDireto, precoBase:REAL.precificacao.precoFixo, precoComInstalacao:REAL.precificacao.precoFixo, precoCalculado, precoFinal, margemInfo:null, margin:null, modoFixo:true, embalagemPct:emb.embalagemPct, embalagemValor:emb.embalagemValor};
  }

  const margemInfo = REAL.precificacao ? margemDaTabela(REAL.precificacao, custoDireto) : null;
  const margin = margemInfo ? margemInfo.percentual : REAL.margin;
  const precoBase = custoDireto/(1-margin);
  const precoComInstalacao = precoBase+REAL.instalacao;
  const emb = aplicarEmbalagem(precoComInstalacao*(1-descontoFrac));
  const precoCalculado = emb.precoCalculado;
  const precoFinal = Number.isFinite(REAL.precoAprovadoFinal)?REAL.precoAprovadoFinal:precoCalculado;
  return {matTotal, matKitTotal, custoMateriaisCorTotal:corCusto.total, pendenciasCustoCores:corCusto.pendencias, servTotal, custoFixo, custoDireto, precoBase, precoComInstalacao, precoCalculado, precoFinal, margemInfo, margin, modoFixo:false, embalagemPct:emb.embalagemPct, embalagemValor:emb.embalagemValor};
}

    </div>
  </div>`;
}

const STEP_DEFS = [
  {k:'inventario', n:1, label:'Inventário'},
  {k:'reconstrucao', n:2, label:'Reconstrução'},
  {k:'vetorizacao', n:3, label:'Vetorização'},
  {k:'escala', n:4, label:'Escala e geometria'},
  {k:'kit', n:5, label:'Produto e kit'},
  {k:'nesting', n:6, label:'Nesting'},
  {k:'orcamento', n:7, label:'Orçamento'},
];

function renderStepper(p){
  const maxUnlocked = STEP_DEFS.findIndex(s=>!state.approvals[s.k] && s.k!=='orcamento');
  const unlockedIdx = maxUnlocked===-1 ? STEP_DEFS.length-1 : maxUnlocked;
  return `
  <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
    <button class="btn btn-ghost btn-sm" data-act="back-picker">← Trocar de projeto</button>
    <div style="font-size:12.5px; color:var(--text-faint);">Projeto: <b style="color:var(--text);">${p.nome}</b> · ${p.produto} · ${p.escopo}</div>
  </div>
  <div class="stepper">
    ${STEP_DEFS.map((s,i)=>{
      const done = state.approvals[s.k] || (s.k==='orcamento' && state.orcamentoStatus!=='rascunho');
      const current = state.step===s.n;
      const locked = i>unlockedIdx && !(s.k==='kit' && REAL.step===s.n);
      return `<div class="step-pill ${done?'done':''} ${current?'current':''} ${locked?'locked':'clickable'}" ${locked?'':`data-act="goto-step" data-val="${s.n}"`}>
        <span class="dot">${done?'✓':s.n}</span>${s.label}
      </div>`;
    }).join('')}
  </div>`;
}

function renderStepContent(p){
  switch(state.step){
    case 1: return stepInventario(p);
    case 2: return stepReconstrucao(p);
    case 3: return stepVetorizacao(p);
    case 4: return stepEscala(p);
    case 5: return stepKit(p);
    case 6: return stepNesting(p);
    case 7: return stepOrcamento(p);
    default: return '';
  }
}

    </div>
    <div class="grid2">
      <div class="compare">${p.thumb}</div>

function stepVetorizacao(p){
  return `
  <div class="card">
    <div class="cardhead"><div><h3>3 · Vetorização e verificação geométrica (Prompt 2)</h3><p>SVG técnico (preenchimento branco, contorno preto, fundo transparente) gerado a partir da arte aprovada — sem bitmap, sem fonte dependente, textos convertidos em curvas.</p></div></div>
    <div class="grid2">

      <div><p style="font-size:11.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:6px;">SVG técnico (branco/preto)</p><div class="compare">${p.vetor}</div></div>

function stepEscala(p){
  const s = state.scale[p.id];
  const g = computeGeom(p);
  return `
  <div class="card">
    <div class="cardhead"><div><h3>4 · Escala e geometria (Prompt 3)</h3><p>Margens vazias do viewBox nunca são usadas como limite físico. O mesmo fator de escala é aplicado nos dois eixos.</p></div></div>
    <div class="grid2">
      <div>
        <label class="field">Elemento medido (definido no escopo)
          <input type="text" value="${p.escala.refLabel}" disabled>
        </label>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <label class="field" style="flex:1;">${p.escala.byHeight?'Altura real conhecida':'Largura real conhecida'}
            <input type="text" inputmode="decimal" value="${s.valor}" data-act="scale-value">
          </label>
          <label class="field" style="width:100px;">Unidade
            <select data-act="scale-unit">
              ${['mm','cm','m'].map(u=>`<option value="${u}" ${s.unidade===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </label>
        </div>
        <p style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">A dimensão oposta (${p.escala.byHeight?'largura':'altura'}) é sempre calculada proporcionalmente — nunca distorcida para bater duas medidas incompatíveis.</p>
      </div>
      <div class="tablewrap">
        <table>
          <tbody>
            <tr><td>Largura total</td><td class="num">${fmt(g.totalWidthM,3)} m</td></tr>
            <tr><td>Altura total (proporcional)</td><td class="num">${fmt(g.totalHeightM,3)} m</td></tr>
            <tr><td>Fator de escala</td><td class="num">${g.scaleFactor.toExponential(3)}</td></tr>
            <tr><td>Área líquida (descontados vazados)</td><td class="num">${fmt(g.areaM2,3)} m²</td></tr>
            <tr><td>Perímetro externo</td><td class="num">${fmt(g.perimExtM,2)} m</td></tr>
            <tr><td>Perímetro interno / vazados</td><td class="num">${fmt(g.perimIntM,2)} m</td></tr>
            <tr><td><b>Comprimento total de corte</b></td><td class="num"><b>${fmt(g.corteTotalM,2)} m</b></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card" style="background:var(--surface-2); box-shadow:none; margin-top:14px;">
      <p style="font-size:12.5px; font-weight:700; margin-bottom:8px;">Prancha técnica (prévia esquemática)</p>
      ${prancha(p,g)}
    </div>
    <p style="font-size:11px; color:var(--text-faint); margin-top:8px;">Tolerância: geometria calculada sobre a malha vetorial aprovada, ±1% nos pontos principais. Não inclui kerf do laser, diâmetro de ferramenta, offset de corte ou margem de segurança — calculados separadamente no kit de produção.</p>
    <div class="footer-nav">
      <div class="role-note">${ICONS.info} Confirmação de medida: vendedor · validação geométrica: produção.</div>
      <button class="btn btn-primary" data-act="approve" data-val="escala">${ICONS.check} Confirmar escala e avançar</button>
    </div>
  </div>`;
}

function prancha(p,g){
  const w=560,h=200,pad=48;
  const artW = w-2*pad, artH= (g.totalHeightM/g.totalWidthM)*artW;
  const artY = (h-artH)/2;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; background:var(--surface); border-radius:8px;">
    <rect x="${pad}" y="${artY}" width="${artW}" height="${artH}" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity=".25"/>
    <text x="${w/2}" y="${artY+artH/2+6}" text-anchor="middle" font-family="Sora" font-weight="700" font-size="20" fill="currentColor" opacity=".55">${p.nome.split(' ')[0].toUpperCase()}</text>
    <line x1="${pad}" y1="${artY-14}" x2="${pad+artW}" y2="${artY-14}" stroke="currentColor" opacity=".5"/>
    <line x1="${pad}" y1="${artY-19}" x2="${pad}" y2="${artY-9}" stroke="currentColor" opacity=".5"/>
    <line x1="${pad+artW}" y1="${artY-19}" x2="${pad+artW}" y2="${artY-9}" stroke="currentColor" opacity=".5"/>
    <text x="${w/2}" y="${artY-20}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="currentColor" opacity=".7">${fmt(g.totalWidthM,2)} m</text>
    <line x1="${pad-14}" y1="${artY}" x2="${pad-14}" y2="${artY+artH}" stroke="currentColor" opacity=".5"/>
    <text x="${pad-20}" y="${artY+artH/2}" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="currentColor" opacity=".7" transform="rotate(-90 ${pad-20} ${artY+artH/2})">${fmt(g.totalHeightM,2)} m</text>
  </svg>`;
}

function stepNesting(p){
  return `
  <div class="card">
    <div class="cardhead"><div><h3>6 · Nesting real por material</h3><p>Instâncias físicas de cada peça, por material e processo. Algoritmo <span class="mono">${p.nesting.algoritmo}</span> · versão <span class="mono">${p.nesting.versao}</span> · semente <span class="mono">${p.nesting.semente}</span> · tempo máx. ${p.nesting.tempoMax}.</p></div></div>

      <span style="color:var(--warn);">${ICONS.info}</span>
      <div style="color:var(--text);"><b style="color:var(--warn);">Heurística, não prova de ótimo.</b> Este mapa é uma solução heurística de empacotamento — demonstra rendimento e viabilidade, mas não garante o aproveitamento máximo teórico da chapa. Retalhos reaproveitáveis seguem a política comercial configurada em Administração.</div>
    </div>

      <div class="role-note">${ICONS.info} Validação de colisões e restrições de processo: perfil Produção.</div>
      <button class="btn btn-primary" data-act="approve" data-val="nesting">${ICONS.check} Confirmar nesting e avançar</button>
    </div>
  </div>`;
}

function nestingSheet(f,fi){
  const W=f.larguraMm||1220,H=f.alturaMm||2440, vh = H;
  const colors=['#1e6fd9','#0d9488','#d97706','#c23b3b','#7c3aed'];
  const maxY = Math.max(...f.pecas.map(pc=>pc.y+pc.h)) + 30;
  const usableH = Math.min(vh, Math.max(maxY, W*0.16));
  return `
  <div class="card" style="background:var(--surface-2); box-shadow:none;">
    <div class="cardhead" style="margin-bottom:8px;"><div><h4 style="font-size:13px;">Chapa ${fi+1} — ${f.material}</h4></div>
      <div style="display:flex; gap:8px;">
        <span class="badge b-ok">Aproveitamento ${f.aproveitamento}%</span>
        <span class="badge b-neutral">Sobra ${f.sobra}%</span>
        <span class="badge b-bad">Descarte ${f.descarte}%</span>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${usableH}" style="width:100%; height:auto; background:var(--surface); border-radius:8px; border:1px dashed var(--border);">
      <rect x="8" y="8" width="${W-16}" height="${usableH-16}" fill="none" stroke="currentColor" stroke-dasharray="6 6" opacity=".2"/>
      ${f.pecas.map((pc,i)=>{
        const showLabel = pc.w>=100 && pc.h>=60;
        return `
        <g transform="translate(${pc.x+pc.w/2} ${pc.y+pc.h/2}) rotate(${pc.rot})">
          <rect x="${-pc.w/2}" y="${-pc.h/2}" width="${pc.w}" height="${pc.h}" rx="6" fill="${colors[i%colors.length]}22" stroke="${colors[i%colors.length]}" stroke-width="3"/>
          <circle cx="${-pc.w/2+16}" cy="${-pc.h/2+16}" r="14" fill="${colors[i%colors.length]}"/>
          <text x="${-pc.w/2+16}" y="${-pc.h/2+21}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="15" fill="white">${pc.n}</text>
          ${showLabel?`<text x="0" y="6" text-anchor="middle" font-family="Inter" font-size="14" fill="${colors[i%colors.length]}" opacity=".85">${pc.label}</text>`:''}
        </g>`;}).join('')}
      <text x="${W-16}" y="${usableH-14}" text-anchor="end" font-family="Inter" font-size="13" fill="currentColor" opacity=".4">chapa ${W}×${H}mm — restante não utilizado omitido nesta prévia</text>
    </svg>
    <div style="display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;">
      ${f.pecas.map((pc,i)=>`<div style="display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim);"><span style="width:9px;height:9px;border-radius:3px;background:${colors[i%colors.length]};display:inline-block;"></span>${pc.n}. ${pc.label}</div>`).join('')}
    </div>
  </div>`;
}

        <div class="rangewrap"><span style="font-size:12px; width:70px; color:var(--text-faint);">Margem</span>

      </div>

const STEP_DEFS_REAL = [

function renderRealFlow(){
  return renderRealStepper() + renderRealStepContent();
}

function renderRealStepper(){
  const maxUnlocked = STEP_DEFS_REAL.findIndex(s=>!REAL.approvals[s.k] && s.k!=='orcamento');
  const unlockedIdx = maxUnlocked===-1 ? STEP_DEFS_REAL.length-1 : maxUnlocked;
  return `
  <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">

function renderRealStepContent(){
  switch(REAL.step){

/** Um par (produtoId, modeloId) bate no filtro de categoria/subcategoria/tipo
 *  do passo 1 quando os 3 níveis escolhidos (os que estiverem preenchidos)
 *  batem com o que foi cadastrado nesse modelo em Administração. Sem
 *  categoria cadastrada no modelo, ele nunca aparece quando o filtro está
 *  ativo — decisão do usuário 28/09/2026: categoria primeiro, produto depois. */
function modeloBateFiltro(produtoId, modeloId){
  if(!REAL.filtroCategoria) return true;
  const kit = adminState.kits[kitKey(produtoId, modeloId)];
  if(!kit || kit.categoria!==REAL.filtroCategoria) return false;
  if(REAL.filtroSubcategoria && kit.subcategoria!==REAL.filtroSubcategoria) return false;
  if(REAL.filtroTipo && kit.tipoProduto!==REAL.filtroTipo) return false;
  return true;
}

async function handleReferenceUpload(file, target){
  redrawRequestId++;
  REAL.gerandoRedesenho=false;
  REAL.redesenhoToken=null;

  if(!file || !/^image\/(png|jpeg)$/.test(file.type)){
    REAL.uploadError='Envie uma fotografia ou print em PNG/JPG.';
    render();
    return;
  }
  invalidarRastreamento();
  const dataUrl=await new Promise((resolve,reject)=>{
    const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file);
  });
  if(target==='photo'){
    REAL.imgOriginal=dataUrl;
    REAL.imagemReferenciaUrl=null;
    REAL.imgReconstructed=null; REAL.imgPreview=null;
    REAL.imagemRedesenhadaUrl=null;
    REAL.tracedSvg=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.sourceKind=null;
    REAL.approvals.foto=false; REAL.approvals.redesenho=false; REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false;

}

}

async function comprimirReferenciaGPT(dataUrl){
  const original=await fetch(dataUrl).then(r=>r.blob());
  const bitmap=await createImageBitmap(original);
  const maxDimension=3072;
  let scale=Math.min(1,maxDimension/Math.max(bitmap.width,bitmap.height));
  let width=Math.max(1,Math.round(bitmap.width*scale));
  let height=Math.max(1,Math.round(bitmap.height*scale));
  if(original.size<=3_500_000 && scale===1){ bitmap.close(); return original; }

  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  if(!ctx){ bitmap.close(); throw new Error('Nao foi possivel preparar a foto no navegador.'); }
  for(let tentativa=0;tentativa<5;tentativa++){
    canvas.width=width; canvas.height=height;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,width,height);
    ctx.drawImage(bitmap,0,0,width,height);
    const qualidade=[0.9,0.82,0.74,0.66,0.58][tentativa];
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',qualidade));
    if(!blob){ bitmap.close(); throw new Error('Nao foi possivel preparar a foto no navegador.'); }
    if(blob.size<=3_500_000){ bitmap.close(); return blob; }
    width=Math.max(1,Math.round(width*0.82));
    height=Math.max(1,Math.round(height*0.82));
  }
  bitmap.close();
  throw new Error('A foto e muito grande para enviar. Escolha uma imagem menor.');
}

async function prepararImagemThumbnail(dataUrl){
  const imagem=await createImageBitmap(await fetch(dataUrl).then(response=>response.blob()));
  const escala=Math.min(1,1600/Math.max(imagem.width,imagem.height));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(imagem.width*escala));
  canvas.height=Math.max(1,Math.round(imagem.height*escala));
  const contexto=canvas.getContext('2d');
  if(!contexto){imagem.close();throw new Error('Não foi possível preparar as imagens da proposta.');}
  contexto.fillStyle='#fff'; contexto.fillRect(0,0,canvas.width,canvas.height);
  contexto.drawImage(imagem,0,0,canvas.width,canvas.height);
  imagem.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.82));
  if(!blob) throw new Error('Não foi possível preparar as imagens da proposta.');
  if(blob.size>3_000_000) throw new Error('A miniatura ficou grande demais para anexar à proposta.');
  return blob;
}

async function enviarImagemDaCotacao(dataUrl,tipo){
  const imagem=await prepararImagemThumbnail(dataUrl);
  const response=await fetch(`/api/letra-caixa/cotacoes/imagem/${tipo}`,{
    method:'POST',credentials:'same-origin',headers:{'Content-Type':'image/jpeg'},body:imagem,
  });
  const body=await response.json().catch(()=>({}));
  if(!response.ok||!body.url) throw new Error(body.error||'Não foi possível salvar a imagem da proposta.');
  return body.url;
}

/* ---------- Referências adicionais da MESMA logo (opcional, até 2) ----------
 * O vendedor anexa imagens do site, redes sociais etc. e diz o que cada uma é; o GPT Image as usa só para confirmar letras e
 * símbolo que a foto principal não mostra bem. Nada é buscado na internet: quem escolhe as fontes é o vendedor. */
const TIPOS_REFERENCIA_CPQ = {site:'Logotipo no site oficial', redes:'Rede social (perfil ou publicação)', papelaria:'Cartão / papelaria', outra:'Outra imagem da mesma logo'};
const MAX_REFERENCIAS_EXTRAS_CPQ = 2;

async function blobParaBase64(blob){ return (await blobParaDataUrl(blob)).split(',')[1]; }

/** Reduz a imagem (JPEG) até caber em `maxBytes`: o corpo da requisição na Vercel é limitado a 4,5 MB e vão até 3 imagens em base64. */
async function comprimirImagemAte(dataUrl, maxBytes, maxDim){
  const original = await fetch(dataUrl).then(r => r.blob());
  const bitmap = await createImageBitmap(original);
  const escala = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
  let w = Math.max(1, Math.round(bitmap.width * escala)), h = Math.max(1, Math.round(bitmap.height * escala));
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
  if(!ctx){ bitmap.close(); throw new Error('Não foi possível preparar a imagem no navegador.'); }
  for(let tentativa = 0; tentativa < 8; tentativa++){
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bitmap, 0, 0, w, h);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', [0.9, 0.82, 0.74, 0.66, 0.58, 0.5][Math.min(tentativa, 5)]));
    if(blob && blob.size <= maxBytes){ bitmap.close(); return {mimeType:'image/jpeg', dataBase64:await blobParaBase64(blob)}; }
    w = Math.max(1, Math.round(w * 0.85)); h = Math.max(1, Math.round(h * 0.85));
  }
  bitmap.close();
  throw new Error('Uma das imagens é grande demais para enviar. Use uma imagem menor.');
}
