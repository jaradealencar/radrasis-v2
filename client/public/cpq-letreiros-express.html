function soldaFormVazio(){ return {id:null,nome:'',ativa:true,prioridade:'0',material:'',tipoProduto:'',fixacaoTipos:[],palavras:'',faixa:'',materiaPrimaId:''}; }
function soldaListaPalavras(texto){ return String(texto||'').split(',').map(p=>p.trim()).filter(Boolean).slice(0,10); }
async function soldaAcao(fn, mensagem){
  soldaAdmin.salvando=true; soldaAdmin.erro=''; soldaAdmin.mensagem='';
  render();
  try{ await fn(); soldaAdmin.mensagem=mensagem||''; await carregarSoldaAdmin(); }
  catch(error){ soldaAdmin.erro=error.message||'A operação não foi concluída.'; }
  finally{ soldaAdmin.salvando=false; render(); }
}
function bindSoldaAdminEvents(){
  if(state.tab!=='admin'||state.adminTab!=='solda') return;
  const todos=sel=>document.querySelectorAll(sel);
  todos('[data-act="solda-adm-atualizar"]').forEach(el=>el.addEventListener('click',()=>{ soldaAdmin.mensagem=''; carregarSoldaAdmin(); }));
  todos('[data-act="solda-adm-secao"]').forEach(el=>el.addEventListener('click',()=>{ soldaAdmin.secao=el.dataset.val; soldaAdmin.erro=''; soldaAdmin.mensagem=''; render(); }));
  // Correções pendentes
  todos('[data-act="solda-adm-criar-abrir"]').forEach(el=>el.addEventListener('click',()=>{
    const id=Number(el.dataset.id);
    soldaAdmin.criando={id,nome:`Correção #${id}`,prioridade:'10',usarMaterial:true,usarFixacao:true,usarFaixa:true,usarTipoProduto:false,palavras:''};
    render();
  }));
  todos('[data-act="solda-adm-criar-campo"]').forEach(el=>el.addEventListener('input',()=>{ if(soldaAdmin.criando) soldaAdmin.criando[el.dataset.campo]=el.value; }));
  todos('[data-act="solda-adm-criar-uso"]').forEach(el=>el.addEventListener('change',()=>{ if(soldaAdmin.criando) soldaAdmin.criando[el.dataset.campo]=el.checked; }));
  todos('[data-act="solda-adm-criar-cancelar"]').forEach(el=>el.addEventListener('click',()=>{ soldaAdmin.criando=null; render(); }));
  todos('[data-act="solda-adm-criar-confirmar"]').forEach(el=>el.addEventListener('click',()=>{
    const c=soldaAdmin.criando; if(!c) return;
    soldaAcao(async()=>{
      await soldaApi('POST',`/correcoes/${c.id}/regra`,{nome:String(c.nome||'').trim()||`Correção #${c.id}`,prioridade:Math.trunc(Number(c.prioridade))||0,usarMaterial:!!c.usarMaterial,usarFixacao:!!c.usarFixacao,usarFaixa:!!c.usarFaixa,usarTipoProduto:!!c.usarTipoProduto,palavrasTitulo:soldaListaPalavras(c.palavras)});
      soldaAdmin.criando=null; soldaAdmin.secao='regras';
    },'Regra criada: as próximas cotações com essas condições já usam a produtividade escolhida.');
  }));
  todos('[data-act="solda-adm-descartar"]').forEach(el=>el.addEventListener('click',()=>{
    soldaAcao(()=>soldaApi('PUT',`/correcoes/${el.dataset.id}`,{status:'descartada'}),'Correção descartada.');
  }));
  // Regras
  todos('[data-act="solda-adm-regra-nova"]').forEach(el=>el.addEventListener('click',()=>{ soldaAdmin.form=soldaFormVazio(); render(); }));
  todos('[data-act="solda-adm-regra-editar"]').forEach(el=>el.addEventListener('click',()=>{
    const r=soldaAdmin.regras.find(x=>x.id===Number(el.dataset.id)); if(!r) return;
    soldaAdmin.form={id:r.id,nome:r.nome,ativa:r.ativa,prioridade:String(r.prioridade),material:r.material||'',tipoProduto:r.tipoProduto||'',fixacaoTipos:[...(r.fixacaoTipos||[])],palavras:(r.palavrasTitulo||[]).join(', '),faixa:r.faixa||'',materiaPrimaId:String(r.materiaPrimaId)};
    render();
  }));
  todos('[data-act="solda-adm-form-campo"]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{ if(soldaAdmin.form) soldaAdmin.form[el.dataset.campo]=el.value; }));
  todos('[data-act="solda-adm-form-ativa"]').forEach(el=>el.addEventListener('change',()=>{ if(soldaAdmin.form) soldaAdmin.form.ativa=el.checked; }));
  todos('[data-act="solda-adm-form-fixacao"]').forEach(el=>el.addEventListener('change',()=>{
    if(!soldaAdmin.form) return;
    soldaAdmin.form.fixacaoTipos=alternarFixacaoSolda(soldaAdmin.form.fixacaoTipos,el.dataset.val);
    render();
  }));
  todos('[data-act="solda-adm-form-cancelar"]').forEach(el=>el.addEventListener('click',()=>{ soldaAdmin.form=null; render(); }));
  todos('[data-act="solda-adm-form-salvar"]').forEach(el=>el.addEventListener('click',()=>{
    const f=soldaAdmin.form; if(!f) return;
    const corpo={nome:String(f.nome||'').trim(),ativa:!!f.ativa,prioridade:Math.trunc(Number(f.prioridade))||0,material:f.material||null,tipoProduto:String(f.tipoProduto||'').trim()||null,fixacaoTipos:f.fixacaoTipos.length?f.fixacaoTipos:null,palavrasTitulo:soldaListaPalavras(f.palavras),faixa:f.faixa||null,materiaPrimaId:Number(f.materiaPrimaId)};
    if(!corpo.nome){ soldaAdmin.erro='Dê um nome à regra.'; render(); return; }
    if(!Number.isInteger(corpo.materiaPrimaId)||corpo.materiaPrimaId<=0){ soldaAdmin.erro='Escolha a produtividade da regra.'; render(); return; }
    soldaAcao(async()=>{ await soldaApi(f.id?'PUT':'POST',f.id?`/regras/${f.id}`:'/regras',corpo); soldaAdmin.form=null; },f.id?'Regra atualizada.':'Regra criada.');
  }));
  todos('[data-act="solda-adm-regra-ativa"]').forEach(el=>el.addEventListener('change',()=>{
    const r=soldaAdmin.regras.find(x=>x.id===Number(el.dataset.id)); if(!r) return;
    soldaAcao(()=>soldaApi('PUT',`/regras/${r.id}`,{nome:r.nome,ativa:el.checked,prioridade:r.prioridade,material:r.material,tipoProduto:r.tipoProduto,fixacaoTipos:r.fixacaoTipos,palavrasTitulo:r.palavrasTitulo||[],faixa:r.faixa,materiaPrimaId:r.materiaPrimaId}),el.checked?'Regra ativada.':'Regra desativada.');
  }));
  todos('[data-act="solda-adm-regra-excluir"]').forEach(el=>el.addEventListener('click',()=>{
    const r=soldaAdmin.regras.find(x=>x.id===Number(el.dataset.id)); if(!r) return;
    if(!confirm(`Excluir a regra "${r.nome}"? As próximas cotações voltam a usar a pontuação automática.`)) return;
    soldaAcao(()=>soldaApi('DELETE',`/regras/${r.id}`),'Regra excluída.');
  }));
  // Simulador
  todos('[data-act="solda-adm-sim-campo"]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{ soldaAdmin.sim[el.dataset.campo]=el.value; }));
  todos('[data-act="solda-adm-sim-fixacao"]').forEach(el=>el.addEventListener('change',()=>{ soldaAdmin.sim.tiposFixacao=alternarFixacaoSolda(soldaAdmin.sim.tiposFixacao,el.dataset.val); render(); }));
  todos('[data-act="solda-adm-sim-rodar"]').forEach(el=>el.addEventListener('click',async()=>{
    const s=soldaAdmin.sim, num=t=>numeroBR(t);
    const faixas=[{faixa:'ate_11cm',perimetroM:num(s.perimetroAte),elementos:Math.max(0,Math.trunc(num(s.elementosAte)))},{faixa:'acima_11cm',perimetroM:num(s.perimetroAcima),elementos:Math.max(0,Math.trunc(num(s.elementosAcima)))}];
    s.erro=''; s.resultado=null;
    if(!faixas.some(f=>f.perimetroM>0||f.elementos>0)){ s.erro='Informe o perímetro ou o número de elementos de ao menos uma faixa.'; render(); return; }
    s.carregando=true; render();
    try{
      s.resultado=await soldaApi('POST','/simular',{titulo:s.titulo.trim(),subcategoria:s.subcategoria.trim()||null,tipoProduto:s.tipoProduto.trim()||null,nomesComposicao:[],tiposFixacao:s.tiposFixacao,...(s.materialManual?{materialManual:s.materialManual}:{}),faixas});
    }catch(error){ s.erro=error.message||'Não foi possível simular.'; }
    finally{ s.carregando=false; render(); }
  }));
}

function formatarDocumentoCliente(documento){
  const digitos=normalizarDocumento(documento);
  if(digitos.length===11) return digitos.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
  if(digitos.length===14) return digitos.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
  return documento||'—';
}

function adminPropostasReais(){
  const lista = Object.entries(propostasReais).map(([id,d])=>({id, ...d}));
  const filtroVendedor = adminState.filtroVendedorPropostas||'';
  const filtradas = lista.filter(p=> !filtroVendedor || p.vendedor===filtroVendedor);
  // Agrupadas por grupoId (versões da mesma proposta), grupos ordenados pela
  // versão mais recente; dentro do grupo, v1, v2, v3... em ordem.
  const gruposCount = {};
  filtradas.forEach(p=>{ const g=p.grupoId||p.id; gruposCount[g]=(gruposCount[g]||0)+1; });
  const ordenadas = [...filtradas].sort((a,b)=>{
    const ga=a.grupoId||a.id, gb=b.grupoId||b.id;
    if(ga!==gb) return new Date(b.criadoEm||0) - new Date(a.criadoEm||0);
    return (a.versao||1) - (b.versao||1);
  });
  const vendedoresComProposta = [...new Set(lista.map(p=>p.vendedor).filter(Boolean))];
  const STATUS_LABEL = {rascunho:'Rascunho', pendente:'Pendente', aprovado:'Aprovado', enviado:'Enviado'};
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Propostas realizadas</h3><p>Propostas salvas pelo vendedor no fluxo real (passo 7 · Orçamento) — separadas por data e vendedor. Uma proposta pode ter várias versões (mesmo cliente, produtos diferentes) via "Criar nova versão".</p></div>
      <span class="badge b-accent">${lista.length} proposta(s)</span>
    </div>
    <label class="field" style="max-width:260px; margin-bottom:12px;">Filtrar por vendedor
      <select data-act="admin-propostas-filtro-vendedor">
        <option value="">Todos</option>
        ${vendedoresComProposta.map(v=>`<option value="${v}" ${filtroVendedor===v?'selected':''}>${v}</option>`).join('')}
      </select>
    </label>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Data emissão</th><th>Versão</th><th>Vendedor</th><th>Cliente</th><th>Produto</th><th>Frete</th><th>Pagamento</th><th>Valor</th><th>Status</th><th>Reação do cliente</th></tr></thead>
        <tbody>
        ${ordenadas.length? ordenadas.map(p=>{
          const grupo = p.grupoId||p.id;
          const reacao = p.reacaoCliente && p.reacaoCliente.tipo ? REACOES_CLIENTE.find(x=>x.key===p.reacaoCliente.tipo) : null;
          return `<tr>
          <td>${p.dataEmissao? new Date(p.dataEmissao).toLocaleDateString('pt-BR') : (p.criadoEm? new Date(p.criadoEm).toLocaleDateString('pt-BR') : '—')}</td>
          <td>v${p.versao||1}${gruposCount[grupo]>1?` <span class="badge b-accent" style="font-size:9px;">${gruposCount[grupo]} versões</span>`:''}</td>
          <td>${p.vendedor||'—'}</td>
          <td title="${escaparHtml([p.clienteCnpj && rotuloDocumento(p.clienteCnpj)+' '+p.clienteCnpj, p.clienteEndereco].filter(Boolean).join(' · '))}">${escaparHtml(p.clienteRazao||p.clienteCnpj||'—')}${p.clienteFantasia ? '<div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">'+escaparHtml(p.clienteFantasia)+'</div>' : ''}</td>
          <td>${p.modeloNome||'—'}</td>
          <td>${FRETE_LABEL[p.modalidadeFrete]||'—'}</td>
          <td>${PAGAMENTO_LABEL[p.metodoPagamento]||'—'}</td>
          <td class="num">${money(p.precoFinal||0)}</td>
          <td><span class="badge b-neutral">${STATUS_LABEL[p.status]||p.status}</span></td>
          <td>${reacao? `<span title="${reacao.label}${p.reacaoCliente.comentario?' — \"'+p.reacaoCliente.comentario+'\"':''}">${reacao.emoji} ${reacao.label}</span>` : '<span style="color:var(--text-faint);">— sem resposta —</span>'}</td>
        </tr>`;}).join('') : `<tr><td colspan="10" class="empty-hint">Nenhuma proposta salva ainda — no Fluxo do vendedor, passo 7, clique em "Salvar proposta".</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

function adminCotacoesHistorico(){
  const servidor = adminState.cotacoesServidor.map(p=>({
    ...p, id:'servidor-'+p.id, numeroCotacao:p.numero, vendedor:p.vendedor,
    modeloNome:p.modeloNome, clienteRazao:p.clienteNome, precoFinal:p.precoFinal,
    clienteFantasia:p.clienteFantasia, clienteEndereco:p.clienteEndereco,
    clienteCnpj:p.clienteCnpj, status:p.status, criadoEm:p.criadaEm, reacaoCliente:p.reacaoCliente,
  }));
  const lista = servidor;
  const numero = (adminState.filtroNumeroPropostas||'').trim().toLowerCase();
  const inicio = adminState.filtroDataInicioPropostas||'';
  const fim = adminState.filtroDataFimPropostas||'';
  const vendedor = adminState.filtroVendedorPropostas||'';
  const filtradas = lista.filter(p=>{
    const dataObj = new Date(p.dataEmissao||p.criadoEm||0);
    const data = Number.isNaN(dataObj.getTime())?'':[dataObj.getFullYear(),String(dataObj.getMonth()+1).padStart(2,'0'),String(dataObj.getDate()).padStart(2,'0')].join('-');
    return (!numero || String(p.numeroCotacao||'').toLowerCase().includes(numero))
      && (!inicio || data>=inicio) && (!fim || data<=fim)
      && (!vendedor || p.vendedor===vendedor);
  }).sort((a,b)=>new Date(b.criadoEm||b.dataEmissao||0)-new Date(a.criadoEm||a.dataEmissao||0));
  const vendedores = [...new Set(lista.map(p=>p.vendedor).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const STATUS_LABEL = {aberta:'Enviada', aceita:'Aceita', recusada:'Recusada', expirada:'Expirada', enviado:'Enviada'};
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Cotações concluídas</h3><p>Orçamentos concluídos no CPQ Letreiros Express, com número e link interativo para o cliente responder.</p></div>
      <span class="badge b-accent">${adminState.cotacoesCarregando?'Atualizando…':filtradas.length+' cotação(ões)'}</span>
    </div>
    ${adminState.cotacoesErro?`<div class="warnbox" style="margin-bottom:12px;">${escaparHtml(adminState.cotacoesErro)}</div>`:''}
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;">
      <label class="field">Data inicial<input type="date" value="${escaparHtml(inicio)}" data-act="admin-propostas-data-inicio"></label>
      <label class="field">Data final<input type="date" value="${escaparHtml(fim)}" data-act="admin-propostas-data-fim"></label>
      <label class="field">Número da cotação<input type="text" placeholder="Ex.: COT-000123" value="${escaparHtml(adminState.filtroNumeroPropostas||'')}" data-act="admin-propostas-filtro-numero"></label>
      <label class="field">Vendedor<select data-act="admin-propostas-filtro-vendedor"><option value="">Todos</option>${vendedores.map(v=>`<option value="${escaparHtml(v)}" ${vendedor===v?'selected':''}>${escaparHtml(v)}</option>`).join('')}</select></label>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Data</th><th>Número</th><th>Vendedor</th><th>Cliente</th><th>Produto</th><th>Frete</th><th>Pagamento</th><th>Valor</th><th>Status / resposta</th><th>Link</th></tr></thead>
      <tbody>${filtradas.length?filtradas.map(p=>{
        const reacao = p.reacaoCliente?.tipo ? REACOES_CLIENTE.find(x=>x.key===p.reacaoCliente.tipo) : null;
        const pagamentoResposta=p.reacaoCliente?.formaPagamento?`${PAGAMENTO_LABEL[p.reacaoCliente.formaPagamento]||p.reacaoCliente.formaPagamento}${p.reacaoCliente.formaPagamento==='cartao'?` ${p.reacaoCliente.parcelasCartao||1}x · ${money(p.reacaoCliente.valorPagamento||p.precoFinal||0)}`:''}`:'';
        const link = p.token ? linkCotacaoPublica(p.token) : '';
        const data = p.dataEmissao||p.criadoEm;
        const cliente = p.clienteNome||p.clienteRazao||p.clienteCnpj||'—';
        return `<tr>
          <td>${data?new Date(data).toLocaleDateString('pt-BR'):'—'}</td>
          <td class="mono">${escaparHtml(p.numeroCotacao||'—')}</td>
          <td>${escaparHtml(p.vendedor||'—')}</td>
          <td title="${escaparHtml([p.clienteCnpj,p.clienteEndereco].filter(Boolean).join(' · '))}">${escaparHtml(cliente)}${p.clienteFantasia?`<div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">${escaparHtml(p.clienteFantasia)}</div>`:''}</td>
          <td>${p.tituloProposta?`<b>${escaparHtml(p.tituloProposta)}</b><div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;">${escaparHtml(p.modeloNome||'')}</div>`:escaparHtml(p.modeloNome||'—')}</td>
          <td>${FRETE_LABEL[p.modalidadeFrete]||'—'}</td>
          <td>${PAGAMENTO_LABEL[p.metodoPagamento]||'—'}</td>
          <td class="num">${money(p.precoFinal||0)}</td>
          <td><span class="badge b-neutral">${STATUS_LABEL[p.status]||p.status||'Enviada'}</span>${reacao?`<div style="font-size:11px;margin-top:4px;" title="${escaparHtml(reacao.label+(p.reacaoCliente.comentario?' — '+p.reacaoCliente.comentario:''))}">${reacao.emoji} ${escaparHtml(reacao.label)}</div>`:''}${pagamentoResposta?`<div style="font-size:10.5px;color:var(--text-dim);margin-top:3px;">Pagamento: ${escaparHtml(pagamentoResposta)}</div>`:''}</td>
          <td>${link?`<div style="display:flex;gap:6px;flex-wrap:wrap;"><a class="btn btn-ghost btn-sm" href="${escaparHtml(link)}" target="_blank" rel="noopener">Abrir</a><button class="btn btn-ghost btn-sm" data-act="admin-cotacao-copiar" data-url="${escaparHtml(link)}">Copiar link</button></div>`:'<span style="color:var(--text-faint);">Link não disponível</span>'}</td>
        </tr>`;
      }).join(''):`<tr><td colspan="10" class="empty-hint">Nenhuma cotação encontrada para estes filtros.</td></tr>`}</tbody>
    </table></div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn btn-ghost btn-sm" data-act="admin-propostas-atualizar">Atualizar histórico</button></div>
  </div>`;
}

function adminProdutos(){
  if(!catalog.ready) return `<div class="card"><div class="empty-hint">Carregando catálogo real do MubiSys…</div></div>`;
  const q = normalizeSearch(adminState.produtoQuery);
  // Excluído sempre vai para o fim da lista — ordenação estável, então a
  // ordem original do catálogo é preservada dentro de cada grupo (ativos
  // primeiro, excluídos depois). A posição é derivada de produtosExcluidos,
  // que já é persistido (salvarExclusoes) — não precisa de campo de ordem
  // separado: excluir/reativar já reordena e já fica salvo. Pedido do
  // usuário 29/09/2026.
  const visiveis = catalog.produtos
    .filter(p=> !q || normalizeSearch(p.nome+' '+skuProduto(p.id)+' '+p.modelos.map(m=>skuModelo(p.id,m.id)).join(' ')).includes(q))
    .slice()
    .sort((a,b)=> (adminState.produtosExcluidos.has(a.id)?1:0) - (adminState.produtosExcluidos.has(b.id)?1:0));
  const cadastrados = Object.keys(adminState.kits).length;
  return `
  <div class="card">
    <div class="cardhead">
      <div><h3>Produtos (catálogo real do MubiSys)</h3><p>${catalog.produtos.length} produtos espelhados via API GET /produto. Cada produto recebe um SKU Radrasys fixo a partir do ID MubiSys; cada modelo tem um SKU derivado do produto e do ID do modelo. Busque por nome ou SKU para localizar configurações.</p><p>As variações vêm do catálogo. Para importar a ficha de consumo de cada variação, conecte a conta do MubiSys abaixo; se não houver ficha importada, a composição manual por modelo continua disponível.</p>${catalog.baixadoEm?`<p style="font-size:11.5px;color:var(--text-faint);margin-top:5px;">Última consulta ao MubiSys: ${new Date(catalog.baixadoEm).toLocaleString('pt-BR')}</p>`:''}</div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
        <span class="badge b-accent">${cadastrados} modelo(s) cadastrado(s)</span>
        <span class="badge ${kitsApiDisponivel?'b-ok':'b-warn'}">${kitsCarregando?'Carregando cadastros…':kitsApiDisponivel?'✓ gravação no banco compartilhado':`⚠ banco indisponível${kitsApiErro?': '+escaparHtml(kitsApiErro):''}`}</span>
        <button class="btn btn-ghost btn-sm" data-act="admin-catalogo-atualizar" ${catalog.refreshing?'disabled':''}>${catalog.refreshing?'Atualizando…':'Atualizar catálogo do MubiSys'}</button>
      </div>
    </div>
    ${renderConexaoMubiSys()}
    ${catalogErrorNotice()}
    <input type="text" placeholder="Buscar produto ou SKU…" value="${adminState.produtoQuery}" data-act="admin-produto-query" style="width:100%; margin-bottom:12px;">
    <div class="tablewrap">
      ${visiveis.length? visiveis.map(p=>adminProdutoRow(p)).join('') : `<div class="empty-hint">Nenhum produto encontrado para "${adminState.produtoQuery}".</div>`}
    </div>
  </div>`;
}

  return `

    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; cursor:pointer; ${excluido?'opacity:.45;':''}" data-act="admin-toggle-produto" data-val="${p.id}">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="color:var(--text-faint); font-size:12px;">${expanded?'▾':'▸'}</span>
        <div>
          <div style="font-weight:600; font-size:13.5px;">${p.nome}${excluido?' <span class="badge b-bad" style="margin-left:6px;">excluído</span>':''}</div>
          <div style="font-size:10.5px;color:var(--accent-ink);margin-top:2px;">SKU do produto: <span class="mono">${skuProduto(p.id)}</span></div>

        </div>

function adminKitEditor(p, m, key){
  const kitState = adminState.kits[key] || {linhas:[], precificacao:null};
  const estadoSalvamento=textoEstadoSalvamentoKit(key);
  const kit = kitState.linhas;
  const q = adminState.adminMatQuery||'';
  const matches = q.length>=2 ? catalog.materias.filter(x=>!adminState.materiasExcluidas.has(x.id) && normalizeSearch(x.nome).includes(normalizeSearch(q))).slice(0,40) : [];

  const modoPreco = kitState.precificacao && ['fixo','lucro'].includes(kitState.precificacao.modo) ? kitState.precificacao.modo : 'margem';
  // Linha da Tabela de Preços já vinculada (se houver) — resolvida direto
  // pelo ID de linha, não mais por seção. Pedido do usuário 29-30/09/2026.
  const linhaVinculada = kitState.precificacao && kitState.precificacao.lineId!=null
    ? catalog.margens.find(l=>l.lineId===kitState.precificacao.lineId) : null;
  const precoLinhaQuery = adminState.precoLinhaQuery||'';
  const precoLinhaMatches = buscarLinhasPrecificacao(precoLinhaQuery);

  const kitProdutos = Array.isArray(kitState.kitProdutos) ? kitState.kitProdutos : [];
  const kpq = String(adminState.kitProdutoQuery||'').trim();
  const kitProdutoModeloSelecionado = catalog.produtos.find(prod=>prod.id===adminState.kitProdutoProdutoIdSelecionado) || null;
  const kitProdutoModeloSelecionadoKey = String(adminState.kitProdutoModeloSelecionadoKey||'');
  const kitProdutoModeloSelecionadoMod = kitProdutoModeloSelecionado
    ? kitProdutoModeloSelecionado.modelos.find(mod=>kitKey(kitProdutoModeloSelecionado.id,mod.id)===kitProdutoModeloSelecionadoKey) || null
    : null;
  const kitProdutoMatches = kpq.length>=1
    ? catalog.produtos.filter(prod=>{
        const modelosTexto=prod.modelos.map(mod=>{
          const k=kitKey(prod.id,mod.id);
          const existente=adminState.kits[k];
          return (existente && existente.nomeCompleto) || `${prod.nome} ${mod.nome} ${skuModelo(prod.id,mod.id)}`;
        }).join(' ');
        return normalizeSearch(`${prod.nome} ${skuProduto(prod.id)} ${modelosTexto}`).includes(normalizeSearch(kpq));
      }).slice(0,40)
    : [];
  const kitCopiaQuery=String(adminState.kitCopiaQuery||'').trim();
  const kitCopiaSelecionadoKey=adminState.kitCopiaSelecionadoKey===key?null:adminState.kitCopiaSelecionadoKey;
  const kitCopiaSelecionado=kitCopiaSelecionadoKey?adminState.kits[kitCopiaSelecionadoKey]:null;
  const kitCopiaMatches=kitCopiaQuery.length>=1
    ? Object.entries(adminState.kits).filter(([origemKey,origem])=>{
        if(origemKey===key) return false;
        const linhas=Array.isArray(origem.linhas)?origem.linhas:[];
        const vinculados=Array.isArray(origem.kitProdutos)?origem.kitProdutos:[];
        if(!linhas.length&&!vinculados.length) return false;
        const [produtoId,modeloId]=origemKey.split('_').map(Number);
        const produto=catalog.produtos.find(item=>item.id===produtoId);
        const modelo=produto && produto.modelos.find(item=>item.id===modeloId);
        const busca=`${nomeModeloPorKey(origemKey)} ${skuModeloPorKey(origemKey)} ${produto?.nome||''} ${modelo?.nome||''}`;
        return normalizeSearch(busca).includes(normalizeSearch(kitCopiaQuery));
      }).slice(0,30).map(([origemKey,origem])=>({
        key:origemKey,
        nome:nomeModeloPorKey(origemKey),
        linhas:Array.isArray(origem.linhas)?origem.linhas:[],
        vinculados:Array.isArray(origem.kitProdutos)?origem.kitProdutos:[],

    : [];

  const kitVariacaoQuery=String(adminState.kitVariacaoQuery||'').trim();
  const variacaoIdx=String(adminState.kitVariacaoLinhaKey||'').startsWith(`${key}:`)?parseInt(adminState.kitVariacaoLinhaKey.slice(key.length+1)):null;
  const kitVariacaoLinha=Number.isInteger(variacaoIdx)?kit[variacaoIdx]:null;
  const kitVariacaoOpcoes=kitVariacaoLinha && Array.isArray(kitVariacaoLinha.variantes)?kitVariacaoLinha.variantes:[];
  const kitVariacaoMaterialSelecionado=catalog.materias.find(m=>m.id===adminState.kitVariacaoMaterialSelecionadoId) || null;
  const kitVariacaoTermo=normalizeSearch(kitVariacaoQuery);
  const kitVariacaoMatches=kitVariacaoLinha && kitVariacaoQuery.length>=2
    ? catalog.materias.filter(m=>!adminState.materiasExcluidas.has(m.id)&&m.id!==kitVariacaoLinha.matId&&!kitVariacaoOpcoes.some(v=>v.matId===m.id)&&normalizeSearch(m.nome).includes(kitVariacaoTermo)).sort((a,b)=>normalizeSearch(a.nome).indexOf(kitVariacaoTermo)-normalizeSearch(b.nome).indexOf(kitVariacaoTermo)).slice(0,25)
    : [];

  const variacoesModelo = variacoesAtivasDoModelo(m);
  const baseKit = baseCobrancaValida(kitState.baseCobranca);
  const catAtual = kitState.categoria && CATEGORIAS_PRODUTO[kitState.categoria] ? kitState.categoria : '';
  const subcatsDaCat = catAtual ? Object.keys(CATEGORIAS_PRODUTO[catAtual]) : [];
  const subcatAtual = kitState.subcategoria && subcatsDaCat.includes(kitState.subcategoria) ? kitState.subcategoria : '';
  const tiposDaSubcat = (catAtual && subcatAtual) ? CATEGORIAS_PRODUTO[catAtual][subcatAtual] : [];

  return `

        <select data-act="admin-tipo-produto" data-key="${key}" ${!tiposDaSubcat.length?'disabled':''}>

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Foto do produto <span style="font-weight:400; text-transform:none;">— aparece na proposta comercial</span></p>

      ${kitState.fotoUrl? `<img src="${kitState.fotoUrl}" style="width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--border);">` : `<div style="width:90px; height:90px; border-radius:8px; border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-faint); text-align:center;">sem foto</div>`}
      <input type="file" accept="image/*" data-act="admin-foto-produto" data-key="${key}" ${assetsApi?'':'disabled'}>
    </div>
    ${!assetsApi? `<p style="font-size:11px; color:var(--text-faint); margin-top:4px;">Upload de imagem indisponível nesta visão (sem grant de assets).</p>` : ''}

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Prazo de produção</p>

      <input type="text" inputmode="numeric" value="${kitState.prazoDiasUteis??''}" data-act="admin-prazo-dias" data-key="${key}" placeholder="ex: 5">

          const cadastro=adminState.kits[modeloKey];
          const nomeModelo=(cadastro&&cadastro.nomeCompleto)||`${kitProdutoModeloSelecionado.nome} — ${mod.nome}`;
          return `<button type="button" data-act="admin-kitproduto-selecionar-modelo" data-val="${modeloKey}" data-key="${key}" ${jaVinculado||principal?'disabled':''} style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:0;border-radius:8px;background:${selecionado?'var(--surface-2)':'transparent'};color:${jaVinculado||principal?'var(--text-faint)':'var(--text)'};text-align:left;cursor:${jaVinculado||principal?'default':'pointer'};font-size:12.5px;"><span style="color:var(--accent);font-weight:700;">${jaVinculado?'✓':principal?'•':selecionado?'✓':'○'}</span><span class="mono" style="color:var(--accent-ink);">${skuModelo(kitProdutoModeloSelecionado.id,mod.id)}</span><span>${escaparHtml(nomeModelo)}</span><span style="margin-left:auto;color:var(--text-faint);">${jaVinculado?'já vinculado':principal?'produto principal':selecionado?'selecionado':''}</span></button>`;
        }).join(''):'<p class="empty-hint">Este produto não possui modelos cadastrados no MubiSys.</p>'}
        ${kitProdutoModeloSelecionadoMod?`<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px;box-shadow:none;background:var(--surface-2);"><div><strong>Modelo selecionado para adicionar</strong><div class="mono" style="font-size:10.5px;color:var(--accent-ink);margin-top:2px;">${skuModelo(kitProdutoModeloSelecionado.id,kitProdutoModeloSelecionadoMod.id)} · ${escaparHtml((adminState.kits[kitProdutoModeloSelecionadoKey]&&adminState.kits[kitProdutoModeloSelecionadoKey].nomeCompleto)||`${kitProdutoModeloSelecionado.nome} — ${kitProdutoModeloSelecionadoMod.nome}`)}</div></div>${variacoesAtivasDoModelo(kitProdutoModeloSelecionadoMod).length?`<label class="field" style="min-width:220px;">Variação padrão<select data-act="admin-kitproduto-variacao-padrao"><option value="">Nenhuma (escolher na cotação)</option>${variacoesAtivasDoModelo(kitProdutoModeloSelecionadoMod).map(v=>`<option value="${v.id}" ${String(adminState.kitProdutoVariacaoPadrao)===String(v.id)?'selected':''}>${escaparHtml(v.nome)}${v.padrao?' · padrão no MubiSys':''}</option>`).join('')}</select></label>`:''}<button type="button" class="btn btn-primary btn-sm" data-act="admin-kitproduto-confirmar" data-val="${kitProdutoModeloSelecionadoKey}" data-key="${key}">Adicionar produto ao kit</button></div>`:''}
      </div>` : kitProdutoMatches.length? `<div class="card" style="position:absolute; z-index:20; width:100%; margin-top:4px; padding:6px; max-height:260px; overflow:auto;">
        ${kitProdutoMatches.map(prod=>{
          const disponiveis=prod.modelos.filter(mod=>kitKey(prod.id,mod.id)!==key&&!kitProdutos.some(kp=>kp.key===kitKey(prod.id,mod.id))).length;
          return `<button type="button" data-act="admin-kitproduto-selecionar-produto" data-val="${prod.id}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer;font-size:12.5px;"><span style="color:var(--accent);font-weight:700;">›</span><span class="mono" style="color:var(--accent-ink);">${skuProduto(prod.id)}</span><span>${escaparHtml(prod.nome)}</span><span style="margin-left:auto;color:var(--text-faint);">${disponiveis} modelo(s) disponível(is)</span></button>`;
        }).join('')}
      </div>` : (kpq.length ? '<p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">Nenhum produto encontrado para esta busca.</p>' : '')}
    </div>
    ${kitProdutos.length? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">
      ${kitProdutos.map((kp,i)=>`<span class="badge b-neutral" style="gap:6px;"><span class="mono">${skuModeloPorKey(kp.key)}</span> ${kp.nome}${kp.variacaoPadraoNome?` · ${escaparHtml(kp.variacaoPadraoNome)}`:''}${baseCobrancaValida(adminState.kits[kp.key]?.baseCobranca)?` · por ${ROTULO_CURTO_BASE_COBRANCA[adminState.kits[kp.key].baseCobranca]}`:''} <button type="button" data-act="admin-kitproduto-remove" data-key="${key}" data-idx="${i}" style="background:none;border:none;cursor:pointer;color:var(--text-faint);padding:0;">✕</button></span>`).join('')}
    </div><p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">${kitProdutos.length} modelo(s) vinculado(s). Pesquise outro produto para adicionar mais.</p>` : `<p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">Nenhum modelo vinculado. Você pode adicionar vários produtos e modelos do catálogo.</p>`}

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Variações do modelo <span style="font-weight:400; text-transform:none;">— importadas do MubiSys (${variacoesModelo.length})</span></p>
    ${variacoesModelo.length? `<div style="display:flex; flex-wrap:wrap; gap:6px;">${variacoesModelo.map(v=>`<span class="badge b-neutral" title="ID MubiSys ${v.id}">${escaparHtml(v.nome)}${v.padrao?' · padrão':''}${v.valorFinal>0?` · ${money(v.valorFinal)}`:''}</span>`).join('')}</div>
    <div style="margin-top:8px;"><button type="button" class="btn btn-soft btn-sm" data-act="admin-kit-importar-mubisys" data-key="${key}" ${catalog.mubisysWebConectado?'':'disabled'}>Importar composição do MubiSys (comum + variações)</button>${catalog.mubisysWebConectado?'':' <span style="font-size:11px;color:var(--text-faint);">Conecte o MubiSys na barra acima para habilitar.</span>'}</div>
    <p style="font-size:11px;color:var(--text-faint);margin-top:6px;">Na composição abaixo, cada matéria-prima pode valer para todas as variações (comum) ou só para uma delas. No orçamento entram as linhas comuns mais as das variações escolhidas pelo vendedor.</p>`
    : `<p style="font-size:11.5px;color:var(--text-faint);">Este modelo não tem variações ativas no MubiSys. Se acabou de cadastrá-las lá, recarregue a página para atualizar o catálogo.</p>`}

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Como este produto é cobrado <span style="font-weight:400; text-transform:none;">— base de consumo quando ele entra no kit de outro produto</span></p>
    <div class="card" style="padding:12px;box-shadow:none;background:var(--surface);" data-teste="base-cobranca-produto">
      <label class="field" style="max-width:460px;">Base de cobrança
        <select data-act="admin-kit-base-cobranca" data-key="${key}">
          <option value="">Cada matéria-prima define a sua fórmula</option>
          ${BASES_COBRANCA_PRODUTO.map(b=>`<option value="${b}" ${baseKit===b?'selected':''}>${FORMULA_TYPES[b].label}</option>`).join('')}
        </select>
      </label>
      <p style="font-size:11px;color:var(--text-faint);margin-top:6px;">${baseKit
        ? `Cada matéria-prima abaixo é a <strong>quantidade por ${POR_BASE_COBRANCA[baseKit]}</strong> do letreiro. Ex.: ${baseKit==='fixo'?'2 unidades → 2 por letreiro':'12 → em 0,5 '+(baseKit.startsWith('perim')?'m':'m²')+' entram 6'}; o custo é essa quantidade × o custo atual da matéria-prima no MubiSys. Uma linha pode abrir exceção escolhendo outra fórmula na tabela.`
        : 'Escolha como cobrar este produto: área líquida (ex.: pintura, iluminação LED), área geral, perímetro ou unidade. Sem escolha, a fórmula é definida linha a linha na composição.'}</p>
    </div>

    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Composição — matéria-prima real <span style="font-weight:400; text-transform:none;">(quantas quiser${baseKit?` · quantidade por ${POR_BASE_COBRANCA[baseKit]}`:''})</span></p>
    <div style="position:relative;">
      <input type="text" placeholder="Buscar matéria-prima real…" value="${q}" data-act="admin-mat-query" style="width:100%;">
      ${matches.length? `<div class="card" style="position:absolute; z-index:10; width:100%; margin-top:4px; padding:6px; max-height:280px; overflow:auto;">
        ${matches.map(x=>`<div data-act="admin-mat-add" data-val="${x.id}" data-key="${key}" style="padding:7px 9px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:12.5px;">
          <span>${x.nome}</span><span class="mono" style="color:var(--text-faint);">${money(x.valor)}/${x.unidade}</span>
        </div>`).join('')}
      </div>`:''}
    </div>
    <div class="tablewrap" style="margin-top:${matches.length?'60px':'10px'};">
      <table>
        <thead><tr><th>Matéria-prima</th><th>Papel na peça</th>${variacoesModelo.length?'<th>Vale para</th>':''}<th>Fórmula de consumo</th><th>${baseKit?`Qtd. por ${baseKit==='fixo'?'unidade':baseKit.startsWith('perim')?'metro':'m²'}`:'Mult.'}</th><th></th></tr></thead>
        <tbody>
        ${kit.length? kit.map((k,i)=>`
          <tr>
            <td>${k.nome}<div class="source-tag">${ICONS.db} unidade real: ${k.unidade}</div><button type="button" class="btn btn-ghost btn-sm" data-act="admin-kit-variacao-toggle" data-key="${key}" data-idx="${i}" style="display:block;margin-top:5px;">${Array.isArray(k.variantes)&&k.variantes.length?`Variações (${k.variantes.length})`:"Criar variação"}</button></td>
            <td><select data-act="admin-kit-papel" data-idx="${i}">
              <option value="">— selecione —</option>
              ${papeisDePeca().map(pp=>`<option value="${pp}" ${k.papel===pp?'selected':''}>${pp}</option>`).join('')}
            </select></td>
            ${variacoesModelo.length?`<td><select data-act="admin-kit-variacao-modelo" data-idx="${i}" style="max-width:190px;">
              <option value="">Todas (comum)</option>
              ${variacoesModelo.map(v=>`<option value="${v.id}" ${String(k.variacaoModeloId)===String(v.id)?'selected':''}>${escaparHtml(v.nome)}</option>`).join('')}
            </select></td>`:''}
            <td><select data-act="admin-kit-formula" data-idx="${i}">${Object.entries(FORMULA_TYPES).map(([fk,f])=>`<option value="${fk}" ${k.formulaType===fk?'selected':''}>${f.label}</option>`).join('')}</select>${baseKit&&k.formulaType!==baseKit?`<div class="source-tag" title="A base do produto é ${escaparHtml(ROTULO_CURTO_BASE_COBRANCA[baseKit])}; esta linha usa outra fórmula.">≠ base do produto (${escaparHtml(ROTULO_CURTO_BASE_COBRANCA[baseKit])})</div>`:''}</td>
            <td><input type="text" inputmode="decimal" value="${k.mult}" data-act="admin-kit-mult" data-idx="${i}" style="width:70px;"></td>
            <td><button class="btn btn-ghost btn-sm" data-act="admin-kit-remove" data-idx="${i}">✕</button></td>
          </tr>`).join('') : `<tr><td colspan="6" class="empty-hint">Nenhum item ainda — busque acima e clique num resultado (pode adicionar quantas matérias-primas precisar).</td></tr>`}
        </tbody>
      </table>
    </div>

    ${kitVariacaoLinha? `<div class="card" style="margin-top:10px;padding:12px;box-shadow:none;background:var(--surface-2);">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;"><strong>Variações da matéria-prima: ${escaparHtml(kitVariacaoLinha.nome)}</strong><button type="button" class="btn btn-ghost btn-sm" data-act="admin-kit-variacao-fechar">Fechar</button></div>
      <p style="font-size:11px;color:var(--text-faint);margin:4px 0 10px;">No orçamento, escolha uma das opções para trocar a matéria-prima desta linha. "Nenhuma" mantém a matéria-prima principal. A busca inclui todo o catálogo. Se a unidade da opção for diferente, confira o aviso antes de adicionar: o cálculo não faz conversão automática.</p>
      <label class="field" style="max-width:320px;">Nome da variação (ex.: Cor)
        <input type="text" maxlength="80" placeholder="Ex.: Cor" value="${escaparHtml(kitVariacaoLinha.variacaoNome||"")}" data-act="admin-kit-variacao-nome" data-key="${key}" data-idx="${variacaoIdx}">
      </label>
      <label class="field" style="max-width:420px;margin-top:8px;">Padrão para novos orçamentos
        <select data-act="admin-kit-variacao-padrao" data-key="${key}" data-idx="${variacaoIdx}">
          <option value="">Nenhuma (matéria-prima principal)</option>
          ${kitVariacaoOpcoes.map(opcao=>`<option value="${opcao.matId}" ${String(kitVariacaoLinha.variacaoPadraoMatId)===String(opcao.matId)?'selected':''}>${escaparHtml(opcao.valor||opcao.nome)} · ${escaparHtml(opcao.nome)}</option>`).join('')}
        </select>
      </label>
      <p style="font-size:11px;color:var(--text-faint);margin:4px 0 8px;">O orçamento começa com esta escolha; o vendedor ainda pode trocar a opção ou selecionar “Nenhuma”.</p>
      <label class="field" style="margin-top:8px;">Buscar matéria-prima para uma opção de variação
        <input type="text" placeholder="Buscar matéria-prima no catálogo..." value="${escaparHtml(kitVariacaoQuery)}" data-act="admin-kit-variacao-query" data-key="${key}" data-idx="${variacaoIdx}">
      </label>
      ${kitVariacaoMatches.length? `<div class="card" style="margin-top:4px;padding:5px;box-shadow:none;">${kitVariacaoMatches.map(m=>{const mesmaUnidade=m.unidade===kitVariacaoLinha.unidade; return `<button type="button" data-act="admin-kit-variacao-selecionar" data-key="${key}" data-idx="${variacaoIdx}" data-mat="${m.id}" style="display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:6px;background:${adminState.kitVariacaoMaterialSelecionadoId===m.id?'var(--surface-2)':'transparent'};color:var(--text);text-align:left;cursor:pointer;"><span>${adminState.kitVariacaoMaterialSelecionadoId===m.id?'✓':'○'} ${escaparHtml(m.nome)}</span><span class="mono">${money(m.valor)}/${escaparHtml(m.unidade)}${mesmaUnidade?'':' · unidade diferente da base'}</span></button>`;}).join("")}</div>` : kitVariacaoQuery.length>=2? '<p style="font-size:11px;color:var(--text-faint);">Nenhuma matéria-prima encontrada no catálogo para esse termo.</p>' : '<p style="font-size:11px;color:var(--text-faint);margin:4px 0;">Pesquise e selecione um material; depois clique em “Adicionar variação”. Repita para cadastrar outras opções.</p>'}
      ${kitVariacaoMaterialSelecionado? `<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:9px;box-shadow:none;"><div><strong>Opção selecionada</strong><div style="font-size:11px;color:var(--text-faint);">${escaparHtml(kitVariacaoMaterialSelecionado.nome)} · ${money(kitVariacaoMaterialSelecionado.valor)}/${escaparHtml(kitVariacaoMaterialSelecionado.unidade)}</div>${kitVariacaoMaterialSelecionado.unidade!==kitVariacaoLinha.unidade?`<p role="alert" style="font-size:11px;color:var(--text-faint);margin:5px 0 0;">A unidade (${escaparHtml(kitVariacaoMaterialSelecionado.unidade)}) difere da matéria-prima base (${escaparHtml(kitVariacaoLinha.unidade)}). O orçamento usará a quantidade calculada sem conversão.</p>`:''}</div><button type="button" class="btn btn-primary btn-sm" data-act="admin-kit-variacao-add" data-key="${key}" data-idx="${variacaoIdx}" data-mat="${kitVariacaoMaterialSelecionado.id}">${kitVariacaoMaterialSelecionado.unidade===kitVariacaoLinha.unidade?'+ Adicionar variação':'Adicionar mesmo assim'}</button></div>` : ''}
      ${kitVariacaoOpcoes.length? `<div style="display:grid;gap:6px;margin-top:10px;">${kitVariacaoOpcoes.map((opcao,opIdx)=>`<div style="display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,2fr) auto auto;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;"><input type="text" maxlength="80" placeholder="Valor da opção" value="${escaparHtml(opcao.valor||opcao.nome||"")}" data-act="admin-kit-variacao-valor" data-key="${key}" data-idx="${variacaoIdx}" data-opcao="${opIdx}"><span>${escaparHtml(opcao.nome)}</span><span class="mono">${money(opcao.custo)}/${escaparHtml(opcao.unidade)}</span><button type="button" class="btn btn-ghost btn-sm" data-act="admin-kit-variacao-remover" data-key="${key}" data-idx="${variacaoIdx}" data-opcao="${opIdx}">Remover</button></div>`).join("")}</div>` : '<p style="font-size:11px;color:var(--text-faint);margin-top:8px;">Ainda não há opções. Sem opção selecionada, o orçamento usa a matéria-prima principal.</p>'}
    </div>` : ""}
    <p style="font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; margin:16px 0 6px;">Precificação — linha da Tabela de Preços</p>
    <div class="segtabs" style="width:fit-content; margin-bottom:10px;">
      <button type="button" data-act="admin-preco-modo" data-key="${key}" data-val="margem" class="${modoPreco==='margem'?'active':''}">Margem por faixa (oscila com o ticket)</button>
      <button type="button" data-act="admin-preco-modo" data-key="${key}" data-val="lucro" class="${modoPreco==='lucro'?'active':''}">% de lucro do produto</button>
      <button type="button" data-act="admin-preco-modo" data-key="${key}" data-val="fixo" class="${modoPreco==='fixo'?'active':''}">Preço fixo</button>
    </div>
    ${modoPreco==='lucro'? `
    <label class="field" style="max-width:220px;">% de lucro (sobre o preço de venda)
      <input type="text" inputmode="decimal" value="${kitState.precificacao && kitState.precificacao.margemPct || ''}" data-act="admin-preco-lucro-valor" data-key="${key}" placeholder="ex: 35">
    </label>
    <p style="font-size:11px; color:var(--text-faint); margin-top:4px;">Preço = custo direto ÷ (1 − lucro). Ex.: 35% de lucro sobre um custo de R$ 65 dá preço de R$ 100. O custo vem da composição de matérias-primas (e das variações escolhidas no orçamento).</p>
    ` : modoPreco==='fixo'? `
    <label class="field" style="max-width:220px;">Preço de venda fixo (R$)
      <input type="text" inputmode="decimal" value="${kitState.precificacao && kitState.precificacao.precoFixo || ''}" data-act="admin-preco-fixo-valor" data-key="${key}" placeholder="ex: 350,00">
    </label>
    <p style="font-size:11px; color:var(--text-faint); margin-top:4px;">Preço fixo ignora custo/margem — usado direto na proposta (menos desconto). Indicado pra produto padronizado de ticket baixo.</p>
    ` : `
    <p style="font-size:11.5px; color:var(--text-faint); margin-bottom:6px;">Busque pelo número do ID (o mesmo que aparece na sua Tabela de Preços impressa) ou pelo nome — ${catalog.margens.length} linhas reais, vindas direto do Radrasys.</p>
    <div style="position:relative;">
      <input type="text" placeholder="Ex: 56 ou frontlight galvanizado…" value="${precoLinhaQuery}" data-act="admin-preco-linha-query" style="width:100%;">
      ${precoLinhaMatches.length? `<div class="card" style="position:absolute; z-index:10; width:100%; margin-top:4px; padding:6px; max-height:300px; overflow:auto;">
        ${precoLinhaMatches.map(l=>`<div data-act="admin-preco-linha-add" data-val="${l.lineId}" data-key="${key}" style="padding:7px 9px; border-radius:8px; cursor:pointer; font-size:12.5px;">
          <span class="mono" style="color:var(--text-faint);">#${l.lineId}</span> ${l.secaoTitulo}${l.rotulo!=='Margem'?' — '+l.rotulo:''}
          <span style="font-size:10.5px; color:var(--text-faint);"> · pág. ${l.pagina} · ${l.aba==='novo_cliente'?'novo cliente':l.aba==='clientes_antigos'?'clientes antigos':'consulta'}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
    ${linhaVinculada? `<div class="tablewrap price-margin-wrap" style="margin-top:10px;">
      <table><thead><tr>${linhaVinculada.colunas.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
      <tbody><tr>${linhaVinculada.valores.map(v=>`<td class="num">${v}</td>`).join('')}</tr></tbody></table>
    </div>
    <div class="source-tag" style="margin-top:6px;">${ICONS.db} #${linhaVinculada.lineId} — ${linhaVinculada.secaoTitulo}${linhaVinculada.rotulo!=='Margem'?' — '+linhaVinculada.rotulo:''} · margem real por faixa de custo (ticket = matéria-prima + custo fixo). Fonte: Tabela de Preços do Radrasys.</div>
    <button class="btn btn-ghost btn-sm" style="margin-top:6px;" data-act="admin-preco-linha-remover" data-key="${key}">✕ Remover vínculo (usa margem manual no orçamento)</button>`
    : `<p style="font-size:11.5px; color:var(--text-faint); margin-top:6px;">Sem vínculo — usa margem manual no orçamento.</p>`}
    `}

    <div class="footer-nav">
      <div>
        <div class="role-note" data-kit-save-status="${key}" role="status" aria-live="polite">${escaparHtml(estadoSalvamento)}</div>
        <div class="role-note" style="margin-top:4px;">${ICONS.info} A unidade de medida vem automática da matéria-prima real. O cálculo do orçamento usa a geometria vetorizada.</div>
      </div>
      <button class="btn btn-primary btn-sm" data-act="admin-kit-done" data-val="${key}">${ICONS.check} Salvar e concluir</button>
    </div>
  </div>`;
}

function adminMateriasAdmin(){
  if(!catalog.ready) return `<div class="card"><div class="empty-hint">Carregando catálogo real do MubiSys…</div></div>`;
  const q = normalizeSearch(adminState.materiaQuery);
  // Mesma regra de Produtos: excluída sempre no fim, ordenação estável (ativas
  // mantêm a ordem original do catálogo entre si) — posição derivada de
  // materiasExcluidas, que já é persistido (salvarExclusoes). Pedido do
  // usuário 29/09/2026.
  const visiveis = catalog.materias
    .filter(m=> !q || normalizeSearch(m.nome).includes(q))
    .slice()
    .sort((a,b)=> (adminState.materiasExcluidas.has(a.id)?1:0) - (adminState.materiasExcluidas.has(b.id)?1:0));
  const excluidas = adminState.materiasExcluidas.size;

    return ' <span class="badge b-neutral" style="margin-left:4px;" title="Ainda não categorizada no cadastro de Produtos">Sem categoria</span>';

  return `

    <input type="text" placeholder="Buscar matéria-prima…" value="${adminState.materiaQuery}" data-act="admin-materia-query" style="width:100%; margin-bottom:12px;">
    <div class="tablewrap">
      <div class="erpitem head"><span>ID</span><span>Nome</span><span>Unidade</span><span>Custo</span><span>Atualizado</span><span>Ação</span></div>
      ${visiveis.slice(0,150).map(m=>{
        const excl = adminState.materiasExcluidas.has(m.id);
        return `<div class="erpitem" style="${excl?'opacity:.45;':''}">
          <span class="mono">${m.id}</span>

  carregarPantoneReferencia();
  chapasCotacaoCarregando=true;chapasCotacaoErro='';

  try{
    const response=await fetch('/api/letra-caixa/chapas',{credentials:'same-origin',cache:'no-store'});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'Não foi possível carregar os formatos de chapa.');
    chapasCotacao=Array.isArray(data.chapas)?data.chapas:[];
  }catch(error){chapasCotacaoErro=error.message||'Falha ao carregar formatos de chapa.';}
  finally{chapasCotacaoCarregando=false;if(state.tab==='admin'&&state.adminTab==='chapas')render();}

// Únicas data-act tratadas pelo handler de clique GENÉRICO abaixo — tudo que
// não está nesta lista tem handler próprio e dedicado em bindAdminEvents/
// bindRealEvents/bindClienteEvents (ou nos blocos logo após este bind).
// Sem essa lista, o loop genérico anexava TAMBÉM um listener a esses outros
// elementos (ex: `admin-mat-add`, `admin-kit-papel`) — como o genérico roda
// PRIMEIRO (registrado antes dos handlers específicos) e termina com
// render(), ele reconstruía a tela com o estado AINDA não atualizado (o
// handler real só roda depois, no segundo listener do mesmo elemento) —
// isso apagava visualmente a seleção de <select> como "Papel na peça" e
// atrapalhava cliques em sequência (ex: adicionar mais de uma matéria-prima),
// porque o DOM já tinha sido reconstruído prematuramente por baixo do clique
// em andamento. Achado e corrigido 29/09/2026.
const GENERIC_CLICK_ACTS = new Set(['tab','admin-tab','pick-project','back-picker','goto-step','approve','advance-status','erp-search','chapas-atualizar','chapa-salvar','chapa-principal','chapa-remover','real-imagem-zoom','real-imagem-zoom-fechar']);
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.dataset.act;
    const handler = (ev)=>{
      const val = el.dataset.val;
      switch(act){
        case 'tab': state.tab=val; break;
        case 'role': state.role=val; break;
        case 'admin-tab': state.adminTab=val; if(val==='propostas') carregarCotacoesServidor(); if(val==='clientes') carregarClientesCadastrados(); if(val==='chapas') carregarChapasServidor(); if(val==='solda') carregarSoldaAdmin(); if(val==='config') carregarCatalogoCorServidor(); break;
        case 'pick-project': resetProjectState(val); break;
        case 'back-picker': state.projectId=null; break;
        case 'goto-step': state.step=parseInt(val); break;
        case 'approve': {
          state.approvals[val]=true;
          const idx = STEP_DEFS.findIndex(s=>s.k===val);
          if(idx>-1 && idx<STEP_DEFS.length-1) state.step = STEP_DEFS[idx+1].n;
          break;
        }
        case 'advance-status': {
          const order=['rascunho','pendente','aprovado','enviado'];
          const i = order.indexOf(state.orcamentoStatus);
          if(i<order.length-1) state.orcamentoStatus=order[i+1];
          break;
        }
        case 'erp-search': return;
      }
      render();
    };
    // Único <select> com ação puramente genérica (sem handler próprio) é o
    // de perfil (role) no topbar — todos os outros selects com data-act
    // (papel na peça, fórmula, categoria, vendedor, produto/modelo etc.) têm
    // handler dedicado registrado em outro lugar; deixá-los cair aqui também
    // causava o double-handling descrito acima.
    if(el.tagName==='SELECT'){
      if(act==='role') el.addEventListener('change', (e)=>{ state.role=e.target.value; render(); });
      return;
    }
    // Campos de texto/número/checkbox têm handlers próprios (input/change) ligados
    // mais abaixo. Anexar também este clique genérico destruiria o campo (via
    // render()) assim que o usuário clicasse nele para focar, antes mesmo da
    // primeira tecla — foi o que quebrou a digitação do CNPJ.
    if(el.tagName==='INPUT' || el.tagName==='TEXTAREA'){ return; }
    if(!GENERIC_CLICK_ACTS.has(act)) return;
    el.addEventListener('click', handler);
  });

  bindRangeLive('[data-act="overlay-opacity"]', v=>{ state.overlayOpacity=parseInt(v); return state.overlayOpacity; }, v=>v+'%');
  bindRangeLive('[data-act="margin"]', v=>{ state.margin=parseFloat(v); return state.margin; }, v=>Math.round(v*100)+'%');
  bindRangeLive('[data-act="desconto"]', v=>{ state.desconto=parseFloat(v); return state.desconto; }, v=>v+'%');

/** Re-renderiza preservando foco e posição do cursor no campo de texto ativo
 *  (render() reconstrói o innerHTML inteiro, o que por padrão perde o foco a
 *  cada tecla digitada). */
function renderPreservingFocus(){
  const active = document.activeElement;
  let restore=null;
  if(active && active.dataset && active.dataset.act && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    restore = { act:active.dataset.act, idx:active.dataset.idx, selStart:active.selectionStart, selEnd:active.selectionEnd };
  }
  render();
  if(restore){
    const sel = restore.idx!=null ? `[data-act="${restore.act}"][data-idx="${restore.idx}"]` : `[data-act="${restore.act}"]`;
    const el = document.querySelector(sel);
    if(el){
      el.focus();
      if(typeof restore.selStart==='number' && el.setSelectionRange){
        try{ el.setSelectionRange(restore.selStart, restore.selEnd); }catch(e){}
      }
    }
  }
}

let _renderDebounceTimer=null;
/** Liga um <input type=range>: dá feedback numérico imediato sem reconstruir a
 *  página a cada pixel arrastado (o que interromperia o próprio arraste), e só
 *  confirma o re-render completo (ou uma função de commit, ex. retrace) depois
 *  de uma pausa curta ou ao soltar (change). */
function bindRangeLive(selector, setValue, formatFn, commitFn){
  commitFn = commitFn || render;
  const el = document.querySelector(selector);
  if(!el) return;
  const valEl = el.parentElement.querySelector('.val');
  el.addEventListener('input', e=>{
    const v = setValue(e.target.value);
    if(valEl) valEl.textContent = formatFn(v);
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(commitFn, 250);
  });
  el.addEventListener('change', ()=>{ clearTimeout(_renderDebounceTimer); commitFn(); });
}

/** Liga um <input type=number|text> que compõe um valor de vários caracteres
 *  (ex.: "0.4", "1.25"). Atualiza o estado a cada tecla mas NÃO reconstrói o
 *  DOM a cada uma — se render() rodasse a cada tecla, o campo seria
 *  redesenhado com o valor já convertido (ex. "0." vira "0"), apagando o
 *  ponto decimal que o usuário acabou de digitar antes de terminar o número.
 *  Só confirma o re-render completo numa pausa curta ou ao sair do campo. */
/** Número digitado em português: aceita vírgula decimal (1,5) e ponto de milhar (1.500,5). Texto inválido vira 0. */
function numeroBR(texto){
  let t = String(texto == null ? '' : texto).trim().replace(/\s/g, '');
  if(t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
}
/* Guarda o que a pessoa digitou ("1," ou "1,5") sem gravar campo novo no objeto; o campo só é reescrito pelo número quando o texto deixa de bater com ele. */
const _textoDigitado = new WeakMap();
function textoNumero(objeto, valor){
  const texto = _textoDigitado.get(objeto);
  return texto != null && numeroBR(texto) === Number(valor) ? texto : valor;
}

function bindNumberLive(selector, setValue, commitFn){
  commitFn = commitFn || renderPreservingFocus;
  const el = document.querySelector(selector);
  if(!el) return;
  el.addEventListener('input', e=>{
    setValue(e.target.value);
    clearTimeout(_renderDebounceTimer);
    _renderDebounceTimer = setTimeout(commitFn, 400);
  });
  el.addEventListener('change', ()=>{ clearTimeout(_renderDebounceTimer); commitFn(); });
}

function dividirValorPix(valor){
  const primeira=Math.round((Number(valor)||0)*50)/100;
  const total=Math.round((Number(valor)||0)*100)/100;
  return {primeira,segunda:Math.round((total-primeira)*100)/100};
}

function calcularPagamentoPublico(p){
  const formasValidas=['pix','cartao','boleto','ted'];
  const configuradas=Array.isArray(p?.formasPagamentoPermitidas)?p.formasPagamentoPermitidas.filter(f=>formasValidas.includes(f)):formasValidas;
  const permitidas=[...new Set(['pix',...configuradas])];
  const forma=permitidas.includes(formaPagamentoPublica)?formaPagamentoPublica:'pix';
  const parcelas=forma==='cartao'?Math.max(1,Math.min(6,Number(parcelasCartaoPublica)||1)):1;
  const taxas=Array.isArray(p?.jurosCartaoPct)?p.jurosCartaoPct:[];
  const taxa=forma==='cartao'?Math.max(0,Math.min(100,Number(taxas[parcelas-1])||0)):0;
  const base=Number(p?.precoFinal)||0;
  const total=base*(1+taxa/100);
  const splitPix=dividirValorPix(base);
  return {permitidas,forma,parcelas,taxa,base,total,valorParcela:total/parcelas,...splitPix};
}

function abrirWhatsAppRespostaPublica(tipo, comentario){
  const p=cotacaoPublicaAtual;
  const reacao=REACOES_CLIENTE.find(x=>x.key===tipo);
  if(!p || !reacao) return;
  const cliente=p.cliente?.razao || p.cliente?.fantasia || 'cliente';
  const pagamento=calcularPagamentoPublico(p);
  const linhas=[
    `Olá, ${p.vendedor}! Sou ${cliente} e estou retornando sobre a cotação ${p.numero} (${p.modeloNome}).`,
    `Minha resposta: ${reacao.label}`,
    `Forma de pagamento simulada: ${PAGAMENTO_LABEL[pagamento.forma]}${pagamento.forma==='cartao'?` em ${pagamento.parcelas}x de ${money(pagamento.valorParcela)} (total ${money(pagamento.total)}, taxa ${fmt(pagamento.taxa,2)}%)`:pagamento.forma==='pix'?` em duas partes: ${money(pagamento.primeira)} + ${money(pagamento.segunda)}`:''}.`,
    `Cotação: ${window.location.href}`,
  ];
  if(comentario?.trim()) linhas.push(`Complemento: ${comentario.trim()}`);
  const telefone=normalizarTelefoneWhatsApp(p.whatsappVendedor);
  const url=`https://wa.me/${telefone}?text=${encodeURIComponent(linhas.join(String.fromCharCode(10)))}`;
  const janela=window.open(url,'_blank');
  if(janela) janela.opener=null;
  else window.location.href=url;
}

    renderCotacaoPublica();
  });
}

async function iniciarCotacaoPublica(token){
  renderCotacaoPublica();
  try{
    const response=await fetch('/api/letra-caixa/cotacoes/'+encodeURIComponent(token),{credentials:'same-origin',cache:'no-store'});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Link inválido ou cotação não encontrada.');
    cotacaoPublicaAtual=body;
    formaPagamentoPublica='pix';
    parcelasCartaoPublica=1;
    renderCotacaoPublica();
  }catch(error){renderCotacaoPublica(error.message||'Não foi possível abrir a cotação.');}
}

/* ---------- ORÇAMENTOS EM PARALELO (até 6 abas) E VÁRIOS DESENHOS POR ORÇAMENTO (até 3) ----------
 * Pedidos do usuário 05/10/2026. Cada desenho é uma instância independente desta mesma página, carregada num
 * quadro (iframe) com ?orc=N&d=K&g=GRUPO: estado, requisições e temporizadores são isolados, então o que um
 * orçamento ou desenho está processando continua em segundo plano quando o vendedor troca de aba. A página de
 * topo só desenha as abas (orçamentos) e a barra de desenhos do orçamento ativo, e consulta o resumo de cada
 * quadro (__cpqResumo). Cada desenho vira uma cotação própria no servidor, ligada às outras pelo código do grupo
 * (g=...); o cliente recebe um único link (?grupo=...) com todos os desenhos e o total somado. */
const MAX_ORCAMENTOS = 6;
const MAX_DESENHOS = 3;
const _paramsPagina = new URLSearchParams(window.location.search);
const MODO_ABAS = window.self === window.top && !_paramsPagina.get('cotacao') && !_paramsPagina.get('grupo') && !_paramsPagina.has('orc') && !_paramsPagina.has('semabas');

/** Resumo do desenho desta instância, lido pela página de abas. */
window.__cpqResumo = function(){
  const ocupado = [
    [REAL.gerandoRedesenho, 'gerando a reconstrução (GPT)'],
    [REAL.analisandoArte, 'lendo a arte'],
    [REAL.chatCarregando, 'conversando sobre o vetor'],
    [state.tracing, 'vetorizando'],
    [REAL.colorAnalysis && REAL.colorAnalysis.loading, 'analisando as cores'],
    [REAL.factibilidadeCarregando, 'verificando a factibilidade'],
    [REAL.nestingCarregando, 'calculando o nesting'],
    [REAL.precoIACarregando || REAL.precoAprovacaoCarregando, 'analisando o preço'],
    [REAL.consultaCnpj && REAL.consultaCnpj.status === 'loading', 'consultando o cliente'],
  ].find(item => item[0]);
  return {
    cliente: (REAL.cliente && (REAL.cliente.fantasia || REAL.cliente.razao)) || '',
    titulo: REAL.tituloProposta || '',
    modelo: REAL.modeloNome || '',
    etapa: REAL.step || 1,
    emAndamento: state.mode === 'real',
    ocupado: ocupado ? ocupado[1] : null,
    cotacaoNumero: REAL.cotacaoNumero || null,
    enviada: !!REAL.cotacaoLink,
  };
};

/** Dados do cliente e do orçamento que um novo desenho herda do primeiro. */
window.__cpqDadosCliente = function(){
  return JSON.parse(JSON.stringify({
    cliente: REAL.cliente, consultaCnpj: REAL.consultaCnpj, vendedor: REAL.vendedor, tituloProposta: REAL.tituloProposta,
    escopoRedesenho: REAL.escopoRedesenho,
  }));
};
window.__cpqHerdar = function(dados){
  state.mode = 'real';
  REAL = novaProposta();
  Object.assign(REAL.cliente, dados.cliente || {});
  if(dados.consultaCnpj) REAL.consultaCnpj = {...dados.consultaCnpj};
  REAL.vendedor = dados.vendedor || '';
  REAL.tituloProposta = dados.tituloProposta || '';
  if(dados.escopoRedesenho) REAL.escopoRedesenho = dados.escopoRedesenho;
  render();
};

function montarAbasOrcamento(){
  document.title = 'CPQ Letreiros Express';
  document.getElementById('shell').style.display = 'none';
  const estilo = document.createElement('style');
  estilo.textContent = `
    #abas-orc,#desenhos-orc{position:fixed;left:0;right:0;z-index:50;display:flex;align-items:center;gap:6px;padding:0 10px;overflow-x:auto;}
    #abas-orc{top:0;height:46px;background:var(--surface);border-bottom:1px solid var(--border);}
    #desenhos-orc{top:46px;height:38px;background:var(--surface-2);border-bottom:1px solid var(--border);}
    #abas-orc .aba,#desenhos-orc .des{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:10px;padding:5px 8px 5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;max-width:300px;}
    #desenhos-orc .des{background:var(--surface);padding:3px 8px 3px 11px;font-size:12px;}
    #abas-orc .aba.ativa,#desenhos-orc .des.ativa{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
    .nome{overflow:hidden;text-overflow:ellipsis;}
    .chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface);color:var(--text-dim);}
    .chip.ocupado{background:#fff4d6;color:#8a5a00;}
    .chip.pronto{background:#d9f5e3;color:#14683a;}
    .fechar{border:none;background:none;color:inherit;opacity:.6;cursor:pointer;font-size:14px;padding:0 2px;}
    .fechar:hover{opacity:1;}
    .nova{border:1px dashed var(--border);background:none;color:var(--accent);border-radius:10px;padding:5px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;}
    #desenhos-orc .nova{padding:3px 10px;font-size:12px;}
    .nova:disabled{opacity:.45;cursor:not-allowed;}
    #quadros-orc{position:fixed;top:84px;left:0;right:0;bottom:0;}
    #quadros-orc iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);}
  `;
  document.head.appendChild(estilo);
  const barra = document.createElement('div'); barra.id = 'abas-orc';
  const barraDesenhos = document.createElement('div'); barraDesenhos.id = 'desenhos-orc';
  const quadros = document.createElement('div'); quadros.id = 'quadros-orc';
  document.body.append(barra, barraDesenhos, quadros);

  const orcs = [];
  let contador = 0, ativo = null;

  const resumoDe = des => { try{ return des.iframe.contentWindow.__cpqResumo ? des.iframe.contentWindow.__cpqResumo() : null; }catch(e){ return null; } };
  const corta = (texto, max) => texto.length > max ? texto.slice(0, max - 1) + '…' : texto;
  const esc = valor => String(valor).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const novoGrupoId = () => 'g' + btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(18)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const orcAtivo = () => orcs.find(orc => orc.id === ativo);
  const emAndamento = r => !!(r && r.emAndamento && !r.enviada);

  function chipDe(r, des, orc){
    if(r && r.ocupado) return `<span class="chip ocupado">⏳ ${esc(r.ocupado)}</span>`;
    if(des.pronto && !(orc.id === ativo && orc.posAtiva === des.pos)) return '<span class="chip pronto">● pronto</span>';
    if(r && r.enviada) return `<span class="chip pronto">✔ ${esc(r.cotacaoNumero || 'enviada')}</span>`;
    if(r && r.emAndamento) return `<span class="chip">etapa ${r.etapa}/8</span>`;
    return '';
  }

  function desenhar(){
    barra.innerHTML = orcs.map((orc, i) => {
      const rs = orc.desenhos.map(des => des.resumo);
      const primeiro = rs[0];
      const nome = primeiro && (primeiro.cliente || primeiro.titulo || primeiro.modelo) ? corta(primeiro.cliente || primeiro.titulo || primeiro.modelo, 22) : 'Novo orçamento';
      const ocupadoDes = orc.desenhos.find(des => des.resumo && des.resumo.ocupado);
      const prontos = orc.desenhos.some(des => des.pronto) && orc.id !== ativo;
      const enviados = rs.filter(r => r && r.enviada).length;
      let chip = '';
      if(ocupadoDes) chip = `<span class="chip ocupado">⏳ ${orc.desenhos.length > 1 ? 'D' + ocupadoDes.pos + ': ' : ''}${esc(ocupadoDes.resumo.ocupado)}</span>`;
      else if(prontos) chip = '<span class="chip pronto">● pronto</span>';
      else if(enviados) chip = `<span class="chip pronto">✔ ${enviados}/${orc.desenhos.length} enviado${enviados > 1 ? 's' : ''}</span>`;
      else if(orc.desenhos.length > 1) chip = `<span class="chip">${orc.desenhos.length} desenhos</span>`;
      else if(primeiro && primeiro.emAndamento) chip = `<span class="chip">etapa ${primeiro.etapa}/8</span>`;
      return `<div class="aba ${orc.id === ativo ? 'ativa' : ''}" data-aba="${orc.id}" title="Orçamento ${i + 1}"><span class="nome">${i + 1}. ${esc(nome)}</span>${chip}<button class="fechar" data-fechar="${orc.id}" title="Fechar este orçamento" type="button">×</button></div>`;
    }).join('') + `<button class="nova" data-nova="1" type="button" ${orcs.length >= MAX_ORCAMENTOS ? 'disabled title="Máximo de 6 orçamentos abertos"' : ''}>+ Novo orçamento (${orcs.length}/${MAX_ORCAMENTOS})</button>`;

    const orc = orcAtivo();
    barraDesenhos.innerHTML = orc ? orc.desenhos.map(des => {
      const r = des.resumo;
      const nome = r && (r.modelo || r.titulo) ? corta(r.modelo || r.titulo, 22) : 'novo produto';
      return `<div class="des ${orc.posAtiva === des.pos ? 'ativa' : ''}" data-des="${des.pos}"><span class="nome">Desenho ${des.pos} · ${esc(nome)}</span>${chipDe(r, des, orc)}${orc.desenhos.length > 1 ? `<button class="fechar" data-fechar-des="${des.pos}" title="Remover este desenho" type="button">×</button>` : ''}</div>`;
    }).join('') + `<button class="nova" data-novo-des="1" type="button" ${orc.desenhos.length >= MAX_DESENHOS ? 'disabled title="Máximo de 3 desenhos por orçamento"' : 'title="Outro desenho, com outro produto, na mesma cotação do cliente"'}>+ Adicionar desenho (${orc.desenhos.length}/${MAX_DESENHOS})</button>` : '';
  }

  function mostrar(){
    for(const orc of orcs) for(const des of orc.desenhos){
      const visivel = orc.id === ativo && orc.posAtiva === des.pos;
      des.iframe.style.display = visivel ? 'block' : 'none';
      if(visivel) des.pronto = false;
    }
    desenhar();
  }

  function criarQuadro(orc, pos){
    const iframe = document.createElement('iframe');
    iframe.src = window.location.pathname + `?orc=${orc.id}&d=${pos}&g=${orc.grupoId}`;
    iframe.title = `Orçamento ${orc.id} · desenho ${pos}`;
    iframe.style.display = 'none';
    quadros.appendChild(iframe);
    const des = { pos, iframe, resumo:null, pronto:false };
    orc.desenhos.push(des);
    orc.desenhos.sort((a, b) => a.pos - b.pos);
    return des;
  }

  function novoOrcamento(){
    if(orcs.length >= MAX_ORCAMENTOS){ alert('Você já tem 6 orçamentos abertos. Conclua ou feche um para abrir outro.'); return; }
    const orc = { id: ++contador, grupoId: novoGrupoId(), desenhos: [], posAtiva: 1 };
    orcs.push(orc);
    criarQuadro(orc, 1);
    ativo = orc.id;
    mostrar();
  }

  function adicionarDesenho(orc){
    if(orc.desenhos.length >= MAX_DESENHOS){ alert('Um orçamento aceita no máximo 3 desenhos.'); return; }
    const primeiro = orc.desenhos.find(des => des.pos === 1) || orc.desenhos[0];
    let dados = null;
    try{ dados = primeiro.iframe.contentWindow.__cpqDadosCliente(); }catch(e){}
    if(!dados || !dados.cliente || !(dados.cliente.cnpj || '').replace(/\D/g, '')){
      alert('Preencha primeiro o CPF/CNPJ e os dados do cliente no Desenho 1. O novo desenho herda o cliente.');
      return;
    }
    const pos = [1, 2, 3].find(n => !orc.desenhos.some(des => des.pos === n));
    const des = criarQuadro(orc, pos);
    orc.posAtiva = pos;
    mostrar();
    // Assim que o novo quadro termina de carregar, entrega o cliente do Desenho 1.
    const inicio = Date.now();
    const espera = setInterval(() => {
      try{
        const w = des.iframe.contentWindow;
        if(w && typeof w.__cpqHerdar === 'function'){ clearInterval(espera); w.__cpqHerdar(dados); return; }
      }catch(e){}
      if(Date.now() - inicio > 20000) clearInterval(espera);
    }, 300);
  }

  function fecharOrcamento(id){
    const orc = orcs.find(item => item.id === id);
    if(!orc) return;
    if(orc.desenhos.some(des => emAndamento(resumoDe(des) || des.resumo)) && !confirm('Fechar este orçamento? O que não foi enviado ao cliente será perdido.')) return;
    const posicao = orcs.indexOf(orc);
    orc.desenhos.forEach(des => des.iframe.remove());
    orcs.splice(posicao, 1);
    if(!orcs.length) novoOrcamento();
    else if(ativo === id){ ativo = orcs[Math.min(posicao, orcs.length - 1)].id; mostrar(); }
    else desenhar();
  }

  function removerDesenho(orc, pos){
    const des = orc.desenhos.find(item => item.pos === pos);
    if(!des || orc.desenhos.length <= 1) return;
    if(emAndamento(resumoDe(des) || des.resumo) && !confirm('Remover este desenho? O que não foi enviado ao cliente será perdido.')) return;
    des.iframe.remove();
    orc.desenhos.splice(orc.desenhos.indexOf(des), 1);
    if(orc.posAtiva === pos) orc.posAtiva = orc.desenhos[0].pos;
    mostrar();
  }

  barra.addEventListener('click', ev => {
    const fecharBtn = ev.target.closest('[data-fechar]');
    if(fecharBtn){ ev.stopPropagation(); fecharOrcamento(Number(fecharBtn.dataset.fechar)); return; }
    const abaEl = ev.target.closest('[data-aba]');
    if(abaEl){ ativo = Number(abaEl.dataset.aba); mostrar(); return; }
    if(ev.target.closest('[data-nova]')) novoOrcamento();
  });
  barraDesenhos.addEventListener('click', ev => {
    const orc = orcAtivo();
    if(!orc) return;
    const fecharBtn = ev.target.closest('[data-fechar-des]');
    if(fecharBtn){ ev.stopPropagation(); removerDesenho(orc, Number(fecharBtn.dataset.fecharDes)); return; }
    const desEl = ev.target.closest('[data-des]');
    if(desEl){ orc.posAtiva = Number(desEl.dataset.des); mostrar(); return; }
    if(ev.target.closest('[data-novo-des]')) adicionarDesenho(orc);
  });

  // Usadas pelos quadros: quantos desenhos tem o orçamento e o resumo de cada um.
  window.__cpqDesenhosDoGrupo = grupoId => (orcs.find(orc => orc.grupoId === grupoId) || { desenhos: [] }).desenhos.length || 1;
  window.__cpqGrupoResumo = grupoId => (orcs.find(orc => orc.grupoId === grupoId) || { desenhos: [] }).desenhos.map(des => des.resumo);

  // Consulta o resumo de cada quadro; avisa quando um desenho em segundo plano termina de processar.
  setInterval(() => {
    let mudou = false;
    for(const orc of orcs) for(const des of orc.desenhos){
      const r = resumoDe(des);
      if(!r) continue;
      const antes = des.resumo;
      const visivel = orc.id === ativo && orc.posAtiva === des.pos;
      if(antes && antes.ocupado && !r.ocupado && !visivel){ des.pronto = true; mudou = true; }
      if(!antes || JSON.stringify(antes) !== JSON.stringify(r)) mudou = true;
      des.resumo = r;
    }
    if(mudou) desenhar();
  }, 1200);

  window.addEventListener('beforeunload', ev => {
    if(orcs.some(orc => orc.desenhos.some(des => emAndamento(des.resumo)))){ ev.preventDefault(); ev.returnValue = ''; }
  });

  novoOrcamento();
}

const tokenCotacaoPublica=_paramsPagina.get('cotacao');
const tokenGrupoPublico=_paramsPagina.get('grupo');
if(tokenCotacaoPublica){
  document.title='Cotação · CPQ Letreiros Express';
  iniciarCotacaoPublica(tokenCotacaoPublica);
}else if(tokenGrupoPublico){
  document.title='Cotação · CPQ Letreiros Express';
  iniciarGrupoPublico(tokenGrupoPublico);
}else if(MODO_ABAS){
  montarAbasOrcamento();
}else{
  render();
  loadCatalog();
  initDb();
}
</script>
