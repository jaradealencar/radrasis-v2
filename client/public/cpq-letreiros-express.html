<!doctype html><html lang="pt-BR"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CPQ Letreiros Express</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="/cpq-vetorizador-local.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --border:#dce2ec;
    --text:#151b2c; --text-dim:#5b6478; --text-faint:#8891a3;
    --accent:#1e6fd9; --accent-ink:#0d4fa8; --accent-soft:#e7f0fd;
    --accent2:#0d9488; --accent2-soft:#e3f7f4;
    --ok:#16a34a; --ok-soft:#e7f8ed;
    --warn:#d97706; --warn-soft:#fdf1de;
    --bad:#dc2626; --bad-soft:#fdeaea;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1420; --surface:#161d2e; --surface-2:#1d2538; --border:#2b3450;
      --text:#e7ebf6; --text-dim:#a7b0c6; --text-faint:#7883a0;
      --accent:#5b9df0; --accent-ink:#bcdaff; --accent-soft:#1b2c4a;
      --accent2:#3fc6b8; --accent2-soft:#12312e;
      --ok:#4ade80; --ok-soft:#123420;
      --warn:#f5a524; --warn-soft:#3a2a0c;
      --bad:#f87171; --bad-soft:#3a1616;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1420; --surface:#161d2e; --surface-2:#1d2538; --border:#2b3450;
    --text:#e7ebf6; --text-dim:#a7b0c6; --text-faint:#7883a0;
    --accent:#5b9df0; --accent-ink:#bcdaff; --accent-soft:#1b2c4a;
    --accent2:#3fc6b8; --accent2-soft:#12312e;
    --ok:#4ade80; --ok-soft:#123420;
    --warn:#f5a524; --warn-soft:#3a2a0c;
    --bad:#f87171; --bad-soft:#3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  /* Ícones inline (ICONS.*) não têm width/height — sem isso, o navegador usa o
     tamanho padrão de SVG sem viewport definido (300×150px). Qualquer SVG com
     style inline (prévias, mapas de nesting etc.) sobrescreve isso normalmente. */
  svg{width:1em; height:1em; flex:none;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; padding-inline:16px;}
  h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  #shell{max-width:1180px; margin:0 auto; padding-block:18px 48px;}

  .topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--bg); padding-block:10px 12px; margin-inline:-16px; padding-inline:16px; border-bottom:1px solid var(--border);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; flex:none;}
  .brand .mark svg{width:19px; height:19px;}
  .brand-name{font-family:'Sora'; font-weight:700; font-size:16px; letter-spacing:.01em;}
  .brand-sub{font-size:11px; color:var(--text-faint); margin-top:-2px;}
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .topbar-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  .segtabs{display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px;}
  .segtabs button{border:none; background:transparent; color:var(--text-dim); font-size:13px; font-weight:600; padding:7px 13px; border-radius:7px;}
  .segtabs button.active{background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow);}

  select, input[type=number], input[type=text]{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit;
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-dim); font-weight:600;}

  .banner{display:flex; align-items:flex-start; gap:10px; background:var(--accent-soft); border:1px solid color-mix(in oklab, var(--accent) 30%, var(--border)); border-radius:12px; padding:11px 14px; margin-block:14px; font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .banner b{color:var(--accent-ink);}
  .banner svg{flex:none; margin-top:1px; width:16px; height:16px; color:var(--accent);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .cardhead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .cardhead h3{font-size:15px;}
  .cardhead p{font-size:12.5px; color:var(--text-faint); margin-top:3px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:99px; text-transform:uppercase;}
  .b-ok{background:var(--ok-soft); color:var(--ok);}
  .b-warn{background:var(--warn-soft); color:var(--warn);}
  .b-bad{background:var(--bad-soft); color:var(--bad);}
  .b-neutral{background:var(--surface-2); color:var(--text-dim);}
  .b-accent{background:var(--accent-soft); color:var(--accent-ink);}

  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:600; border:1px solid transparent; transition:filter .15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.45; cursor:not-allowed; filter:none;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:var(--surface); border-color:var(--border); color:var(--text);}
  .btn-soft{background:var(--accent-soft); color:var(--accent-ink);}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700;}
  td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right; font-family:'JetBrains Mono'; font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
  .tablewrap table{border:none;}
  .price-margin-wrap table{table-layout:fixed; min-width:860px;}
  .price-margin-wrap th,.price-margin-wrap td{width:14.2857%; text-align:center; vertical-align:middle;}
  .price-margin-wrap th{white-space:nowrap;}
  .price-margin-wrap td{font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  .stepper{display:flex; gap:4px; overflow-x:auto; padding-bottom:4px; margin-block:14px;}
  .step-pill{flex:none; display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; color:var(--text-faint); white-space:nowrap;}
  .step-pill .dot{width:19px; height:19px; border-radius:50%; background:var(--surface-2); color:var(--text-faint); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex:none;}
  .step-pill.done{color:var(--text);} .step-pill.done .dot{background:var(--ok); color:#fff;}
  .step-pill.current{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}
  .step-pill.current .dot{background:var(--accent); color:#fff;}
  .step-pill.locked{opacity:.5;}
  .step-pill.clickable{cursor:pointer;}

  .projcard{border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden; cursor:pointer; text-align:left; transition:transform .15s, box-shadow .15s; display:flex; flex-direction:column;}
  .projcard:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .projcard .thumb{aspect-ratio:16/10; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .projcard .thumb svg{width:100%; height:100%; display:block;}
  .projcard .body{padding:14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .projcard h4{font-size:14px;}
  .projcard p{font-size:12px; color:var(--text-faint); line-height:1.5;}

  .kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--text-faint);}
  .kv span:last-child{font-weight:600; font-family:'JetBrains Mono';}

  .compare{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2);}
  .compare svg{display:block; width:100%; height:auto;}
  .compare .layer{position:absolute; inset:0;}

  .checklist{display:flex; flex-direction:column; gap:7px;}
  .checkrow{display:flex; align-items:center; gap:8px; font-size:13px;}
  .checkrow svg{width:15px; height:15px; color:var(--ok); flex:none;}

  input[type=range]{width:100%; accent-color:var(--accent);}
  .rangewrap{display:flex; align-items:center; gap:10px;}
  .rangewrap .val{font-family:'JetBrains Mono'; font-size:13px; font-weight:700; width:52px; text-align:right;}

  .footer-nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}

  .role-note{font-size:11.5px; color:var(--text-faint); margin-top:6px; display:flex; gap:6px; align-items:flex-start;}
  .role-note svg{width:13px; height:13px; flex:none; margin-top:1px;}

  .pill-status{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;}
  .status-flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11.5px;}
  .status-flow .fseg{padding:4px 9px; border-radius:99px; background:var(--surface-2); color:var(--text-faint); font-weight:700;}
  .status-flow .fseg.active{background:var(--accent); color:#fff;}
  .status-flow .arrow{color:var(--text-faint);}

  .subtabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .subtabs button{background:transparent; border:none; padding:9px 4px; font-size:13px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent; margin-right:14px;}
  .subtabs button.active{color:var(--accent-ink); border-color:var(--accent);}

  .erpitem{display:grid; grid-template-columns:70px minmax(180px,1fr) 130px 100px 100px max-content; gap:10px; align-items:center; padding:9px 10px; border-bottom:1px solid var(--border); font-size:12.5px;}
  .erpitem:last-child{border-bottom:none;}
  .erpitem.head{font-size:11px; text-transform:uppercase; color:var(--text-faint); font-weight:700; letter-spacing:.02em;}
  @media (max-width:820px){.erpitem{grid-template-columns:1fr; gap:3px; padding:10px;} .erpitem.head{display:none;}}

  .empty-hint{font-size:12.5px; color:var(--text-faint); padding:20px; text-align:center;}

  .source-tag{font-size:10.5px; color:var(--text-faint); display:flex; align-items:center; gap:4px; margin-top:2px;}
  .source-tag svg{width:11px;height:11px;}

  .warnbox{display:flex; gap:10px; background:var(--bad-soft); border:1px solid color-mix(in oklab, var(--bad) 35%, var(--border)); border-radius:12px; padding:13px 15px; font-size:12.5px; color:var(--text);}
  .warnbox svg{width:18px; height:18px; color:var(--bad); flex:none;}
  .warnbox b{color:var(--bad);}

  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}

  /* ---- Visão do cliente: cards de reação grandes e convidativos ---- */
  .cliente-hero{background:linear-gradient(160deg, var(--accent-soft), var(--surface) 65%); border:1px solid color-mix(in oklab, var(--accent) 25%, var(--border)); border-radius:18px; padding:24px; text-align:center;}
  .cliente-hero h2{font-size:20px; margin-bottom:6px;}
  .cliente-preco{font-size:32px; font-weight:800; color:var(--accent-ink); font-family:'Sora';}
  .reacoes-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px;}
  @media (max-width:640px){.reacoes-grid{grid-template-columns:1fr;}}
  .reacao-card{display:flex; align-items:center; gap:12px; text-align:left; border-radius:14px; padding:16px; border:2px solid var(--border); background:var(--surface); cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s; font-family:inherit;}
  .reacao-card:hover{transform:translateY(-2px) scale(1.01); box-shadow:var(--shadow);}
  .reacao-card .emoji{font-size:28px; flex:none; line-height:1;}
  .reacao-card .txt{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.35;}
  .reacao-card.cor-ok{border-color:color-mix(in oklab, var(--ok) 40%, var(--border));} .reacao-card.cor-ok:hover{background:var(--ok-soft);}
  .reacao-card.cor-accent{border-color:color-mix(in oklab, var(--accent) 40%, var(--border));} .reacao-card.cor-accent:hover{background:var(--accent-soft);}
  .reacao-card.cor-warn{border-color:color-mix(in oklab, var(--warn) 40%, var(--border));} .reacao-card.cor-warn:hover{background:var(--warn-soft);}
  .reacao-card.cor-neutral:hover{background:var(--surface-2);}
  .reacao-card.cor-bad{border-color:color-mix(in oklab, var(--bad) 40%, var(--border));} .reacao-card.cor-bad:hover{background:var(--bad-soft);}
</style>

<div id="shell"></div>

<script>
const ICONS = {
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v6h6"/><path d="M9 14h6M9 17h4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  db: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
};

/* ---------- DADOS DE DEMONSTRAÇÃO (fictícios, rotulados) ---------- */

function svgSign({texto, slogan, simbolo, cor, perspectiva, blur, incompleto}){
  const skew = perspectiva ? 'transform="skewY(-2.2) skewX(-4)"' : '';
  const filt = blur ? 'filter="url(#blurf)"' : '';
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="blurf"><feGaussianBlur stdDeviation="3.2"/></filter>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${blur?'#3a3f4d':'#c9cfda'}"/>
        <stop offset="1" stop-color="${blur?'#20232c':'#a8afbd'}"/>
      </linearGradient>
    </defs>
    <rect width="600" height="260" fill="url(#wall)"/>
    <g ${skew} ${filt}>
      <rect x="70" y="70" width="460" height="120" rx="8" fill="${cor.painel}" stroke="#00000022" stroke-width="2"/>
      ${simbolo}
      <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="${incompleto?'40':'38'}" fill="${cor.texto}">${texto}</text>
      ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="${cor.texto}" opacity=".85">${slogan}</text>`:''}
    </g>
    ${blur?'<rect x="120" y="60" width="360" height="150" fill="white" opacity=".14"/>':''}
    ${blur?'<rect x="300" y="60" width="80" height="150" fill="white" opacity=".1"/>':''}
  </svg>`;
}

function svgReconstruction({texto, slogan, cor, simbolo}){
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="260" fill="transparent"/>
    <g>
      <rect x="70" y="70" width="460" height="120" rx="8" fill="${cor.painel}"/>
      ${simbolo}
      <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="38" fill="${cor.texto}">${texto}</text>
      ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="1.5" fill="${cor.texto}" opacity=".85">${slogan}</text>`:''}
    </g>
  </svg>`;
}

function svgVector({texto, slogan, simboloOutline}){
  return `
  <svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="260" fill="transparent"/>
    <rect x="70" y="70" width="460" height="120" rx="8" fill="white" stroke="black" stroke-width="2"/>
    ${simboloOutline}
    <text x="300" y="${slogan?128:140}" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="38" fill="white" stroke="black" stroke-width="1.4">${texto}</text>
    ${slogan?`<text x="300" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" fill="white" stroke="black" stroke-width=".6">${slogan}</text>`:''}
  </svg>`;
}

const SIMBOLO_TRIGO = `<g transform="translate(300,50)"><path d="M0 20 C -10 0, -6 -22, 0 -34 C 6 -22, 10 0, 0 20 Z" fill="#f0c419"/><path d="M-14 4 C -22 -6, -20 -20, -12 -26" fill="none" stroke="#c99a12" stroke-width="3"/><path d="M14 4 C 22 -6, 20 -20, 12 -26" fill="none" stroke="#c99a12" stroke-width="3"/></g>`;
const SIMBOLO_TRIGO_OUTLINE = `<g transform="translate(300,50)"><path d="M0 20 C -10 0, -6 -22, 0 -34 C 6 -22, 10 0, 0 20 Z" fill="white" stroke="black" stroke-width="2"/></g>`;

const SIMBOLO_ENGRENAGEM = (color)=>`<g transform="translate(300,52)">
  <circle cx="0" cy="0" r="30" fill="none" stroke="${color}" stroke-width="9"/>
  ${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-5" y="-40" width="10" height="14" fill="${color}" transform="rotate(${a})"/>`).join('')}
  <circle cx="0" cy="0" r="11" fill="#f6f7fb" stroke="${color}" stroke-width="3"/>
</g>`;
const SIMBOLO_ENGRENAGEM_OUTLINE = `<g transform="translate(300,52)">
  <circle cx="0" cy="0" r="30" fill="none" stroke="black" stroke-width="9"/>

/* ---------- CÁLCULOS ---------- */
function unitToM(v,u){ return u==='mm'? v/1000 : u==='cm'? v/100 : v; }

function computeGeom(p){
  const s = state.scale[p.id];
  const e = p.escala;
  const knownM = unitToM(s.valor, s.unidade);
  const refVU = e.byHeight ? e.refHeightVU : e.refWidthVU;
  const scaleFactor = knownM / refVU; // metros por unidade-vetor
  const totalWidthM = e.totalWidthVU * scaleFactor;
  const totalHeightM = e.totalHeightVU * scaleFactor;
  const areaM2 = e.areaVU * scaleFactor * scaleFactor;
  const perimExtM = e.perimExtVU * scaleFactor;
  const perimIntM = e.perimIntVU * scaleFactor;
  return {
    scaleFactor, totalWidthM, totalHeightM, areaM2, perimExtM, perimIntM,
    corteTotalM: perimExtM + perimIntM,
  };
}

function fmt(n,d=2){ return n.toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d}); }
/** Compara ignorando acento/caixa — "acrilico" precisa achar "Acrílico" na busca. */
function normalizeSearch(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function money(n){ return 'R$ '+fmt(n,2); }

function computeOrcamento(p){
  const matTotal = p.kit.reduce((a,k)=>a+k.qtd*k.custo,0);
  const servTotal = p.servicos.reduce((a,s)=>a+s.v,0);
  const custoDireto = matTotal + servTotal;
  const descontoFrac = state.desconto/100;
  const precoBase = custoDireto/(1-state.margin);
  const precoComInstalacao = precoBase + p.instalacao;
  const precoFinal = precoComInstalacao * (1-descontoFrac);
  return {matTotal, servTotal, custoDireto, precoBase, precoComInstalacao, precoFinal};
}

const catalog = { produtos:[], materias:[], margens:[], composicoesMubiSys:[], mubisysWebConectado:false, erroComposicoesMubiSys:null, connectionOpen:false, connectionBusy:false, connectionMessage:null, ready:false, refreshing:false, error:null, baixadoEm:null };
async function loadCatalog(){
  const jaCarregado=catalog.ready;
  catalog.refreshing = true;
  catalog.error = null;
  render();
  try{
    const response = await fetch('/api/letra-caixa/catalogo', { credentials:'same-origin', cache:'no-store' });
    const dados = await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(dados.error || `Falha ao consultar o catálogo (HTTP ${response.status}).`);
    catalog.produtos = Array.isArray(dados.produtos) ? dados.produtos : [];
    catalog.materias = Array.isArray(dados.materias) ? dados.materias : [];
    catalog.margens = Array.isArray(dados.margens) ? dados.margens : [];
    catalog.composicoesMubiSys = Array.isArray(dados.composicoesMubiSys) ? dados.composicoesMubiSys : [];
    catalog.mubisysWebConectado = dados.mubisysWebConectado === true;
    catalog.erroComposicoesMubiSys = dados.erroComposicoesMubiSys || null;
    catalog.baixadoEm = dados.carregadoEm || null;
  }catch(e){
    if(!jaCarregado){
      catalog.produtos = [];
      catalog.materias = [];
      catalog.margens = [];
      catalog.composicoesMubiSys = [];
      catalog.mubisysWebConectado = false;
    }
    catalog.error = String(e && e.message || 'Não foi possível consultar o MubiSys.');
  }finally{
    catalog.ready = true;
    catalog.refreshing = false;
    render();
  }
}

function bindMubiSysConnectionEvents(){
  const abrir=document.querySelector('[data-act="mubisys-connect-open"]');
  if(abrir) abrir.addEventListener('click',()=>{catalog.connectionOpen=!catalog.connectionOpen;catalog.connectionMessage=null;render();});
  const form=document.querySelector('[data-act="mubisys-connect-form"]');
  if(form) form.addEventListener('submit',async e=>{
    e.preventDefault();
    if(catalog.connectionBusy) return;
    const dados=new FormData(form);
    const credenciais={codigo:String(dados.get('codigo')||'').trim(),usuario:String(dados.get('usuario')||'').trim(),senha:String(dados.get('senha')||'')};
    catalog.connectionBusy=true;
    const botao=form.querySelector('button[type="submit"]');
    if(botao){botao.disabled=true;botao.textContent='Conectando…';}
    try{
      const response=await fetch('/api/letra-caixa/mubisys/sessao',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(credenciais),cache:'no-store'});
      const body=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(body.error||`Não foi possível conectar (HTTP ${response.status}).`);
      form.reset();
      catalog.connectionOpen=false;
      catalog.connectionMessage={tipo:'sucesso',texto:'Conta conectada. Atualizando as composições…'};
      await loadCatalog();
    }catch(error){
      form.reset();
      catalog.connectionMessage={tipo:'erro',texto:String(error?.message||'Não foi possível conectar ao MubiSys.')};
    }finally{
      catalog.connectionBusy=false;
      render();
    }
  });
  const importarTudo=document.querySelector('[data-act="mubisys-importar-tudo"]');
  if(importarTudo) importarTudo.addEventListener('click',()=>{
    if(confirm('Importar do MubiSys a composição (comum e por variação) de todos os modelos? Modelos que já têm composição cadastrada manualmente no Radrasys serão pulados.')) importarComposicoesMubiSysEmMassa();
  });
  const atualizar=document.querySelector('[data-act="mubisys-reload"]');
  if(atualizar) atualizar.addEventListener('click',()=>{catalog.connectionMessage=null;loadCatalog();});
  const desconectar=document.querySelector('[data-act="mubisys-disconnect"]');
  if(desconectar) desconectar.addEventListener('click',async()=>{
    try{
      const response=await fetch('/api/letra-caixa/mubisys/sessao',{method:'DELETE',credentials:'same-origin',cache:'no-store'});
      const body=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(body.error||'Não foi possível desconectar agora.');
      catalog.mubisysWebConectado=false;
      catalog.composicoesMubiSys=[];
      catalog.erroComposicoesMubiSys=null;
      catalog.connectionMessage={tipo:'sucesso',texto:'Conta desconectada deste navegador.'};
      if(REAL.produtoId&&REAL.modeloId){
        const produto=catalog.produtos.find(p=>p.id===REAL.produtoId);
        const modelo=produto?.modelos.find(m=>m.id===REAL.modeloId);
        carregarComposicaoModeloReal(produto,modelo,REAL.variacaoModeloIds);
      }
    }catch(error){catalog.connectionMessage={tipo:'erro',texto:String(error?.message||'Não foi possível desconectar agora.')};}
    render();
  });
}

/* ---------- TABELA DE PREÇOS REAL (margem por faixa de ticket) ---------- */
/** "12k" → 12000, "4.8k" → 4800 (aqui o ponto é decimal); sem "k" o ponto é
 *  separador de milhar ("8.010" → 8010, sem casas decimais na tabela real). */
function parseValorFaixa(tok){
  tok = (tok||'').trim();
  if(/k$/i.test(tok)) return parseFloat(tok.replace(/k$/i,'').replace(',','.'))*1000;
  return parseFloat(tok.replace(/\./g,'').replace(',','.'))||0;
}
function parseFaixa(label){
  const s = (label||'').replace(/R\$/g,'').trim();
  if(/^até/i.test(s)){ const m=s.match(/([\d.,]+k?)/i); return {min:0, max:m?parseValorFaixa(m[1]):Infinity}; }
  if(/\+\s*$/.test(s)){ const m=s.match(/([\d.,]+k?)\+/i); return {min:m?parseValorFaixa(m[1]):0, max:Infinity}; }
  const partes = s.split('~');
  if(partes.length===2) return {min:parseValorFaixa(partes[0]), max:parseValorFaixa(partes[1])};
  return {min:0, max:Infinity};
}
function encontrarFaixaIndex(colunas, custo){
  for(let i=0;i<colunas.length;i++){ const {min,max}=parseFaixa(colunas[i]); if(custo>=min && custo<=max) return i; }
  return Math.max(colunas.length-1,0);
}
/** Dado um vínculo {lineId} e o custo direto (ticket) do orçamento, devolve
 *  a margem real da Tabela de Preços para aquela faixa. catalog.margens é
 *  uma lista ACHATADA por linha (cada linha da Tabela de Preços real tem seu
 *  próprio ID estável, atribuído pelo servidor — ver shared/price-table.ts —
 *  nunca por seção inteira; uma "seção" como "PVC ... Clientes Brasil" tem
 *  6 linhas, cada uma com ID próprio). Migrado de vínculo por seção pra
 *  vínculo direto por linha, pedido do usuário 29-30/09/2026: a tabela física
 *  que o usuário consulta tem um ID por linha, não por seção. */
function margemDaTabela(precificacao, custoDireto){
  // Modo "lucro": % de lucro (margem sobre o preço de venda) definido no cadastro do produto.
  if(precificacao && precificacao.modo==='lucro'){
    const pct=Number(precificacao.margemPct);
    if(!Number.isFinite(pct)||pct<=0||pct>=100) return null;
    return { percentual:pct/100, faixaLabel:'fixa', rotulo:'Margem', secaoTitulo:'Lucro definido no cadastro do produto', propria:true };
  }
  if(!precificacao || !precificacao.lineId) return null;
  const linha = catalog.margens.find(l=>l.lineId===precificacao.lineId);
  if(!linha) return null;
  const idx = encontrarFaixaIndex(linha.colunas, custoDireto);
  const pct = parseFloat((linha.valores[idx]||'0').replace('%','').replace(',','.'))/100;
  return { percentual:pct, faixaLabel:linha.colunas[idx], rotulo:linha.rotulo, secaoTitulo:linha.secaoTitulo };
}

/** Busca linhas da Tabela de Preços por ID (prefixo numérico) ou por texto
 *  no título da seção/rótulo da linha — pedido do usuário 30/09/2026: com
 *  105 linhas reais, rolar uma lista inteira não é viável. */
function buscarLinhasPrecificacao(query){
  const q = (query||'').trim();
  if(!q) return [];
  if(/^\d+$/.test(q)) return catalog.margens.filter(l=>String(l.lineId).startsWith(q)).slice(0,30);
  const nq = normalizeSearch(q);
  return catalog.margens.filter(l=>normalizeSearch(l.secaoTitulo+' '+l.rotulo).includes(nq)).slice(0,30);
}

/* ---------- PROPOSTA REAL: estado ---------- */
function escaparHtml(valor){
  return String(valor ?? '').replace(/[&<>"']/g, caractere=>({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  })[caractere]);
}

function normalizarDocumento(valor){ return String(valor||'').replace(/\D/g,''); }

function validarCnpj(cnpj){
  if(!/^\d{14}$/.test(cnpj) || /^(\d)\1{13}$/.test(cnpj)) return false;
  const calcularDigito = (base, pesos)=>{
    const soma = [...base].reduce((total, digito, indice)=>total + Number(digito)*pesos[indice], 0);
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  const base = cnpj.slice(0,12);
  const primeiro = calcularDigito(base, [5,4,3,2,9,8,7,6,5,4,3,2]);
  const segundo = calcularDigito(base+primeiro, [6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return cnpj === base+primeiro+segundo;
}

function validarCpf(cpf){
  if(!/^\d{11}$/.test(cpf) || /^(\d)\1{10}$/.test(cpf)) return false;
  const calcularDigito = base=>{
    const soma = [...base].reduce((total, digito, indice)=>total + Number(digito)*(base.length+1-indice), 0);
    const resto = (soma*10)%11;
    return resto===10 ? 0 : resto;
  };
  const base = cpf.slice(0,9);
  const primeiro = calcularDigito(base);
  const segundo = calcularDigito(base+primeiro);
  return cpf===base+primeiro+segundo;
}

function rotuloDocumento(valor){ return normalizarDocumento(valor).length===11 ? 'CPF' : 'CNPJ'; }

function validarDocumento(valor){
  const documento = normalizarDocumento(valor);
  return documento.length===11 ? validarCpf(documento) : documento.length===14 ? validarCnpj(documento) : false;
}

function montarEnderecoCnpj(dados){
  const tipo = String(dados.descricao_tipo_de_logradouro||'').trim();
  const logradouro = String(dados.logradouro||'').trim();
  const rua = logradouro && tipo && !logradouro.toLocaleLowerCase('pt-BR').startsWith(tipo.toLocaleLowerCase('pt-BR'))
    ? tipo+' '+logradouro
    : (logradouro||tipo);
  const numero = String(dados.numero||'').trim();
  const numeroJaIncluido = numero && rua.toLocaleLowerCase('pt-BR').includes(numero.toLocaleLowerCase('pt-BR'));
  const linhaRua = rua && numero && !numeroJaIncluido ? rua+', '+numero : rua;
  const municipio = String(dados.municipio||'').trim();
  const uf = String(dados.uf||'').trim();
  const cep = String(dados.cep||'').replace(/\D/g,'');
  const cepFormatado = cep.length===8 ? cep.slice(0,5)+'-'+cep.slice(5) : cep;
  return [
    linhaRua,
    String(dados.complemento||'').trim(),
    String(dados.bairro||'').trim(),
    [municipio,uf].filter(Boolean).join('/'),
    cepFormatado ? 'CEP '+cepFormatado : '',
  ].filter(Boolean).join(' · ');
}

async function consultarClienteCadastrado(documento, requestId){
  try{
    const response=await fetch('/api/letra-caixa/clientes?documento='+encodeURIComponent(documento),{credentials:'same-origin',cache:'no-store'});
    const body=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(body.error||'Não foi possível consultar o cadastro de clientes.');
    if(requestId!==_clienteLookupRequestId||normalizarDocumento(REAL.cliente.cnpj)!==documento) return;
    if(body.cliente){

      REAL.cliente.cnpjConsultado=documento;
      REAL.consultaCnpj={status:'success',mensagem:'Cliente encontrado no cadastro. Dados carregados.'};
    }else if(documento.length===14){

      _consultaCnpjTimer=setTimeout(()=>consultarDadosCnpj(documento),350);

      REAL.cliente.cnpjConsultado=documento;
      REAL.consultaCnpj={status:'success',mensagem:'CPF válido. Informe os dados do cliente para cadastrá-lo.'};
    }
  }catch(error){

    if(documento.length===14){
      REAL.consultaCnpj={status:'loading',mensagem:'Consultando dados cadastrais do CNPJ…'};

}

async function consultarDadosCnpj(cnpj){
  const requestId = ++_consultaCnpjRequestId;
  const controller = new AbortController();
  _consultaCnpjController = controller;
  try{
    const resposta = await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj, {
      headers:{Accept:'application/json'}, signal:controller.signal,
    });
    if(requestId !== _consultaCnpjRequestId) return;
    if(resposta.status===404) throw new Error('CNPJ não encontrado na base consultada.');
    if(resposta.status===429) throw new Error('A API recebeu muitas consultas. Tente novamente em instantes.');
    if(resposta.status===403) throw new Error('A API recusou a consulta neste momento. Tente novamente mais tarde.');
    if(!resposta.ok) throw new Error('Não foi possível consultar o CNPJ agora.');
    const dados = await resposta.json();
    if(requestId !== _consultaCnpjRequestId || normalizarDocumento(REAL.cliente.cnpj)!==cnpj) return;
    if(!dados || !dados.razao_social) throw new Error('A API não retornou os dados cadastrais deste CNPJ.');
    if(dados.cnpj && normalizarDocumento(dados.cnpj)!==cnpj) throw new Error('A API retornou dados para outro CNPJ.');
    REAL.cliente.razao = String(dados.razao_social||'');
    REAL.cliente.fantasia = String(dados.nome_fantasia||'');
    REAL.cliente.endereco = montarEnderecoCnpj(dados);
    // E-mail e WhatsApp são informados pelo vendedor: não importar os contatos
    // que a API de CNPJ eventualmente retorne.
    REAL.cliente.cnpjConsultado = cnpj;
    REAL.consultaCnpj = {status:'success', mensagem:'Dados encontrados. Confira as informações antes de iniciar a proposta.'};
  }catch(erro){
    if(erro.name==='AbortError' || requestId !== _consultaCnpjRequestId) return;
    REAL.consultaCnpj = {status:'error', mensagem:erro.message||'Falha na consulta. Verifique a conexão e tente novamente.'};
  }finally{
    if(requestId === _consultaCnpjRequestId){
      _consultaCnpjController = null;
      renderPreservingFocus();
    }
  }
}

/* ---------- GEOMETRIA REAL (integração poligonal sobre o SVG rastreado) ---------- */
function shoelaceSigned(points){
  let s=0;
  for(let i=0;i<points.length;i++){
    const a=points[i], b=points[(i+1)%points.length];
    s += a.x*b.y - b.x*a.y;
  }
  return s/2;
}

function splitSubpaths(d){
  return (d||'').trim().split(/(?=M)/).map(s=>s.trim()).filter(Boolean);
}

let _workPathEl = null;
function workPath(){
  if(_workPathEl) return _workPathEl;
  const ns='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('style','position:absolute; width:1px; height:1px; overflow:hidden; visibility:hidden; left:-9999px; top:-9999px;');
  const path = document.createElementNS(ns,'path');
  svg.appendChild(path);
  document.body.appendChild(svg);
  _workPathEl = path;
  return path;
}

function measureSubpath(dStr){
  const path = workPath();
  path.setAttribute('d', dStr);
  let len=0, bbox={x:0,y:0,width:0,height:0};
  try{ len = path.getTotalLength(); }catch(e){}
  try{ bbox = path.getBBox(); }catch(e){}
  const points=[];
  if(len>0){
    // Prompt 3 pede área vetorial, mas a API SVG do navegador só expõe o
    // comprimento da curva. Amostrar a cada ~0,5 unidade reduz o erro da
    // integração poligonal; o limite evita travar em SVGs com escala extrema.
    const samples=Math.min(10000,Math.max(32,Math.ceil(len/0.5)));
    for(let i=0;i<=samples;i++) points.push(path.getPointAtLength(len*i/samples));
  }
  const areaSigned = points.length>2 ? shoelaceSigned(points) : 0;
  return { d:dStr, len, bbox, area:Math.abs(areaSigned) };
}

function bboxContains(outer, inner){
  return inner.x >= outer.x-0.5 && inner.y >= outer.y-0.5 &&
         (inner.x+inner.width) <= (outer.x+outer.width+0.5) &&
         (inner.y+inner.height) <= (outer.y+outer.height+0.5);
}

function caixasSobrepostas(a,b){
  return a.x < b.x+b.width && a.x+a.width > b.x &&
         a.y < b.y+b.height && a.y+a.height > b.y;
}

/** Classifica contornos pelo número de outros contornos que os envolvem.
 *  Profundidade par = peça/material; ímpar = vazado (regra even-odd). */
function classifyGeometry(dString){
  const subpaths = splitSubpaths(dString).map(measureSubpath).filter(s=>s.area>3 && s.len>0);
  const external=[], internal=[];
  subpaths.forEach((s,i)=>{
    const depth=subpaths.filter((o,j)=>j!==i && o.area>s.area && bboxContains(o.bbox,s.bbox)).length;
    if(depth%2) internal.push(s); else external.push(s);
  });
  const possivelSobreposicao=external.some((a,i)=>external.slice(i+1).some(b=>caixasSobrepostas(a.bbox,b.bbox)));
  const areaPx = Math.max(external.reduce((a,s)=>a+s.area,0) - internal.reduce((a,s)=>a+s.area,0), 0);
  const perimExtPx = external.reduce((a,s)=>a+s.len,0);
  const perimIntPx = internal.reduce((a,s)=>a+s.len,0);
  let bx1=Infinity,by1=Infinity,bx2=-Infinity,by2=-Infinity;
  external.forEach(s=>{ bx1=Math.min(bx1,s.bbox.x); by1=Math.min(by1,s.bbox.y); bx2=Math.max(bx2,s.bbox.x+s.bbox.width); by2=Math.max(by2,s.bbox.y+s.bbox.height); });
  if(!isFinite(bx1)){ bx1=0; by1=0; bx2=0; by2=0; }
  return {
    areaPx, perimExtPx, perimIntPx,
    possivelSobreposicao,
    bboxPx:{x:bx1,y:by1,w:bx2-bx1,h:by2-by1},
    pieces: external.map((s,i)=>({ n:i+1, bbox:s.bbox, area:s.area, len:s.len, d:s.d })),
    contours:[...external.map(s=>({d:s.d,bbox:s.bbox,area:s.area,len:s.len,tipo:'externo'})),...internal.map(s=>({d:s.d,bbox:s.bbox,area:s.area,len:s.len,tipo:'vazado'}))],
  };
}

function computeGeomReal(){
  const g = REAL.geomRaw;
  if(!g || !g.bboxPx.w) return {scaleFactor:0,totalWidthM:0,totalHeightM:0,areaM2:0,areaGeralM2:0,areaTotalNestingM2:0,perimExtM:0,perimIntM:0,corteTotalM:0};
  const s = REAL.scale;
  const knownM = unitToM(s.valor, s.unidade);
  const refPx = s.byHeight ? g.bboxPx.h : g.bboxPx.w;
  const scaleFactor = refPx>0 ? knownM/refPx*(Number(REAL.factibilidade?.fator_escala_aplicado)||1) : 0;
  const totalWidthM = g.bboxPx.w*scaleFactor;
  const totalHeightM = g.bboxPx.h*scaleFactor;
  return {
    scaleFactor,
    totalWidthM, totalHeightM,
    // Área líquida: só o conteúdo real da letra (descontados vazados) — o que
    // a integração poligonal mede. Área geral: o retângulo que contém a peça
    // inteira (largura × altura totais) — é o quanto de CHAPA o letreiro
    // consome de fato, já que a chapa é cortada de um retângulo, não recortada
    // rente à silhueta. Distinção pedida pelo usuário 28/09/2026: sem ela, uma
    // fórmula "por área" sempre subestimava o consumo real de chapa.
    areaM2: g.areaPx*scaleFactor*scaleFactor,
    areaGeralM2: totalWidthM*totalHeightM,
    areaTotalNestingM2: (g.pieces||[]).reduce((total,p)=>total+p.bbox.width*p.bbox.height,0)*scaleFactor*scaleFactor,
    perimExtM: g.perimExtPx*scaleFactor,
    perimIntM: g.perimIntPx*scaleFactor,
    corteTotalM: (g.perimExtPx+g.perimIntPx)*scaleFactor,
    possivelSobreposicao: !!g.possivelSobreposicao,
  };
}

/* ---------- ALTURA DOS ELEMENTOS (ficha técnica) ---------- */
// Pedido de 05/10/2026: contar quantos elementos têm 11 cm ou menos e quantos têm mais, pela altura vertical (base das linhas
// "Produtividade Solda" por tamanho). Elemento = contorno externo (letra, símbolo ou pedaço solto, como o ponto do "i").
const ALTURA_ELEMENTO_LIMITE_MM = 110;
// A escala tem tolerância de ~±1%: peça a até 5 mm do limite pede conferência.
const ALTURA_ELEMENTO_FAIXA_PROXIMA_MM = 5;

/** Classifica cada contorno externo pela altura da caixa envolvente na escala física. Compara em milímetros inteiros (o que a tela
 *  mostra: 110,4 mm continua "até 11 cm"). Cada vazado vai para a menor peça que o contém, para o desenho e para o perímetro:
 *  o perímetro de um elemento é o do contorno externo mais o dos seus vazados, que é por onde a solda corre.
 *  O resultado fica em cache pela geometria e pela escala, porque a composição o consulta a cada linha de solda. */
let _memoAlturas = {geom:null, fator:0, resultado:null};
function classificarAlturasElementos(geom, scaleFactor){
  if(!geom || !geom.pieces || !geom.pieces.length || !(scaleFactor>0)) return null;
  if(_memoAlturas.geom===geom && _memoAlturas.fator===scaleFactor) return _memoAlturas.resultado;
  const mmPorPx = scaleFactor*1000;
  const itens = geom.pieces.map(p=>{
    const alturaMm = Math.round(p.bbox.height*mmPorPx);
    return {
      n:p.n, d:p.d, bbox:p.bbox, area:p.area, vazados:[], perimetroPx:p.len||0,
      alturaMm, larguraMm:Math.round(p.bbox.width*mmPorPx),
      grupo: alturaMm<=ALTURA_ELEMENTO_LIMITE_MM ? 'ate' : 'acima',
      proximoDoLimite: Math.abs(alturaMm-ALTURA_ELEMENTO_LIMITE_MM)<=ALTURA_ELEMENTO_FAIXA_PROXIMA_MM,
    };
  });
  (geom.contours||[]).filter(c=>c.tipo==='vazado').forEach(vazado=>{
    let dono=null;
    itens.forEach(i=>{ if(i.area>vazado.area && bboxContains(i.bbox,vazado.bbox) && (!dono || i.area<dono.area)) dono=i; });
    if(dono){ dono.vazados.push(vazado.d); dono.perimetroPx += vazado.len||0; }
  });
  itens.forEach(i=>{ i.perimetroM = i.perimetroPx*scaleFactor; });
  const ate = itens.filter(i=>i.grupo==='ate'), acima = itens.filter(i=>i.grupo==='acima');
  const soma = lista => lista.reduce((total,i)=>total+i.perimetroM,0);
  const resultado = {
    itens, ate, acima,
    proximos: itens.filter(i=>i.proximoDoLimite),
    perimetroAteM: soma(ate), perimetroAcimaM: soma(acima),
  };
  _memoAlturas = {geom, fator:scaleFactor, resultado};
  return resultado;
}

/** Perímetro total (externo + vazados), em metros, dos elementos de cada faixa de altura. */
function perimetrosPorAltura(g=computeGeomReal()){
  const c=classificarAlturasElementos(REAL.geomRaw, g.scaleFactor);
  return c ? {ateM:c.perimetroAteM, acimaM:c.perimetroAcimaM, ateElementos:c.ate.length, acimaElementos:c.acima.length} : {ateM:0, acimaM:0, ateElementos:0, acimaElementos:0};
}

/* ---------- IMPORTAÇÃO DE VETOR JÁ PRONTO (SVG enviado direto, sem rastreamento) ---------- */
/** Extrai e combina os <path> de um SVG enviado pelo usuário. Formas não-path
 *  (rect/circle/etc.) são contadas mas não entram na geometria — a maioria dos
 *  vetorizadores profissionais já exporta tudo como <path>, então isso cobre o
 *  caso comum; formas nativas exigiriam conversão adicional (fora de escopo
 *  deste protótipo). */
function extractPathsFromRawSVG(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  if(doc.querySelector('parsererror')) return null;
  const svgEl = doc.querySelector('svg');
  if(!svgEl) return null;
  const paths = [...doc.querySelectorAll('path')].map(p=>p.getAttribute('d')).filter(Boolean);
  const d = paths.join(' ');
  let vw=0, vh=0;
  const vb = svgEl.getAttribute('viewBox');
  if(vb){ const parts=vb.trim().split(/[\s,]+/).map(Number); vw=parts[2]||0; vh=parts[3]||0; }
  if(!vw||!vh){ vw=parseFloat(svgEl.getAttribute('width'))||vw; vh=parseFloat(svgEl.getAttribute('height'))||vh; }
  const nonPathCount = doc.querySelectorAll('rect,circle,ellipse,polygon,polyline,line,text,image,use').length;
  const transformedCount = doc.querySelectorAll('[transform]').length;
  return { d, w:vw, h:vh, pathCount:paths.length, nonPathCount, transformedCount };
}

// 'forcar' só vale quando a validação automática reprova: o vendedor pode avançar por conta própria (decisão de 05/10/2026).
const TRACE_REVIEW_DEFAULTS = {letras:false, simbolo:false, isolamento:false, forcar:false};
// A comparação roda em 1024 px (antes 512): em letras finas, 1 px de borda já derrubava a coincidência.
const TRACE_COMPARE_SIZE = 1024;
const TRACE_COMPARE_ALVO = 920; // maior lado da arte, em pixels, dentro da área de comparação
const TRACE_IOU_MIN = 95;
const TRACE_ASPECT_MAX = 1;
const TRACE_SHIFT_MAX_PERCENT = 1;
// Faixa de revisão manual (decisão de 05/10/2026): diferenças pequenas e só de borda não bloqueiam o vendedor,
// que passa a conferir a sobreposição e confirmar; vetor visivelmente errado continua bloqueado.
const TRACE_IOU_TOLERANTE_MIN = 97; // coincidência aceitando diferença de até ~0,4% do tamanho nas bordas
const TRACE_IOU_MANUAL_MIN = 85;
const TRACE_ASPECT_MANUAL_MAX = 3;
const TRACE_SHIFT_MANUAL_MAX_PERCENT = 2;

function inspectPrompt2Svg(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  if(doc.querySelector('parsererror')) return {ok:false, fatal:['O arquivo SVG não é XML válido.'], warnings:[], pathCount:0, openPathCount:0, duplicateCount:0, viewBox:null};
  const root = doc.documentElement;
  if(!root || root.localName.toLowerCase()!=='svg') return {ok:false, fatal:['A raiz do arquivo não é <svg>.'], warnings:[], pathCount:0, openPathCount:0, duplicateCount:0, viewBox:null};
  const fatal=[]; const warnings=[];
  const paths=[...doc.querySelectorAll('path')];
  const viewBoxText=root.getAttribute('viewBox');
  const viewBox=(viewBoxText||'').trim().split(/[\s,]+/).map(Number);
  const width=parseFloat(root.getAttribute('width'))||0, height=parseFloat(root.getAttribute('height'))||0;
  const hasValidViewBox=viewBox.length===4 && viewBox.every(Number.isFinite) && viewBox[2]>0 && viewBox[3]>0;
  const vw=hasValidViewBox?viewBox[2]:width, vh=hasValidViewBox?viewBox[3]:height;
  if(!viewBoxText) fatal.push('O SVG precisa ter um viewBox explícito para garantir escala e proporções.');
  else if(!hasValidViewBox) fatal.push('O viewBox do SVG precisa ter quatro números finitos e largura/altura positivas.');
  if(!Number.isFinite(vw)||!Number.isFinite(vh)||vw<=0||vh<=0) fatal.push('O SVG precisa ter viewBox ou dimensões positivas.');
  if(!paths.length) fatal.push('O SVG não contém caminhos <path>.');
  const rasterCount=doc.querySelectorAll('image,foreignObject').length;
  const textCount=doc.querySelectorAll('text,tspan,textPath').length;
  const useCount=doc.querySelectorAll('use').length;
  const activeContentCount=doc.querySelectorAll('script,style,a,animate,animateMotion,animateTransform,set').length;
  const nonPathCount=doc.querySelectorAll('rect,circle,ellipse,polygon,polyline,line').length;
  const transformedCount=doc.querySelectorAll('[transform]').length;
  const gradientCount=doc.querySelectorAll('linearGradient,radialGradient').length;
  const complexCount=doc.querySelectorAll('clipPath,mask,filter,pattern,marker').length;
  const allowedElements=new Set(['svg','g','path','defs','title','desc','metadata','linearGradient','radialGradient','stop']);
  const unsupportedElements=[...doc.querySelectorAll('*')].filter(el=>!allowedElements.has(el.localName)).length;
  const nestedSvgCount=doc.querySelectorAll('svg svg').length;
  const externalRefs=[...doc.querySelectorAll('[href],[xlink\\:href]')].filter(el=>{
    const href=el.getAttribute('href')||el.getAttribute('xlink:href')||'';
    return href && !href.startsWith('#');
  }).length;
  const cssRefs=[...doc.querySelectorAll('[style]')].filter(el=>/url\((?!\s*['"]?#)/i.test(el.getAttribute('style')||'')).length;
  const nonPathStyles=[...doc.querySelectorAll('[style]')].filter(el=>el.localName.toLowerCase()!=='path').length;
  if(rasterCount) fatal.push(`Há ${rasterCount} elemento(s) de imagem/objeto incorporado; a saída precisa ser 100% vetorial.`);
  if(textCount) fatal.push(`Há ${textCount} elemento(s) de texto; converta todas as letras em caminhos.`);
  if(useCount) fatal.push(`Há ${useCount} referência(s) <use> que não entram no cálculo do nesting.`);
  if(activeContentCount) fatal.push(`Há ${activeContentCount} elemento(s) de estilo, link ou animação que não pertencem à arte estática.`);
  if(nonPathCount) fatal.push(`Há ${nonPathCount} forma(s) SVG fora de <path>; converta-as em caminhos para calcular o nesting.`);
  if(unsupportedElements) fatal.push(`Há ${unsupportedElements} elemento(s) SVG fora da estrutura vetorial suportada.`);
  if(nestedSvgCount) fatal.push(`Há ${nestedSvgCount} SVG(s) aninhado(s); achate a estrutura antes de usar o nesting.`);
  if(transformedCount) fatal.push(`Há ${transformedCount} transformação(ões) SVG; achate-as antes de calcular medidas.`);
  if(externalRefs||cssRefs) fatal.push('O SVG contém referências externas ou recursos vinculados.');
  if(nonPathStyles) fatal.push(`Há ${nonPathStyles} regra(s) de estilo fora dos caminhos; simplifique o SVG para que a geometria calculada corresponda à visualização.`);
  const hiddenElements=[...doc.querySelectorAll('*')].filter(el=>['display','visibility','opacity','fill-opacity','stroke-opacity'].some(name=>{
    const value=el.getAttribute(name)?.trim().toLowerCase();
    return value==='none'||value==='hidden'||value==='0'||value==='0.0';
  })).length;
  if(hiddenElements) fatal.push(`Há ${hiddenElements} elemento(s) com atributo de visibilidade/opacity que não entram no cálculo geométrico.`);
  const partialOpacity=[...doc.querySelectorAll('*')].filter(el=>['opacity','fill-opacity','stroke-opacity'].some(name=>{
    const value=el.getAttribute(name);
    return value!==null && Number.isFinite(Number(value)) && Number(value)<0.999;
  })).length;
  if(partialOpacity) warnings.push(`${partialOpacity} elemento(s) do vetor colorido têm opacidade parcial; a versão de geometria (branco com contorno preto) é gerada com cores chapadas, mas confira as cores extraídas.`);
  if(complexCount) fatal.push(`Há ${complexCount} recurso(s) SVG avançado(s) (recorte, máscara, filtro, padrão ou marcador) que alteram a geometria visível.`);
  if(gradientCount) warnings.push(`${gradientCount} gradiente(s) identificado(s): as regiões serão classificadas para adesivo impresso antes da normalização para corte.`);
  const seen=new Set(); let duplicateCount=0, openPathCount=0;
  for(const path of paths){
    const d=(path.getAttribute('d')||'').replace(/\s+/g,' ').trim();
    if(d && seen.has(d)) duplicateCount++;
    if(d) seen.add(d);
    const commands=d.match(/[a-zA-Z]/g)||[]; let open=false;
    for(const command of commands){
      if(command.toLowerCase()==='m') { if(open) openPathCount++; open=true; }
      else if(command.toLowerCase()==='z') open=false;
    }
    if(open) openPathCount++;
  }
  if(duplicateCount) fatal.push(`Foram encontrados ${duplicateCount} caminho(s) duplicado(s), que poderiam gerar peças sobrepostas no nesting.`);
  if(openPathCount) fatal.push(`${openPathCount} subcaminho(s) aberto(s); feche os contornos ou corrija as linhas abertas antes de produzir.`);
  if(!fatal.length && !openPathCount) warnings.push('Estrutura vetorial sem texto, raster ou contornos abertos detectáveis.');
  return {ok:fatal.length===0, fatal, warnings, pathCount:paths.length, openPathCount, duplicateCount, viewBox:{w:vw,h:vh}, doc};
}

function applyPrompt2VectorStyle(svgText){
  const audit=inspectPrompt2Svg(svgText);
  if(!audit.ok) return {svgText, audit};
  const root=audit.doc.documentElement;
  const strokeWidth=Math.max(Math.min(audit.viewBox.w,audit.viewBox.h)*0.0015,0.35);
  for(const path of audit.doc.querySelectorAll('path')){
    for(const attr of ['class','fill','stroke','stroke-width','fill-opacity','stroke-opacity','opacity','style','vector-effect']) path.removeAttribute(attr);
    path.setAttribute('fill','#FFFFFF');
    path.setAttribute('stroke','#000000');
    path.setAttribute('stroke-width',String(strokeWidth));
    path.setAttribute('stroke-linejoin','round');
    path.setAttribute('stroke-linecap','round');
  }
  for(const defs of audit.doc.querySelectorAll('defs')) defs.remove();
  return {svgText:new XMLSerializer().serializeToString(root), audit};
}

function loadTraceImage(src){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error('Não foi possível abrir a imagem para comparar a silhueta.'));
    image.src=src;
  });
}

function canvasForTraceImage(image){
  // 1536 px (antes 768): num logotipo largo, 768 deixava a arte com menos de 200 px de altura e as letras finas
  // com poucos pixels, o que tornava a comparação de silhuetas ruidosa.
  const size=1536, canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
  const context=canvas.getContext('2d',{willReadFrequently:true});
  context.clearRect(0,0,size,size);
  const scale=Math.min((size-24)/image.naturalWidth,(size-24)/image.naturalHeight);
  const width=image.naturalWidth*scale, height=image.naturalHeight*scale;
  const x=(size-width)/2, y=(size-height)/2;
  context.drawImage(image,x,y,width,height);
  // Região realmente ocupada pela imagem: o resto do quadrado é só enquadramento, não é fundo da arte.
  canvas.__area={x,y,w:width,h:height};
  return canvas;
}
function binarySilhouette(canvas){
  const width=canvas.width,height=canvas.height,pixels=canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,width,height).data;
  const area=canvas.__area||{x:0,y:0,w:width,h:height};
  const ax0=Math.max(0,Math.ceil(area.x)+2), ay0=Math.max(0,Math.ceil(area.y)+2);
  const ax1=Math.min(width,Math.floor(area.x+area.w)-2), ay1=Math.min(height,Math.floor(area.y+area.h)-2);
  const mask=new Uint8Array(width*height); let transparent=0, interior=0;
  for(let y=ay0;y<ay1;y++) for(let x=ax0;x<ax1;x++){interior++;if(pixels[(y*width+x)*4+3]<248) transparent++;}
  if(transparent>interior*0.002){
    for(let y=ay0;y<ay1;y++) for(let x=ax0;x<ax1;x++){const i=y*width+x;if(pixels[i*4+3]>48) mask[i]=1;}
  }else{
    const border=[];
    for(let x=ax0;x<ax1;x++) for(const y of [ay0,ay1-1]){const i=(y*width+x)*4;border.push([pixels[i],pixels[i+1],pixels[i+2]]);}
    for(let y=ay0+1;y<ay1-1;y++) for(const x of [ax0,ax1-1]){const i=(y*width+x)*4;border.push([pixels[i],pixels[i+1],pixels[i+2]]);}
    const median=channel=>{const values=border.map(rgb=>rgb[channel]).sort((a,b)=>a-b);return values[Math.floor(values.length/2)]||255;};
    const bg=[median(0),median(1),median(2)];
    const nearBg=i=>{const p=i*4,dr=pixels[p]-bg[0],dg=pixels[p+1]-bg[1],db=pixels[p+2]-bg[2];return dr*dr+dg*dg+db*db<48*48;};
    const queue=new Int32Array(width*height); let head=0,tail=0;
    const seed=i=>{if(mask[i]===0 && nearBg(i)){mask[i]=2;queue[tail++]=i;}};
    for(let x=ax0;x<ax1;x++){seed(ay0*width+x);seed((ay1-1)*width+x);}
    for(let y=ay0+1;y<ay1-1;y++){seed(y*width+ax0);seed(y*width+ax1-1);}
    while(head<tail){const i=queue[head++],x=i%width,y=(i/width)|0;
      if(x>ax0){const j=i-1;if(!mask[j]&&nearBg(j)){mask[j]=2;queue[tail++]=j;}}
      if(x+1<ax1){const j=i+1;if(!mask[j]&&nearBg(j)){mask[j]=2;queue[tail++]=j;}}
      if(y>ay0){const j=i-width;if(!mask[j]&&nearBg(j)){mask[j]=2;queue[tail++]=j;}}
      if(y+1<ay1){const j=i+width;if(!mask[j]&&nearBg(j)){mask[j]=2;queue[tail++]=j;}}
    }
    for(let y=ay0;y<ay1;y++) for(let x=ax0;x<ax1;x++){const i=y*width+x;mask[i]=mask[i]===2?0:1;}
    for(let i=0;i<mask.length;i++) if(mask[i]===2) mask[i]=0;
  }
  // Limites da silhueta ignorando manchas isoladas (0,05% dos pixels de cada lado), que distorceriam escala e proporção.
  const colunas=new Uint32Array(width), linhasMask=new Uint32Array(height); let total=0;
  for(let i=0;i<mask.length;i++) if(mask[i]){colunas[i%width]++;linhasMask[(i/width)|0]++;total++;}
  if(!total) throw new Error('A imagem não tem uma silhueta visível para comparar.');
  const corte=Math.floor(total*0.0005);
  const limites=(contagens)=>{
    let acumulado=0,inicio=0,fim=contagens.length-1;
    for(let k=0;k<contagens.length;k++){acumulado+=contagens[k];if(acumulado>corte){inicio=k;break;}}
    acumulado=0;
    for(let k=contagens.length-1;k>=0;k--){acumulado+=contagens[k];if(acumulado>corte){fim=k;break;}}
    return [inicio,fim];
  };
  const [minX,maxX]=limites(colunas),[minY,maxY]=limites(linhasMask);
  if(maxX<minX||maxY<minY) throw new Error('A imagem não tem uma silhueta visível para comparar.');
  return {mask,width,height,bounds:{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1}};
}

function normalizeSilhouette(shape,scale,center=TRACE_COMPARE_SIZE/2){
  const size=TRACE_COMPARE_SIZE, out=new Uint8Array(size*size), b=shape.bounds;
  const w=Math.max(1,Math.round(b.w*scale)),h=Math.max(1,Math.round(b.h*scale));
  const left=Math.round(center-w/2),top=Math.round(center-h/2);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const sx=b.x+Math.min(b.w-1,Math.floor((x/w)*b.w));
    const sy=b.y+Math.min(b.h-1,Math.floor((y/h)*b.h));
    if(shape.mask[sy*shape.width+sx]){const dx=left+x,dy=top+y;if(dx>=0&&dy>=0&&dx<size&&dy<size)out[dy*size+dx]=1;}
  }
  return out;
}

function silhouetteEdge(mask){
  const size=TRACE_COMPARE_SIZE, edge=new Uint8Array(mask.length);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){const i=y*size+x;if(!mask[i])continue;
    if(!x||!y||x===size-1||y===size-1||!mask[i-1]||!mask[i+1]||!mask[i-size]||!mask[i+size])edge[i]=1;
  }
  return edge;
}

function edgeDistance(edge){
  const size=TRACE_COMPARE_SIZE, inf=1e6, dist=new Float32Array(edge.length);
  for(let i=0;i<dist.length;i++)dist[i]=edge[i]?0:inf;
  const diagonal=Math.SQRT2;
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){const i=y*size+x;let d=dist[i];if(x)d=Math.min(d,dist[i-1]+1);if(y)d=Math.min(d,dist[i-size]+1);if(x&&y)d=Math.min(d,dist[i-size-1]+diagonal);if(x+1<size&&y)d=Math.min(d,dist[i-size+1]+diagonal);dist[i]=d;}
  for(let y=size-1;y>=0;y--) for(let x=size-1;x>=0;x--){const i=y*size+x;let d=dist[i];if(x+1<size)d=Math.min(d,dist[i+1]+1);if(y+1<size)d=Math.min(d,dist[i+size]+1);if(x+1<size&&y+1<size)d=Math.min(d,dist[i+size+1]+diagonal);if(x&&y+1<size)d=Math.min(d,dist[i+size-1]+diagonal);dist[i]=d;}
  return dist;
}

function traceEvidenceCanvases(referenceMask,vectorMask){
  const size=TRACE_COMPARE_SIZE, overlay=document.createElement('canvas'),difference=document.createElement('canvas');
  overlay.width=overlay.height=difference.width=difference.height=size;
  const o=overlay.getContext('2d'),d=difference.getContext('2d');
  const oi=o.createImageData(size,size),di=d.createImageData(size,size);
  for(let i=0;i<referenceMask.length;i++){
    const a=referenceMask[i],b=vectorMask[i],p=i*4;
    if(a&&b){oi.data[p]=di.data[p]=255;oi.data[p+1]=di.data[p+1]=255;oi.data[p+2]=di.data[p+2]=255;oi.data[p+3]=di.data[p+3]=255;}
    else if(a){oi.data[p]=0;oi.data[p+1]=166;oi.data[p+2]=220;oi.data[p+3]=255;di.data[p]=235;di.data[p+1]=50;di.data[p+2]=70;di.data[p+3]=255;}
    else if(b){oi.data[p]=230;oi.data[p+1]=0;oi.data[p+2]=120;oi.data[p+3]=255;di.data[p]=35;di.data[p+1]=115;di.data[p+2]=230;di.data[p+3]=255;}
    else {oi.data[p]=di.data[p]=247;oi.data[p+1]=di.data[p+1]=248;oi.data[p+2]=di.data[p+2]=250;oi.data[p+3]=di.data[p+3]=255;}
  }
  o.putImageData(oi,0,0);d.putImageData(di,0,0);
  // Recorta rente à arte (com margem) para o logotipo aparecer grande, em vez de pequeno no meio de um quadrado.
  let x0=size,y0=size,x1=-1,y1=-1;
  for(let i=0;i<referenceMask.length;i++) if(referenceMask[i]||vectorMask[i]){const x=i%size,y=(i/size)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<x0||y1<y0) return {overlay:overlay.toDataURL('image/png'),difference:difference.toDataURL('image/png')};
  const margem=Math.round(Math.max(x1-x0,y1-y0)*0.04)+6;
  x0=Math.max(0,x0-margem);y0=Math.max(0,y0-margem);x1=Math.min(size-1,x1+margem);y1=Math.min(size-1,y1+margem);
  const recortar=(origem)=>{
    const c=document.createElement('canvas');c.width=x1-x0+1;c.height=y1-y0+1;
    const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(origem,x0,y0,c.width,c.height,0,0,c.width,c.height);
    return c.toDataURL('image/png');
  };
  return {overlay:recortar(overlay),difference:recortar(difference)};
}

function compareSilhouetteMasks(source,vector){
  const aspectSource=source.bounds.w/source.bounds.h,aspectVector=vector.bounds.w/vector.bounds.h;
  const aspectDelta=Math.abs(aspectVector-aspectSource)/aspectSource*100;
  const maxDimension=Math.max(source.bounds.w,source.bounds.h,vector.bounds.w,vector.bounds.h);
  const scale=TRACE_COMPARE_ALVO/maxDimension;
  const sourceMask=normalizeSilhouette(source,scale),vectorMask=normalizeSilhouette(vector,scale);
  let intersection=0,union=0;
  for(let i=0;i<sourceMask.length;i++){if(sourceMask[i]&&vectorMask[i])intersection++;if(sourceMask[i]||vectorMask[i])union++;}
  const iou=union?intersection/union*100:0;
  const sourceEdge=silhouetteEdge(sourceMask),vectorEdge=silhouetteEdge(vectorMask);
  const distanceToSource=edgeDistance(sourceEdge),distanceToVector=edgeDistance(vectorEdge);
  let maxShift=0;
  for(let i=0;i<sourceEdge.length;i++){if(sourceEdge[i])maxShift=Math.max(maxShift,distanceToVector[i]);if(vectorEdge[i])maxShift=Math.max(maxShift,distanceToSource[i]);}
  // Coincidência tolerante: um pixel que só difere numa faixa estreita de borda (até ~0,4% do tamanho) conta como igual.
  const toleranciaPx=Math.max(2,TRACE_COMPARE_ALVO*0.004);
  let toleradas=0;
  for(let i=0;i<sourceMask.length;i++){
    if(sourceMask[i]===vectorMask[i]) continue;
    const distancia=sourceMask[i]?distanceToVector[i]:distanceToSource[i];
    if(distancia<=toleranciaPx) toleradas++;
  }
  const iouTolerante=union?(intersection+toleradas)/union*100:0;
  return {metrics:{iou,iouTolerante,toleranciaPx,aspectDelta,shiftPercent:maxShift/TRACE_COMPARE_ALVO*100},sourceMask,vectorMask};
}

function traceMetricsPass(metrics,audit){
  return metrics.iou>=TRACE_IOU_MIN && metrics.aspectDelta<=TRACE_ASPECT_MAX && metrics.shiftPercent<=TRACE_SHIFT_MAX_PERCENT && audit.openPathCount===0;
}

/** 'pass' (dentro dos limites), 'manual' (só diferenças de borda: o vendedor confere) ou 'fail' (vetor visivelmente diferente). */
function classificarMetricasTrace(metrics,audit){
  if(audit.openPathCount) return {status:'fail',aviso:null};
  if(traceMetricsPass(metrics,audit)) return {status:'pass',aviso:null};
  const proporcaoOk=metrics.aspectDelta<=TRACE_ASPECT_MAX, deslocamentoOk=metrics.shiftPercent<=TRACE_SHIFT_MAX_PERCENT;
  if(metrics.iouTolerante>=TRACE_IOU_TOLERANTE_MIN && proporcaoOk && deslocamentoOk)
    return {status:'pass',aviso:`Coincidência exata de ${metrics.iou.toFixed(1)}%, abaixo de ${TRACE_IOU_MIN}%, mas a diferença é só de borda (até ${metrics.toleranciaPx.toFixed(0)} px de ${TRACE_COMPARE_ALVO}); aceita.`};
  if(metrics.iou>=TRACE_IOU_MANUAL_MIN && metrics.aspectDelta<=TRACE_ASPECT_MANUAL_MAX && metrics.shiftPercent<=TRACE_SHIFT_MANUAL_MAX_PERCENT)
    return {status:'manual',aviso:`O vetor difere um pouco da arte (coincidência ${metrics.iou.toFixed(1)}%, deslocamento ${metrics.shiftPercent.toFixed(2)}%). Compare a sobreposição e confirme abaixo; se houver letra faltando, sobrando ou deformada, vetorize de novo.`};
  return {status:'fail',aviso:null};
}

async function validatePrompt2Trace(referenceSrc,svgText){
  const audit=inspectPrompt2Svg(svgText);
  const result={status:'fail',fatal:audit.fatal,warnings:audit.warnings,metrics:null,overlay:null,difference:null,audit:{pathCount:audit.pathCount,openPathCount:audit.openPathCount,duplicateCount:audit.duplicateCount}};
  if(!audit.ok) return result;
  if(!referenceSrc){result.status='manual';result.warnings.push('Não há bitmap de referência neste envio de SVG; a comparação de silhueta não pode ser calculada.');return result;}
  try{
    const sourceImage=await loadTraceImage(referenceSrc);
    const vectorUrl=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml'}));
    let vectorImage;
    try{vectorImage=await loadTraceImage(vectorUrl);}finally{URL.revokeObjectURL(vectorUrl);}
    const source=binarySilhouette(canvasForTraceImage(sourceImage)),vector=binarySilhouette(canvasForTraceImage(vectorImage));
    const comparison=compareSilhouetteMasks(source,vector),{iou,aspectDelta,shiftPercent}=comparison.metrics;
    const evidence=traceEvidenceCanvases(comparison.sourceMask,comparison.vectorMask);
    result.metrics=comparison.metrics; result.overlay=evidence.overlay;result.difference=evidence.difference;
    const classe=classificarMetricasTrace(comparison.metrics,audit);
    result.status=classe.status;
    if(classe.aviso) result.warnings.push(classe.aviso);
    if(classe.status==='fail'){
      if(iou<TRACE_IOU_MANUAL_MIN)result.fatal.push(`Coincidência de silhueta ${iou.toFixed(2)}%; abaixo de ${TRACE_IOU_MANUAL_MIN}%, o vetor está visivelmente diferente da arte.`);
      if(aspectDelta>TRACE_ASPECT_MANUAL_MAX)result.fatal.push(`Variação de proporção ${aspectDelta.toFixed(2)}%; o máximo aceito é ${TRACE_ASPECT_MANUAL_MAX}%.`);
      if(shiftPercent>TRACE_SHIFT_MANUAL_MAX_PERCENT)result.fatal.push(`Deslocamento máximo de contorno ${shiftPercent.toFixed(2)}%; o máximo aceito é ${TRACE_SHIFT_MANUAL_MAX_PERCENT}%.`);
      if(!result.fatal.length)result.fatal.push('Feche ou revise os subcaminhos abertos antes de aprovar.');
    }
  }catch(error){result.status='fail';result.fatal.push(error.message||'Não foi possível calcular a comparação de silhueta.');}
  return result;
}

function traceReviewReady(){
  const quality=REAL.traceQuality;
  if(!REAL.fgD || !quality) return false;
  const {forcar, ...conferencias}=REAL.traceReview||{};
  if(!Object.values(conferencias).every(Boolean)) return false;
  // Reprovado pela validação: segue só se o vendedor declarar que entende o risco. Pass/manual seguem como antes.
  if(quality.status==='fail') return !!forcar;
  return ['pass','manual'].includes(quality.status);
}

const RASTER_EXT = ['.png','.jpg','.jpeg'];
const UNSUPPORTED_EXT = ['.pdf','.ai','.eps','.cdr'];

/** Ponto único de entrada para os três estágios de upload do fluxo (envio
 *  inicial, troca no redesenho, envio direto de vetor na vetorização). Decide
 *  entre o caminho raster (Vectorizer.AI no servidor) e o caminho
 *  vetor (SVG já pronto, geometria extraída direto dos caminhos reais — sem
 *  rastrear nada). AI/EPS/PDF/CDR não são processáveis no navegador nesta
 *  demonstração (exigiriam conversão no servidor, ex. Inkscape CLI — este
 *  Artifact roda 100% client-side, sem processo de servidor por trás); o
 *  usuário é avisado e orientado a exportar como SVG. Pedido do usuário
 *  29/09/2026 (CDR é o formato nativo do CorelDraw, usado por vários
 *  clientes/gráficas parceiras). */
async function handleUploadedFile(file){
  invalidarRastreamento();
  REAL.redesenhoToken=null;
  REAL.uploadError=null; REAL.uploadWarning=null;
  const name = (file.name||'').toLowerCase();
  const isSvg = name.endsWith('.svg') || file.type==='image/svg+xml';
  const isRaster = RASTER_EXT.some(ext=>name.endsWith(ext)) || /^image\/(png|jpe?g)$/.test(file.type);
  const isUnsupported = UNSUPPORTED_EXT.some(ext=>name.endsWith(ext));

  if(isUnsupported){
    const ext = name.split('.').pop().toUpperCase();
    REAL.uploadError = ext==='CDR'
      ? `Arquivo CDR (CorelDraw) não é processável no navegador nesta demonstração (exigiria conversão no servidor). No CorelDraw, use Arquivo > Exportar como > SVG e envie o SVG resultante — ou envie uma imagem JPG/PNG.`
      : `Formato ${ext} não é processável no navegador nesta demonstração (exigiria conversão no servidor). Exporte como SVG no seu software de vetorização e envie o SVG — ou envie uma imagem JPG/PNG.`;
    render();
    return;
  }
  if(isSvg){
    const text = await file.text();
    const styled = applyPrompt2VectorStyle(text);
    const parsed = extractPathsFromRawSVG(styled.svgText);
    if(!parsed || !parsed.d){
      REAL.uploadError = 'Não consegui ler caminhos vetoriais nesse SVG (arquivo inválido ou sem elementos <path>).';
      render();
      return;
    }
    if(!Number.isFinite(parsed.w)||!Number.isFinite(parsed.h)||parsed.w<=0||parsed.h<=0){
      REAL.uploadError = 'O SVG precisa ter um viewBox ou largura e altura válidos para calcular escala e medidas.';
      render();
      return;
    }
    REAL.sourceKind='vetor'; limparContornoCorte();
    REAL.tracedSvg=styled.svgText; REAL.tracedSvgOriginal=text; REAL.fgD=parsed.d; REAL.tracedW=parsed.w; REAL.tracedH=parsed.h; invalidarFactibilidadeReal();
    const approvedArtwork=REAL.imgReconstructed||REAL.imgPreview||null;
    REAL.imgPreview=approvedArtwork;
    REAL.traceReview={...TRACE_REVIEW_DEFAULTS};
    REAL.traceQuality=await validatePrompt2Trace(approvedArtwork,REAL.tracedSvg);
    REAL.geomRaw = classifyGeometry(parsed.d);
    REAL.traceError=null;
    REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
    if(parsed.nonPathCount>0){
      REAL.uploadWarning = `Detectei ${parsed.nonPathCount} elemento(s) que não são <path> (formas, texto ou imagem); foram ignorados. Converta texto e formas em caminhos no editor vetorial e remova imagens raster antes de usar este resultado.`;
    }
    if(parsed.transformedCount>0){
      REAL.uploadWarning = [REAL.uploadWarning,`Detectei ${parsed.transformedCount} elemento(s) com transformações SVG; o protótipo ainda não aplica esses transforms ao cálculo. Achate as transformações no editor antes de reenviar.`].filter(Boolean).join(' ');
    }
    render();
    return;
  }
  if(isRaster || file.type.startsWith('image/')){
    const dataUrl = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
    REAL.sourceKind='raster';
    REAL.imgReconstructed = dataUrl;
    REAL.imgPreview=null;
    REAL.tracedSvg=null; REAL.tracedSvgOriginal=null; REAL.fgD=''; REAL.geomRaw=null; REAL.traceQuality=null; REAL.traceReview={...TRACE_REVIEW_DEFAULTS};
    REAL.approvals.vetorizacao=false; REAL.approvals.escala=false; REAL.approvals.kit=false; REAL.approvals.nesting=false; REAL.nesting=null;
    render();
    return;
  }
  REAL.uploadError = 'Tipo de arquivo não reconhecido. Envie JPG, PNG ou SVG.';
  render();
}

/** A factibilidade separa as peças por camada: o SVG do Vectorizer não traz o grupo Face, então ele é acrescentado. */
function svgComCamadaFace(svgText){
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const raiz = doc.documentElement;
  if(doc.querySelector('parsererror') || !raiz || raiz.localName.toLowerCase() !== 'svg') return svgText;
  if(raiz.querySelector('g[id],g[inkscape\\:label],g[data-layer-name],g[aria-label]')) return svgText;
  const grupo = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
  grupo.setAttribute('id', 'Face');
  [...raiz.childNodes].filter(no => no.nodeType === 1 && no.localName.toLowerCase() === 'path').forEach(no => grupo.appendChild(no));
  raiz.appendChild(grupo);
  return new XMLSerializer().serializeToString(raiz);
}

async function silhuetaDoSvg(svgText){
  const url = URL.createObjectURL(new Blob([svgText], {type:'image/svg+xml'}));
  try{ return binarySilhouette(canvasForTraceImage(await loadTraceImage(url))); }
  finally{ URL.revokeObjectURL(url); }
}

/** Confere se o SVG de uma cor só é de fato o contorno da arte (e não um fundo cheio ou um desenho diferente). */
async function validarContornoCorte(svgText){
  const estilizado = applyPrompt2VectorStyle(svgText);
  if(!estilizado.audit.ok) return {ok:false, erro:'O SVG do contorno não passou na validação: ' + estilizado.audit.fatal.join(' ')};
  const lido = extractPathsFromRawSVG(estilizado.svgText);
  if(!lido || !lido.d || !(lido.w > 0) || !(lido.h > 0)) return {ok:false, erro:'O contorno de corte veio sem caminhos ou sem medidas.'};
  if(Math.abs(lido.w - REAL.tracedW) / REAL.tracedW > 0.005 || Math.abs(lido.h - REAL.tracedH) / REAL.tracedH > 0.005)
    return {ok:false, erro:'O contorno de corte tem dimensões diferentes do vetor completo.'};
  const geom = classifyGeometry(lido.d);
  if(!geom.pieces.length) return {ok:false, erro:'Não encontrei contornos fechados no desenho de corte.'};
  const cobreTudo = geom.bboxPx.w >= lido.w * 0.97 && geom.bboxPx.h >= lido.h * 0.97 && geom.areaPx >= lido.w * lido.h * 0.85;
  if(cobreTudo) return {ok:false, erro:'A arte aprovada parece ter fundo: a silhueta ocupou a imagem inteira. Use uma arte com fundo transparente para extrair o contorno.'};
  const comparacao = compareSilhouetteMasks(await silhuetaDoSvg(REAL.tracedSvg), await silhuetaDoSvg(estilizado.svgText)).metrics;
  if(comparacao.iouTolerante < 90) return {ok:false, erro:`O contorno de corte não confere com o vetor completo (coincidência ${comparacao.iouTolerante.toFixed(0)}%).`};
  return {
    ok:true, svgOriginal:svgText, svg:estilizado.svgText,
    info:{externos:geom.pieces.length, vazados:geom.contours.filter(c => c.tipo === 'vazado').length, caminhos:lido.pathCount, coincidencia:comparacao.iouTolerante},
  };
}

/** Lê a arte aprovada com um modelo de visão e obtém os ajustes de vetorização (regras do administrador incluídas). */
async function lerArteAprovada(imagem, requestId){
  REAL.analiseArte = null; REAL.analiseErro = null; REAL.analisandoArte = true; render();
  try{
    const response = await fetch('/api/letra-caixa/analise-arte', {
      method:'POST', credentials:'same-origin', headers:{'Content-Type':imagem.type, 'X-Redesenho-Token':REAL.redesenhoToken}, body:imagem,
    });
    const body = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(body.error || 'Não consegui ler a arte agora.');
    if(requestId !== traceRequestId) return null;
    REAL.analiseArte = body;
    return body;
  }catch(erro){
    if(requestId === traceRequestId) REAL.analiseErro = String(erro && erro.message || erro);
    return null;
  }finally{
    if(requestId === traceRequestId){ REAL.analisandoArte = false; render(); }
  }
}

/* ---------- AJUSTE POR CONVERSA ----------
 * O vendedor descreve o que saiu errado; um modelo de visão enxerga o vetor atual (elementos numerados) e propõe um plano
 * (vetorizar de novo com outros ajustes OU editar elementos). Nada é executado sem o vendedor aprovar o plano. */
function prepararContextoChat(){
  const {els} = lerElementosEditaveis(REAL.tracedSvgOriginal || REAL.tracedSvg);
  const {uniao, caixas} = caixasDosCaminhos(els.map(e => e.d));
  if(!(uniao.width > 0) || !(uniao.height > 0)) throw new Error('O desenho não tem tamanho para ser analisado.');
  const pct = (valor, total) => Number((valor / total * 100).toFixed(1));
  const tabela = els.map((e, i) => ({
    i, x:pct(caixas[i].x - uniao.x, uniao.width), y:pct(caixas[i].y - uniao.y, uniao.height), w:pct(caixas[i].width, uniao.width), h:pct(caixas[i].height, uniao.height),
    cor:String(e.attrs.fill || '#000000').slice(0, 30), areaPct:pct(caixas[i].width * caixas[i].height, uniao.width * uniao.height),
  }));
  const usados = [...tabela].sort((a, b) => b.areaPct - a.areaPct).slice(0, 120).sort((a, b) => a.i - b.i);
  // Imagem do vetor com o número de cada elemento, para o modelo saber de qual o vendedor está falando.
  const lado = 1100, escala = lado / Math.max(uniao.width, uniao.height), margem = 24;
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(uniao.width * escala + margem * 2); canvas.height = Math.ceil(uniao.height * escala + margem * 2);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#d9dee8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(escala, 0, 0, escala, margem - uniao.x * escala, margem - uniao.y * escala);
  els.forEach(e => { try{ ctx.fillStyle = e.attrs.fill || '#000000'; ctx.fill(new Path2D(e.d)); }catch(erro){} });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  usados.forEach(item => {
    const cx = margem + (caixas[item.i].x + caixas[item.i].width / 2 - uniao.x) * escala, cy = margem + (caixas[item.i].y + caixas[item.i].height / 2 - uniao.y) * escala;
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#111827'; ctx.stroke();
    ctx.fillStyle = '#111827'; ctx.fillText(String(item.i), cx, cy + 1);
  });
  const q = REAL.traceQuality, m = q && q.metrics;
  return {
    imagem:canvas.toDataURL('image/png'), totalElementos:els.length, elementos:usados,
    ajustesAtuais:REAL.ajustesVetorizacao || {},
    qualidade:{status:q ? q.status : 'sem_validacao', iou:m ? m.iou : null, iouTolerante:m ? m.iouTolerante : null, proporcao:m ? m.aspectDelta : null, deslocamento:m ? m.shiftPercent : null, falhas:((q && q.fatal) || []).slice(0, 10)},
  };
}

async function enviarMensagemChat(){
  const texto = (REAL.chatRascunho || '').trim();
  if(texto.length < 2 || REAL.chatCarregando) return;
  REAL.chatVetor = REAL.chatVetor || [];

}

/** Executa as edições aprovadas direto nos caminhos (apagar, mover, esticar, girar, espelhar): sem crédito. */
async function executarAcoesDeEdicao(acoes){
  const {els} = lerElementosEditaveis(REAL.tracedSvgOriginal || REAL.tracedSvg);
  const ativos = () => els.filter(e => !e.deleted);
  for(const acao of acoes){
    const alvo = acao.indices.map(i => els[i]).filter(e => e && !e.deleted);
    if(!alvo.length) continue;
    if(acao.tipo === 'apagar'){ alvo.forEach(e => { e.deleted = true; }); continue; }
    const caixa = caixaDeCaminhos(alvo.map(e => e.d)), cx = caixa.x + caixa.width / 2, cy = caixa.y + caixa.height / 2;
    let m;
    if(acao.tipo === 'mover'){ const tudo = caixaDeCaminhos(ativos().map(e => e.d)); m = [1, 0, 0, 1, acao.dxPct / 100 * tudo.width, acao.dyPct / 100 * tudo.height]; }
    else if(acao.tipo === 'escalar') m = [acao.fator, 0, 0, acao.fatorY, cx * (1 - acao.fator), cy * (1 - acao.fatorY)];
    else if(acao.tipo === 'girar'){ const r = acao.graus * Math.PI / 180, cos = Math.cos(r), sen = Math.sin(r); m = [cos, sen, -sen, cos, cx - cos * cx + sen * cy, cy - sen * cx - cos * cy]; }
    else if(acao.tipo === 'espelhar') m = acao.eixo === 'horizontal' ? [-1, 0, 0, 1, 2 * cx, 0] : [1, 0, 0, -1, 0, 2 * cy];
    else continue;
    alvo.forEach(e => { e.d = vtTransformarCaminho(e.d, m); });
  }
  const resultado = await finalizarEdicaoVetor(ativos().map(e => ({attrs:e.attrs, d:e.d})), 'Desenho ajustado por conversa. Confira o resultado e informe de novo o tamanho real do letreiro na etapa de escala antes do nesting.');
  if(!resultado.ok) throw new Error(resultado.erro);
}

async function aplicarPlanoChat(indice){
  const mensagem = (REAL.chatVetor || [])[indice];
  if(!mensagem || mensagem.estado !== 'pendente' || state.tracing) return;
  mensagem.estado = 'aplicando'; render();
  try{
    const nova = mensagem.acoes.find(acao => acao.tipo === 'revetorizar');
    if(nova) await retrace({ajustes:nova.ajustes});
    else await executarAcoesDeEdicao(mensagem.acoes);
    mensagem.estado = 'aplicado';
  }catch(erro){
    mensagem.estado = 'erro_aplicar'; mensagem.erro = String(erro && erro.message || erro);
  }
  (REAL.chatVetor || []).forEach((item, i) => { if(i !== indice && item.estado === 'pendente') item.estado = 'obsoleto'; });
  render();
}
